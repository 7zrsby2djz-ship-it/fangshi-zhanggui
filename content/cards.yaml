# 卡片版《坊市掌櫃》的骨架：十八個月的時間軸、每個月開頭的話、規費、當鋪、新增的兩種死法。
# 舊內容（交易、散事、店裡事件、地點、遺物、死法）由 build.py 直接轉成卡片，不用在這裡重寫。
#
# 時間：一局十八個月，最後一個月「結霜」拆成四天。
# 舊內容的 month 1／2／3 對應：1 → 第 1～11 個月，2 → 第 12～17 個月，3 → 結霜四天。
# 舊內容的 days（第幾天）在那一段裡平均攤開。

start:
  stones: 120
  lifespan: 18
  level: 4
  xp: 30
  burden: 0
  title: 坊市掌櫃
  sub: 十八個月・每一步都可能是最後一步
  lede: 大災變過後大約一百年。台灣的山整片往上抬，人在中央山區的高地重新過日子。你叫許衡，在山上的聚落顧一間店。十二年前家裡背上八千靈石的債，你去長生當鋪押了壽命。現在，只剩十八個月。
  ticket: 今押壽命四十年，到期不贖，人死當絕。
  how: 一次一張卡，按一下就往下走。每個月會有人找上門、有怪事、有空檔可以出門。選錯會死，死的原因都寫在你選的那一步裡。死了可以回到這個月開頭，記得上一次是怎麼死的。

# 每個月：chip 是上面那一排的字；name 是大字；gap 是那個月開頭的一段話。
months:
  - {chip: 開張, name: 一月, season: 冬, gap: 山上的一月，風從北邊來，帶著鐵味。你把許家店的鐵捲門拉起來，門軸叫了一聲，像很久沒有人叫它起床。對門錢家店早就開了，錢不語站在門口朝你揮手，笑得很用力。}
  - {chip: 二月, name: 二月, season: 冬, gap: 二月，舊公路邊的櫻花開了，開得很亂，有幾棵開在半空中——它們長在被抬起來的那半截路上。茶館說今年的霧來得早。}
  - {chip: 三月, name: 三月, season: 春, dues: 80, gap: 三月，管理處貼出公告：本季規費月底收，逾期者暫停營業。公告的紙是新的，漿糊是舊的，風一吹就翹起一角。}
  - {chip: 清明, name: 四月, season: 春, gap: 清明前後，後山住宅區的人去舊公路崩塌段的土地公廟拜拜。回來的人說，廟前的香爐又往上移了一點點，好像整座廟在慢慢往天上走。}
  - {chip: 五月, name: 五月, season: 春, gap: 五月，寒潭水庫的霧更厚了，霧裡偶爾有路燈亮起來，一盞，兩盞。沒有人裝過那些路燈。}
  - {chip: 梅雨, name: 六月, season: 雨, dues: 100, gap: 梅雨來了。雨下在聚落裡是往下的，下在西邊斷崖那一帶，有人說看到雨往上飄。管理處的規費單照常貼出來，被雨打濕了一半。}
  - {chip: 七月, name: 七月, season: 夏, gap: 七月，熱得很普通，普通到讓人不安。只有北礦那一帶，柵欄上的鐵絲摸起來還是冰的。}
  - {chip: 颱風, name: 八月, season: 夏, gap: 颱風擦過山腰。一夜的風把舊公路上的碎石又往下推了一段，也把一些很久以前的東西吹了出來。第二天，街上多了很多來店裡賣「舊貨」的人。}
  - {chip: 中秋, name: 九月, season: 秋, dues: 110, gap: 中秋，聚落在活動中心前面烤肉。月亮很大，大到有人說它比去年近。規費單又貼出來了，就貼在烤肉架旁邊。}
  - {chip: 十月, name: 十月, season: 秋, gap: 十月，管理處開始登記「冬季外出」。表格上多了一欄：「預計回來的時間」。下面用小字寫著：「請務必填寫。」}
  - {chip: 十一月, name: 十一月, season: 秋, gap: 十一月，庫房裡的寒鐵夜裡會敲。很輕，一下，一下，像在對帳。你沒有跟任何人說。}
  - {chip: 冬至, name: 十二月, season: 冬, dues: 120, gap: 冬至，阿花嬸送來一碗湯圓。她說，你媽以前每年冬至都去北礦那邊，提一盞燈，天亮才回來。說完她就後悔了，湯圓也沒等你吃完就把碗收走。}
  - {chip: 過年, name: 一月, season: 冬, gap: 過年。長生當鋪的字條照常塞進門縫：「許先生，尚餘半年。」你把它跟去年的字條放在一起。字是同一個人寫的，可是今年的墨比較淡。}
  - {chip: 二月, name: 二月, season: 冬, gap: 二月，北邊的風停了三天。三天沒有風，聚落裡的人都睡不好。第四天風又來了，大家才鬆一口氣。}
  - {chip: 三月, name: 三月, season: 春, dues: 140, gap: 三月，規費漲了。公告上寫的理由是「北區設施維護」。沒有人知道北區有什麼設施。}
  - {chip: 四月, name: 四月, season: 春, gap: 四月，井水開始變涼。打水的太太說，從沒有這麼涼過。茶館裡有人說是地下水改道，有人說是北邊那個東西醒了。白姐只說：「喝熱的。」}
  - {chip: 五月, name: 五月, season: 春, gap: 五月，坡上的草還是枯的。北礦柵欄裡面，有人在搬東西，搬了一個月。管理處說那是例行維護。}
  - {chip: 結霜一, name: 六月, frost: 1, season: 霜, gap: 那天早上，你拉開店門，呼出來的氣是白的。六月。}
  - {chip: 結霜二, name: 六月, frost: 2, season: 霜, gap: 第二天，霜爬過了北礦的柵欄，在舊公路上停了一夜。市集照常開，攤子比平常少一半。}
  - {chip: 結霜三, name: 六月, frost: 3, season: 霜, gap: 第三天。街尾那扇黑門，白天也開著。}
  - {chip: 結霜四, name: 六月, frost: 4, season: 霜, gap: 第四天，中午以前，整條街忽然安靜下來。}

# 舊內容的段落對應（month: 1/2/3）
spans:
  1: [1, 11]
  2: [12, 17]
  3: [18, 21]

# 規費：繳不出來就沒有店了
dues:
  title: 管理處收規費
  text: 管理處的人照著單子一家一家收。輪到許家店，他把單子放在櫃上：「{n} 靈石，今天收。」他看了看你的貨架，又看了看你。
  pay: 繳 {n} 靈石
  beg: 「下個月一起繳。」
  begText: 他在單子上畫了一個圈：「下次一起，多收三成。」他走的時候，順手把你門口的招牌扶正，像在看它還能掛多久。
  cant: 你翻遍抽屜，湊不出 {n} 靈石。
  pawnpay: 去街尾的黑門，再押一個月
  pawnpayText: 長生當鋪的門白天也開著，好像知道你會來。那個穿黑長衫的年輕人在帳本上多寫了一格，把一百五十靈石推給你，沒有問你要做什麼。你回到店裡，把規費繳了。管理處的人走的時候，你覺得店裡比剛才冷了一點。

# 長生當鋪：壽命不夠撐到結霜時會找上門
pawn:
  title: 長生當鋪的人
  text: 傍晚，一個穿黑長衫的年輕人站在你店門口，手裡拿著一本很舊的帳。「許先生，」他說，「您還剩 {left} 個月。到結霜，還要 {need} 個月。」他沒有催，只是翻開帳本，把筆遞給你。
  redeem: 贖回一個月（{cost} 靈石）
  redeemText: 他在帳本上劃掉一格，墨很淡，像是本來就快消失了。「多謝惠顧。」他把三百靈石收進袖子，沒有點。
  sell: 再押一個月，換 {gain} 靈石
  sellText: 他在帳本上多寫了一格，寫得很慢。「許先生，這一格，就不能贖了。」靈石放在櫃上，冰的。
  leave: 「再說吧。」
  leaveText: 他點點頭，把帳本闔上：「當鋪不催。帳會自己走。」
  cost: 300
  gain: 150

# 鐵師傅的攤子、修店面：每隔幾個月出現一次
smith:
  title: 鐵師傅的攤子
  text: 鐵師傅在舊公路邊擺了一張折疊桌，上面是他這陣子做的東西。他用下巴指了指：「往外走的人，身上要有東西。不買也沒關係，記得看路。」
  leave: 今天不買
upgrade:
  title: 這個月手頭有點寬
  text: 你算了算帳，抽屜裡有點餘錢。店面有幾個地方，早就該修了。
  leave: 先存著

# 出門
out:
  title: 這個月的空檔
  text: 有一天下午店裡沒什麼事，阿岳說他顧得來。你可以出門走走，也可以待在店裡靜坐。
  town: 在聚落裡走走
  far: 往外走
  stay: 待在店裡靜坐
  stayText: 你在二樓坐了一下午。窗外的霧來了又走。身體鬆了一點。
  townTitle: 聚落裡
  townText: 你在聚落裡走了一圈。要去哪裡？
  farTitle: 往外走
  farText: 你背上背包，站在聚落的入口。要往哪裡走？越下面越怪，回來越累。
  back: 回店裡

# 回程
ascent:
  title: 往回爬
  ok: 你一步一步往上走。腳很重，可是路還認得你。回到聚落的時候，天剛暗。
  heavy: 你背上的東西太重了。身體在往下沉，路在往上走。
  climb: 慢慢爬回去
  drop: 把最重的留下（{item}）
  dropText: 你把{item}放在路邊一塊石頭上。背上一下子輕了。你回頭看了一眼，它好像也在看你。

# 新增的死法（壽命、規費）
deaths:
  pawn_due:
    cat: 當鋪
    title: 到期不贖
    seal: 收當
    text: 你一早起來，覺得店裡特別安靜。鐘還在走，可是你聽不到。長生當鋪那個穿黑長衫的年輕人站在櫃檯前面，把帳本翻到最後一格，用指甲在上面輕輕一劃。「許先生，」他說，「到期了。」他說得很客氣，像在跟你說今天會下雨。
    hint: 壽命每個月少一個月，有些事、有些東西還會再扣。長生當鋪的人來的時候，三百靈石可以贖回一個月。錢要留著。
  shop_sealed:
    cat: 店裡
    title: 繳不出來的規費
    seal: 封店
    text: 管理處的人在鐵捲門上貼了兩張交叉的封條，一張寫「暫停營業」，一張寫「欠繳規費」。對門錢不語站在門口，替你嘆了一口氣，嘆得很大聲。沒有店，你就沒有東西可以押了。那天晚上，長生當鋪的黑門自己開了。
    hint: 規費每隔幾個月收一次，越來越貴。被騙、亂花，抽屜就會空。先把規費的錢留下來，再去想別的。
  raid_lie:
    cat: 店裡
    title: 說不知道
    seal: 搜店
    text: 你說不知道。周警員點點頭，好像早就等你這一句。他身後的兩個人進了庫房，十分鐘後抱著那批貨出來，貨底下壓著一本帳——你自己的帳，那一筆寫得清清楚楚。「收贓，加上說謊。」他在單子上多寫了一行。鐵捲門被貼上封條的時候，你才想起來，賣你貨的那個人，從頭到尾都沒有說過它是從哪裡來的。
    hint: 來路不明、價錢便宜得不對勁的東西，收之前先問來歷。真的收了，有人來查就老實交出來。
  raid_bribe:
    cat: 店裡
    title: 塞給他的那包靈石
    seal: 行賄
    text: 你把一包靈石推過櫃檯。周警員看了那包靈石很久，然後把它放進證物袋，連同你寫在帳上的那一頁。「本來只是收贓，」他說，「現在是兩件事了。」那天晚上，許家店的招牌被拆下來，放在管理處的倉庫裡，跟十二年前你爸那塊放在一起。
    hint: 被查的時候塞錢，只會多一條罪。老實交出來，最多賠錢。

# 收了來路不明的貨，下個月有人找上門
raid:
  title: 派出所的人來了
  text: 周警員站在門口，手裡拿著一張單子，沒有進來。「許老闆，」他說，「上個月有人看到你收了「{item}」。那批東西，是我們在找的。」他身後站著兩個人，一個看著你，一個看著你的庫房。
  give: 老實交出來，說是誰賣的
  giveText: 你把東西搬出來，把賣家的長相、說過的話，一五一十說了。周警員一邊寫一邊點頭：「罰款照收。下次，問清楚再收。」他走了以後，你才發現自己的手一直在抖。
  fine: 40
  lie: 「我不知道你在說什麼。」
  bribe: 把一包靈石推過櫃檯
  unmanaged:
    cat: 店裡
    title: 一個月什麼都沒管
    seal: 沒人管
    text: 消息在聚落裡走得比霧快：許家店這個月，什麼都不收、什麼都不管。月底，進門的只剩對門的錢不語。他站在櫃檯前，把你推掉的那幾件事一件一件數給你聽——每一件，後來都進了他的店。「〈你〉，」他說，「長生當鋪的人問我，這間店還有沒有人在顧。我說，沒有了。」那天晚上，街尾的黑門自己開了。帳本上那一格寫著：店主不在，壽命收當。
    hint: 一個月裡推掉、不理的事到了四件，聚落就當這間店沒人顧了。看不準的事可以先問、先查，不一定要推；真的要推，留給最可疑的那幾件。

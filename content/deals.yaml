  need: {has: {hantie: 5}}
  side: buy
  item: hantie
  qty: 10
  price: 6
  truth: {goods: genuine, origin: clean, intent: squeeze}
  lesson: 「新礦脈」只是他說的。管理處沒貼公告，鐵師傅也沒聽說；他說「要跌」時嘴角往上，你一沉默他就加價。真要跌，他不會急著收。
  verdict: [decline, expose]
  open: 「〈你〉，聽說了沒？北邊開了新礦脈，寒鐵要跌了。你爸留下那些寒鐵，趁還有人要，我幫你接手。六塊一公斤。」
  ask: {q: 錢老闆怎麼突然要收寒鐵？, a: 「錢家店做的就是寒鐵生意，跌了我也要收。收的人少，我收的就便宜。這是在幫你。」}
  press:
    - {q: 新礦脈在哪裡？, a: 「北邊嘛。礦上的事，我們做生意的哪講得清楚。」}
    - {q: 誰說的？, a: 「茶館都在傳。白姐那邊的消息，你還不信？」}
  silence: 「……你爸當年也這樣，一想就是半天。好啦，我再加半塊。」
  silenceRaise: 6.5
  haggle:
    - {price: 6.5, a: 「六塊半，再多我就虧了。」}
    - {price: 7, a: 「七塊。〈你〉，這是看在你爸的面子上。」}
  tells:
    - {after: open, need: -2, text: 他說「要跌」的時候，嘴角是往上的。, f: smile}
    - {after: silence, need: -2, text: 他加價加得很快，好像早就準備好了這半塊。, f: smile}
  appraise:
    - {realm: 4, text: 你自己的十公斤寒鐵原礦，成色很勻，是正規礦上出的老料，有登記印記。}
  verify:
    - {who: tie, cost: 0, a: 「北邊？我沒聽說。」}
    - {who: bai, cost: 5, a: 「寒鐵的消息啊……聽雨茶館什麼都賣，消息也是。許老闆自己判斷。」}
  opts:
    deal: {label: 賣給他, text: 錢不語笑著點了靈石：「爽快！」他走的時候，腳步比來時輕。, fx: {mem: {qian: 想用低價收你的寒鐵，你賣了。}}}
    decline: {text: 他也不惱：「行，那你留著。跌了別怨我。」, fx: {mem: {qian: 想用低價收你的寒鐵，你沒賣。}}}
    expose: {right: true, text: 你說：「真的有新礦脈，管理處早就貼公告了。帳面上的事，錢老闆比我清楚。」錢不語哈哈一笑：「誤會，誤會。來，喝茶。」他自己沒喝就走了。, fx: {rel: {qian: -2}, rep: {loose: 1}, flag: [exposed_qian], mem: {qian: 拿礦脈的傳言壓價收你的寒鐵，被你點破了。}}}
    report: {text: 你去派出所說了這件事。周警員只回了一句：「錢老闆收寒鐵，礙著你什麼了？」, fx: {rel: {zhou: -1}, mem: {zhou: 你去告錢家店壓價，他替錢家店說話。}}}


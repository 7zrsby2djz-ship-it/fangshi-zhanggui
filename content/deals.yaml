    - {q: 你自己試了幾天？, a: 「兩天半。最後那半天，我的靈識撐不住。」}
  silence: 「……你不信？石屋裡還有一具骨骸，手裡握著半本書，我沒敢動。人面向東邊，我猜是還惦記著誰……」

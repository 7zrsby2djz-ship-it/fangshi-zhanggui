    expose: {right: true, text: 你說：「師父讀了兩天半就燒了讀卡機，卻記得門牌B2-17、門上貼什麼貼紙。這記性，拿去背卡裡的東西剛好。」道士臉色一變，甩了一下袖子就走。, fx: {rep: {loose: 1}, tag: {loose: 眼尖}}}
    report: {text: 周警員懶得理你：「騙子？你不買就是了。」, fx: {rel: {zhou: -1}}}
    refer: {text: 你指了指對門：「錢家店收這種寶貝。」道士合掌道謝，拿著記憶卡過馬路去了。, fx: {flag: [yujian_to_qian]}}


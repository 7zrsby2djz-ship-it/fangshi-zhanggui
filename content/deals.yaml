  open: 「你來得正好。這枚玉簡是一位前輩過世前留的，要用靈識試滿三天，裡面的東西才會出來。我修為不夠，試不開，想換點旅費。四十靈石。」
  ask: {q: 你在哪裡拿到的？, a: 「我在西邊沙漠一間石屋撿到。屋主留了紙條：『有緣者得之。』」}

  open: 老錢把手推車停在門外。「小許，這批你要放多久？北邊又挖到一批，等那批運下來，你這些還賣得掉？一公斤十塊，六公斤整箱六十。不足整箱，就按秤出的重量算。」
  ask: {q: 你不是也怕跌，怎麼還要整批？, a: 「我有客人在等啊。等它跌？人家早就跟別人買了。我現在搬走，你也不用再慢慢零賣。」}
  press:
    - {q: 新礦脈在哪裡？, a: 「北邊啊。你問這麼細，我又沒去挖。」}
    - {q: 誰說的？, a: 「外面都在講，早上的報紙你沒看？也有人跟我講。是不是同一個消息，我哪知道。你到底是要賣東西，還是要查我跟誰來往？」}
  silence: 老錢往後靠。「好啦，六公斤整箱六十五，現在就給你。你也不用再慢慢零賣，省多少事。不是整箱就照重量比例算。」
  silenceRaise: 6.5

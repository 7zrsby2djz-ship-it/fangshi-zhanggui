# 交易。truth 三層：goods（貨）/ origin（來路）/ intent（意圖）——玩家永遠看不到。
# side：sell = 對方賣給你；buy = 對方向你買；task = 委託或其他
# verdict：哪些處置算「看穿了」；neutral: true 表示這筆不評對錯
# 〈你〉 會依境界差換成對方對你的稱呼
# tells.need：你的境界減對方境界 ≥ need 才看得見（狐尾燈在店裡 +2）


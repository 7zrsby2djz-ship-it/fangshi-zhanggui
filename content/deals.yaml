    - {after: silence, need: -2, text: 他很快就接著報價，手推車仍停在門外。, f: smile}
  appraise:
    - {realm: 4, text: 你手上這批鐵礦石成色一致，是正常礦區出的老料；重量按當前選的批次另算。}
  verify:
    - {who: tie, cost: 0, a: 「北面？我沒聽說。」}
    - {who: bai, cost: 5, a: 「礦區消息啊……聽雨樓什麼都賣，消息也是。你自己判斷。」}
  opts:
    deal: {label: 賣給他, text: 老錢笑著點了靈石：「爽快！」他走的時候，腳步比來時輕。, fx: {mem: {qian: 想用低價收你的寒鐵，你賣了。}}}
    decline: {text: 他也不惱：「好啦，之後跌了不要怪我。」許衡說：「我自己留的，怪你幹嘛。」老錢拉著空車回對面。, fx: {mem: {qian: 想用低價收你的寒鐵，你沒賣。}}}
    expose: {right: true, text: 你說：「你拿新礦消息壓價，可是誰去過、什麼時候出貨都沒說清楚。這樣我不能按你的話算價。」老錢把椅子推回去：「好啦，是我多管閒事。」他拉著推車回去了。, fx: {rel: {qian: -2}, rep: {loose: 1}, flag: [exposed_qian], mem: {qian: 拿礦脈的傳言壓價收你的寒鐵，被你點破了。}}}

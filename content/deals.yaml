- id: d06
  openFace: smile
  title: 空白記憶卡
  npc: daoren
  where: shop
  days: [1, 2]
  prio: 7
  side: sell
  item: yujian
  qty: 1
  price: 40
  lot: {q: 0.02, label: 修行記憶卡（據說）}
  truth: {goods: fake, origin: clean, intent: con}
  lesson: 實驗室在第幾層、門牌號碼都記得，讀了兩天半卻說讀卡機壞了——故事太完整了。白姐今年見過四張，姚四年輕時也買過；仔細看，卡的金屬接點是新磨的。
  verdict: [decline, expose, refer]
  open: 「這位老闆有緣。這張記憶卡，是一位老前輩過世前存進去的修行方法，要接上還能用的讀卡機，連續讀三天才出得來。我沒那個機器，只想換點路費。四十靈石。」
  ask: {q: 師父從哪裡得來的？, a: 「西邊斷崖下面一間舊實驗室撿的。桌上留了一張紙：『有緣的人拿去。』」}
  press:
    - {q: 實驗室在斷崖哪裡？, a: 「從舊步道往下三百公尺，第七個平台，鐵門朝東，門牌是B2-17，門上貼著一隻三隻腳的烏鴉貼紙。」}
    - {q: 師父自己讀過幾天？, a: 「兩天半。最後半天，讀卡機燒掉了。」}
  silence: 「……這位老闆不信？那間實驗室裡還有一具骨頭，手裡握著一本筆記，我沒敢動。他死的時候臉朝東邊，大概是在想家……」
  haggle:
    - {price: 30, a: 「三十。我只是要路費。」}
    - {price: 25, a: 「二十五。再少，我就回不去了。」}
  tells:
    - {after: silence, need: -3, text: 他說得越多，眼睛越亮，像是在等你的反應。, f: smile}
  appraise:
    - {realm: 4, text: 卡的金屬接點亮得不正常，是最近才磨過的。舊時代的東西，不會這麼新。}
  verify:
    - {who: bai, cost: 5, a: 「這種記憶卡，今年我看過四張。四個道士，四間斷崖下的實驗室。」}
    - {who: yao, cost: 0, a: 「空白記憶卡？我年輕時也買過一張，找讀卡機找了三個月，找到了，裡面是空的。」}
  opts:
    deal: {label: 買下, text: 道士合掌：「有緣。」他走得很快，袍子在門口一閃就不見了。, fx: {flag: [bought_yujian]}}

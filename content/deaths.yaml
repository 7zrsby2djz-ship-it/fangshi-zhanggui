# ═════════════ 死法 ═════════════
# 每一種死法：title（死法名）、cat（分類）、text（死亡畫面）、hint（圖鑑裡的「怎麼避開」）、seal（印章，兩字）
# 觸發方式：fx 裡寫 death: id，或 death: {id, chance, unless: 條件, saved: 逃過一劫的文字}
# 上升負擔：探索帶回來的「負擔」超過身體撐得住的量，回程可能會死（ascent: 該地點的死法 id）。
deaths:
  # ─── 上升負擔 ───
  asc_ruin:
    cat: 上升負擔
    title: 斷路邊的午睡
    seal: 長眠
    text: 你只是在翹起來的柏油上坐一下。風很舒服，雲海在腳底下慢慢走。你想，休息五分鐘就好。第二天早上，撿破爛的小孩發現你的時候，你還坐在那裡，臉朝著雲，表情很平靜，像在等一班車。
    hint: 連崩塌段都會累死人，代表你前幾天已經把身體用光了。看清楚上方的「負擔」，紅了就回家睡覺。
  asc_tunnel:
    cat: 上升負擔
    title: 隧道口的最後一百公尺
    seal: 窒息
    text: 隧道口的光就在前面，一百公尺，你走了很久。每走一步，胸口就像被人多壓一塊磚。最後二十公尺，你是爬的。光照到你手指的時候，你停了。後來走過的人說，那盞沒有電也亮的燈，那天晚上特別亮。
    hint: 隧道看起來不深，可是負擔會一層一層疊。回程前看一眼「回程危險」的提示。
  asc_reservoir:
    cat: 上升負擔
    title: 霧裡的岸
    seal: 迷霧
    text: 你從水庫底下的路往上走，霧越來越濃，腳越來越重。你看見岸了，看見賣霧的阿伯在對你招手。你走過去，他一直在前面一點點，一直在前面一點點。你最後記得的，是腳底下的地變成了水，水是溫的。
    hint: 寒潭水庫本身不深，深的是你身上積著的累。負擔超過上限再出門，連平常的路都會變長。
  asc_cliff:
    cat: 上升負擔
    title: 斷崖步道第三百一十二階
    seal: 墜落
    text: 步道的台階有人用油漆編了號。你在第三百一十二階眼前一黑，手抓住欄杆，欄杆是鏽的。你掉下去的時間很長，長到你看清楚了海往下流的那個缺口，看清楚了卡在半空中的那艘船，船上有人在朝你揮手。
    hint: 斷崖是第三層，往下容易、往上難。負擔快滿的時候，別再多看一處。
  asc_north:
    cat: 上升負擔
    title: 柵欄外的霜
    seal: 凍結
    text: 從北礦柵欄往回走的路上，你覺得很暖，暖到想把外套脫掉。你知道這是不對的，可是你還是脫了。巡守隊三天後在路邊找到你，你蜷著，臉上帶著笑，全身蓋著一層朝北的霜花。
    hint: 北礦外圍很耗身體，而且越冷越覺得熱。負擔紅了就不要去，去了也只看一處。
  asc_stair:
    cat: 上升負擔
    title: 維修梯B1
    seal: 上升
    text: 下去的時候你很輕，輕到想笑。往上爬到B1，你的耳朵開始流血；爬到崖頂前三格，你的手指不聽話了。你最後看見的是粉筆字：「下去容易。」底下還有一行你之前沒看到的小字：「上來要帶著命。」
    hint: 斷崖下的維修梯是上升負擔最重的地方之一。下去之前，負擔要是空的；一天只下一次。
  asc_lampst:
    cat: 上升負擔
    title: 留在燈街的人
    seal: 歸屬
    text: 你想回去，可是身體不肯。每往上一格，心臟就像被拉回去一格。燈街的窗戶一扇一扇亮起來，有人開門，有人把你的拖鞋擺在門口，有人說：「你回來啦。」你說對，我回來了。那是你說的最後一句話，也是最後一句是你自己的話。
    hint: 第六層的燈街，負擔一次就堆很高。吐納六層以上、負擔空著、身上帶著回程用的東西，再下去。
  asc_platform:
    cat: 上升負擔
    title: 月台上的乘客
    seal: 候車
    text: 回程的梯子不見了，或者說，梯子還在，可是你的身體已經忘了「上」是哪個方向。你在長椅上坐下，旁邊的人遞給你一張票。你收下了。廣播說，下一班車，即將進站。
    hint: 第七層幾乎沒有人回來過。去之前一定要讓負擔歸零，而且只看一處。

  # ─── 探索中的選擇 ───
  wall_hand:
    cat: 探索
    title: 水牆裡的手
    seal: 海葬
    text: 你把手伸進那面直立的海水。水是溫的，很軟，像有人握住了你的手。你想抽回來，對方不放。你最後一個念頭是：原來海是從這裡往下流的。隧道的燈照著那面水牆，水牆裡多了一個影子，慢慢往下沉。
    hint: 林老師說，舊物室那顆「不沉的石頭」，是有人從水牆前面帶回來的。手上握著它的人，水不會留你。
  echo_answer:
    cat: 探索
    title: 跟回聲講話
    seal: 回聲
    text: 你在隧道裡喊了一聲，回聲答了你。你又喊，回聲回答的不是你喊的話。你們聊了很久，聊到你的聲音越來越小，它的聲音越來越像你。後來去隧道的人說，喊一聲，回聲會用許衡的聲音說：「我在這裡。」
    hint: 回聲不能聊太久。身上帶著回聲石的人，回聲會先找石頭講話。
  dam_dive:
    cat: 探索
    title: 水底的村子
    seal: 返鄉
    text: 你潛下去，水比想像的淺。村子的路燈還亮著，雜貨店的鐵捲門拉了一半，有人在裡面看電視。你敲了敲門，對方說：「下來了喔，那就不用上去了。」你回頭看，水面很遠很遠，像天空。
    hint: 冷羽毛會讓人冷靜。帶著它下水的人，會記得要回頭。或者，身體適應到吐納七層再說。
  fog_lamp:
    cat: 探索
    title: 霧裡的第四十二盞燈
    seal: 迷霧
    text: 你跟著霧裡的路燈走，一盞、兩盞……釣魚的阿伯說他數到第四十一盞。你數到第四十二盞的時候，發現那盞燈底下站著的是你自己，提著燈，在等人。你們互相看了很久。後來阿伯說，今年的燈，多了一盞。
    hint: 霧裡的燈不能跟。真的要跟，帶著那個只會指著你家方向的指南針。
  cliff_jump:
    cat: 探索
    title: 跟著海一起走
    seal: 落海
    text: 你站在斷崖邊，看海往下流。流了一百年，海面沒有低一公分。你想知道水去了哪裡。你真的很想知道。風從下面往上吹，好像在扶著你。你往前走了一步。風沒有扶住你。……你到底看到了什麼，沒有人知道。
    hint: 這個沒有辦法避開。只能不要往前走那一步。
  ship_climb:
    cat: 探索
    title: 半空中的船
    seal: 墜落
    text: 你順著卡在崖壁上的纜繩爬到船上。甲板是斜的，船艙裡的餐桌擺著碗筷，飯是熱的。你吃了一口。船輕輕晃了一下，好像終於等到最後一個乘客，鬆開了崖壁。
    hint: 半空中的船吃不得、坐不得。身體到吐納六層的人，爬上去會先注意到纜繩是新的。
  vent_enter:
    cat: 探索
    title: 會呼吸的通風口
    seal: 吞沒
    text: 通風口吸氣的時候，你把頭探進去。很暗，很暖，聞起來像剛洗好的被子。它吐氣的時候，你沒有被吐出來。北礦的人說，那幾天通風口的呼吸很慢、很飽，像吃過飯的人。
    hint: 通風口只能聽，不能鑽。狐尾燈照得出它什麼時候在吸氣。
  frost_bare:
    cat: 探索
    title: 霜的源頭
    seal: 凍結
    text: 你用手直接摸了那道地裂。霜從指尖往上爬，很慢，很漂亮，像一株往上長的白色的樹。等它爬到你的胸口，你已經不覺得冷了。巡守隊把你搬回來的時候，你很輕，輕得像一塊霜晶。
    hint: 霜的源頭不能空手碰。身上有冷羽毛，霜會先往羽毛那邊長。
  lab_card:
    cat: 探索
    title: B2-17的讀卡機
    seal: 讀取
    text: 你把一張空白記憶卡插進讀卡機。機器沒有電，可是亮了。螢幕上出現一行字：「讀取中，請勿拔除。」你沒有拔。三天後，有人在實驗室的椅子上發現你，你面向東邊坐著，表情很專心，像在等一個很長的檔案載完。
    hint: 道士說的「讀三天」是真的，只是讀的不是卡。不要把東西插進還會亮的機器。
  bus_board:
    cat: 探索
    title: 末班車
    seal: 乘車
    text: 23:59，車來了。司機看了你一眼：「票？」你說沒有。他說沒關係，第一次坐都不用票。車門關上，車往下開。窗外的燈一排一排往上飛。你一直在等下一站的廣播，廣播一直沒有響。
    hint: 末班車要用票。崩塌段、斷崖下面，都撿得到舊票根——拿著票上車的人，司機會讓你在第七層下車。
  flower_eat:
    cat: 探索
    title: 吃了白花
    seal: 轉向
    text: 白花是甜的。吃下去以後，你的頭一直想轉，轉向北邊。你轉過去，就舒服了；轉回來，就頭痛。後來你一直朝北站著，站在維修梯的平台上，跟其他的白花一起。
    hint: 從斷崖下面爬上來的人說過：白花會一直看你。會看你的東西，不能吃。
  window_knock:
    cat: 探索
    title: 敲了燈街的窗
    seal: 歸屬
    text: 你敲了窗。窗裡那個在吃飯的人轉過頭，是你爸。他站起來替你開門：「怎麼這麼晚。」你說店裡忙。你坐下來，飯是熱的，湯是你小時候喝的那個味道。你一直沒有再站起來。
    hint: 燈街的窗只能看，不能敲。不管窗裡的人長得像誰。
  lampst_eat:
    cat: 探索
    title: 燈街的晚飯
    seal: 飽足
    text: 有人塞給你一個便當，飯上面放一顆滷蛋，跟舊國小附近那家便當店一模一樣——那家店，一百年前就不在了。你吃完，覺得很飽、很安心，安心到不想回去了。
    hint: 下面的東西不要吃。吃了，身體就會覺得自己是這裡的人。
  lampst_stay:
    cat: 探索
    title: 過了23:59
    seal: 停留
    text: 你看錶，23:58。你想再看一分鐘就走。燈街所有的鐘同時跳到23:59，然後停住。窗裡的人都抬起頭，對你笑。那一分鐘很長，長到現在還沒有過完。
    hint: 燈街的時間停在23:59。待得太久，你也會停在那裡。帶著倒走的錶，你會比較早發現時間不對。
  platform_look:
    cat: 探索
    title: 往月台下看
    seal: 凝視
    text: 月台底下不是鐵軌。是更多的月台，一層一層往下，每一層都有人在等車。你看得太久，最下面那一層的人抬起頭，跟你對上眼。下一秒，你就站在他們中間了。
    hint: 第七層月台的邊，看一眼就好。
  platform_wait:
    cat: 探索
    title: 等下一班
    seal: 候車
    text: 你決定等下一班車，看看它從哪裡來。等了一個小時，兩個小時，一百年。長椅很溫，旁邊的人很安靜。有時候，你會聽到很高很高的地方，有人在喊「阿衡」。你想應，可是嘴巴已經忘了怎麼動。
    hint: 末班車只有一班。

  # ─── 遺物的代價 ───
  bead_street:
    cat: 遺物
    title: 珠子裡的街
    seal: 映入
    text: 三顆黑玻璃珠映的是同一條街。你把它們排成一排，街就連起來了，很亮，很熱，有海風。你湊近一點，再近一點。第二天，店裡只剩三顆珠子排在櫃上，其中一顆，映著一個在海邊走路的人，背影很像你。
    hint: 黑玻璃珠不要收太多顆，尤其不要排在一起看。拿去給林老師，或捐出去。
  watch_zero:
    cat: 遺物
    title: 倒走的錶歸零
    seal: 歸零
    text: 錶一直倒著走。你算過，它走到零的那一刻，就是今天晚上。你想看看零以後會怎樣。零點的時候，指針停了。你也停了。後來林老師把那隻錶放進舊物室，指針又開始往前走了。
    hint: 倒走的錶會一天一天提醒你。有人叫你把它上緊，就上緊。
  sea_drink:
    cat: 遺物
    title: 喝了斜的海水
    seal: 傾斜
    text: 瓶子裡的海水永遠是斜的。你想知道喝下去會怎樣。你喝了一口，鹹的，跟普通的海水一樣。然後你就一直往左邊倒，世界一直往右邊斜，斜到最後，你沿著店裡的地板，一路滑出了門外，滑出了聚落。
    hint: 斜的海水是看的，不是喝的。
  fog_third:
    cat: 遺物
    title: 第三次應聲
    seal: 迷霧
    text: 霧又來了，又叫了一聲「阿衡」。你已經應過兩次了，每次都少一點什麼。第三次你應了，還走出門去找她。霧很溫柔，像小時候被抱著。街坊第二天只找到一根白色的長羽毛，插在你的店門上。
    hint: 霧裡叫你的聲音，應一次會少一點東西。應三次，就整個人都給它了。
  bell_open:
    cat: 遺物
    title: 半夜的銅鐘
    seal: 應門
    text: 半夜，櫃上那個小銅鐘自己響了三下。你去開門。門外沒有人，只有一排腳印，從霧裡走過來，停在門口，鞋尖朝著你。你低頭看，你的腳也在那排腳印裡面。
    hint: 銅鐘自己響的時候，不要開門。等它響完第七下，客人就走了。
  flower_keep:
    cat: 遺物
    title: 一屋子的白花
    seal: 轉向
    text: 你收了太多深淵的花。它們一起轉向你，一起轉向北，一起慢慢長出根。某天早上你起不來，因為你的腳也長了根。花很漂亮，路過的人都說，許家店的花開得真好。
    hint: 深淵的花一朵兩朵沒事。超過三朵，記得拿去給林老師。

  # ─── 店裡與夥計 ───
  robbery:
    cat: 店裡
    title: 跟搶匪拚了
    seal: 刀傷
    text: 三個蒙面的人說要那批不問來路的貨。你抓起櫃上的秤錘。打架只花了十秒，你的血流了一整晚。後來大家說許家店的老闆有骨氣，可是骨氣沒辦法收進帳本。
    hint: 收「來路不明」的貨，麻煩會上門。請個守夜的人，或裝鐵捲門；真的遇上了，錢給他就好。
  breath_box:
    cat: 店裡
    title: 會呼吸的箱子
    seal: 開箱
    text: 夥計收進來的木箱一直在呼吸，一吸一吐，很規律。你撬開它。箱子裡什麼都沒有，只有一股很冷的風，往你的臉上吹。風停了以後，箱子是滿的。夥計第二天打開，裡面只有你的外套。
    hint: 來路不明的東西，會呼吸的、會敲的、會發熱的，不要自己打開。交給黑狗，或交給派出所。
  bad_pill:
    cat: 店裡
    title: 自己試吃
    seal: 試藥
    text: 收進來的藥丸沒有標籤，賣的人說吃了能直接築基。你想先試一顆，免得賣給客人出事。你很負責。藥效來得很快：你看見自己的經脈，像一張發亮的地圖，然後地圖燒起來了。
    hint: 來路不明的藥，不要賣，更不要吃。
  amei_search:
    cat: 店裡
    title: 去找阿妹
    seal: 尋人
    text: 阿妹兩天沒回來。你一個人在晚上進了隧道，沒帶燈。你一路喊她的名字，回聲一路回答你。最後你找到她了——她坐在水牆前面，回頭對你笑：「老闆，你也來了喔。」她的影子，是水做的。
    hint: 要找人，白天去，帶燈，帶人。或者，一開始就不要讓十四歲的孩子往深處跑。
  night_guest:
    cat: 店裡
    title: 沒有影子的客人
    seal: 隨行
    text: 溫伯說，今天晚上那位客人，是來找老闆的。他沒有影子，說話很客氣，說你媽託他帶一句話，可是要在外面講。你跟他出去了。溫伯在帳本上寫：「老闆跟客人出門。未歸。」字寫得很工整。
    hint: 夜裡沒有影子的客人，什麼都可以賣給他，就是不要跟他走。
  frost_window:
    cat: 店裡
    title: 結霜那晚沒關窗
    seal: 凍結
    text: 結霜第一個晚上，你想看霜是怎麼爬進來的，就沒關窗。它爬得很慢，先爬上窗框，再爬上櫃子，再爬上你的手背。你一直看，看得很專心。早上阿花嬸來開門，以為你在櫃上睡著了。
    hint: 結霜的那幾天，晚上一定要關窗。
  greed_dig:
    cat: 探索
    title: 再挖深一點
    seal: 坍方
    text: 碎石底下有東西在發光。你挖，它就往下一點；你再挖，它又往下一點。等你挖到手指流血、整個人趴進洞裡，上面的柏油牆才慢慢、慢慢地，往你身上靠了過來。
    hint: 崩塌段的東西翻得到就翻，翻不到就算了。會往下躲的東西，是在帶你走。

# ═════════════ 謎題簿：一條一條追下去的事 ═════════════
# steps：依序，flag 成立就算完成；hint 是還沒完成時給的方向（只顯示下一步的 hint）
threads:
  - id: lamp
    title: 霜華的燈
    desc: 你媽的事、玄霜巡守隊、盲婆婆的那盞燈。
    steps:
      - {flag: got_box, text: 姚四還來你爸寄放的舊箱子，裡面有半截燒焦的編繩。, hint: 第一兩天，姚四會來店裡賣一箱舊貨。}
      - {flag: lamp, text: 盲婆婆摸過編繩，把唯一的狐尾燈給了你。, hint: 舊公路市場的盲婆婆，認得某種繩結。把編繩拿給她看。}
      - {flag: mang_told_mother, text: 盲婆婆說，她是你媽霜華以前的隊友。, hint: 五月，帶著燈再去找盲婆婆。}
      - {anyFlag: [mang_north, tie_xuanshuang, elder_lamp], text: 你知道了燈原本該放在哪裡。, hint: 結霜那幾天，盲婆婆、鐵師傅、或那個來討熱水的老人，都知道燈的事。}
  - id: ledger
    title: 十二年前的帳
    desc: 你爸的帳冊少了七頁。那一年三月，派出所進了許家店的倉庫。
    steps:
      - {flag: got_box, text: 你拿回了你爸的帳冊，缺了七頁。, hint: 先拿回你爸的舊箱子。}
      - {anyFlag: [knows_raid, got_pages], text: 你知道了一部分十二年前的事。, hint: 白姐知道那天清早誰站在對街；缺的那幾頁，姚四知道在哪裡。}
      - {anyFlag: [qian_confronted, zhang_exposed, scar_caught, lu_knows_scar], text: 你手上的帳，已經對得上人了。, hint: 對門的錢老闆、回春藥行的張主任、北林的案子——總有一筆會對上。}
  - id: lastbus
    title: 23:59的末班車
    desc: 翻倒的公車、站牌、票根。到處都是同一個時間。
    steps:
      - {flag: saw_bus_window, text: 翻倒的公車窗上，有一個不會乾的笑臉。, hint: 舊公路崩塌段的草叢裡，有一輛翻倒的公車。}
      - {flag: saw_deep_stop, text: 斷崖下第四層，立著一根沒有終點站的站牌，末班車23:59。, hint: 斷崖下面的維修梯，一直往下。}
      - {anyFlag: [has_ticket_seen, rode_bus], text: 你注意到，撿回來的舊票根上印的時間，都是23:59。, hint: 崩塌段和斷崖下面，風會把票根吹上來。手上有一張，再去站牌。}
      - {flag: rode_bus, text: 你拿著票，搭上了末班車，在第七層下了車。, hint: 拿著票根，在站牌下等23:59。}
  - id: watch
    title: 倒走的錶
    desc: 一隻倒著走的錶，好像在倒數什麼。
    steps:
      - {flag: got_watch, text: 你拿到一隻倒著走的錶。, hint: 舊隧道裡的燈下，有人遺落了一隻錶。}
      - {flag: watch_counted, text: 你算出它歸零的時間。, hint: 帶著錶過幾個晚上，它會提醒你。}
      - {anyFlag: [watch_wound, studied_biao], text: 你讓錶不再歸零。它停在23:59。, hint: 把它上緊，或交給懂的人。}
  - id: fog
    title: 霧裡的聲音
    desc: 霧裡有人叫你「阿衡」。只有你媽會這樣叫你。
    steps:
      - {anyFlag: [heard_fog_name, met_fog_man], text: 你在水庫的霧裡，聽見有人叫你的名字。, hint: 寒潭水庫的霧裡，有賣霧的阿伯，也有別的東西。}
      - {anyFlag: [answered_fog, ignored_fog], text: 霧來店門口叫過你。, hint: 五月以後，霧會自己找上門。}
      - {anyFlag: [fog_named, studied_lengyu], text: 你知道霧裡的聲音想要什麼了。, hint: 林老師研究過霧裡留下的羽毛；或者，跟著霧裡的燈走一次。}
  - id: amei
    title: 阿妹的地圖
    desc: 撿東西的阿妹，畫了一張只有她看得懂的地圖。
    steps:
      - {flag: hired_amei, text: 你請了阿妹幫店裡撿東西。, hint: 店務裡可以請夥計。}
      - {flag: amei_map, text: 阿妹給你看她畫的地圖，上面有一條你沒走過的路。, hint: 讓她多撿幾天。}
      - {anyFlag: [amei_safe, amei_lost], text: 阿妹那條路的盡頭，你知道了。, hint: 她會往太深的地方跑。}
  - id: night
    title: 夜班的客人
    desc: 溫伯說，晚上來的大多是好人。
    steps:
      - {flag: hired_wenbo, text: 溫伯開始顧夜班。, hint: 五月以後，店裡可以請一個顧夜班的人。}
      - {flag: night_guest_seen, text: 溫伯的帳本上，記著一位沒有影子的客人。, hint: 讓他顧幾個晚上。}
      - {anyFlag: [night_guest_paid, night_guest_lamp], text: 你知道那位客人是誰派來的了。, hint: 他還會再來。不要跟他走。}
  - id: depth
    title: 更下面
    desc: 斷崖下面的路燈，其實是窗。
    steps:
      - {flag: saw_below_lights, text: 你從斷崖往下看，看到一排路燈。, hint: 西側斷崖的步道走到底。}
      - {flag: stair_b1, text: 你下了維修梯，身體一路變輕。, hint: 身體適應到吐納五層，就撐得住維修梯。}
      - {flag: lampst_in, text: 你走進了第六層的燈街。, hint: 從斷崖下面往上看過聚落之後，路燈之間會出現一條街。}
      - {flag: platform_in, text: 你站上了第七層的月台。, hint: 燈街的盡頭，或者末班車。}

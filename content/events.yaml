events:
  e_intro:
    title: 長生典的字條
    text: 天還沒亮，門縫裡塞進來一張字條。紙色暗黃，字跡很淡：「許公子，尚餘一年又六個月。」落款是長生典。
  e_sting:
    title: 周執事上門
    cases:
      - if: {holdFlag: sting}
        text: 周執事帶著兩個人進門，直接走到庫房，把那三枚療傷丹翻了出來，瓶底的硃印對著光：「許掌櫃，收贓，是要罰的。」罰三十，丹藥沒收。
        fx: {confiscate: sting, stones: -30, rep: {sect: -1}, tag: {sect: 收贓的}, rel: {zhou: -1}, flag: [sting_caught]}
      - if: {}
        text: 周執事帶著兩個人進門：「柳郎中賣給你的療傷丹呢？賣出去了？那就罰得更重。」罰四十五。
        fx: {stones: -45, rep: {sect: -1}, tag: {sect: 收贓的}, rel: {zhou: -1}, flag: [sting_caught]}
  e_pkg:
    title: 有人舉報
    cases:
      - if: {}
        text: 周執事帶人進門：「有人告發許記私藏私鐵。」包裹從櫃下拖出來，火漆一挑開，是二十斤沒有印記的寒鐵。周執事把包鐵的襯紙折起來，收進袖子裡，罰了你五十：「下不為例。」對門錢記的門，今天沒開。
        fx: {stones: -50, rep: {sect: -1}, tag: {sect: 私藏寒鐵}, rel: {zhou: -1}, flag: [pkg_caught]}
  e_aheng_warn:
    title: 阿蘅託人帶話
    text: 「林子北邊這幾天別去，狼的腳印越來越多。」
  e_xiaoman_back:
    title: 回春堂退貨
    cases:
      - if: {backFlag: painted}
        text: 葛小滿紅著眼睛回來了，把赤炎草放在櫃上：「師父說，金線是畫的。」張掌事要你退錢。
        fx: {rel: {zhang: -2, xiaoman: -2}, rep: {sect: -1}, tag: {sect: 賣假草}, flag: [zhang_saw_fake]}
      - if: {}
        text: 葛小滿紅著眼睛回來了，把赤炎草放在櫃上：「師父說，這草不到二十年，藥性也虛。」張掌事要你退錢。
        fx: {rel: {zhang: -1, xiaoman: -1}, rep: {sect: -1}, tag: {sect: 以次充好}}
  melt:
    xuechan: 你打開玉匣。裡面只剩一汪清水，涼的。
    default: 「{name}」放壞了。
  complaint:
    painted: 金線是畫的！
    damp: 符一沾水就化了！
    default: 這是什麼次貨！

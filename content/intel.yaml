    cases:
      - if: {dayAfter: 3}
        text: 周警員讓人去聚落入口問了一聲。那個道士第四天一早就離開聚落，往西走了。「人走了。」周警員說，「下回早點來。」
      - if: {strength: 3, has: {yujian: 1}}
        text: 周警員聽你把話說完，派了兩個人出去。傍晚前人就帶回來了，是在聽雨茶館樓下抓到的，正拉著一個年輕人說斷崖下的實驗室。他背包裡還有三張一模一樣的記憶卡。周警員把你那張扣下當證物，從道士的路費裡數了靈石給你：「苦主是你，錢退你八成。另外兩成，是派出所辦案的辛苦錢。」
        fx: {unfool: d06, refundLot: {item: yujian, ratio: 0.8}, rel: {zhou: 1}, rep: {sect: 1, loose: 1}, tag: {loose: 不好惹}, flag: [daoren_caught], spreadText: 聚落裡抓了一個賣假記憶卡的道士，背包裡還有三張。, mem: {zhou: 你告了賣假記憶卡的道士，證據齊全。}}
      - if: {strength: 1}

# 消息簿。玩家看不到 truth，也看不到 leak 的內容。
#
# kind：seen = 你親眼看到、親手驗過的；heard = 別人說的（可能是假的）
# from：在哪裡得知
#   〈交易〉:open / ask / press0 / press1 / silence / appraise / verify:〈人〉 / opt:〈處置〉
#   home:〈人〉（登門）　smith:〈貨〉（賣給鐵老蔫時他順口說的）　lot:〈貨〉（鑑定庫房裡的貨）
# flag：任一旗標成立就記下；need：條件成立就記下（同 deals 的 need）。srcText：這類記下時顯示的來處
# short：賣消息時按鈕上的短名
# value：白七娘的底價
# exclusive：坊市裡只有你知道。sharedIf：這些旗標任一成立，就不只你知道了
# hot：[起, 迄]，這幾天想知道的人多。public：從這天起人盡皆知。expire：過了這天沒人要。expireFlag：旗標成立就沒人要
# refuse：白七娘不收，說這句話
# truth: false：賣了之後，reveal 那天白七娘會發現，burn 是她託人帶來的話
# spread：白七娘轉手之後，隔天晨報上的樣子。suppress: true 表示她壓著不賣
# sellFlag：賣出後設的旗標
# leak.cases：賣出後隔天早上，當事人的反應（依序取第一個條件成立的）

intel:

  i_vein_claim:

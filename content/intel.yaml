      - if: {strength: 3, has: {yujian: 1}}
        text: 周正聽你把話說完，派了兩個人出去。下午前人就帶回來了，是在聽雨樓樓下逮著的，正拉著一個外圍工作人員說西漠的洞府。他袖子裡還有三枚一模一樣的玉簡。周正把你那枚扣下當證物，從道士的旅費裡數了靈石給你：「苦主是你，錢退你八成。另外兩成，是派出所辦案的辛苦錢。」

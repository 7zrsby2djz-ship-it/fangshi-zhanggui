  text: 儲物袋是散修的半個家。袋口的花紋會告訴你它的主人屬於哪裡，所以拿到別人儲物袋的人，第一件事就是挑掉花紋。
  sell: [walk]

canye:
  name: 帳冊缺頁
  cat: story
  unit: 疊
  grade: 雜物
  base: 0
  perish: null
  stat: 七頁｜字是你爹的｜最後兩頁燒焦了
  text: 幾頁從帳冊上整齊裁下來的紙。字是你爹的字，墨色有深有淺，像是好幾天裡斷斷續續寫的。
  hidden:
    - {label: 你讀過了, need: {flag: got_pages}, text: 「壬午年三月十七：錢兄薦寒鐵三百斤，價廉，無印。周執事言可入帳。霜華說，這批鐵不能收。」「三月十八：收了。霜華一夜沒睡。」「三月十九：霜華說，要是出事，帶衡兒去找她師姐。」後面兩頁燒焦了，只剩一個「典」字。}


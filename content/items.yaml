# 物品：性能欄（stat）＋ 敘述欄（text）＋ 隱藏句（hidden）
# cat: herb 靈草 / incense 香 / talisman 符 / beast 妖獸材料 / ore 礦材 / pill 丹藥 / spirit 靈物 / weapon 兵器 / story 雜物 / tool 器物
dry_mint_leaf:
  name: 乾薄荷葉
  cat: herb
  unit: 公克
  priceQty: 200
  priceUnit: 200公克
  grade: 普通香草
  base: 0
  perish: null
  stat: 依完整葉／碎葉分批｜普通香草用途｜未定售價
  text: 乾葉聞得到薄荷味，完整葉和碎葉分開裝。所翻看的地方是乾的，沒有黏在一起或發霉。老葛說是自家種的，搬來搬去才弄碎。
  sell: []
# base: 一單位的基準市價（下品靈石）；perish: 靈性天數（null = 不壞）
# sell: 誰會收（huichun 回春堂 / tie 鐵師傅 / walk 上門散客）

chiyan:
  name: 赤炎草
  cat: herb
  unit: 株
  grade: 一階靈草
  base: 12
  perish: 30
  stat: 年份 10～80 年｜離土後靈性 30 日｜火屬丹藥主材
  text: 長在有地火的石縫裡，根鬚扎進燙石，葉背有細如髮的金線。年份每長十年，金線多一道。傳聞數金線定價，於是有人學會了畫。
  hidden:
    - {label: 築基可見, need: {realm: 10}, text: 地火旺的時候，赤炎草會提早成熟。這種草的金線看起來完整，藥力卻只有六成。}
  sell: [huichun, walk]

dingshen:
  name: 定神香
  cat: incense
  unit: 束
  grade: 一階雜貨
  base: 25
  perish: null
  stat: 一束十支｜不壞｜打坐時點燃，修為轉換加四成
  text: 點一支香，可以幫助這段打坐時間穩住心神。聚落裡的散修打坐時都會用，平常供貨穩定，大家也習慣它的價錢。若哪天定神香漲了，不是香少了，是很多人睡不著。
  sell: [huichun, walk]

bishui:
  name: 避水符
  cat: talisman
  unit: 張
  grade: 一階符籙
  base: 8
  perish: null
  stat: 存放不當會受潮｜渡水、探秘境必備
  text: 黃紙上的符用硃砂畫成，中間沒有斷筆。受潮的避水符，硃砂邊緣會暈開一圈極淡的紅。所有製符師都知道這件事，所以他們賣符時從不讓你對著光看。
  sell: [walk]

langya:
  name: 鐵背狼牙
  cat: beast
  unit: 枚
  grade: 一階妖獸材料
  base: 6
  perish: null
  stat: 不壞｜煉器、入藥兩用
  text: 牙根若帶血絲，取下時狼還沒死透。獵戶說活取的牙更利，丹師說活取的牙帶著怨，入藥發苦。兩種人都在買，所以獵戶從不先殺狼。
  sell: [tie, huichun, walk]

hantie:
  name: 寒鐵
  cat: ore
  unit: 斤
  grade: 一階礦材
  base: 9
  perish: null
  stat: 不壞｜煉器主材
  text: 北邊礦區出的原礦，顏色偏灰藍。礦區供貨和配額由資源組織管，流通的貨要有來源印記與帳目，派出所處理贓物或違規案件。
  sell: [tie, walk]

liaoshang:
  name: 療傷丹
  cat: pill
  unit: 枚
  grade: 一階丹藥
  base: 18
  perish: null
  stat: 止血、接續筋傷｜內傷可壓住三天
  text: 散修離開聚落前總會買兩枚，買了往往捨不得吃。於是療傷丹最常出現的地方，是死人的身上。
  sell: [huichun, walk]

yangqi:
  name: 養氣丹
  cat: pill
  unit: 枚
  grade: 一階丹藥
  base: 22
  perish: null
  stat: 打坐時服用，修為加十八｜連日服用，藥力減半
  text: 幫助身體適應修煉時運行的氣。藥行說打坐時一晚吃一枚就夠了，散修總想再吃一枚。第二枚的藥力，大多成了累積在身體裡的丹毒。
  sell: [huichun, walk]

xuechan:
  name: 雪蟾酥
  cat: spirit
  unit: 匣
  grade: 二階靈物
  base: 70
  perish: 7
  stat: 凝成後七天會化成清水，玉盒只能延緩｜療傷聖藥
  text: 寒潭雪蟾耳後凝結出的酥，每隻雪蟾取得的量很少，凝成那天就是牠的死期。凝成後七天就會化成清水，寒潭宗以玉盒封存，也只能多留它幾天。資源組織的帳上記得清楚：每盒都有去處。
  hidden:
    - {label: 築基可見, need: {realm: 10}, text: 表面如果有冰裂一樣的細紋，凝成還不到十天。}
  sell: []

lingsui:
  name: 地火靈髓
  cat: spirit
  unit: 塊
  grade: 二階靈物
  base: 60
  perish: null
  stat: 器修淬刃、丹師溫爐
  text: 地火的精氣凝結在石頭裡，外面灰暗，中心有一道暗紅色的線。離開地脈後，白天沒有反應，晚上才慢慢回溫。
  sell: [huichun, tie]

duanshui:
  name: 斷水刀（殘）
  cat: weapon
  unit: 把
  grade: 一階法器
  base: 10
  perish: null
  stat: 有修補痕
  text: 刀身有一道舊裂，被人用銅汁仔細補過，補痕打磨得幾乎看不見。補刀的人手藝很好，好到願意替一把只值十塊靈石的刀花三天時間。除非那道裂痕本身，就是要藏起來的東西。
  hidden:
    - {label: 築基可見, need: {realm: 10}, text: 裂痕的走向，與一門叫「碎星指」的指法留下的勁力相符。}
  sell: [tie, walk]

duandao:
  name: 寒鐵短刀
  cat: weapon
  unit: 把
  grade: 一階法器
  base: 40
  perish: null
  stat: 鐵師傅打造｜不壞
  text: 鐵師傅打的刀，不好看。刀背厚，刀刃薄，握柄纏得很緊。他說好看的刀是給人看的，他的刀是給人用的。
  sell: [tie, walk]

yujian:
  name: 無字玉簡
  cat: tool
  unit: 枚
  grade: 品階不明
  base: 40
  perish: null
  stat: 據說要用靈識試滿三天才會顯示
  text: 玉簡裡沒有字。賣家說這是某個人過世前留下的東西，要用靈識試滿三天才會顯示。坊市裡這樣的玉簡很多，願意試滿三天的人很少，所以騙子們從不缺生意。偶爾，也真有一枚會說話。
  sell: [walk]

zhuji:
  name: 築基丹
  cat: pill
  unit: 枚
  grade: 二階丹藥
  base: 600
  perish: null
  stat: 突破築基的關鍵物｜本季已配完
  text: 一枚築基丹，是一個散修半生的積蓄，或是一個宗門弟子一年的月例。回春藥行每季只出九枚，從不多一枚。據說是丹方所限。據說。
  hidden:
    - {label: 待核對的舊批次記錄, need: {flag: old_batch_record_seen}, text: 第三季那一爐，出了十一枚。}
  sell: []

hudeng:
  name: 狐尾燈
  cat: tool
  unit: 盞
  grade: 手作
  base: 30
  perish: null
  stat: 盲婆婆製｜擺在店裡，上門客的小動作更容易看見
  text: 燈罩用的是狐尾內側的軟毛，點起來燈影會輕輕擺動，像有什麼東西在燈後面呼吸。盲婆婆攤前賣的是普通燈，這盞另留著。光照在客人手上，細小的動作比較容易看見；看見了，仍要自己判斷對方在做什麼。
  sell: []

zhangce:
  name: 缺頁帳冊
  cat: story
  unit: 本
  grade: 雜物
  base: 0
  perish: null
  stat: 不可修煉｜市價幾乎為零
  text: 一本店裡的流水帳，字跡工整，最後七頁被整齊裁去。剩下的帳目每一筆都對得上，有一筆寫著：「壬午年三月，收寒鐵三百斤，付靈石四十。」照那年的行情，四十塊靈石只買得到十八公斤鐵礦石。
  hidden:
    - {label: 你讀時可見, need: {flag: got_box}, text: 你認得這筆跡。是你爹的。}
  sell: []

zhangye:
  name: 一頁帳紙（抄本）
  cat: story
  unit: 頁
  grade: 雜物
  base: 0
  perish: null
  stat: 你自己抄的
  text: 老錢的包裹裡，包寒鐵的襯紙是從一本舊帳冊上撕下來的。你抄了一份。上面寫著：「壬午年三月，出寒鐵三百斤予許記，收四十。另，周，二十。」字跡圓潤，不是你爹的。
  sell: []

jiansui:
  name: 半截劍穗
  cat: story
  unit: 條
  grade: 雜物
  base: 0
  perish: null
  stat: 不可修煉
  text: 青色的線編成，末端燒焦。穗結是玄霜門的「三回結」，那個門派已經三十年沒人打這種結了。舊貨堆從不說它從哪裡來。
  hidden:
    - {label: 盲婆婆摸過後可見, need: {flag: mang_saw_jiansui}, text: 她說，打這種結的人，最後一個是她師妹。}
  sell: []

yupai:
  name: 霜紋玉牌
  cat: story
  unit: 塊
  grade: 雜物
  base: 0
  perish: null
  stat: 不可修煉
  text: 玉牌一面刻霜紋，一面刻名字。名字被人用指甲一點一點刮掉了。刮的人很有耐心，或者很恨。
  hidden:
    - {label: 盲婆婆摸過後可見, need: {flag: mang_saw_yupai}, text: 她摸了很久，說了一個名字，然後問你：「長生典那個人，今年還會來看燈嗎？」}
  sell: []

dangpiao:
  name: 長生典當票
  cat: story
  unit: 張
  grade: 不可交易
  base: 0
  perish: null
  stat: 不可交易
  text: 紙色暗黃。上頭寫著：「今典壽元四十年，到期不贖，人死當絕。」落款是你的名字。字是你寫的，手抖得很厲害。
  sell: []

# —— 第二個月 ——
luopan:
  name: 尋脈羅盤
  cat: tool
  unit: 個
  grade: 一階法器
  base: 60
  perish: null
  stat: 天池水銀不散｜指針尋地脈
  text: 看地脈的人用的羅盤。天池裡那滴水銀聚而不散，指針自己會轉，轉到礦脈的方向就停。礦上的人說，好羅盤會記得主人最後一次指的方向。
  hidden:
    - {label: 築基可見, need: {realm: 10}, text: 指針停的地方不是礦脈，是北面礦上一條封了十二年的舊坑道。}
  sell: [walk]

yaopai:
  name: 寒潭宗外門腰牌
  cat: story
  unit: 塊
  grade: 宗門信物
  base: 0
  perish: null

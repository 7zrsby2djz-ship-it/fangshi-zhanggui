# 卡片版：讓選擇會死。
# deals：交易 id → 選項 → 加上的死法（death 會併進那個選項的 fx）。
#   chance：幾成會死；saved：逃過時多出來的一句；if：條件成立才有這個危險（例如 doneAs: {d04: deal} 表示 d04 選了「買下」）。
# 每一種死法的原因，都要在那張卡（或之前的卡）裡找得到線索。

deals:
  d08:      # 疤臉的斷水刀：他的手按上了刀柄
    expose: {death: {id: scar_knife, chance: 0.6, saved: 他的手在刀柄上停了很久，最後鬆開了。你知道，這件事還沒有完。}}
  m212:     # 疤臉的收納袋：當眾說破，他的手又按上了刀柄
    expose: {death: {id: scar_knife, chance: 0.75, saved: 那天晚上，你把鐵捲門拉到底，又多上了一道鎖。半夜，門外有人站了很久，然後走了。}}
  d04:      # 阿蘅的雪蟾酥：燒熱水的工友拿不到的東西，有人在找
    deal: {death: {id: cold_box, chance: 0.45, saved: 那幾天晚上，你總覺得後門外有人站過。保冷盒裡的冰，化得特別快。}}
  m216:     # 張主任的封口錢：「許老闆保重。」
    decline: {death: {id: zhang_careful, chance: 0.5, saved: 那陣子你走路都挑大路，天黑前一定回店。有一次，一輛沒有人推的藥材車從坡上滑下來，停在你剛剛站過的地方。}}
  m201:     # 錢不語的無印寒鐵：去跟周警員告狀
    report: {death: {id: framed, chance: 0.55, saved: 周警員沒有來。可是那幾天，你倉庫的鎖上多了一道很新的刮痕。}}
  d12:      # 錢不語的包裹：去跟周警員告狀
    report: {death: {id: framed, chance: 0.35, saved: 周警員沒有來。可是那幾天，你倉庫門口的地上，有一雙不是你的鞋印。}}
  m301:     # 討水的老人
    decline: {death: {id: frost_door, chance: 0.6, saved: 那天晚上，霜從門縫爬進來，爬到櫃檯前停住，到天亮才慢慢退回去。你在被子裡抖了一整夜。}}
  m207:     # 陸調查員問雪蟾酥：你明明收過
    decline: {death: {id: lied_to_lu, chance: 0.8, if: {doneAs: {d04: deal}}, saved: 陸調查員走到門口，回頭看了你一眼，又看了一眼你的冷藏櫃。他沒有說話。}}

deaths:
  scar_knife:
    cat: 店裡
    title: 當面說破的人
    seal: 滅口
    text: 那天你收攤收得晚。鐵捲門拉到一半，一隻手從底下伸進來，扣住了門緣。疤臉彎著腰鑽進店裡，沒有出聲。他走到你面前，很近，近到你聞得到他身上的溪水味。「白天你看得很清楚，」他說，「那就再看清楚一點。」第二天早上，鐵捲門停在一半的地方，店裡很乾淨。管理處的登記簿上，許家店那一格寫著：店主外出，未歸。
    hint: 手按在刀柄上、身上帶著溪水味的人，不要當面說破他的來路。看出來了，換個時間，去跟管得動他的人說。
  cold_box:
    cat: 店裡
    title: 那個保冷盒
    seal: 追盒
    text: 你把保冷盒收進最裡面的櫃子。第三天半夜，後門的鎖被人用很安靜的方法打開了。來的人知道盒子放在哪裡，也知道它原本是誰的——北林溪邊，有一個人就是因為不肯交出這個盒子，被推進了溪裡。你醒過來的時候，只來得及看見一張臉上的疤。盒子被拿走了。你被留在後院，沒有再起來。
    hint: 一個燒熱水的工友拿不到的東西、賣的人又急著脫手，背後通常有人在找它。收下，就是把那個人引到你家。勸她自己交出去，或去報案。
  zhang_careful:
    cat: 店裡
    title: 「許老闆保重。」
    seal: 意外
    text: 張主任走後第五天，你去回春藥行送貨，回程抄藥田邊那條近路。一輛裝滿藥材的推車從坡上滑下來，沒有人推，剎車是鬆的。管理處的報告寫得很清楚：意外，推車老舊，坡太陡。報告最後一頁，蓋的是回春藥行的章。
    hint: 把封口錢退回去，等於告訴對方你不會閉嘴。退回去之後就不能一個人等——把話交給管得動他的人，例如寒潭會的調查員。
  framed:
    cat: 店裡
    title: 告錯了人
    seal: 栽贓
    text: 你去派出所告錢家店之後的第三天清晨，有人敲你的鐵捲門。周警員帶著兩個人進了你的倉庫，從最裡面搬出一批沒有印記的寒鐵——你從來沒有收過。「許老闆，」周警員說，「告別人藏私貨，自己倉庫裡倒是不少。」對街，錢不語站在自己店門口，一直站到天亮。十二年前也有一個早上，他是這樣站著的。鐵捲門貼上封條的那天晚上，街尾的黑門自己開了。
    hint: 告狀之前，先想清楚聽你告狀的人，跟被你告的人是什麼關係。周警員替錢家店說話，不只一次了。
  frost_door:
    cat: 店裡
    title: 不賣熱水的店
    seal: 結霜
    text: 老人站過的地方，那層霜到晚上都沒化。半夜你被冷醒，霜已經從門縫爬了進來，沿著地板一路爬到櫃檯前，停在你白天說「不賣」的那個位置——然後往上爬。早上鄰居來敲門，許家店裡裡外外結了一層白。櫃檯後面的人，跟櫃檯一樣冰。
    hint: 結霜那幾天，從北邊走來、只跟你要一杯熱水的人，給他熱水。
  lied_to_lu:
    cat: 店裡
    title: 「沒見過。」
    seal: 包庇
    text: 陸調查員在冊子上劃的那一筆，你以為寫的是「沒有」。兩個星期後他又來了，這次沒有坐下。阿蘅已經在派出所把話都說了：那盒雪蟾酥，是賣給許家店的。「北林死了一個人，」陸調查員說，「許老闆說，沒見過證物。」寒潭會的規矩很舊，也很簡單：藏起命案證物的人，跟動手的人同罪。他們帶你往北走。那條路，沒有回來的方向。
    hint: 寒潭會的人問你見過什麼，見過就說見過——尤其是你真的收過那樣東西。

kaozheng:
  canye:
    title: 缺的七頁
    need: {has: {canye: 1}}
    text: 「壬午年三月十七：錢兄薦寒鐵三百斤，價廉，無印。周執事言可入帳。霜華說，這批鐵不能收。」「三月十八：收了。霜華一夜沒睡。」「三月十九：霜華說，要是出事，帶衡兒去找她師姐。」那天，你爹把箱子和這幾頁交給了姚四。三月二十一，天沒亮，執事堂進了許記的倉庫。
  shuanghua:
    title: 霜華
    need: {flag: [mang_told_mother]}
    text: 你娘叫霜華，玄霜門最後一代弟子。三回結是她教你爹打的；她的師姐，在青石街擺了十二年燈攤，等一個姓許的孩子。盲婆婆說，你娘走的那年，不是你們說的那樣。
  twoledgers:
    title: 兩本帳
    need: {has: {zhangce: 1, zhangye: 1}}
    text: 你爹的帳上寫：「壬午年三月，收寒鐵三百斤，付靈石四十。」錢記的帳頁寫：「壬午年三月，出寒鐵三百斤予許記，收四十。另，周，二十。」同一筆生意，兩邊都記了。多出來的那一筆，只記在一邊。
  xuanshuang:
    title: 三回結
    need: {flag: [mang_saw_jiansui, mang_saw_yupai]}
    text: 一條燒焦的劍穗，一塊刮掉名字的玉牌，一盞照得見說謊的人的燈。盲婆婆說，打三回結的最後一個人，是她師妹。她問你，長生典那個人，今年還會不會來買燈。

endings:
  top: 這個月，你看穿的比被騙的多。長生典的字條準時塞進門縫：「許公子，尚餘一年又五個月。」你把字條摺好，壓在那本缺頁的帳冊底下。
  mid: 規費繳了，鋪子還開著。長生典的字條準時塞進門縫：「許公子，尚餘一年又五個月。」日子還長，也不長。
  low: 錢不語替你墊了規費。他走的時候，在門口多站了一會兒，看了看許記的招牌。長生典的字條準時塞進門縫：「許公子，尚餘一年又五個月。」
  lowFooled: 這個月，你被騙的次數比你看穿的多。庫房裡堆著賣不出去的東西，有的金線是畫的，有的一沾水就化。長生典的字條準時塞進門縫：「許公子，尚餘一年又五個月。」
  teasers:
    - {need: {flag: [gave_knife]}, text: 余小七抱著刀走之前，回頭說了一句：「掌櫃的，刀柄的繩尾，是被割斷的。我哥說過，割繩，就是還活著。」}
    - {need: {flag: [zhou_warned]}, text: 周執事燒掉的那頁紙，你還記得上面每一個字。他說，你爹當年，帳翻得太勤。}
    - {need: {flag: [yao_closed]}, text: 姚四沒有再來過許記。你爹的事，他知道的，比他說過的多。}
    - {need: {flag: [ahe_taken], not: [aheng_taken]}, text: 阿蘅的屋子空了。洞府區的人說，她去鬼市找過人，一個人去的。}
    - {need: {flag: [sold_info_pkg]}, text: 白七娘說替你壓著的那則消息，還在她的算盤底下。她沒說要壓多久。}
    - {need: {flag: [xuechan_sold_qian]}, text: 錢不語被罰之後，逢人便說是有人害他。他沒說是誰，只是每天早上開門，第一眼看的是許記。}
    - {need: {flag: [scar_grudge]}, text: 門板上那道刀痕，你沒有刨掉。}
    - {need: {flag: [daoren_caught]}, text: 那個道士袖子裡的三枚玉簡，周執事說，是從同一個地方批來的。批貨的人，就在坊市裡。}
    - {need: {flag: [gave_tie_lingsui]}, text: 鐵老蔫的爐子，這幾天夜裡都沒熄。牆上那把二十年沒開刃的刀胚，不見了。}
    - {need: {flag: [lost_big_deal]}, text: 阿福說的那筆大生意，錢記接了。}
    - {need: {flag: [passed_test], not: [lost_big_deal]}, text: 阿福說，下個月執事堂有一筆大生意。周執事記得你退回去的那四十五塊。}
    - {need: {flag: [aheng_entrust], not: [betrayed_aheng, aheng_leak]}, text: 阿蘅說她信你一次。坊市裡，肯信人一次的人不多。}
  next: 下個月：寒潭宗開始追查失物，鬼市的門對你半開，錢不語的笑容沒有變。
  m2:
    top: 這個月，坊市裡的人開始知道，許記的掌櫃不好騙。長生典的字條準時塞進門縫：「許公子，尚餘{left}。」你把它跟那幾頁帳紙壓在一起。
    mid: 規費繳了，鋪子還開著。長生典的字條準時塞進門縫：「許公子，尚餘{left}。」十二年前的帳，還差幾筆。
    low: 錢不語又在門口站了一會兒，看著許記的招牌。長生典的字條準時塞進門縫：「許公子，尚餘{left}。」
    lowFooled: 這個月，你被騙的比看穿的多。長生典的字條準時塞進門縫：「許公子，尚餘{left}。」
    next: 第三個月，還在寫。
    teasers:
      - {need: {flag: [mang_told_mother]}, text: 盲婆婆說，你娘走的那年，不是你們說的那樣。她說下個月，要帶你去一個地方。}
      - {need: {flag: [got_pages], not: [mang_told_mother]}, text: 帳紙上寫著：「要是出事，帶衡兒去找她師姐。」你娘的師姐，在坊市裡等了你十二年——你還不知道是誰。}
      - {need: {flag: [scar_caught]}, text: 疤臉在執事堂只說了一句話：「玉匣不是我要的。是有人出錢，要那個弟子回不了宗門。」}
      - {need: {flag: [xiaoliu_truth], not: [scar_caught]}, text: 余小六還躲在南嶺。疤臉也還在找他。}
      - {need: {flag: [qian_confronted]}, text: 錢不語那天在門口說的話，你想了一整夜。他沒說自己是被冤枉的，他說的是「你爹要是有你一半小心」。}
      - {need: {flag: [zhang_exposed]}, text: 張掌事交代了丹坊帳外的兩枚築基丹。買丹的人是誰，他咬死不說。}
      - {need: {flag: [took_zhang_money]}, text: 你收了張掌事的四十塊。這個人情，他記著，你也記著。}
      - {need: {flag: [knows_raid], not: [qian_confronted]}, text: 白七娘說，那天清早，錢不語在對街站到天亮。他在等什麼？}
      - {need: {flag: [siti_caught]}, text: 有人說，十二年前，許記也是這樣被查的。一模一樣。}
      - {need: {flag: [did_big_deal]}, text: 阿福說，北面礦上的閘門修好了。周執事下個月還有生意，這回要的是別的東西。}

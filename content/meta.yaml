intro:
  lede: 大災變過後大約一百年。台灣的山整片往上抬，平地大多泡在水裡，人在中央山區的高地重新過日子。你叫許衡，三十一歲，在山上的聚落裡顧一間店，街坊叫你許半兩。十二年前，家裡一夜之間背上八千靈石的債；為了保住這間店，你去長生當鋪押了壽命。現在，只剩十八個月。
  ticket: 今押壽命四十年，到期不贖，人死當絕。
  stance: 招牌可以掛低調或張揚，在「店務」裡調。低調：規費照常。張揚：客人多一點，但太顯眼，管理處來收規費時會多收你一筆。
  goal: 店會自己做生意，你只管定方針、請夥計、修店面。有事的日子一天一天過，沒事的日子一跳就過去。北邊遲早會出事；走到最後，你會做一個決定。外面很危險——負擔超過上限，回程可能上不來；有些地方，看一眼就回不來了。死了可以回到當天或前一天早上。
  how: 每天早上看卡片、開門；店自己開著，晚上自動結帳，給你一張日報。白天分上午、下午、傍晚三個時段，你可以出門：舊國小、茶館、管理處、後山住宅區、長生當鋪，還有聚落外面那些大家不太去的地方——崩掉的舊公路、舊隧道、寒潭水庫、西邊的斷崖，聽說斷崖下面還有路，路的下面還有一條亮著燈的街。越往下越怪、越重，撿回來的東西越值錢。有人會找上門，不花時間，看完做一個決定就好。遊戲不會告訴你誰在說謊。


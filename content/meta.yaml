  goods: {genuine: 貨真價實, inferior: 以次充好, fake: 假貨, flawed: 暗傷, undervalued: 不識貨}
  origin: {clean: 來路乾淨, stolen: 贓物, contraband: 禁物, inheritance: 遺物, evidence: 證物}
  intent: {plain: 單純買賣, con: 騙局, dump: 拋貨局, squeeze: 壓價局, setup: 設局, sting: 釣魚, proxy: 借刀, test: 試探, innocent: 無心之過, bribe: 封口}

kaozheng:
  canye:
    title: 缺的七頁
    need: {has: {canye: 1}}
    text: 「災後89年3月17日：老錢介紹寒鐵礦石三百公斤，便宜，沒有登記印。周正說可以入帳。霜華說這批不能收。」「3/18：收了。霜華整晚沒睡。」「3/19：霜華說，要是出事，帶衡去找她以前隊上的人。」那天，你爸把箱子跟這幾頁交給姚四。3月21日天還沒亮，派出所就進了店裡的倉庫。
  shuanghua:
    title: 霜華
    need: {flag: [mang_told_mother]}
    text: 你媽媽叫霜華，是玄霜巡守隊最後一批隊員——那是一支以前專門看守北礦舊坑道的小隊，三十年前解散了。三回結是她教你爸打的。她以前的隊友，在舊公路市場擺了十二年燈攤，等一個姓許的孩子。盲婆婆說，你媽走的那年，不是你們家說的那樣。
  twoledgers:
    title: 兩本帳
    need: {has: {zhangce: 1, zhangye: 1}}
    text: 你爸的帳上寫：「災後89年3月，收寒鐵三百公斤，付靈石四十。」錢家店的帳頁寫：「災後89年3月，出寒鐵三百公斤給許家，收四十。另，周，二十。」同一筆生意，兩邊都記了。多出來的那一筆，只記在一邊。
  xuanshuang:
    title: 三回結
    need: {flag: [mang_saw_jiansui, mang_saw_yupai]}
    text: 一條燒焦的編繩，一塊刮掉名字的隊牌，一盞會讓人特別注意到別人小動作的燈。盲婆婆說，打三回結的最後一個人，是她隊上年紀最小的那個。她問你，長生當鋪那個人，今年還會不會來看燈。

endings:
  top: 這個月，你看穿的比被騙的多。長生當鋪的字條準時塞進門縫：「許先生，尚餘一年又五個月。」你把字條摺好，壓在那本缺頁的帳冊底下。
  mid: 規費繳了，店還開著。長生當鋪的字條準時塞進門縫：「許先生，尚餘一年又五個月。」日子還長，也不長。
  low: 錢不語替你墊了規費。他走的時候，在門口多站了一會兒，看了看許家店的招牌。長生當鋪的字條準時塞進門縫：「許先生，尚餘一年又五個月。」
  lowFooled: 這個月，你被騙的次數比你看穿的多。庫房裡堆著賣不出去的東西，有的金線是畫的，有的一沾水就化。長生當鋪的字條準時塞進門縫：「許先生，尚餘一年又五個月。」
  teasers:
    - {need: {flag: [gave_knife]}, text: 余小七抱著刀走之前，回頭說了一句：「老闆，刀柄的繩尾是被割斷的。我哥說過，割繩就是還活著。」}
    - {need: {flag: [zhou_warned]}, text: 周警員燒掉的那頁紙，你還記得上面每一個字。他說，你爸當年，帳翻得太勤。}
    - {need: {flag: [yao_closed]}, text: 姚四沒有再來過許家店。你爸的事，他知道的，比他說過的多。}
    - {need: {flag: [ahe_taken], not: [aheng_taken]}, text: 阿蘅的屋子空了。後山住宅區的人說，她去黑市找過人，一個人去的。}
    - {need: {flag: [sold_info_pkg]}, text: 白姐說替你壓著的那則消息，還在她的計算機底下。她沒說要壓多久。}
    - {need: {flag: [xuechan_sold_qian]}, text: 錢不語被罰之後，逢人便說是有人害他。他沒說是誰，只是每天早上開門，第一眼看的是許家店。}
    - {need: {flag: [scar_grudge]}, text: 門板上那道刀痕，你沒有刨掉。}
    - {need: {flag: [daoren_caught]}, text: 那個道士包包裡的三張記憶卡，周警員說，是從同一個地方批來的。批貨的人，就在聚落裡。}
    - {need: {flag: [gave_tie_lingsui]}, text: 鐵師傅的爐子，這幾天夜裡都沒熄。牆上那把二十年沒開刃的刀胚，不見了。}
    - {need: {flag: [lost_big_deal]}, text: 阿福說的那筆大生意，錢家店接了。}
    - {need: {flag: [passed_test], not: [lost_big_deal]}, text: 阿福說，下個月管理處有一筆大生意。周警員記得你退回去的那四十五塊。}
    - {need: {flag: [aheng_entrust], not: [betrayed_aheng, aheng_leak]}, text: 阿蘅說她信你一次。聚落裡，肯信人一次的人不多。}
  next: 寒潭會開始追查失物，黑市的門對你半開，錢不語的笑容沒有變。
  m2:
    top: 這個月，聚落裡的人開始知道，許家店的老闆不好騙。長生當鋪的字條準時塞進門縫：「許先生，尚餘{left}。」你把它跟那幾頁帳紙壓在一起。
    mid: 規費繳了，店還開著。長生當鋪的字條準時塞進門縫：「許先生，尚餘{left}。」十二年前的帳，還差幾筆。
    low: 錢不語又在門口站了一會兒，看著許家店的招牌。長生當鋪的字條準時塞進門縫：「許先生，尚餘{left}。」
    lowFooled: 這個月，你被騙的比看穿的多。長生當鋪的字條準時塞進門縫：「許先生，尚餘{left}。」
    next: 北邊的霜，已經在路上了。
    teasers:
      - {need: {flag: [mang_told_mother]}, text: 盲婆婆說，你媽走的那年，不是你們說的那樣。她說下個月，要帶你去一個地方。}
      - {need: {flag: [got_pages], not: [mang_told_mother]}, text: 帳紙上寫著：「要是出事，帶阿衡去找她老隊友。」你媽的老隊友，在聚落裡等了你十二年——你還不知道是誰。}
      - {need: {flag: [scar_caught]}, text: 疤臉在管理處只說了一句話：「保冷盒不是我要的。是有人出錢，要那個年輕人回不去寒潭會。」}
      - {need: {flag: [xiaoliu_truth], not: [scar_caught]}, text: 余小六還躲在南稜。疤臉也還在找他。}
      - {need: {flag: [qian_confronted]}, text: 錢不語那天在門口說的話，你想了一整夜。他沒說自己是被冤枉的，他說的是「你爸要是有你一半小心」。}
      - {need: {flag: [zhang_exposed]}, text: 張主任交代了藥行帳外的兩份築基藥。買藥的人是誰，他咬死不說。}
      - {need: {flag: [took_zhang_money]}, text: 你收了張主任的四十塊。這個人情，他記著，你也記著。}
      - {need: {flag: [knows_raid], not: [qian_confronted]}, text: 白姐說，那天清早，錢不語在對街站到天亮。他在等什麼？}
      - {need: {flag: [siti_caught]}, text: 有人說，十二年前，許家店也是這樣被查的。一模一樣。}
      - {need: {flag: [did_big_deal]}, text: 阿福說，北礦的閘門修好了。周警員下個月還有生意，這回要的是別的東西。}

  # ═════ 第三個月：結霜（終章） ═════
  # finale：依序取第一個條件成立的結局。visit：拜訪那一幕的補述（全部符合的都會出現）。
  m3:
    top: 從四月到結霜，你看穿的比被騙的多。
    mid: 四天過去了。聚落還在，許家店也還在。
    low: 錢不語的借據還壓在櫃上。他這幾天沒來討，誰都沒有心思討帳。
    lowFooled: 從四月到結霜，你被騙的比看穿的多。慌的時候，人最好騙。
    next: 坊市掌櫃・完。北邊的霜到底是什麼，一百年前那場災變到底是什麼，沒有人能拍胸脯說清楚。你可以從頭再開一次店，走另一條路、往另一個地方走深一點。
    finale:
      - id: lamp
        need: {flag: [finale_lamp]}
        title: 終局・守燈
        seal: 守燈
        visit:
          - {need: {flag: [qiyu_elder]}, text: 第一天那杯淡茶，雪衣老人記著。往北的路上，他一句一句告訴你，你媽小時候怕冷，每年冬天都偷偷在燈芯邊上烤手。}
          - {need: {flag: [mang_north]}, text: 盲婆婆走在你身邊，手搭在你的肩上。她看不見路，可她一步都沒有踩錯。}
          - {need: {flag: [tie_xuanshuang]}, text: 鐵師傅揹著那把刻著「玄霜」的刀，走在最後面。小石頭要跟，被他一句話趕了回去。}
          - {need: {flag: [heard_vent]}, text: 坑道裡的敲擊聲你聽過——在柵欄外那個通風口。走進來以後，它停了一下，像是知道有人來了，然後又開始敲，比較慢。}
          - {need: {flag: [saw_frost_source]}, text: 你認得那道地裂。上一次你只敢在柵欄外面掰一塊霜晶，這一次你提著燈，從它旁邊走了下去。}
          - {need: {anyFlag: [saw_below_lights, stair_b1]}, text: 雪衣老人問你有沒有去過西邊斷崖下面。你說去過。他點點頭：「那你知道，往下走的時候身體會變輕。這裡也一樣。不要被騙了，回來的時候要留力氣。」}
          - {need: {flag: [answered_fog]}, text: 坑道裡起了一點霧。霧裡有人叫了一聲「阿衡」。這一次，雪衣老人替你應了：「他在這裡。」霧就散了。}
        text: |
          北礦的舊坑道，十二年沒有人進去過。越往下走，耳朵越塞，鼻子裡有鐵味。牆上長滿了霜晶，一面一面，像鏡子。燈一照，每一面鏡子裡都有一個提燈的人，走路的速度跟你差一點點。
          坑道盡頭，什麼都沒有。沒有怪物，沒有裂開的天，也沒有帳冊。只有冷，一段鏽掉的軌道，和一個空著的燈座。燈座旁邊的水泥牆上，有人用油漆寫過字，大部分剝落了，只剩「2029」跟一個箭頭，箭頭朝下。
          你把燈放上去。燈芯亮了，是很淡的藍。霜，一寸一寸往後退。
          雪衣老人說，玄霜巡守隊守了幾十年，沒有一個人知道守的是什麼。有人說是一頭睡著的東西，燈一滅它就醒；有人說是災變那年留下來、還在運轉的什麼設備；也有人說什麼都沒有，燈只是讓人敢在這裡站著。他說他年輕的時候三種都信過。
          你在燈邊坐了一夜。天快亮的時候，你看見對面那面霜晶裡，有一個人朝你點了點頭。你分不清那是你媽，還是你自己的影子。
          回到聚落，門縫裡塞著長生當鋪的字條：「許先生，尚餘——」後面的字，被霜糊住了，怎麼也看不清。
      - id: ledger
        need: {flag: [finale_ledger]}
        title: 終局・清帳
        seal: 清帳
        visit:
          - {need: {flag: [qian_confronted]}, text: 錢不語在寒漪面前，把十二年前那三百公斤寒鐵的來路，一筆一筆說了。說完，他看著許家店的招牌：「你爸當年，要是有你一半小心就好了。」這一回，他沒有笑。}
          - {need: {flag: [zhang_exposed]}, text: 張主任的口供也在卷宗裡。藥行帳外的兩份築基藥，十二年來，有一半送進了管理處。}
          - {need: {anyFlag: [scar_caught, lu_knows_scar]}, text: 陸調查員把北林的案子並了進來。沈青的識別證放在寒漪面前，塑膠殼上還有一道刮痕。}
          - {need: {flag: [meng_fair]}, text: 孟太太也來了。她說她先生死在北礦那天，礦上點貨，少了三百公斤寒鐵。}
          - {need: {flag: [saw_miner_names]}, text: 你提起紀念碑上那個油漆寫的名字：孟家和。寒漪讓人把它抄進卷宗，說等北礦封好了，要請石匠補刻。}
          - {need: {flag: [played_tape]}, text: 你把那捲錄音帶的事告訴寒漪。她聽到那句「專家表示，目前還無法確定」，笑了一下，笑得很累：「一百年了，還是這句。」}
          - {need: {flag: [saw_lab]}, text: 你說了斷崖下面B2-17那間實驗室。葉理事沉默了很久，說寒潭會的檔案裡也有一模一樣的句子：「找不到證據，也找不到相反的證據。」他們抄了一百年。}
          - {need: {flag: [lin_theories]}, text: 林老師託你把她那面黑板抄下來交給寒漪。寒漪看完，在最下面加了一行：「以上皆非，或以上皆是。」}
        text: |
          寒漪在活動中心前面的空地上，把十二年前許家那件案子，從頭唸了一遍。周正被停職，錢家店的門貼了封條。許家店的招牌，有人重新上了漆。
          然後寒漪帶著寒潭會的三位金丹級的人，去了北礦。他們沒有讓任何人跟著。
          三天後，霜停在聚落入口那根舊電線桿前面，再也沒有往前一步。寒潭會貼了公告：北礦舊坑道坍塌，已經用水泥和鋼梁封住，聚落無虞。
          公告上沒有寫「封住」的是什麼。陸調查員私下跟你說，他們在坑道裡看到一排排生鏽的機櫃，有人說那就是災變的源頭；可葉理事說，機櫃全是空殼，真正冷的地方在更下面，下面沒有燈也沒有路。兩個人都沒說自己確定。
          夜裡關了店，你有時候會把耳朵貼在櫃上那塊寒鐵上。很遠很遠的地方，有東西在敲，一下，一下，很有耐心，像在對帳。
          長生當鋪的字條照常塞進門縫：「許先生，尚餘一年又三個月。」帳清了一半。另一半，還在北邊。
      - id: missed
        need: {flag: [missed_visit]}
        title: 終局・典當（空櫃）
        seal: 典當
        text: |
          第四天中午前，你不在店裡。回來的時候，櫃上擺著兩個喝空的茶杯，和一個紅色信封的拜訪信。杯底結著一圈薄冰。
          那天夜裡，長生當鋪的黑門開了一整夜。天亮的時候，霜退了，退得乾乾淨淨，像從來沒來過。長生當鋪的門，也不見了，那面牆上只有一片白。
          門縫裡的字條上，只有四個字：「尚餘：無期。」你不知道那是說你自由了，還是說你的帳，已經不歸你管了。
      - id: pawn
        need: {flag: [finale_pawn]}
        title: 終局・典當
        seal: 典當
        visit:
          - {need: {flag: [sold_lamp]}, text: 你的狐尾燈，掛在長生當鋪的當票庫裡。燈還亮著，只是照的人，換了。}
          - {need: {flag: [pawned_sign]}, text: 許家店的招牌，也在當票庫裡。門口上方那塊白，一直沒有補上。}
          - {need: {flag: [elder_turned_away]}, text: 雪衣老人走的時候，沒有再看你。你想起第一天那杯沒倒的熱水。}
          - {need: {flag: [finale_refused]}, text: 他們走後，你一個人把四個茶杯洗了。杯底的冰，到晚上才化。}
          - {need: {anyFlag: [saw_water_wall, saw_sea_fall]}, text: 當鋪老闆從你門口經過的時候，身上有海的味道。你想起隧道盡頭那面水牆，想起斷崖外那片一直往下流的海。}
          - {need: {flag: [donated]}, text: 林老師把你捐的那幾樣東西擺在舊物室最顯眼的一格，旁邊寫著：「它們還在等一個解釋。我們也是。」}
        text: |
          兩位客人走後，長生當鋪的老闆一個人往北去了。有人說，他帶著一整箱當票。有人說，箱子是空的。
          那一夜，北邊亮了一下，不是燈的顏色。第二天，霜退了，退得乾乾淨淨。礦上的人說，舊坑道塌了，塌得連入口都找不到。
          長生當鋪的黑門不見了，那面牆上只剩一片白。聚落裡押過壽命的人，都在那天早上收到一張字條，上面只有四個字：「尚餘：無期。」
          有人說，那是長生當鋪替所有人還了帳。有人說，霜就是利息，利息收完了，本金也收走了。有人說，北邊那台一百年沒停過的機器，終於停了。也有人說，什麼都沒有發生，只是天氣轉暖了。
          你把那張字條壓在帳冊底下。每天早上開門，你都會多等一會兒，看門縫裡還會不會有東西塞進來。
    teasers:
      - {need: {flag: [qiyu_elder]}, text: 第一天那杯熱茶，是你這輩子泡過最淡的一杯，也是最貴的一杯。}
      - {need: {flag: [stone_crystal_fair]}, text: 小石頭用你給的三十塊，給鐵師傅買了一袋好炭。爐子又燒了一整夜。}
      - {need: {flag: [bought_fake_pass]}, text: 你買的那塊避難名額木牌，後來拿去墊了桌腳。}
      - {need: {flag: [fake_pass_exposed]}, text: 那天被你拆穿的假會員，在聚落入口被三家買了牌子的人堵住了。}
      - {need: {flag: [humble_baitie]}, text: 葉理事後來跟人說，聚落裡有個才吐納幾層的店老闆，連元嬰級的人的拜訪信都敢推。他說的時候在笑。}
      - {need: {flag: [saw_from_below]}, text: 你知道從斷崖下面往上看，聚落像一個很小的星座。你店裡那一點燈，是其中一顆。有時候關店前，你會想：下面的人，現在是不是也在看。}
      - {need: {anyFlag: [saw_sea_fall, saw_hanging_ship]}, text: 你有時候會想起斷崖外的海。流了一百年，海面沒有低一公分。水去了哪裡，跟霜從哪裡來，也許是同一個問題，也許不是。}
      - {need: {flag: [answered_fog]}, text: 那天霧裡叫你的聲音，你後來再也沒聽過。少掉的那一點東西，你一直沒想起來是什麼。}
      - {need: {flag: [fog_bus_wait]}, text: 舊公路站牌下那張「末班車　已過」的紙，一直沒有人撕。}
      - {need: {flag: [saw_fog_lights]}, text: 寒潭的霧裡，今年又多了兩盞燈。釣魚的阿伯說，他數到第四十一盞了。}
      - {need: {}, text: 後來有人問你，北邊到底是什麼。你把封印、礦脈、舊時代的機器、當鋪的帳，這幾種說法都講了一遍，又說：「我只知道我那幾天看見的。」對方不太滿意。你也是。}

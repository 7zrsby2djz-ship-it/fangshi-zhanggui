intro:
  lede: 你叫許衡，三十一歲，煉氣四層，坊市裡的人叫你許半兩。十二年前，你爹的鋪子一夜之間背上八千靈石的債，你去長生典典了四十年壽元，保住了招牌。如今典期將至。
  ticket: 今典壽元四十年，到期不贖，人死當絕。
  stance: 右上角可以切換氣息。收斂：別人看不清你的修為，比較願意閒聊，也比較敢騙你。外放：別人規矩些，讓價也爽快，但樹大招風，月底執事堂會多收你一筆。
  goal: 這個月：月底要繳坊市規費八十。修為到煉氣五層，而且被騙、錯怪加起來不超過一次，就算上等。
  how: 每天三個時辰，每個時辰選一件事：顧店，等客人上門；或出門，去市集、丹坊、茶樓、執事堂、藥田、洞府區。客人說的話，有真有假。遊戲不會告訴你誰在說謊。


# W07：分段只記玩家實際讀到的生活話題；非共同歷史。
version: 1
s02:
  open: 老葛把空木箱放在門邊，兩手壓著翹起來的蓋子。「小許，你這裡有沒有空箱子？這個怎麼蓋都蓋不起來。」韓九在旁邊接住蓋子，讓他不用一直壓著。
  oreHeld: 許衡看向裝鐵礦石的箱子。「只有裝石料的那個，我還要用。你要裝什麼？」
  oreGone: 許衡指了指原來裝石料的箱子。「那個空了，可是還要留著進貨，今天不能給你。你要裝什麼？」
  life: 老葛說：「曬乾的藥材。現在全攤在吃飯桌上，小滿昨天端著碗，站在旁邊叫我先把桌子還她。」韓九把蓋子靠在腿邊：「這麼大箱，裝滿你搬得動？我是在想我自己。上次回來，連飯都懶得煮。下一趟想跑近一點，當天就回家。」老葛說：「我放家裡的，又不是要背上山。」
  drying: 許衡幫老葛扶著箱子，歪掉的邊緣還是對不上蓋子。「先不要硬壓。你那些都乾了嗎？」老葛鬆手：「還在晾。太早收起來會悶壞，到時候就不能賣了。可是晚上吃飯又要清桌子，我整天都在搬這些。」
  rainRead: 韓九指著櫃台上的報紙：「東邊那幾家更麻煩，聽說倉庫進水了。」許衡問：「你有去過？」韓九搖頭：「沒有，我也是看這張。」老葛說：「我也沒去。我的都放屋裡，只是沒地方擺，沒有淹到。」
  end: 許衡說：「我真的沒有合用的空箱子可以給你，這個蓋子先不要硬塞，弄裂就更難用了。」老葛抱起箱子：「好啦，我回去再喬一下位置。」韓九把蓋子還他，兩人換了一個拿法才走出去。老葛把箱子轉個方向，抱穩了再走。
  stop: 許衡說今天沒空多聊。韓九把蓋子還老葛，兩人帶著原來的箱子離開。許衡回去整理櫃台。
s05:
  open: 老葛這次提了一袋乾薄荷葉來。「三百公克，十塊。」他把袋子放上櫃台，還沒收錢。
  lifeKnown: 許衡問：「其他的呢？」老葛說：「搬開了。小滿說她拿著碗走來走去，不知道的還以為她在幫我趕鳥。這包賣掉，桌子總算能用了。」
  lifeUnknown: 老葛說：「這包賣掉，家裡的桌子總算能用了。」許衡把袋子扶穩。「我先看一下這袋。」
  inspect: 許衡把整袋都倒出來，完整的葉子攤一邊，碎的分開。所翻看的地方是乾的，聞得到薄荷味，沒看到黏在一起或發霉。扣掉盤重，一共三百公克；比較完整的兩百，碎的一百。老葛把空袋折好等著：「搬來搬去才弄碎的，沒有壞掉。」原袋仍是他的。
  haggle: 許衡把兩盤放在老葛拿得到的位置。「這邊七塊，碎的一塊，全部八塊。客人要整片的，我不能拿碎的當整片賣。」老葛捏著空袋：「拿去裝香包，又沒差。」許衡說：「那也要分開。不然碎的你留著，我只買這邊。」老葛想了一下：「好啦，八塊。袋子我拿回去。我是來賣東西，不是叫你幫忙，不用多給我。」
  all: 許衡數出八塊，老葛一塊一塊點過。完整的兩百公克和碎的一百公克分裝成兩袋，才收上貨架。老葛捲好自己的原袋帶走。
  whole: 許衡付七塊，只收比較完整的兩百公克。老葛把碎的一百公克裝回自己的袋子帶走。
  rejectUnopened: 許衡說今天先不收。老葛提起還沒打開的原袋，點點頭，離開店裡。
  reject: 許衡說今天先不收。兩盤葉子都倒回老葛的原袋，他把三百公克帶走。老葛點點頭，把原袋捲好，離開店裡。

    source: 陶師傅空出工作台，拿出一支四十公分長木夾和二百五十毫升廣口玻璃罐。罐外有木框，木塞蓋著。「一套二十，只有這套。」沒試過耐霧、氣密或壓力，也不保人身安全。
    service: 木夾和罐子，加上挑選、調固定繩，合用後收三十二。先試布角與空罐，不合就不買；只配普通取樣工具，不保進霧或人身安全。
    fit: 阿蘅夾自己的布角，捏太緊，布翻了一下。她馬上放鬆，重新夾住邊緣。許衡扶罐口，讓她輕輕放進去再拿出來，木框讓罐子不會滾，木塞蓋得回去。空罐放進袋子試，長夾換到旁邊免得碰臉，再調固定繩。這只試了眼前的布角和罐子。
    sold: 阿蘅數三十二給許衡，才把夾子和罐子拿回手上。「沒拿到也不往裡面找，明天早上來說。」她收好自己的布角、便當盒與乾糧，提袋試重量，把長夾換到外側。許衡扶開門邊的工具套，讓她出門。
    report: 阿蘅把玻璃罐放上櫃台，只鬆開木塞給許衡看。裡面是一片約兩公分的透明薄殼，淡藍邊緣有彎彎細紋。「從乾的那邊夾到的，沒有下去，就這一片。昨天回家還有力氣收好。」她說新片沒碎、上次一公分布角也留著，先不賣。兩片是不同物件，始終屬她。她解下長木夾的繩子，打開空便當盒放繩頭。蓋內幾排名字磨淡，有的剩一半，下面一行仍清楚：「2029/12/31」。她說長輩告訴她，以前工作那邊送別時，同事留字；誰送誰、為什麼送別，她沒問。這是長輩經阿蘅轉述，日期用途與原刻者仍未知。她把盒、木夾、罐與新舊片都收回去帶走，沒有賣、借或贈給許衡。
    id: O204
s07:
  open: 阿岳拿著一個鋼扣走進來，肩膀還留著背架的印子。許衡放下帳本：「要修，還是換新的？」他說四個都磨到了，架子沒壞，先拆最嚴重的這個。
  reputation: 「韓九說你會幫人想怎麼綁。這個幫我看一下。」
  public: 「我在礦區搬貨，布罩的繩子又斷在這裡。想找人幫我看四個扣子。」他指著毛邊。
  spec: 阿岳碰到翹起來的邊，立刻收手。「固定布罩，沒有拿來吊貨。罩子掀起來，石頭粉一直掉進領子。」許衡量舊扣：內寬三公分、厚三公釐，兩端固定孔的位置也記好。「架子沒帶，現在不能說裝得上。」
  address: 阿岳說問過鐵師傅。「市場入口旁邊那間，門上掛工具袋的，就是他平常工作的地方。不用等市集；有沒有現成的，要去問。」許衡記下位置。這只是入口，還沒看開門或現貨。
  accept: 許衡把尺寸貼到夾板：「明天先看現貨。照這張量好的尺寸買回來，再拿你的架子試。裝不上，就不賣給你。」阿岳說會先刷掉粉。許衡把毛邊轉開讓他拿另一邊，舊扣由阿岳帶回，其他三個先別丟。新扣還沒買，錢也還沒收。
  decline: 許衡把舊扣轉到沒有毛邊的方向，還給阿岳：「這次先不接，你問鐵師傅看看。」沒約帶架來，也沒扣款。
s09:
  open: 阿蘅放下兩小包乾糧和捲好的衣服。衣卷往邊緣滾，她先伸手按住。
  reputation: 「韓九那趟是你幫他包的？我也想問一下。」
  public: 「出門的東西可以幫我看看怎麼分嗎？」許衡先問要走哪裡、會不會過夜。
  constraints: 阿蘅說走熟的草坡，當天回可能採不到多少；往前經過山裡凹下去的地方就要住一晚。「上次回去，東西要晾，衣服也要洗。我坐著看那堆，連站起來收都懶。可是採回來又放著不弄，也沒用。」
  compare: 許衡在紙背面畫兩欄，當天回只放一包乾糧；過夜把衣卷和第二包放回去。「短的就真的回頭，沒採到也別加走。要過夜，保暖的不能省。」阿蘅拿起衣服又放下，還沒選。「我以為有配好的，買了就出發。」許衡說剛知道她怎麼走，不能先答應一定夠用。
  decline: 「今天我先不接這個。我可以幫你分東西，但不能先答應哪套一定夠用。」阿蘅收回兩包乾糧和衣卷，把比較紙摺好帶走。「哪裡價錢好，我就賣哪裡。」沒有採購、訂金、行程或回報承諾。
  stop: 許衡說今天先忙店裡，阿蘅收回原來的乾糧和衣物。沒聽完的安排沒有記進消息，也沒有扣款。
s11:
  open: 阿蘅從便當盒拿乾糧咬兩口，把盒蓋收在手邊，免得碎屑掉在攤開的布角上。
  scope: 布上約一公分的硬殼透明、邊緣淡藍，細線像葉脈。阿蘅說上次在草坡旁淺凹的霧邊，用棉布碰一下就結層硬殼，剪角帶回，路上碎一半。「站在乾的這邊伸手拿，不下去。拿不到就回，再往裡面走又跟上次一樣。」許衡彎下來看，沒有伸手去摳。
  accept: 許衡讓她收回布角：「陶師傅有修容器，去問夾子和罐子。我沒碰過那個霧。」阿蘅蓋好自己的便當盒。「看了不合就不要買。」店內這次占一格；去陶師傅那裡還要一格。
  decline: 許衡沒接配貨，阿蘅收好自己的布角、飯盒和乾糧，自行安排。沒有買器具、採樣或回報的共同承諾。
jug:
  need: 韓九蹲在修水壺攤前，兩個壺擠進袋子，提把卡住了。許衡叫他別硬壓。他說內膽剛換好，要送回貨主；以前這樣放，走起來一直撞，放箱子又太占地方。
  literal: 許衡為了看壺底多寬，把其中一個翻過來。底角固定的舊金屬片，淺刻「2029.12」，下面是「換內膽」，沒有幾號。韓九說送來就有、外殼是舊的，這次也換了內膽，請他別把那片弄掉。原刻者與是哪次維修，還不知道。
  address: 陶師傅指著市場入口另一邊：「我平常就在那裡修東西，門邊掛兩個空框。」這是本人說的入口，平日現貨還沒看。

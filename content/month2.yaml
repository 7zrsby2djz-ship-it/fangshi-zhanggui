    source: 陶師傅從桌子底下拿出兩個木片框，內墊乾布，再加隔片讓提把有空間。「兩個套子十八塊。讓它們不要撞在一起，不是掉下去也摔不壞。」
    service: 兩個護套加上照壺的尺寸配放、調整固定繩，合用後收二十八。先拿這兩個壺試，合用才買；只減少互撞，不保重摔。
    fit: 許衡避開壺底的舊片，調好內襯和隔片，把比較重的壺靠背架、提把朝外。韓九背起來左右轉兩次，再伸手摸袋子裡面，沒有聽到兩壺互撞。「這樣好，我就怕半路又要拆開。」
    sold: 韓九付二十八，又自己拉緊一次繩子。「月底最後一天早上，過來跟你說收到沒。」他提起袋子，扶著舊壺的提把，從攤位旁的窄縫走出去。許衡把擋路的空框拿開，讓他先把壺送回去。
    report: 韓九一早拿出綁壺袋的繩子。「送到了，兩個都拆開給人家看。提把沒鬆，外殼也沒撞壞。」許衡問走路會不會歪，他說途中有停下來把繩子再綁緊一次。「套子有用，壺還是會晃。我先去拿別的，這次沒有要再請你配。」繩子由韓九收回，壺據他說已交給貨主。這次沒有款或物要交給許衡，護套後來放哪裡也還沒問。
    id: O203
  O204:
    title: 阿蘅的木夾與罐子

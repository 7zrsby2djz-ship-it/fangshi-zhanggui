    source: 鐵師傅把四個U形鋼扣放到桌上。許衡逐個量內寬三公分、厚三公釐，照紙上的位置比固定孔，再拿棉繩貼著裡面來回拉，沒有勾到。「四個十六，都照這個尺寸做的。」
    service: 四個扣子只固定背架布罩。買回來仍要拿阿岳的空架試孔位，沒有主承重或用一整天的保證。
    fit: 阿岳把刷乾淨的空架撐好，四個舊扣放旁邊。許衡逐個對孔，用阿岳原本的固定零件裝上。最後一處還沒鎖到底，他先按住架子；阿岳鬆手轉緊，再拉開、收回布罩，沒有勾到。「用完再看這段繩子，現在看不出會不會磨。」
    sold: 阿岳先背起空架，拉了幾次布罩，往門口退兩步才點頭。四個扣子加上量尺寸、回店試裝，一共二十四，他當面付清。舊扣、原繩、固定零件和架子全由阿岳帶走。「明天早上經過，再跟你說。」
    report: 阿岳在開門前來了一趟，拉出背架上原本的繩子。「昨天搬完，這段沒有刮斷。布罩也沒一直掀起來。」許衡看了他指的地方，把這次的情況記在尺寸旁邊，註明是阿岳說的。阿岳收回繩子，背著架子走了，沒有留下東西，這次也不用付錢。
    id: O201

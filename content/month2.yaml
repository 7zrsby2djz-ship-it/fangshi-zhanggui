    source: 鐵師傅拿出新一批兩份普通塗蠟厚布，每份兩段棉繩，約一公尺見方、約三百公克。他逐張翻看、用少量水短試，提醒不供浸水或長時暴雨。一份六塊。這是新一批布繩。
    service: 阿蘅自己選行程。短程一份，成本六、合用售十；過夜兩份，成本十二、合用售十八。乾糧、衣物都是她自有的；包裹不能讓長路不累，也不能替她決定回頭。
    fit: 阿蘅把自己的乾糧放進布裡，許衡覆住折角、調袋口繩頭。短程只分一包；過夜把衣卷另外包好，沒有省掉保暖衣。她試著拿取，確認外層覆得住。
    sold: 阿蘅按自己選的行程付清，把布繩和自有衣糧帶走。她說月底最後一天早上再來交代，沒答應一定採到或把採來的東西賣給許衡。
    report: 阿蘅把包裹布收好，說這趟依自己選的安排回來，所看的乾糧沒有濕。這是她本人的使用說法，沒有採集收入或新貨給許衡，也沒有保證下一趟都一樣。
    id: O202

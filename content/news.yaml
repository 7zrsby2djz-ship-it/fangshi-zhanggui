# 晨報。effects：{item, from, to, mult}，自 from 日至 to 日（含）市價乘上 mult。
# cond：只有在旗標成立時才出現（例如玩家做過某事，消息才傳開）。
# goods：牽動的貨；ask：哪裡打聽得到。玩家看不到真假。

news:
  - id: n_missing
    day: 1
    source: 茶樓閒談
    text: 寒潭宗一名外門弟子送貨途中失蹤，已經三天了。宗門的人在北林一帶找了兩回。
    goods: [xuechan]
    ask: [聽雨樓, 派出所]

  - id: n_market1
    day: 1
    source: 坊市告示
    text: 初三市集日。外地的攤子進城，青石街的攤子比平常多一倍，只擺這一天。當天也可以自己擺攤。
    goods: []
    ask: [青石街市集]

  - id: n_vein
    day: 1
    source: 聽雨樓傳出
    text: 聽說北面寒鐵礦脈新開了一條支脈。真開了，寒鐵恐怕要大跌。
    goods: [hantie]
    ask: [聽雨樓, 鐵師傅]
    effects:
      - {item: hantie, from: 1, to: 5, mult: 0.8}

  - id: n_dihuo
    day: 2
    source: 藥農傳話
    text: 南嶺地火異動，山民說夜裡地面發燙，井水都是溫的。
    goods: [chiyan, lingsui]
    ask: [城外藥田, 回春堂]
    effects:
      - {item: chiyan, from: 4, to: 6, mult: 0.7}

  - id: n_zhuji
    day: 2
    source: 回春堂告示
    text: 本季築基丹九枚，已全數配出。下季請早。
    goods: [zhuji]
    ask: [回春堂]

  - id: n_bounty
    day: 3
    source: 派出所懸賞
    text: 尋寒潭宗失物「雪蟾酥」一匣，賞六十靈石。另尋散修余小六，十九歲，身形瘦小，佩刀一把，知其下落者賞二十。
    goods: [xuechan, duanshui]
    ask: [派出所]

  - id: n_xiang
    day: 3
    source: 市價
    text: 定神香一日漲了三成。回春堂說貨不缺，就是買的人突然多了。
    goods: [dingshen]
    ask: [回春堂, 聽雨樓]
    effects:
      - {item: dingshen, from: 3, to: 4, mult: 1.3}
      - {item: dingshen, from: 5, to: 6, mult: 1.6}

  - id: n_market2
    day: 2
    source: 坊市告示
    text: 明天市集日。外地攤子只擺一天，錯過了就要等下個月。
    goods: []
    ask: [青石街市集]

  - id: n_market3
    day: 3
    source: 坊市
    text: 今天市集日。天還沒亮，青石街上就擠滿了外地來的攤子。
    goods: []
    ask: [青石街市集]

  - id: n_rain
    day: 2
    source: 傳聞
    text: 東邊連下了三天雨，幾家店的倉庫進了水。
    goods: [bishui]
    ask: [市集]

  - id: g_yao
    day: 4
    source: 地方傳聞
    cond: exposed_yao
    text: 聽說許衡把姚四打了一頓。也有人說，是姚四把許衡打了。
    goods: []
    ask: []

  - id: g_tao
    day: 4
    source: 地方傳聞
    cond: tao_grateful
    text: 陶師傅逢人就說，許衡眼睛毒，救了他十張符的名聲。
    goods: []
    ask: []

  - id: g_report
    day: 4
    source: 地方傳聞
    cond: aheng_taken
    notCond: aheng_leak
    text: 散修們說，許衡會報案。採藥的阿蘅被派出所帶走了，到現在還沒放出來。
    goods: []
    ask: []

  - id: n_wolves
    day: 5
    source: 派出所告示
    text: 北邊鐵背狼群下山，傷了兩個藥農。即日起封北林，散修不得擅入。
    goods: [liaoshang, langya, duandao]
    ask: [派出所, 城外藥田]
    effects:
      - {item: liaoshang, from: 5, to: 6, mult: 1.4}
      - {item: duandao, from: 5, to: 6, mult: 1.3}
      - {item: langya, from: 6, to: 6, mult: 0.7}

  - id: n_qian_raid
    day: 5
    source: 傳聞
    cond: xuechan_to_qian
    text: 錢記昨天被派出所查了半日，說是收了寒潭宗的東西。今天錢記沒開門。
    goods: []
    ask: []

  - id: n_qian_fined
    day: 5
    source: 傳聞
    cond: xuechan_sold_qian
    text: 寒潭宗在城裡追回一匣失物，經手的錢記被罰了一大筆。老錢逢人便說，是有人害他。
    goods: []
    ask: []

  - id: n_vein_false
    day: 6
    source: 礦區公告
    text: 北面礦區沒有新開支脈，先前的傳聞不實。鐵礦石照原價收售。
    goods: [hantie]
    ask: [礦區供貨窗口]
    effects:
      - {item: hantie, from: 6, to: 6, mult: 1.05}

# ═════ 第二個月 ═════
  - {id: n2_lu, month: 2, day: 1, source: 地方傳聞, text: 寒潭組織派了一位調查人員下山，查上個月北林失物的案子。聽說人已經住進了派出所。, goods: [xuechan], ask: [派出所, 聽雨樓]}
  - {id: n2_market1, month: 2, day: 1, source: 坊市告示, text: 這個月第四天是市集日。外地的攤子來聚落，只擺這一天。, goods: [], ask: [青石街市集]}
  - id: n2_iron
    month: 2
    day: 2
    source: 礦區盤點公告
    text: 北面礦區點貨少了一百八十公斤鐵礦石，沒有印記。公告提醒店家不要收；收下可能被追查。
    goods: [hantie]
    ask: [礦區, 鐵師傅]
    effects:
      - {item: hantie, from: 2, to: 6, mult: 1.15}
  - {id: n2_shen, month: 2, day: 3, source: 派出所告示, text: 上個月在北林失蹤的外圍工作人員沈青，已在北林溪底尋獲。知情者，賞五十。, goods: [], ask: [派出所]}
  - {id: n2_dan, month: 2, day: 3, source: 回春藥行, text: 回春藥行說，下一季的築基丹要漲價。, goods: [zhuji], ask: [回春藥行]}
  - {id: n2_market3, month: 2, day: 3, source: 坊市告示, text: 明天市集日。, goods: [], ask: [青石街市集]}
  - id: n2_market4
    month: 2
    day: 4
    source: 坊市
    text: 今天市集日。北邊來了個香商，有人說他的定神香便宜得嚇人。
    goods: [dingshen]
    ask: [青石街市集, 回春藥行]
    effects:
      - {item: dingshen, from: 4, to: 6, mult: 0.92}
  - {id: n2_wolf, month: 2, day: 5, source: 派出所告示, text: 北林解封。藥田的路也通了。, goods: [], ask: [城外藥田]}
  - {id: g2_qian, month: 2, day: 3, source: 地方傳聞, cond: qian_confronted, text: 老錢這兩天沒怎麼笑。有人看見他一個人在派出所門口站了很久。, goods: [], ask: []}
  - {id: g2_siti, month: 2, day: 5, source: 地方傳聞, cond: siti_caught, text: 許衡的店被派出所查了，搬出來一堆無印寒鐵。有人說，十二年前也是這樣。, goods: [], ask: []}
  - {id: g2_scar, month: 2, day: 6, source: 地方傳聞, cond: scar_caught, text: 派出所在南嶺抓了一個臉上有疤的刀客。北林的案子，有了消息。, goods: [], ask: []}
  - {id: g2_zhang, month: 2, day: 6, source: 地方傳聞, cond: zhang_exposed, text: 回春藥行今天沒開門。聽說張老闆被請去了派出所，到現在還沒出來。, goods: [], ask: []}

# 聽雨樓的消息單：花靈石買一則傳言。真假不標示。
teahouse:
  - {day: 1, price: 6, text: 老錢的店這兩天在收寒鐵，收得很急。, true: true}
  - {day: 1, price: 4, text: 有人看見一個採藥的採集者，從北林出來時抱著一個包袱。, true: true}
  - {day: 2, price: 5, text: 姚四這陣子在聚落裡到處賣赤炎草，賣得很急。, true: true}
  - {day: 2, price: 6, text: 回春藥行的張老闆想調回資源組織，最近格外小心。, true: true}
  - {day: 3, price: 6, text: 外地來的那個疤臉，是寒潭組織派來找人的。, true: false}
  - {day: 3, price: 8, text: 北林的獵戶說，狼這陣子叫得特別凶，往年冬天才這樣。, true: true}
  - {day: 4, price: 5, text: 那個流動賣藥的柳先生，上個月在王記賣過一回好丹藥。第二天王記就被查了。, true: true}
  - {day: 4, price: 7, text: 老錢後天要離開聚落收貨。, true: false}
  - {day: 5, price: 6, text: 回春藥行要漲療傷丹的價。, true: true}
  - {day: 5, price: 8, text: 鬼市有人在收寒潭組織的東西，價錢給得很高。, true: true}
  - {day: 6, price: 6, text: 礦區今天要貼公告，跟鐵礦石供貨有關。, true: true}
  - {month: 2, day: 1, price: 6, text: 老錢的店這個月要出一批寒鐵，價錢低得不像話。, true: true}
  - {month: 2, day: 1, price: 5, text: 下山的那位陸調查員，在上級組織裡說得上話，誰的面子都不給。, true: true}
  - {month: 2, day: 2, price: 6, text: 北林溪邊有人看見一個瘦小子，右手纏著布。, true: true}
  - {month: 2, day: 2, price: 7, text: 疤臉已經離開聚落了，往北走的。, true: false}
  - {month: 2, day: 3, price: 6, text: 孟三娘那個羅盤，懂行的人說值五六十。, true: true}
  - {month: 2, day: 4, price: 5, text: 北地來的那個香商，上個月在別的坊市也擺過攤，擺了一天就走。, true: true}
  - {month: 2, day: 4, price: 8, text: 有人在坊市裡打聽一個右手受傷的瘦小子，出手很大方。, true: true}
  - {month: 2, day: 5, price: 7, text: 鬼市這個月出了一枚築基丹。, true: true}
  - {month: 2, day: 5, price: 6, text: 回春藥行這一季的帳，陸執法已經看過了。, true: false}
  - {month: 2, day: 6, price: 6, text: 老錢最近常去派出所喝茶。, true: true}

# 偷聽：坐在聽雨樓，聽到的片段。每天一句。
overhear:
  - {day: 1, text: 「……一百八十公斤，派出所的帳上只寫三十……周那邊打點過了……」}
  - {day: 2, text: 「……那孩子不是失蹤。北林那條溪，我親眼看見……噓。」}
  - {day: 3, text: 「……鐵師傅那個刀胚，二十年了，還沒開刃……」}
  - {day: 4, text: 「……許衡那家店，櫃下放了東西沒有？……再等兩天。」}
  - {day: 5, text: 「……藥行那兩枚，這季還是老規矩？……鬼市見。」}
  - {day: 6, text: 「……長生典的人，這個月又去了許衡的店。那小子還剩多久？」}
  - {month: 2, day: 1, text: 「……許衡的店那小子上個月沒上鉤。這個月，換個餌……」}
  - {month: 2, day: 2, text: 「……那瘦小子要是落到疤臉手上，北林的事就沒人說得清了……」}
  - {month: 2, day: 3, text: 「……陸調查員的冊子上，第七家是許衡的店……」}
  - {month: 2, day: 4, text: 「……霜華的孩子？那瞎眼婆子在街上等了十二年……」}
  - {month: 2, day: 5, text: 「……藥行這季的兩枚，有一枚還沒出手……」}
  - {month: 2, day: 6, text: 「……長生典那位，這個月又去買燈了。」}

# 上門散客會順口說的閒話（收斂時比較願意說）
gossip:
  1: [北林那邊這幾天不太平，資源組織的人進進出出。, 長生典的門今天開了，一個月就開這一天。, 回春藥行的藥櫃又添了新貨，貴得很。]
  2: [南嶺的井水都溫了，我舅舅說是地火。, 回春藥行的築基丹又沒了，九枚，跟往年一樣。, 有個道士在聚落裡賣什麼傳承玉簡，說要試三天。]
  3: [今天市集日，東邊盲婆婆的普通燈，賣得比往常快。, 定神香漲了，我昨晚也沒睡好。, 東邊那場雨，好幾家的倉庫都淹了。]
  4: [派出所貼了懸賞，找一個叫余小六的。, 有個郎中在聚落裡賣便宜的療傷丹，便宜得嚇人。, 最近找包貨材料的人比較多，市場那邊可以問問。]
  5: [狼下山了，傷了兩個人，其中一個是城外種藥的。, 療傷丹今天又漲了。, 老錢這兩天臉色不好。]
  6: [礦區說新開支脈的消息是謠言。早說嘛。, 月底了，管理單位又要收規費。, 鐵師傅說他想煉一把好刀，就缺一塊會發燙的料。]

gossip2:
  1: [聽說寒潭組織內門來人了，派出所這兩天天天點燈到半夜。, 老錢的店這個月要出一批便宜的寒鐵，有人等著搶。, 北林那邊的狼走了，可宗門的人還在溪邊轉。]
  2: [礦區貼了盤點公告，提醒店家別收那批沒印記的寒鐵，收下可能被追查。, 有人在北林溪邊撿到一隻草鞋，很小。, 孟三娘那個羅盤，老錢的店只肯出五塊。]
  3: [沈青？就是上個月沒回宗門的那個外圍工作人員。, 北林溪底撈上來一個人，說是寒潭組織的。, 明天市集日，聽說北邊有香商要來。]
  4: [北地香商的香便宜得嚇人，我買了兩束。, 今天市集上，外地人比本地人還多。, 盲婆婆今天的燈一盞都沒賣，坐在那兒發呆。]
  5: [北林解封了，藥田的路也通了。, 鬼市有人在賣築基丹，你信不信？, 回春藥行的張老闆這兩天臉色不太好。]
  6: [月底了，管理單位又要收規費。, 老錢這兩天常往派出所跑。, 長生典的人又去盲婆婆那兒買燈了。]

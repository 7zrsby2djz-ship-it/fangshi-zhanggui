# level：吐納 1–9；築基初期 10、中期 11、後期 12
# traits 1–3（低、中、高），遊戲中永不顯示
# call：依境界差稱呼你（up = 你高他三層以上；eq = 相當；down = 你低他三層以上）
# refuse：境界差太大時，被殺價的回應；cold：茶涼透時的話
# home：後山住宅區住處（解鎖後可拜訪）

qian:
  name: 錢不語
  role: 錢家店老闆
  level: 8
  traits: {greed: 3, nerve: 2, pride: 1, trust: 1, patience: 3, backing: 2}
  call: {up: 許老闆, eq: 許老弟, down: 許老弟}
  surface: 對門錢家店的老闆，逢人便笑，跟誰都稱兄道弟。
  refuse: 許老弟，這個價，是看在你爸的面子上。
  cold: 許老弟，給個痛快話。
  circle: 街上做生意的
  look: {head: square, hair: hat, beard: goatee, mole: true, base: smile}

yao:
  name: 姚四
  role: 草藥販子
  level: 7
  traits: {greed: 2, nerve: 1, pride: 1, trust: 1, patience: 3, backing: 1}
  call: {up: 許老闆, eq: 小許, down: 小許}
  surface: 賣草藥的老人，很愛講古，四十年前聚落發生什麼他都知道。
  refuse: 小許，我跟你講，四十年前這個價錢連一根鬚都買不到。
  cold: 行了行了，要不要？
  circle: 街坊
  home:
    text: 姚四住在後山住宅區最舊的一排鐵皮屋。門沒鎖。桌上一小碟金粉，一支很細的毛筆，筆尖還是濕的。牆角堆著幾株赤炎草，葉背的金線，有的三道，有的五道。
    line: 「小許？你怎麼找到這裡的。坐，坐。」他把那碟金粉往桌下推了推。
  look: {head: thin, hair: topknot, beard: goatee, age: old, base: smile}

bai:
  name: 白姐
  role: 聽雨茶館老闆
  level: 9
  conceal: true
  traits: {greed: 2, nerve: 3, pride: 1, trust: 1, patience: 3, backing: 3}

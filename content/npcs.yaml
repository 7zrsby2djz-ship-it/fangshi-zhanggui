  look: {head: square, hair: scarf, beard: stubble, age: old, base: neutral}

zhou:
  name: 周正
  role: 派出所的秩序人員
  level: 11
  traits: {greed: 3, nerve: 3, pride: 3, trust: 1, patience: 2, backing: 3}

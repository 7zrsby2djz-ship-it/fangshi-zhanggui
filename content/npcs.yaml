  surface: 市場東邊做普通燈的盲婆婆；那盞特殊狐尾燈另留著。
  refuse: 我的燈，不講價。
  cold: 去吧。
  circle: 散修
  look: {head: round, hair: bun, blind: true, age: old, base: neutral}

stone:

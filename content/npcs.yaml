  surface: 笑臉迎人，記得每個客人愛喝什麼茶，也記得每個客人上次說了什麼。
  refuse: 消息的價錢，從來不二價。
  cold: 許老闆，茶涼了。
  circle: 街上做生意的
  look: {head: round, hair: bun, blush: true, base: smile}

aheng:
  name: 阿蘅
  role: 採集的人
  level: 5
  traits: {greed: 1, nerve: 2, pride: 2, trust: 2, patience: 1, backing: 1}
  call: {up: 老闆, eq: 老闆, down: 老闆}
  surface: 話少，穿得樸素，指甲縫裡總有草汁的顏色。會自己算路線、算當天能不能來回。
  refuse: 就這個價。
  cold: 要就要，不要我走。
  circle: 街坊
  home:
    text: 阿蘅住在後山住宅區邊上一間租來的鐵皮屋。門口兩雙鞋，一雙是她的，一雙是男人的，鞋底的泥是黑的。聚落裡只有一條巷子是這種黑泥，就是夜裡才開的那條。
    line: 她開門看見你，愣了一下，回頭把裡面的門帶上：「老闆有事？」
  look: {head: thin, hair: scarf, base: cold}

tie:
  name: 鐵師傅
  role: 市場修理攤的師傅
  level: 6
  traits: {greed: 1, nerve: 2, pride: 3, trust: 3, patience: 1, backing: 1}
  call: {up: 老闆, eq: 小子, down: 小子}
  surface: 話很少，修東西的手藝整條街最好，做出來的東西不好看。會先問尺寸跟用途。
  refuse: 不賣。
  cold: 嗯。
  circle: 街坊
  home:
    text: 鐵師傅的房子後面是個小鍛爐，爐火沒熄。牆上掛著一把沒開刃的刀胚，刀胚上刻著兩個字，被煙燻得看不清。角落裡有一張小板凳，凳腳纏著新布，是給孩子坐的。
    line: 「……來了就坐。」他沒抬頭，手上的鐵鎚也沒停。
  look: {head: square, hair: messy, beard: stubble, age: old, base: cold}


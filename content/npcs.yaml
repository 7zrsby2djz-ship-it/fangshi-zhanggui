# level：煉氣 1–9；築基初期 10、中期 11、後期 12
# traits 1–3（低、中、高），遊戲中永不顯示
# call：依境界差稱呼你（up = 你高他三層以上；eq = 相當；down = 你低他三層以上）
# refuse：境界差太大時，被殺價的回應；cold：茶涼透時的話
# home：洞府區住處（解鎖後可拜訪）

qian:
  name: 錢不語
  role: 錢記掌櫃
  level: 8
  traits: {greed: 3, nerve: 2, pride: 1, trust: 1, patience: 3, backing: 2}
  call: {up: 許掌櫃, eq: 許老弟, down: 許老弟}
  surface: 對門錢記的掌櫃，逢人便笑，跟誰都稱兄道弟。
  refuse: 許老弟，這價錢，是看在你爹的面子上。
  cold: 許老弟，給句痛快話。
  circle: 坊市商人

yao:
  name: 姚四
  role: 草藥販子
  level: 7
  traits: {greed: 2, nerve: 1, pride: 1, trust: 1, patience: 3, backing: 1}
  call: {up: 許掌櫃, eq: 小許, down: 小許}
  surface: 老散修，愛講古，四十年前的坊市什麼都知道。
  refuse: 小許，我跟你說，四十年前這價錢買不到一根鬚。
  cold: 行了行了，要不要？
  circle: 散修
  home:
    text: 姚四住在洞府區最舊的一排石屋。門沒鎖。桌上一碟金粉，一支極細的狼毫筆，筆尖還是濕的。牆角堆著幾株赤炎草，葉背的金線，有的三道，有的五道。
    line: 「小許？你怎麼找到這兒來了。坐，坐。」他把那碟金粉往桌下推了推。

bai:
  name: 白七娘
  role: 聽雨樓老闆娘
  level: 9
  conceal: true
  traits: {greed: 2, nerve: 3, pride: 1, trust: 1, patience: 3, backing: 3}
  call: {up: 許掌櫃, eq: 許掌櫃, down: 許掌櫃}
  surface: 笑臉迎人，記得每個客人愛喝什麼茶。
  refuse: 消息的價錢，從來不二價。
  cold: 許掌櫃，茶涼了。
  circle: 坊市商人

aheng:
  name: 阿蘅
  role: 採藥散修
  level: 5
  traits: {greed: 1, nerve: 2, pride: 2, trust: 2, patience: 1, backing: 1}
  call: {up: 掌櫃的, eq: 掌櫃的, down: 掌櫃的}
  surface: 話少，穿得樸素，指甲縫裡總有草汁的顏色。
  refuse: 就這個價。
  cold: 要就要，不要我走。
  circle: 散修
  home:
    text: 阿蘅住在洞府區邊上一間租來的小屋。門口兩雙鞋，一雙是她的，一雙是男人的，鞋底的泥是黑的。坊市裡只有一條巷子是這種黑泥，就是夜裡才開的那條。
    line: 她開門看見你，愣了一下，回頭把裡屋的門帶上：「掌櫃的有事？」

tie:
  name: 鐵老蔫
  role: 市集器修攤主

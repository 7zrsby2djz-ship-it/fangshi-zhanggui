  surface: 寡言，修東西的手藝整條街最好，做出來的東西不好看。
  refuse: 不賣。
  cold: 嗯。
  circle: 散修
  home:
    text: 鐵老蔫的石屋後面是個小鍛爐，爐火沒熄。牆上掛著一把沒開刃的刀胚，刀胚上刻著兩個字，被煙燻得看不清。角落裡有一張小板凳，凳腳纏著新布，是給孩子坐的。
    line: 「……來了就坐。」他沒抬頭，手裡的鎚子也沒停。


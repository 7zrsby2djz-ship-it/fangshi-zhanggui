# hours：開放的時辰（0 辰、1 午、2 申）
places:
  market:
    name: 青石街市集
    hours: [0, 1, 2]
    blurb: 青石板路兩邊擺滿了攤子。賣什麼的都有，大多是不值錢的東西，偶爾混著一件值錢的。
    blurbMarketDay: 今天是市集日，攤子比平常多一倍，外地人也來了。
    stalls:
      - {npc: mang, deals: [d10, m210], month: all, days: [1, 6], goods: 狐尾燈，一排一排掛著，燈影輕輕擺動。}
      - {npc: stone, deal: d09, days: [1, 3], goods: 一塊舊布上擺著十幾塊石頭，灰的、黑的、帶紋的。}
      - {npc: tie, special: smith, month: all, days: [1, 6], goods: 一張油膩的木台，台上擺著幾把不好看的刀，和一堆等著修的東西。}
      - {npc: tao, deal: d07, days: [3, 3], goods: 一疊一疊的黃紙符籙，用石頭壓著。}
      - {npc: scar, deal: d08, days: [3, 3], goods: 地上一塊破布，布上只有一把刀。}
      - {npc: stone, deal: m204, month: 2, days: [2, 4], goods: 小石頭的攤子挪到了鐵老蔫旁邊。布上的石頭少了，多了一塊帶紅紋的。}
      - {npc: xiangke, deal: m211, month: 2, days: [4, 4], goods: 一車用麻繩捆好的定神香，香氣衝得人睜不開眼。}
      - {npc: scar, deal: m212, month: 2, days: [4, 4], goods: 地上一塊破布，布上放著一個舊儲物袋。}

  huichun:
    name: 回春堂
    hours: [0, 1]
    npc: zhang
    blurb: 寒潭宗開的丹坊。藥櫃一直頂到屋樑，櫃檯後面坐著張掌事，學徒在後頭碾藥。
    sells:
      - {item: chiyan, mult: 1.15}
      - {item: liaoshang, mult: 1.15}
      - {item: yangqi, mult: 1.15}
      - {item: dingshen, mult: 1.15}
      - {item: lingsui, mult: 1.25}
    display: [zhuji]
    buyMult: 0.8

  tea:
    name: 聽雨樓
    hours: [1, 2]
    npc: bai
    blurb: 二樓臨街，窗邊的位子最貴。白七娘在櫃檯後面撥算盤，每張桌子上都有人在說話。
    askCost: 3
    about:
      qian: 錢掌櫃啊，跟誰都稱兄道弟。他跟執事堂的周執事，是每個月都要喝一頓酒的交情。
      yao: 姚四跟你爹是老交情。十二年前許記出事，他替人收過一批東西。這陣子他缺錢，缺得很急。
      aheng: 採藥的阿蘅？老實丫頭。她弟弟阿禾在鬼市欠了一筆，利滾利，快滾不動了。
      tie: 鐵老蔫年輕時欠過一筆債，躲了二十年。他補過的東西，比他賣出去的多。
      mang: 盲婆婆……她的事，我不賣。
      stone: 那孩子想拜鐵老蔫為師，蹲了半年了。
      ge: 老葛想讓女兒進寒潭宗。他每年都往執事堂送一筐好藥。
      zhou: 周執事想調回宗門。想調回去的人，帳面都要好看。
      zhang: 張掌事規矩多。規矩多的人，規矩外面的事也多。
      liu: 那個郎中？來了不到兩個月，賣過三回好東西。三回，三家鋪子被查。
      bai: 許掌櫃想打聽我？這個價，你付不起。
      dianzhu: 長生典的事，聽雨樓不賣。
      hu: 鬼市的人，我不認得。
      lu: 陸師兄？寒潭宗執法堂的。他一下山，坊市裡就有人睡不著了。
      meng: 孟三娘的男人是看地脈的，去年冬天死在北面礦上。礦上說是塌方。

  office:
    name: 執事堂
    hours: [0, 1]
    npc: zhou
    blurb: 寒潭宗在坊市的外事堂。門口兩個守衛，牆上貼著告示和懸賞。

  herb:
    name: 城外藥田
    hours: [0]
    npc: ge
    closed: {1: [5]}
    closedText: 北林封了，藥田那條路也有人守著。守衛說，狼還在附近。
    blurb: 出城往北半個時辰，一片一片的藥田。老葛蹲在田埂上抽菸。

  homes:
    name: 洞府區
    hours: [0, 2]
    blurb: 坊市後山的一片石屋，散修大多住在這裡。你知道住址的人，才找得到門。

  pawn:
    name: 長生典
    hours: [0, 1, 2]
    days: [1]
    npc: dianzhu
    blurb: 一扇黑漆門，門上沒有招牌。每月初一才開。

# 藥田的老葛：直接買。q 是實際品質（玩家看到的是老葛的說法）
herbStock:
  - {days: [1, 3], item: chiyan, price: 8, q: 0.75, max: 6, say: 「種的，十五年上下。金線一道，不多不少。」}
  - {month: 2, days: [1, 6], item: chiyan, price: 9, q: 0.85, max: 6, say: 「這個月地火穩了，草長得慢，金線兩道，二十年上下。」}
  - {days: [4, 6], item: chiyan, price: 5, q: 0.55, max: 8, say: 「今年地火旺，草長得急，金線都齊了，可藥性虛。我跟你說實話，便宜給你。」}

# 鐵老蔫的攤子：收貨、訂製
smith:
  buys:
    hantie: {mult: 0.95, useBase: true, say: 「寒鐵？礦脈的事是胡扯。照老價收。」}
    langya: {mult: 0.9, aliveBonus: 1.3, say: 「活取的牙？好，煉器用的就是這個。」}
    duanshui: {mult: 0.9, say: 「……這刀我補過。」}
    lingsui: {fixed: 50, say: 「這石頭……我收。五十。我想用它煉一把刀。」}
    duandao: {mult: 0.85, say: 「我打的刀，我收回來。」}
    luopan: {mult: 0.85, say: 「尋脈羅盤？好東西。我收。」}
  sells:
    - {item: hantie, mult: 1.0, lot: 5, month: 2, label: 鐵老蔫的寒鐵（有印）}
  commission:
    item: duandao
    needItem: hantie
    needQty: 5
    fee: 10
    days: 3
    say: 「五斤寒鐵，十塊工錢。三天。」
    done: 鐵老蔫託人帶話：刀好了。你去取回來，刀背厚，刀刃薄，不好看。

# 上門散客：沒有排定的客人時，會有散客上門
walkins:
  who:
    - 一個背著藥簍的散修
    - 兩個結伴的外門弟子，其中一個一直在數錢
    - 一個說話帶北方口音的獵戶
    - 一個鬍子花白的老修士，進門先看你的修為
    - 一個年輕女修，問完價就盯著貨看
    - 一個滿身泥的礦工，指甲縫裡是黑的
  wants: [herb, incense, talisman, beast, ore, pill, weapon]
  # 各天的需求加權（狼群下山後兵器、丹藥需求大增）
  demand:
    5: {pill: 3, weapon: 3, beast: 0.5}
    6: {pill: 2, weapon: 2}
  demand2:
    1: {ore: 1.5, herb: 1.3}
    2: {ore: 2, tool: 1.5}
    3: {ore: 2, pill: 1.5}
    4: {incense: 2, herb: 1.5, talisman: 1.5}
    5: {pill: 2, weapon: 1.5, tool: 1.5}
    6: {pill: 2, herb: 1.5}

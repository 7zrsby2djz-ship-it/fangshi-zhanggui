  - {days: [1, 3], item: chiyan, price: 8, q: 0.75, max: 6, say: 「種的，十五年上下。金線一道，不多不少。」}
  - {month: 2, days: [1, 6], item: chiyan, price: 9, q: 0.85, max: 6, say: 「這個月地熱比較穩，草長得慢，金線兩道，二十年上下。」}
  - {month: 3, days: [1, 2], item: chiyan, price: 11, q: 0.9, max: 4, say: 「北邊冷下來了，地熱也退了。草少，貴一點。再過兩天，大概就採不到了。」}
  - {days: [4, 6], item: chiyan, price: 5, q: 0.55, max: 8, say: 「今年地熱太旺，草長太快，金線都齊了，可是藥效虛。我跟你講實話，算你便宜。」}


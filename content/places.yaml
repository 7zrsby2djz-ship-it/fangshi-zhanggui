# hours：開放的時段（0 上午、1 下午、2 傍晚）
# type: explore 的地方是「往外走」：每次去做一件事（spots），去過的地方會打開更深的地方。
#   spot 欄位：id／title／hint（按鈕上的說明）／text／fx／need／months（哪幾段日子有）／days／after（要先去過哪裡）
#             repeat（可以重複，每天一次，從 loot 抽一個結果）／strain（回程多花一個時段）／cost（要花的靈石）
#             deep（{level, text}：吐納到幾層會多看見一點）／note（記進消息簿的話）
#   need 可以用 level（吐納層數）
places:
  market:
    name: 舊公路市場
    hours: [0, 1, 2]
    blurb: 舊公路剩下的那一段，柏油裂成一塊一塊，兩邊擺滿了攤子。賣什麼的都有，大多不值錢，偶爾混著一件值錢的。路邊那根舊電線桿上，還貼著一百年前的補習班廣告，字早就看不清了。
    blurbMarketDay: 今天是市集日，攤子比平常多一倍，外地人也來了。
    stalls:
      - {npc: mang, deals: [m304, d10, m210], month: all, days: [1, 6], goods: 一排普通的小燈掛在竹竿上，玻璃罩擦得很乾淨。攤子最裡面，另外有一盞燈蓋著布，從來沒掀開過。}
      - {npc: stone, deal: d09, days: [1, 3], goods: 一塊舊布上擺著十幾塊石頭，灰的、黑的、有紋路的。}
      - {npc: tie, special: smith, month: all, days: [1, 6], goods: 一張油膩的木桌，桌上幾把不好看的刀，和一堆等著修的東西：背架扣件、鍋子、一台拆開的手搖收音機。}
      - {npc: tao, deal: d07, days: [3, 3], goods: 一疊一疊的蠟紙防水貼，用石頭壓著。}
      - {npc: scar, deal: d08, days: [3, 3], goods: 地上一塊破布，布上只有一把刀。}
      - {npc: stone, deal: m204, month: 2, days: [2, 4], goods: 小石頭的攤子移到了鐵師傅旁邊。布上的石頭少了，多了一塊帶紅紋的。}
      - {npc: xiangke, deal: m211, month: 2, days: [4, 4], goods: 一台手推車，堆滿用麻繩捆好的定神香，味道衝到睜不開眼睛。}
      - {npc: scar, deal: m212, month: 2, days: [4, 4], goods: 地上一塊破布，布上放著一個舊收納袋。}
      - {npc: stone, deal: m303, month: 3, days: [1, 2], goods: 小石頭的布上只放了一塊石頭，太陽底下亮晶晶的，旁邊的人都離它遠遠的——說是很冰。}

  huichun:
    name: 回春藥行
    hours: [0, 1]
    npc: zhang
    blurb: 寒潭會開的藥行，負責採購、驗貨。藥櫃一路頂到天花板，櫃檯後面坐著張主任，學徒在後面磨藥。牆上貼著手寫的價目表和「驗收不合格恕不退件」。
    sells:
      - {item: chiyan, mult: 1.15}
      - {item: liaoshang, mult: 1.15}
      - {item: yangqi, mult: 1.15}
      - {item: dingshen, mult: 1.15}
      - {item: lingsui, mult: 1.25}
      - {item: bishui, mult: 1.2}
    display: [zhuji]
    buyMult: 0.8

  tea:
    name: 聽雨茶館
    hours: [1, 2]
    npc: bai
    blurb: 二樓靠馬路，窗邊的位子最貴。白姐在櫃檯後面打算盤，每一桌都有人在講話。牆上掛著一張很舊的台灣地圖，海岸線被人用原子筆往內畫了好幾圈，每一圈旁邊寫著不同的年份。
    askCost: 3
    about:
      qian: 錢老闆啊，跟誰都稱兄道弟。他跟派出所的周警員，每個月都要喝一次酒。
      yao: 姚四跟你爸是老交情。十二年前你們家出事，他幫人收過一批東西。這陣子他缺錢，缺得很急。
      aheng: 採藥的阿蘅？老實的女生。她弟弟阿禾在黑市欠了一筆，利滾利，快滾不動了。
      tie: 鐵師傅年輕時欠過一筆債，躲了二十年。他修過的東西，比他賣出去的多。
      mang: 盲婆婆……她的事，我不賣。
      stone: 那孩子想跟鐵師傅學手藝，在旁邊蹲了半年了。
      ge: 老葛想讓女兒進寒潭會。他每年都往管理處送一籃好藥。
      zhou: 周警員想調去總會。想調走的人，帳面都要好看。
      zhang: 張主任規矩多。規矩多的人，規矩外面的事也多。
      liu: 那個醫師？來不到兩個月，賣過三次好東西。三次，三家店被查。
      bai: 許老闆想打聽我？這個價，你付不起。
      dianzhu: 長生當鋪的事，茶館不賣。
      hu: 黑市的人，我不認識。
      lu: 陸調查員？寒潭會稽查組派下來的。他一下山，聚落裡就有人睡不著。
      meng: 孟太太的先生是看地脈的，去年冬天死在北礦。礦上說是坍方。
      lin: 林老師？舊國小那間舊物室是她顧的。你撿到什麼怪東西，拿去給她看，她不會笑你。她自己撿的比你多。

  office:
    name: 管理處・派出所
    hours: [0, 1, 2]
    npc: zhou
    blurb: 以前的鄉公所，一棟兩層的水泥樓。左邊是聚落管理處，收規費、貼公告；右邊是派出所，報案、懸賞都在這裡。周警員通常坐在右邊靠窗那張桌子。

  herb:
    name: 聚落外藥田
    hours: [0, 1]
    npc: ge
    closed: {1: [5], 3: [3, 4]}
    closedText: 北林封了，藥田那條路也有人守著。守的人說，狼還在附近。
    blurb: 出聚落往北走一個小時，一層一層的梯田種著藥。老葛蹲在田埂上抽菸，旁邊的舊水管還在滴水。

  homes:
    name: 後山住宅區
    hours: [0, 1, 2]
    blurb: 聚落後山一片石頭跟鐵皮搭的房子，很多人住在這裡。你知道住址的人，才找得到門。

  pawn:
    name: 長生當鋪
    hours: [0, 1, 2]
    days: [1]
    npc: dianzhu
    blurb: 一扇黑色的門，門上沒有招牌。每段日子的第一天才開。門縫裡的空氣，比外面冷一點。

  school:
    name: 舊國小・舊物室
    type: archive
    hours: [1, 2]
    npc: lin
    blurb: 一百年前的國小，只剩一棟教室還有屋頂。林老師把它整理成舊物室：一排一排的架子上，放著大家從外面撿回來的東西，每一件旁邊都貼著手寫的小卡——「哪裡撿的」「誰撿的」「看到了什麼」「還不知道什麼」。
    blurbM:
      3: 舊物室裡比外面暖。林老師把幾件會冷的東西搬到了窗邊，說它們這幾天「比較吵」。
    note: 舊物、異物可以賣給她（比散客出的好一點）、請她研究（東西還你，會多知道一點），或者乾脆捐給舊物室。
    spots:
      - id: sc_shelf
        title: 看架子
        hint: 慢慢看那些小卡
        text: 你一張一張看小卡。「隧道口撿的玻璃葉子，會響。」「水庫的霧，裝起來不會散。」「北礦柵欄外的羽毛，一直是冰的——不要放在嬰兒旁邊。」有一張卡片空著，只寫了日期，跟一句：「這件東西我不知道是什麼。」架子上那個位置是空的。
        fx: {flag: [lin_met], rel: {lin: 1}}
        note: 舊物室的小卡寫著：隧道、水庫、西邊斷崖、北礦柵欄外，都撿得到怪東西。越遠的地方，東西越怪。
      - id: sc_board
        title: 教室後面的黑板
        hint: 一百年沒擦的黑板
        after: sc_shelf
        text: 教室後面的黑板，有一塊被林老師用透明塑膠板封起來。粉筆字是小孩的：「12/31 放假！大家新年快樂！」旁邊畫了一棵聖誕樹、一個太陽，還有一座很矮很矮的山。值日生的名字被擦掉一半。林老師說，她每天早上都會看一眼這塊黑板，確定它還在。
        fx: {flag: [saw_blackboard]}
      - id: sc_theory
        title: 林老師的筆記
        hint: 她整理的「說法」
        after: sc_board
        need: {rel: {lin: 2}}
        text: 林老師拿出一本很厚的筆記，裡面不是答案，是「說法」。「AI做的。」「AI想救人，救錯了。」「地底下的東西醒了。」「是人自己做的，不關機器的事。」「神明收回去了。」「什麼都不是，地球本來就會這樣。」每一條下面都有她記的證據跟反證。她說：「我不是要你選一個。我是要你知道，每一個說得很肯定的人，手上拿的都是一兩件東西而已。」
        fx: {flag: [lin_theories], rel: {lin: 1}}
        note: 林老師整理的災變說法有六種以上，每一種都有人講得很肯定，沒有一種有足夠的證據。
      - id: sc_map
        title: 牆上的海岸線
        hint: 一張每年重畫的地圖
        after: sc_shelf
        months: [2, 3]
        text: 牆上一張大地圖，海岸線用不同顏色的筆畫了很多次。林老師說，從斷崖回來的人會告訴她海到哪裡了，她就畫一條。可是海面從來沒有下降——水一直往西邊那道缺口流，海卻沒有變淺。「水跑去哪裡了？」她說，「我問了二十年。」
        fx: {flag: [saw_coast_map]}
        note: 林老師說，海水一直流進西邊的落差，海面卻一直沒有下降。

  # ═════ 往外走 ═════
  ruin:
    name: 舊公路崩塌段
    type: explore
    depth: 第一層・聚落邊上
    hours: [0, 1, 2]
    blurb: 舊公路往南走五分鐘，路就斷了——不是塌下去，是被抬起來，整段柏油翹成一面斜牆，最上面懸在半空。風從山谷裡往上吹，帶著草跟鐵鏽的味道。小孩被大人禁止來這裡，所以小孩最愛來這裡。
    blurbM:
      3: 路肩上的草結了一層白霜，霜紋全都朝著北邊。
    spots:
      - id: ru_edge
        title: 走到路的盡頭
        hint: 翹起來的柏油牆
        text: 你爬上翹起來的那段柏油。最上面，路就停在空中，底下是一整片雲海。柏油的斷面一層一層，像蛋糕，最底下那層混著碎玻璃和一塊綠色的鐵片。你把鐵片撬出來，是一塊路牌。
        fx: {give: [{item: lupai, qty: 1, cost: 0}]}
      - id: ru_bus
        title: 翻倒的公車
        hint: 路邊草叢裡
        after: ru_edge
        text: 一輛公車側躺在草叢裡，車身長滿了苔，像一條綠色的船。你從破窗爬進去，座椅都還在，扶手上掛著一個發白的塑膠吊環。最後一排座位底下，有一張藍色的卡。你抬頭，車窗上有一個小孩用手指在霧氣上畫的笑臉——外面沒有霧，窗上的霧卻一直沒乾。
        fx: {give: [{item: youyou, qty: 1, cost: 0}], flag: [saw_bus_window]}
        deep: {level: 5, text: 你盯著那個笑臉看久了，發現它的嘴角每隔一陣子會往下掉一點點，再慢慢回去，像是在呼吸。}
      - id: ru_shrine
        title: 土地公廟
        hint: 斷路旁邊的小廟
        text: 斷路旁邊有一間比人還矮的土地公廟，屋頂換過好幾次鐵皮。香爐裡有新的香腳，有人一直在拜。供桌上一個舊籤筒，你搖了一支。廟旁邊掛著一塊牌子：「平安回來的人，記得來跟土地公說一聲。」
        fx: {give: [{item: qianshi, qty: 1, cost: 0}]}
      - id: ru_wind
        title: 往上吹的風
        hint: 站在斷口聽
        after: ru_edge
        months: [2, 3]
        text: 你站在斷口，風從底下往上吹，吹得你衣服鼓起來。風裡有鹹味——這裡離海很遠很遠。風停的那一秒，你聽到很深很深的地方，有東西在嘩嘩地響，像是很大的一條河，一直往下流。
        fx: {flag: [heard_deep_water], xp: 4}
        note: 舊公路斷口的風有海水的鹹味，風停的時候，聽得到很深的地方有大量的水往下流。
      - id: ru_frost
        title: 路肩上的霜
        hint: 霜紋都朝北
        months: [3]
        text: 路肩上的霜一片一片，每一片的紋路都像箭頭，全都指著北礦的方向。你蹲下來，用手指抹掉一片。過了一下子，它又長回來了，箭頭的方向沒變。
        fx: {flag: [frost_arrows]}
        note: 結霜那幾天，聚落邊上的霜紋全都指向北礦，抹掉會再長回來。
      - id: ru_scrap
        title: 在碎石堆裡翻翻看
        hint: 每天都可能翻到不一樣的
        repeat: true
        loot:
          - {text: 你翻了半天，翻到一頂黃色的安全帽，貼紙還在。, fx: {give: [{item: anquanmao, qty: 1, cost: 0}]}}
          - {text: 碎石底下壓著一頁泡過水的課本，你小心地把它攤平。, fx: {give: [{item: keben, qty: 1, cost: 0}]}}
          - {text: 只有一堆生鏽的螺絲、一隻斷掉的拖鞋。你把拖鞋擺正，放回原處。, fx: {}}
          - {text: 石縫裡長著一株赤炎草，葉背只有一道金線，是真的。, fx: {give: [{item: chiyan, qty: 1, cost: 0, q: 0.9, label: 斷路邊的赤炎草}]}}
          - {text: 一個生鏽的鐵盒，裡面有三塊靈石，和一張寫著「給阿弟」的紙條。你看了紙條很久。, fx: {stones: 3}}
          - {text: 碎石堆裡有一個貝殼，殼裡還是濕的。這裡離海很遠。, fx: {give: [{item: xianbei, qty: 1, cost: 0}]}}
          - {text: 柏油裂縫裡夾著一張超商發票，字黑得像今天早上才印的。, fx: {give: [{item: fapiao, qty: 1, cost: 0}]}}
          - {text: 一本泡過水的畢業紀念冊，攤開在草裡，翻在團體照那一頁。, fx: {give: [{item: jinianc, qty: 1, cost: 0}]}}
          - {text: 你聽到碎石底下有人在敲，一下、一下。你挖開來，底下只有一根普通的水管。敲聲停了。, fx: {}}

  tunnel:
    name: 舊隧道
    type: explore
    depth: 第二層・山腹
    hours: [0, 1]
    blurb: 舊公路穿山的隧道。山抬起來的時候它被扭了一下，入口是斜的，像一張歪掉的嘴。裡面的風永遠往裡吹，從來沒有往外吹過。洞口的牆上有人用油漆寫：「回程比去程累，記得留力氣。」
    blurbM:
      3: 隧道口結了一圈冰柱。往裡吹的風，今天是暖的。
    spots:
      - id: tu_mouth
        title: 洞口的蕨
        hint: 會響的葉子
        text: 隧道口長了一片蕨類，風一吹，有幾株發出叮叮的聲音。你湊近看，那幾株的葉子變成了透明的玻璃，葉脈還在裡面。你小心折下一片，斷口很整齊，像本來就是可以拆下來的。
        fx: {give: [{item: boliye, qty: 1, cost: 0}]}
      - id: tu_lights
        title: 還亮著的燈
        hint: 往裡面走一段
        after: tu_mouth
        text: 往裡走了大概十分鐘，牆上出現一排舊時代的緊急照明燈。大部分都壞了，但有一盞還亮著，很淡的白光。沒有電線接著它，燈罩裡也沒有電池。你在它底下站了一下，耳朵開始塞住，像坐車上山時那樣。
        fx: {flag: [tunnel_light], xp: 5}
        note: 舊隧道裡有一盞緊急照明燈沒有電源也還亮著。走到那裡，耳朵會開始塞。
      - id: tu_echo
        title: 回聲
        hint: 再往裡，會累
        after: tu_lights
        strain: true
        text: 你對著隧道深處喊了一聲。回聲過了很久才回來，回來的不是你的聲音，是一個女人很輕的一句話，你沒聽清楚。地上有一顆光滑的黑石頭，回聲好像就是從它身上回來的。你把它撿起來，它是溫的。回程的路比來的時候長，你走出洞口時，鼻子流了一點血。
        fx: {give: [{item: huishi, qty: 1, cost: 0}], xp: 10}
        deep: {level: 5, text: 你身體比以前撐得住了。回聲裡的那句話，你聽到後半段：「……記得留燈。」}
      - id: tu_car
        title: 長進牆裡的車
        hint: 隧道轉彎處
        after: tu_lights
        strain: true
        text: 轉彎的地方，一台小客車一半在路上，一半埋在隧道的牆裡——不是撞進去的，牆面很平整，像是牆慢慢長過去把它包住了。後座有一本學生的筆記本，封面寫著「不要給媽媽看」。你走出隧道的時候，天色比你以為的晚。
        fx: {give: [{item: bijiben, qty: 1, cost: 0}], flag: [saw_wall_car], xp: 8}
      - id: tu_water
        title: 隧道的另一頭
        hint: 要吐納五層才撐得住
        after: tu_echo
        need: {level: 5, done: [tu_car]}
        strain: true
        text: 你走到隧道本來應該通到另一邊的地方。出口沒有了。眼前是一面直立的水牆，從地面一直到隧道頂，水是透明的藍綠色，幾條魚在裡面側著身體游。你伸手碰它——冰的、鹹的。手抽回來，是乾的。水牆的另一邊，好像有光。你沒有再往前。回程你走了很久很久，出洞口的時候太陽已經偏西，手錶慢了二十分鐘。
        fx: {flag: [saw_water_wall], xp: 15, give: [{item: xianbei, qty: 1, cost: 0, label: 水牆腳下的貝殼}]}
        note: 舊隧道的盡頭是一面直立的海水牆，碰了手是乾的。從那裡回來，時間好像對不上。
        deep: {level: 6, text: 你在水牆前站得比較久。水裡很遠的地方，有一排很小的燈，排成一條線往下延伸，像一條路。}
      - id: tu_dig
        title: 在洞口附近翻翻看
        hint: 每天都可能有不一樣的
        repeat: true
        loot:
          - {text: 落石底下有一片綠色的電路板，一角燒焦了。, fx: {give: [{item: zhuban, qty: 1, cost: 0}]}}
          - {text: 一個比拳頭還大的蟬殼掛在洞口的鐵網上。裡面長著苔，往外長。, fx: {give: [{item: chanke, qty: 1, cost: 0}]}}
          - {text: 什麼都沒有。風一直往裡吹，吹得你有點想跟著走進去。你沒有。, fx: {}}
          - {text: 洞口旁邊有人留下兩張還能用的防水貼，用石頭壓著，旁邊寫著「需要的人拿」。你拿了一張，留了一張。, fx: {give: [{item: bishui, qty: 1, cost: 0, label: 洞口撿到的防水貼}]}}
          - {text: 你在碎石裡找到一塊路牌碎片，字還很清楚。, fx: {give: [{item: lupai, qty: 1, cost: 0}]}}
          - {text: 洞口的鐵網上綁著一串鐵管風鈴，沒有風也在響。你解下來的時候，它停了一下，像在看你。, fx: {give: [{item: fengling, qty: 1, cost: 0}]}}
          - {text: 一個倒過來的紅綠燈黃燈罩，卡在落石裡。你一碰，它亮了三秒。, fx: {give: [{item: huangdeng, qty: 1, cost: 0}]}}

  reservoir:
    name: 寒潭水庫
    type: explore
    depth: 第二層・東邊
    hours: [0, 1, 2]
    blurb: 聚落東邊的舊水庫，大家叫它寒潭。水是黑綠色的，一年到頭都很冰。老人說一百年來它的水位一公分都沒變過，不管下多少雨、旱多久。水面上的霧，早上起、中午也不散。
    blurbM:
      2: 五月了，寒潭的霧更厚，霧裡偶爾有一點一點的光。
      3: 寒潭結了一層薄冰。冰下面，有東西在慢慢游。
    spots:
      - id: re_dam
        title: 壩頂
        hint: 跟釣魚的阿伯聊天
        text: 壩頂有個阿伯在釣魚，釣了一整個早上什麼都沒釣到，看起來也不在意。他旁邊放著一排舊果醬罐，每一罐裡都裝著霧。「霧是這裡唯一抓得到的東西，」他說，「五塊一罐。不買也沒關係，霧又不會跑。」
        fx: {flag: [met_fog_man]}
      - id: re_fogjar
        title: 跟阿伯買一罐霧
        hint: 五塊
        after: re_dam
        cost: 5
        text: 阿伯挑了一罐給你：「這罐比較有精神。」你對著光看，霧在罐子裡慢慢轉，裡面有兩三個很小的光點，像很遠的路燈。
        fx: {give: [{item: wuguan, qty: 1, cost: 5}]}
      - id: re_toad
        title: 白色的蟾蜍
        hint: 沿著水邊走
        text: 水邊的石頭上蹲著幾隻白色的蟾蜍，一動也不動，耳後鼓著一小包。寒潭會的人在不遠處巡邏，看到你，喊了一聲：「不要碰！碰了算偷！」那幾隻蟾蜍同時轉頭看你，動作一模一樣。
        fx: {flag: [saw_toads]}
        note: 寒潭水庫邊的白蟾蜍有寒潭會的人巡守，碰了就算偷。
      - id: re_float
        title: 會漂的石頭
        hint: 壩下的淺灘
        after: re_dam
        text: 淺灘上，有一顆灰色石頭浮在水面上，慢慢往水庫中間漂。你把它撈回來。它是溫的，像剛被人握過。你放開手，它又開始往中間漂；你把它收進口袋。
        fx: {give: [{item: fushi, qty: 1, cost: 0}]}
      - id: re_village
        title: 水底的村子
        hint: 租竹筏，十塊，會累
        after: re_dam
        cost: 10
        strain: true
        text: 你跟阿伯租了竹筏划到水庫中間。霧散開一點，往下看，水很清——底下是一整個村子。屋頂、電線桿、一座國小的籃球架，籃框上還掛著網子。中午十二點，水底傳來一陣鐘聲，是學校的下課鐘。一個塑膠袋從水底浮上來，裡面是一捲錄音帶，標籤寫著「給阿嬤 過年」。划回來的時候，你的手臂抖得握不住槳。
        fx: {give: [{item: luyin, qty: 1, cost: 0}], flag: [saw_drowned_school], xp: 8}
        note: 寒潭水庫底下有一整個村子，中午會傳出學校的下課鐘聲。
      - id: re_lights
        title: 霧裡的路燈
        hint: 傍晚再去一次
        after: re_village
        months: [2, 3]
        text: 傍晚，霧裡的光點變多了，一盞一盞，排成兩條線，中間是一條路的形狀。路的盡頭有一個比較亮的光，一閃一閃，像紅綠燈。阿伯說他看了三十年，每年都多一兩盞。「有人說那是水底村子的燈。可是水底沒有電啊。」
        fx: {flag: [saw_fog_lights], xp: 5}
      - id: re_shore
        title: 沿著岸邊撿撿看
        hint: 每天都可能有不一樣的
        repeat: true
        loot:
          - {text: 岸邊有一顆會漂的石頭卡在蘆葦裡。, fx: {give: [{item: fushi, qty: 1, cost: 0}]}}
          - {text: 一個新鮮的貝殼，殼裡還有海水。寒潭是淡水。, fx: {give: [{item: xianbei, qty: 1, cost: 0}]}}
          - {text: 你撿到一頁課本，地圖上的海岸線被人用鉛筆描過。, fx: {give: [{item: keben, qty: 1, cost: 0}]}}
          - {text: 什麼都沒有。霧裡有人在喊一個名字，喊了三次就停了。附近沒有別人。, fx: {flag: [heard_fog_name]}}
          - {text: 一隻死掉的鐵背狼泡在淺水裡，牙齒還在。你用刀撬了兩顆。, fx: {give: [{item: langya, qty: 2, cost: 0}]}}
          - {text: 蘆葦裡卡著一個小銅鐘，鐘舌上刻著「仁愛國小」。你拿起來的時候，水底某個地方回了一聲。, fx: {give: [{item: xiaozhong, qty: 1, cost: 0}]}}

  cliff:
    name: 西側斷崖・落海口
    type: explore
    depth: 第三層・聚落西緣
    hours: [0, 1]
    blurb: 聚落西邊走兩個小時，地面忽然沒了。斷崖底下很遠的地方是海——不對，海在這裡斷掉了：海水在遠處一道看不到底的缺口邊緣，一直往下流，流成一整片白色的瀑布，聲音大到你要用喊的才聽得到自己。
    blurbM:
      3: 斷崖邊很冷。缺口上方的霧結成了冰晶，太陽一照，整片天空都在閃。
    spots:
      - id: cl_view
        title: 看海往下掉
        hint: 坐在崖邊
        text: 你坐在崖邊看了一個上午。海水一直往缺口流，流了一百年，海面卻沒有變低。一塊漂流木被水流帶到缺口邊，翻了一下，掉下去，沒有聲音。你數到一百，沒有聽到它落地。
        fx: {flag: [saw_sea_fall], xp: 6}
        note: 西邊斷崖外，海水一直流進一道缺口，海面卻沒有下降；掉下去的東西聽不到落地的聲音。
      - id: cl_camp
        title: 崖邊的舊營地
        hint: 帳篷跟木箱
        after: cl_view
        text: 崖邊有一個沒人的營地，帳篷的布已經爛了，木箱上的字是「海況觀測　第十一次」。箱子裡有一本被雨泡爛的紀錄，最後一頁只看得清楚一行：「缺口的寬度沒有變，可是水聲的音高，每年低一點。」箱底有一個指南針，指針不指北。
        fx: {give: [{item: zhibei, qty: 1, cost: 0}], flag: [saw_survey_camp]}
        note: 斷崖營地的觀測紀錄寫著：缺口寬度不變，可是水聲每年低一點。
      - id: cl_bottle
        title: 裝一瓶海水
        hint: 沿著小路往下，會累
        after: cl_view
        strain: true
        text: 有一條很窄的小路沿著崖壁往下，走到一半，水霧大到像下雨。你用瓶子接了一瓶。回到崖上，你發現瓶子裡的水面是斜的，斜向西邊，怎麼放都一樣。爬回崖頂花的時間是下去的兩倍，你喘到說不出話。
        fx: {give: [{item: xianshui, qty: 1, cost: 0}], xp: 10}
      - id: cl_ship
        title: 掛在半空中的船
        hint: 往北邊的崖角
        after: cl_view
        months: [2, 3]
        text: 往北的崖角，可以看到缺口的另一段。水流裡卡著一艘船，不大，舊式的漁船，船頭朝下，停在半空中的白色水流裡，像被定住了。船身上的字只看得到「…漁…號」。有人說它已經在那裡卡了五十年。有人說它是上個月才掉下去的，只是掉得很慢。
        fx: {flag: [saw_hanging_ship], xp: 5}
        note: 落海口的水流裡卡著一艘漁船，船頭朝下，一直沒有掉下去。
      - id: cl_path
        title: 跟著指南針往下
        hint: 要吐納五層，要有那個指南針
        after: cl_camp
        need: {level: 5, has: {zhibei: 1}}
        strain: true
        text: 指南針的指針往下傾。你沿著一條快要被草蓋掉的舊步道往下走，走到一個平台就停了——再下去沒有路。霧裡，很下面很下面的地方，有一排路燈，暖黃色的，亮著。燈旁邊立著一塊招牌，是倒過來的：「歡迎光臨」。你在平台的石頭縫裡撿到一顆黑色的玻璃珠。爬回崖頂的時候，你的耳朵響了一整個晚上。
        fx: {give: [{item: hongzhu, qty: 1, cost: 0}], flag: [saw_below_lights], xp: 15}
        note: 斷崖下的舊步道走到盡頭，看得到很深的地方有一排亮著的路燈，和一塊倒著的「歡迎光臨」招牌。
        deep: {level: 6, text: 你多待了一下。路燈底下，有一個人影在走，走得很慢，提著什麼東西。他抬頭，好像看了你一眼。}
      - id: cl_search
        title: 在崖邊找找看
        hint: 每天都可能有不一樣的
        repeat: true
        loot:
          - {text: 崖邊草叢裡有一個新鮮的貝殼。, fx: {give: [{item: xianbei, qty: 1, cost: 0}]}}
          - {text: 一隻比拳頭大的蟬殼，掛在崖邊的欄杆上。, fx: {give: [{item: chanke, qty: 1, cost: 0}]}}
          - {text: 一支螢幕碎掉的手機，背面刻著「小芸」。, fx: {give: [{item: shouji, qty: 1, cost: 0}]}}
          - {text: 什麼都沒找到。水聲大到你一直覺得有人在後面叫你。你回頭三次，都沒有人。, fx: {}}
          - {text: 一張客運票根被風吹上崖，訖站那一格是空的。, fx: {give: [{item: piaogen, qty: 1, cost: 0}]}}

  north:
    name: 北礦柵欄外
    type: explore
    depth: 第四層・北礦外圍
    hours: [0, 1]
    minLevel: 5
    levelText: 吐納五層以上才撐得住那裡的冷
    blurb: 北礦被寒潭會用鐵絲網圍起來，網上掛著「禁止進入」「違者送辦」的牌子。柵欄外面是一片光禿禿的坡，風很冷，冷得不太正常。坡上有一座小小的礦工紀念碑，碑前擺著幾瓶米酒。
    blurbM:
      2: 坡上的草五月還是枯的。柵欄裡面，有人在搬東西，看到你就停下來。
      3: 整片坡都白了。柵欄的鐵絲上結滿了霜，霜長成一根一根的刺，全都朝外。
    spots:
      - id: no_fence
        title: 礦工紀念碑
        hint: 碑上的名字
        text: 紀念碑上刻著很多名字，最早的是災後第十年，最新的一個還是用油漆寫的，很新：「孟家和，看地脈，災後100年冬。」碑腳下有一個空酒瓶，瓶裡插著一支乾掉的花。
        fx: {flag: [saw_miner_names]}
        note: 北礦紀念碑上最新的名字是孟家和，看地脈的，去年冬天。
      - id: no_office
        title: 礦場舊辦公室
        hint: 柵欄外面那間鐵皮屋
        after: no_fence
        text: 柵欄外面有一間鐵皮屋，門沒鎖。裡面是一百年前的礦場辦公室：一張鐵桌、一個月曆停在2029年12月、一台舊式的錄放音機，還接著一個手搖發電機。牆上貼著一張「本季安全目標：零災害」。月曆的31號被人用紅筆圈起來，旁邊寫著「尾牙」。
        fx: {flag: [saw_mine_office]}
      - id: no_tape
        title: 播那捲錄音帶
        hint: 你身上有錄音帶
        after: no_office
        need: {has: {luyin: 1}}
        text: 你把錄音帶放進去，搖了好久的發電機。沙沙聲之後，是一個小孩的聲音：「阿嬤，新年快樂！我今年考試考很好喔！爸爸說過年要帶我回去看你，你要煮那個……」後面有大人在笑。再後面，電視的聲音很小，好像在播新聞，一個男人說：「……專家表示，目前還無法確定……」然後帶子就沒了。你又聽了一次，那一句還是只有一半。
        fx: {flag: [played_tape], xp: 4}
        note: 錄音帶最後錄到一句舊新聞：「專家表示，目前還無法確定……」後面沒了。
      - id: no_feather
        title: 白色的羽毛
        hint: 坡上
        after: no_fence
        months: [2, 3]
        text: 坡上躺著一根比你手臂還長的白羽毛，它旁邊的草全結了霜，羽毛本身卻很乾淨。你撿起來，它是冰的，冰得剛剛好。抬頭看，天上什麼都沒有。
        fx: {give: [{item: lengyu, qty: 1, cost: 0}]}
      - id: no_vent
        title: 通風口
        hint: 貼著柵欄走，會累
        after: no_fence
        strain: true
        text: 柵欄邊有一個舊通風口，用鐵網封著。你站了一會兒，發現它在呼吸——每隔幾分鐘，一股冷風從裡面吐出來，再慢慢吸回去。吸氣的時候，裡面傳來敲擊聲，一下，一下，很有耐心。回程的路上你一直在發抖，手指到晚上還是麻的。
        fx: {flag: [heard_vent], xp: 12}
        note: 北礦的通風口每隔幾分鐘會吐一口冷風，吸氣的時候，裡面有規律的敲擊聲。
        deep: {level: 6, text: 你數了敲擊聲。它的節奏，跟你店裡那幾塊寒鐵半夜裡敲的，一模一樣。}
      - id: no_frost
        title: 霜從哪裡長出來
        hint: 只有結霜的時候，會很累
        after: no_fence
        months: [3]
        strain: true
        text: 你沿著霜最厚的地方走，走到柵欄底下一道地裂。霜是從地裂裡往上長的，不是從天上落下來的。地裂旁邊有一塊露出來的水泥，上面有很舊的油漆字，大部分剝落了，只剩「2029」，和一個往下的箭頭。地裂邊上的霜晶，你掰了一塊。回去的路上，你的影子比平常淡。
        fx: {flag: [saw_frost_source], xp: 15, give: [{item: shuangjing, qty: 1, cost: 0, label: 地裂邊的霜晶}]}
        note: 北礦的霜是從柵欄下的地裂往上長的。地裂旁的水泥上有「2029」和往下的箭頭。
  stair:
    name: 斷崖下的維修梯
    type: explore
    depth: 第五層・缺口邊緣往下
    hours: [0]
    minLevel: 5
    reveal: saw_below_lights
    levelText: 吐納五層以上才下得去
    blurb: 步道盡頭的平台底下，其實還有路——一道釘在崖壁上的鐵製維修梯，鏽得發紅，一層一層往下。每一層的平台都漆著編號。往下爬的時候，身體反而越來越輕鬆，呼吸越來越順；往上爬的時候，每一層都像有人在你肩膀上多放一塊石頭。梯子口有人用粉筆寫：「下去容易。」
    blurbM:
      3: 維修梯上結了霜，可是越往下越暖。最底下那排路燈，今天比平常亮。
    spots:
      - id: st_b1
        title: B1
        hint: 第一個平台
        strain: true
        text: 第一個平台漆著「B1」。平台上有一張被風吹到褪色的安全須知，最後一條是：「如感到身體變輕，請立即回到地面。」你的身體的確很輕。往下看，還有很多平台，編號一直往下排，你數到B9就看不清楚了。爬回崖頂花了你一整個上午，最後幾格，手是抖的。
        fx: {flag: [stair_b1], xp: 12}
        note: 斷崖下的維修梯一層一層往下編號。下去的時候身體變輕，上來的時候特別累。
      - id: st_lab
        title: B2-17
        hint: 一扇鐵門
        after: st_b1
        strain: true
        text: 第二個平台的崖壁裡嵌著一扇鐵門，門牌「B2-17」，門上貼著一隻三隻腳的烏鴉貼紙，褪成淡藍色。你愣住了——這是那個道士說的地方。門沒鎖。裡面是一間很小的實驗室，桌上一整排讀卡機，插槽全是空的；地上散著幾十個一模一樣的記憶卡空殼。沒有骨頭。一張椅子面向東邊，椅背上掛著一件實驗袍，口袋裡有一張紙：「有緣的人拿去。」紙的背面是另一個人的字：「沒有緣的人，也可以拿。反正都是空的。」
        fx: {flag: [saw_lab], xp: 8}
        note: 斷崖下第二層真的有一間B2-17實驗室。道士的故事有一半是真的——卡是空的，從一開始就是。
        deep: {level: 6, text: 你在桌子底下找到一本值班紀錄。最後一筆是2029年12月30日：「抬升速度超出模型。不是我們的系統造成的——至少我們找不到證據。也找不到相反的證據。」字跡到後面越寫越大。}
      - id: st_stop
        title: 公車站牌
        hint: 再往下兩層
        after: st_lab
        strain: true
        text: 第四個平台上，立著一根公車站牌。站牌的時刻表還在，末班車是 23:59，終點站那一格是空白的。站牌底下有一張長椅，你坐下去——椅子是溫的，像剛有人站起來。底下的路燈，從這裡看，已經近到聽得見電流的嗡嗡聲。
        fx: {flag: [saw_deep_stop], xp: 10}
        note: 斷崖下第四層有一個公車站牌，末班車23:59，沒有終點站。長椅是溫的。
      - id: st_flowers
        title: 白花
        hint: 平台縫隙裡
        after: st_b1
        strain: true
        text: 平台的鐵板縫裡長滿了很小的白花，花莖細得像銀線。你一靠近，所有的花都慢慢轉過來，對著你。你摘了一朵。剩下的花，轉回去對著北邊。
        fx: {give: [{item: shenhua, qty: 1, cost: 0}], xp: 6}
      - id: st_lookup
        title: 往上看
        hint: 最低的那層，要吐納六層
        after: st_stop
        need: {level: 6}
        strain: true
        text: 你下到能下到的最低一層，背靠著崖壁往上看。聚落的燈在很高很高的地方，小得像星座。你認得出舊公路那一排，認得出管理處那盞大燈，也認得出你自己的店——店裡有一點很淡的光，你出門的時候明明沒有點燈。往上爬的時候，你流了鼻血，耳朵一直響，一直到第二天早上都覺得世界太亮。
        fx: {flag: [saw_from_below], xp: 25}
        note: 從斷崖下面往上看，聚落像一個很小的星座。
        deep: {level: 7, text: 你看著最底下那排路燈，忽然發現它們不是路燈——是一扇一扇窗。窗戶裡，有人在走動，在吃飯，在看你。}
      - id: st_gather
        title: 在平台上撿撿看
        hint: 每天都可能有不一樣的
        repeat: true
        strain: true
        loot:
          - {text: 鐵板縫裡卡著一朵白花，一直轉過來看你。, fx: {give: [{item: shenhua, qty: 1, cost: 0}], xp: 3}}
          - {text: 平台角落有一顆黑色玻璃珠，裡面映著一條你沒走過的街。, fx: {give: [{item: hongzhu, qty: 1, cost: 0}], xp: 3}}
          - {text: 一根白色的長羽毛卡在欄杆上，冰的。, fx: {give: [{item: lengyu, qty: 1, cost: 0}], xp: 3}}
          - {text: 什麼都沒找到。下面的路燈閃了一下，所有的燈同時閃，像有人眨了一次眼睛。, fx: {xp: 5}}
          - {text: 一張客運票根，被風吹上來，貼在你的鞋上。, fx: {give: [{item: piaogen, qty: 1, cost: 0}], xp: 3}}
# 藥田的老葛：直接買。q 是實際品質（玩家看到的是老葛的說法）

# ═════════════ 遺物接回事件（第二輪）：二十一件遺物會改變的地點與選項 ═════════════
# spots：新地點（多半要帶著那件遺物才進得去）；drift：只在身上有那件遺物時發生的散事
# addChoices：在既有事件後面加「身上有某件遺物才出現」的選項
# patchSpots：替既有的危險地點加上「做過某件事就不會死」的條件（deathUnless／saved）
spots:
  ruin:
    - id: ru_signback
      title: 把路牌插回路口
      hint: 斷掉的那一截，好像就是你口袋裡那塊
      after: ru_edge
      need: {has: {lupai: 1}}
      text: 斷路邊那根歪掉的路牌桿，斷口剛好對得上你口袋裡的碎片。你把它塞回去，用鐵絲綁緊。「往埔里 32」後面，慢慢浮出一個你沒看過的單位，不是公里。風吹過來，路牌輕輕轉向斷崖的方向，停住了。
      fx: {take: [{item: lupai, qty: 1}], flag: [road_sign_back], burden: -1, xp: 10}
      note: 崩塌段的路牌插回去以後，「32」後面多了一個看不懂的單位，牌子轉向斷崖。
    - id: ru_shrine_return
      title: 把籤詩拿給土地公看
      hint: 籤詩上那句「回頭方見舊時燈」，你看過太多次了
      after: ru_shrine
      need: {has: {qianshi: 1}}
      text: 你把那張粉紅色的籤詩拿出來，對著小廟的籤筒拜了三拜。籤筒自己晃了一下，掉出另一張，紅紙還很新：「第九十籤：路在腳下不在前，燈在身後亦在前。」你不知道這是好籤還是壞籤。廟旁的老人說，這座廟沒有第九十籤。
      fx: {flag: [shrine_new_poem], xp: 6, burden: -1}
      note: 土地公廟掉出一張「第九十籤」。老人說，廟裡沒有第九十籤。
  school:
    - id: sc_tape_more
      title: 把主機板接上錄音機
      hint: 卡帶後半段，錄音機唸不出來
      after: sc_tape
      need: {has: {zhuban: 1}}
      text: 林老師幫你把主機板碎片接在錄音機背後，燒焦的那一角冒出一點煙。卡帶繼續轉，點名點完以後，還有一段：一個大人的聲音說「今天的朝會先到這裡，請三年二班留下來」，接著是很多張椅子拉開的聲音，然後是你很熟悉的、自家店鐵門拉下來的聲音。林老師把錄音機關了，很久沒有說話。
      fx: {flag: [tape_more], xp: 10, rel: {lin: 1}}
      note: 卡帶的後半段，最後是你家店拉鐵門的聲音。
    - id: sc_yearbook
      title: 翻到六年二班那一頁
      hint: 畢業紀念冊的團體照，第二排中間有一個空位
      after: sc_roll
      need: {has: {jinianc: 1}}
      text: 你把畢業紀念冊翻到六年二班。團體照第二排的空位旁邊，有人用鉛筆寫了一個名字，就是三年二班點名簿最後一行那個。三年級就先走的孩子，到了畢業那一年，位子還留著。名字下面還有一行很小的字：「搭23:59那班，先走。」照片上其他小孩，都微微側著身，像在等他坐回來。
      fx: {flag: [yearbook_name], xp: 10}
      note: 畢業紀念冊的空位旁寫著：「搭23:59那班，先走。」
  tea:
    - id: tea_story_end
      title: 把筆記本最後一行念給說書人聽
      hint: 筆記本停在「1」的一半
      after: tea_story
      need: {has: {bijiben: 1}}
      text: 散場後，你把數字筆記本翻到最後一頁，念給說書人聽：「1」的那一撇。他閉著眼睛聽，嘴巴動了動，把那句跳過的話講出一半：「車門打開，裡面坐著——一個在數數字的人，數到一，就……」他停住了，看著你：「剩下的，你自己數。」你回家的路上，覺得自己少了一點什麼。
      fx: {flag: [story_half], lifespan: -1, xp: 15}
      note: 說書人講出一半：「裡面坐著一個在數數字的人，數到一，就……」
  cliff:
    - id: cl_shell_bottle
      title: 把貝殼放進海水瓶
      hint: 貝殼還是濕的，海水瓶裡的水面一直斜向西
      after: cl_bottle
      need: {has: {xianbei: 1, xianshui: 1}}
      text: 你把那顆新鮮的貝殼放進斜的海水瓶。水面晃了很久，最後斜向另一邊——東邊，聚落的方向。瓶底傳來一個很小的聲音，像有人在很遠的地方說「到了」。
      fx: {flag: [sea_turned], xp: 10}
      note: 貝殼放進海水瓶以後，水面改斜向東邊，聚落的方向。
    - id: cl_bowl_back
      title: 把碗放回船上的餐桌
      hint: 半空中那艘船的餐桌，少了一個碗
      after: cl_ship_climb
      need: {has: {wanchu: 1}}
      strain: true
      text: 你又爬上那艘懸在半空的船，把碗放回餐桌上那個空位。碗一放下，船身輕輕晃了一下，好像終於坐穩了。船舷垂下一條繩梯，一直垂到斷崖步道。你沿著繩梯下來，背上輕了很多。
      fx: {take: [{item: wanchu, qty: 1}], flag: [bowl_back], burden: -2, xp: 12}
  north:
    - id: no_shell_feed
      title: 把蟬殼放在殼的膝蓋上
      hint: 你的蟬殼，背上也裂了一條縫
      after: no_shell
      need: {has: {chanke: 1}}
      text: 你把大蟬殼放在那個人形的膝蓋上。兩個殼的裂縫，慢慢對齊。人形背上的縫合起來一點，敲起來不再空空的。礦上的老人說：「餵過了，它就不會再找人坐進去。」
      fx: {take: [{item: chanke, qty: 1}], flag: [shell_fed], xp: 10}
    - id: no_vent_time
      title: 照值班表上的時間進去
      hint: 那張紙上寫著夜班的時間
      after: no_vent
      need: {has: {ventpaper: 1}}
      text: 你照值班表上寫的時間，在通風口前面站好。時間一到，裡面的敲打聲停了。你把那張紙塞進通風口，它被吸進去，過了很久，吐出來一張新的：簽名欄的名字還是孟家和，底下那行字變成了「下面在敲。是我們的人了。」你不知道這是不是好消息。
      fx: {take: [{item: ventpaper, qty: 1}], flag: [vent_named], xp: 10}
      note: 通風口吐出新的值班表：「下面在敲。是我們的人了。」
  lampst:
    - id: ls_yellow
      title: 把燈罩套在不準時的那盞燈上
      hint: 那盞燈一閃一閃的，好像需要人提醒
      after: ls_flicker
      need: {has: {huangdeng: 1}}
      text: 你踮起腳，把黃燈燈罩套在那盞不準時的燈上。燈罩亮了三秒，很平靜的黃光，然後那盞燈跟整條街一起，準時亮了。蹲著的小孩抬頭看了很久：「這樣就不用有人留下來當燈了。」
      fx: {take: [{item: huangdeng, qty: 1}], flag: [lamp_on_time], xp: 15}
    - id: ls_clock_back
      title: 把沒有指針的鐘掛回鐘錶行
      hint: 鐘錶行的牆上，有一個空的釘子
      after: ls_windows
      need: {has: {wuzhen: 1}}
      text: 你把那個沒有指針的鐘掛回鐘錶行牆上的空釘子。整面牆的鐘一起「喀」了一聲，停在23:58的指針全部往前走了一格。23:59。街上的人都抬起頭，好像很久沒看過這個時間了。
      fx: {take: [{item: wuzhen, qty: 1}], flag: [lampst_minute], xp: 15}
      note: 燈街的鐘走到23:59了。
  platform:
    - id: pf_handover
      title: 把站務日誌交還站務室
      hint: 「代子寄存」那一頁，有人在等
      after: pf_office
      need: {has: {zhanwu: 1}}
      text: 你把撕下來的那頁日誌放回站務室的桌上。桌子後面沒有人，可是那一頁自己翻了過去，下一行用一樣的字跡寫著：「已領回。」你走出站務室的時候，覺得身上多了一點時間。
      fx: {take: [{item: zhanwu, qty: 1}], flag: [zhanwu_returned], lifespan: 1, xp: 15}
    - id: pf_read
      title: 照稿子念被劃掉的那句
      hint: 廣播稿上劃掉的那一句，紙都破了
      after: pf_announce
      need: {has: {guangbo: 1}}
      text: 你對著月台的喇叭，把廣播稿上被劃掉的那句念出來：「請旅客回到地面。」喇叭沉默了很久，然後用管理處櫃檯值班那個人的聲音重複了一次：「請旅客回到地面。」黃線上的票根，一張一張翻了過來。
      fx: {take: [{item: guangbo, qty: 1}], flag: [broadcast_fixed], xp: 15}
  stair:
    - id: st_bus_back
      title: 拿車票給司機看
      hint: 打過洞的車票，好像還能再坐一次
      after: st_stop
      need: {has: {chepiao: 1}}
      strain: true
      text: 你在站牌下等到23:59。車來了，司機看了一眼你的車票，在背面又打了一個洞：「回程。」車往上開，窗外的燈一排一排往下沉。你在崩塌段的路口下車，背上什麼都不重了。
      fx: {burden: -99, flag: [rode_back], xp: 10}
  pawn:
    - id: pw_slip
      title: 當鋪櫃檯的寄存單
      hint: 櫃檯玻璃下面壓著一張很舊的單子
      text: 當鋪櫃檯的玻璃下面壓著一張寄存單，寄存人那一欄寫著「B2-17 負責人」，寄存物寫著「一雙室內鞋」，領取期限是「換人的那天」。老闆的面紗動了一下：「那張不賣，也不給看。你看到了，就當作沒看到。」
      fx: {flag: [pawn_b217], xp: 4}
      note: 長生當鋪有一張寄存單：「B2-17 負責人，寄存一雙室內鞋，領取期限：換人的那天。」

drift:
  - id: dr_budeng_door
    month: [2, 3]
    chance: 0.45
    prio: 3
    need: {has: {budeng: 1}}
    title: 燈泡想掛出去
    text: 那顆不熄的燈泡，今晚特別亮，亮到庫房的門縫透出光來。你拿著它站在店門口，霧裡有幾個影子停下來，好像在等你決定。
    face: think
    choices:
      - label: 掛在店門口
        desc: 讓晚上的客人看得到
        text: 你把燈泡掛在招牌底下。那天晚上來了三個客人，付的都是溫的硬幣，買的都是你沒想過會賣出去的東西。其中一個走之前說：「好久沒看到這盞燈了。」
        fx: {stones: 30, flag: [budeng_hung]}
      - label: 收回庫房
        desc: 晚上來的，你還不想認識
        text: 你把燈泡收回去。門口的影子站了一會兒，散了。
        fx: {xp: 3}
  - id: dr_tangzhi_kid
    month: [2, 3]
    chance: 0.4
    prio: 3
    need: {has: {tangzhi: 1}, minDays: 3}
    title: 那個小孩又來了
    text: 那個說自己遲到很久的小學生又從霧裡走出來，站在店門口，看著你櫃上那張糖果紙。
    face: sad
    choices:
      - label: 把糖果紙還給他
        desc: 那本來就是他的
        text: 你把糖果紙還給他。他把它摺成一顆星星，放進書包，說：「燈街的燈，十一點五十八分才會亮喔。不要早到。」他走回霧裡，這次沒有東西掉下來。
        fx: {take: [{item: tangzhi, qty: 1}], flag: [kid_thanked], xp: 8, rel: {lin: 1}}
      - label: 問他要去哪裡
        desc: 他看起來不像要回家
        text: 他想了很久：「去答到。」然後就走了。
        fx: {xp: 3}

  # ── 用過之後：有人記得（第五輪設計，改寫）──
  - id: fu_chachou
    month: [1, 2, 3]
    chance: 0.9
    prio: 5
    need: {usedAgo: {chachou: 1}}
    title: 灰還在櫃上
    text: 一大早，白姐撐著傘來店裡，手裡捏著一小包紙，紙裡是茶籌燒剩的灰。「你問過的那一則旁邊，黏著這個，擦不掉。」她把灰放在櫃上，把筆轉過來，筆尖朝著你：「字是你求出來的。簿子不認灰，認手。」
    face: think
    choices:
      - label: 把那個字再寫一次
        desc: 讓它定下來
        text: 筆尖一碰，灰自己聚成原來那個字，這次沒有散開。白姐看了你的字很久：「我記得你的筆跡了。」
        fx: {rel: {bai: 1}, xp: 4, flag: [ash_rewritten], echo: 開張那天，消息簿第一頁旁邊有一點擦不掉的灰。白姐進門，先看了你的手。}
      - label: 把灰吹掉
        desc: 跟她說那只是一片竹子
        text: 灰吹不乾淨，黏在你的袖口。白姐沒有生氣，只說：「空白也是我記的帳。」
        fx: {flag: [sleeve_ash], xp: 3, note: 白姐說：茶籌本來就不該有字。}
      - label: 問她以前的空白竹片是記誰的
        desc: 她不一定會說
        text: 白姐沒有回答，在簿子那一則底下補了一個空格，空格裡什麼都沒寫。她推了幾塊靈石給你：「找零。」
        fx: {stones: 12, flag: [tea_blank], note: 白姐的簿子裡，有一個比真假更早的空格。}
  - id: fu_banbei
    month: [1, 2, 3]
    chance: 0.9
    prio: 5
    need: {usedAgo: {banbei: 1}, has: {banbei: 1}}
    title: 不要喝完的那口
    text: 白姐路過店門口，看了一眼你櫃上的杯子。茶還是半杯，可是比昨天少了一點點。「你昨天忘掉的那個地方，」她說，「還留著位子。它要是還在，晚上會自己回來找你。」
    face: think
    choices:
      - label: 把少掉的那口補回去
        desc: 補了就不喝
        text: 茶回到半杯。你想起昨天沒去的那個地名，可是想不起來那裡有什麼。
        fx: {rel: {bai: 1}, xp: 4, flag: [banbei_kept]}
      - label: 再喝一口
        desc: 輕一點，代價你知道
        text: 身體又輕了一點。白姐沒有攔你，只把杯子轉過去給你看，杯底寫著「許家店」。
        fx: {burden: -2, lifespan: -1, flag: [banbei_second], echo: 新開張的第一天，白姐倒了半杯冷茶給你，先說：「這次別喝完。」}
      - label: 把杯子還給她
        desc: 請她以後別再倒給你
        text: 白姐點點頭，把杯子收走。走到門口，她回頭留下半句話：「杯底那句，還有下半句。」後面她就沒說了。
        fx: {take: [{item: banbei, qty: 1}], rel: {bai: 2}, flag: [bai_stop_cup], note: 白姐說，杯底那句話還有下半句。}
  - id: fu_quepiao
    month: [1, 2, 3]
    chance: 0.9
    prio: 5
    need: {usedAgo: {quepiao: 1}}
    title: 分號先蓋了章
    text: 早上翻開帳本，最後一頁多了一枚印。印泥是乾的，形狀剛好補上那張票的缺角，像半個「分」字從另一頭蓋回來。旁邊多記了一筆錢，註記寫著「上行已收」。門口沒有腳印。印的邊緣摸起來，有月台那種冷。
    face: think
    choices:
      - label: 把印拓下來，收進帳本
        desc: 錢對得起來
        text: 那筆錢對得起來，可以花。你把拓下來的印夾進帳本，帳本闔起來的時候，比平常重了一點。
        fx: {stones: 40, flag: [branch_acknowledged], echo: 新帳本的第一行寫著「上行已收」，金額是零，印還在。}
      - label: 把那一頁撕掉
        desc: 你沒收過這筆錢
        text: 印跟那筆錢一起不見了。你一直覺得，有人在分號那邊替你結過一次帳。
        fx: {xp: 5, flag: [tore_upline], note: 好像有人在許記分號，替你結過一次帳。}
      - label: 對著空店問是誰蓋的
        desc: 店裡只有你
        text: 沒有人回答。晚上靜坐的時候，你看見缺角的地方自己長出一小段路名，那不是聚落裡的路。
        fx: {xp: 6, flag: [asked_empty_shop], note: 上行的終點，好像不只一個。}
  - id: fu_banpai
    month: [1, 2, 3]
    chance: 0.9
    prio: 5
    need: {usedAgo: {banpai: 2}, has: {banpai: 1}}
    title: 慢半拍的人還坐著
    text: 你夢見礦坑口那層殼。殼旁邊那個盤腿坐著的人還在，姿勢一點都沒變，呼吸比你慢半拍，慢的剛好是你拿走的那一拍。他膝蓋上的灰裡多了一個手印，大小跟你的手一樣。他沒有抬頭：「看完了就還。沒看完，也可以還。」
    face: sad
    choices:
      - label: 把那一拍還給他
        desc: 你本來就是借的
        text: 他點了一下頭，膝蓋上的手印不見了。你醒來的時候，心跳很整齊，整齊到有點陌生。
        fx: {burden: -1, xp: 4, flag: [beat_returned]}
      - label: 再跟他借一拍
        desc: 你還想看完
        text: 他沒有拒絕。你看見他盤腿的影子裡，還坐著另一個人，臉看不清楚。醒來的時候，你少了一點什麼，說不上來。
        fx: {xp: 8, lifespan: -1, flag: [beat_second], echo: 開張第一天晚上靜坐，你的心跳漏了半拍。礦坑口那個人，還坐著。}
      - label: 把殼片留在他膝蓋上
        desc: 讓他自己決定給誰
        text: 你把殼片放下，自己走了。他沒有說謝謝，也沒有叫住你。
        fx: {take: [{item: banpai, qty: 1}], xp: 5, flag: [shell_kept_by]}
  - id: fu_xiangpi
    month: [1, 2, 3]
    chance: 0.9
    prio: 5
    need: {usedAgo: {xiangpi: 1}}
    title: 擦掉的那天有人來上課
    text: 林老師一早來店裡，說舊國小的黑板上多了一行字，被擦到只剩筆畫。她湊近看過了，是你昨天去過的地方。講台抽屜裡還多了一本點名簿：今天的日期在，你的名字不在，老師那一欄也是空的。「有人把板擦放回去了，」她說，「放得很正。」
    face: think
    choices:
      - label: 把那個地名重新寫上
        desc: 不想當作沒去過
        text: 地名寫回去的時候，你覺得肩膀又沉了一點。林老師把它抄進小卡：「這樣就不算沒來過。」
        fx: {burden: 2, rel: {lin: 1}, xp: 6, flag: [late_rewritten]}
      - label: 把點名簿上的空欄也擦掉
        desc: 擦乾淨一點
        text: 你擦了。手上的粉筆灰，洗了很久都洗不掉。林老師看著你，什麼都沒說。
        fx: {burden: -2, rel: {lin: -1}, flag: [erased_with_road], echo: 舊國小的點名簿上，你的名字比別人淡了一截。}
      - label: 對著空掉的老師欄，喊一聲老師
        desc: 也許有人會應
        text: 沒有人應。黑板上自己補了半個姓，那不是你聽過的姓。
        fx: {xp: 5, flag: [called_teacher], note: 上課那天，可能不是被擦掉，是一開始就沒被寫上。}
addChoices:
  dr_branch_sign:
    - label: 戴安全帽爬上去拆
      desc: 招牌掛得很高
      need: {has: {anquanmao: 1}}
      text: 你戴上那頂寫著「2027 平安」的安全帽爬上去拆。拆到一半，招牌後面掉下一大撮木屑，還有一枚很舊的硬幣，砸在你帽子上，「叩」的一聲。
      fx: {flag: [branch_sign], give: [{item: muxie, qty: 1, cost: 0}], stones: 15, xp: 4}
  dr_fog_voice:
    - label: 打開那罐霧，讓它進去
      desc: 罐子裡的霧在轉
      need: {has: {wuguan: 1}}
      text: 你打開果醬罐，對著門外的霧。叫你名字的聲音停了一下，門外的霧有一半被吸進罐子裡，罐子裡的光點多了一顆。剩下的霧散了，門口只留下一串很淺的腳印。
      fx: {flag: [ignored_fog, fog_jarred], xp: 10}
  dr_fog_again:
    - label: 打開那罐霧，讓它進去
      desc: 罐子裡的霧在轉
      need: {has: {wuguan: 1}}
      text: 你打開果醬罐。霧裡那個聲音說到一半就被吸了進去，罐子變得很冰。你蓋上蓋子，聽見裡面很小聲地，又叫了你一次。
      fx: {flag: [fog_two_done, fog_jarred], xp: 10}
  se_bad_pill:
    - label: 把玻璃蕨葉放在藥丸旁邊
      desc: 蕨葉碰到不對的東西會響
      need: {has: {boliye: 1}}
      text: 你把玻璃蕨葉放在藥丸旁邊。葉子自己響了，響得很急。你把整罐倒掉，倒進水溝的時候，水變成了灰色。
      fx: {stones: -5, rep: {loose: 1}, xp: 6}
  dr_frost_night:
    - label: 把倒雨罐放在窗台
      desc: 罐子裡的雨會往上落
      need: {has: {daoyu: 1}}
      text: 你把倒雨罐放在窗台。罐子裡的雨往上落，落到窗戶上，把剛結的霜一道一道沖掉。你睡得很好，早上起來身體很輕。
      fx: {flag: [frost_closed], burden: -1, xp: 8}
  dr_overtime_due:
    - label: 用空號鉛筆把名字改掉
      desc: 加班單上負責人那一格
      need: {has: {qianbi: 1}}
      text: 你用那支空號鉛筆，把加班單上你的名字改成一個空格。字一寫上去就不見了。門口的霧等了一會兒，像在等一個不存在的人，然後散了。鉛筆也短了一截，短到不能再寫。
      fx: {take: [{item: qianbi, qty: 1}], flag: [overtime_done, overtime_void]}

patchSpots:
  no_shell_sit: {deathUnless: {flag: [shell_fed]}, saved: 殼的裂縫已經合起來了，你鑽不進去。你坐在殼旁邊，靠著它休息了一下，它是溫的。}
  ls_return: {deathUnless: {flag: [lamp_on_time]}, saved: 那盞燈已經準時了，燈座上沒有缺口。小孩把碎片推回你手裡：「不用了，這盞燈有人提醒了。」}
  pf_wait: {deathUnless: {flag: [zhanwu_returned]}, saved: 車進站了，門打開，站務室的人探出頭來看了你一眼：「寄存的已經領走了。你不在名單上。」門關上，車開走了。}
  pf_yellow: {deathUnless: {flag: [broadcast_fixed]}, saved: 廣播說：「請旅客回到地面。」你踩過黃線，什麼都沒有發生，只有腳底下的票根，全部是翻過來的。}

# ═════════════ 遺物不是鑰匙（總監＋Grok 第四輪）═════════════
# pairs：庫房同時有這一對，隔天早上出一張卡（一對一次）。只給小獎勵，不給新東西。
# attract：遺物在庫房放滿 days 天，自己引來一件事。
# thresholds：見過的遺物總數到門檻，各出一張卡。
reactions:
  pairs:
    - id: pair_fern_shell
      a: boliye
      b: xianbei
      title: 葉子鹹了
      text: 玻璃蕨葉跟貝殼放在同一格，隔天早上，葉子鹹了。來買東西的那個孩子用指甲刮了一點下來，刮完也不解釋，把鹽抹在自己舌尖上。
      fx: {xp: 4}
    - id: pair_clock_ticket
      a: wuzhen
      b: chepiao
      title: 不上車的人
      text: 無底月台那邊，聽說多了一個不上車的人。他今天來店裡，不問幾點。他問你那張末班車車票，是你自己留的，還是別人塞給你的。
      fx: {xp: 5}
    - id: pair_pencil_book
      a: qianbi
      b: bijiben
      title: 多了一個號
      text: 你沒有動筆。可是筆記本上多了一個號碼。林老師拿去看了很久，對著空教室叫了一聲。沒有人應。
      fx: {xp: 5, rel: {lin: 1}}
    - id: pair_fog_rain
      a: wuguan
      b: daoyu
      title: 罐子裡在下雨
      text: 一罐霧跟倒雨罐放在一起，隔天早上，兩個罐子的內壁都是濕的。霧那一罐，看得見很細的雨絲，從下往上飄。茶館的人說，今天外面一滴雨都沒有。
      fx: {xp: 4}
  attract:
    - id: att_wuguan
      item: wuguan
      days: 3
      title: 霧比你先到
      text: 霧比你先到。茶館那位常客今天特別早，沒有敲門，站在門口說，今天的雨聞起來，像你庫房裡那個罐子。
      fx: {xp: 3}
    - id: att_budeng
      item: budeng
      days: 2
      title: 只站著的客人
      text: 入夜以後，燈泡在櫃上亮著。燈街來的客人進門，什麼都不買，只是站著。他把手靠近玻璃，像在確認這盞燈，還沒學會熄。
      fx: {xp: 3}
    - id: att_chanke
      item: chanke
      days: 2
      title: 來聽第二次
      text: 黃昏的時候，蟬殼輕輕響了一下。北邊礦上的人把安全帽摘下來，說他不是來賣東西的，是來聽第二次。
      fx: {xp: 4, burden: -1}
    - id: att_qianshi
      item: qianshi
      days: 2
      need: {flag: [tea_story_heard]}
      title: 這句他不念了
      text: 你把籤詩拿給茶館的說書人看。他把籤折好還你，說這一句他不念了。下午長生當鋪的老闆路過，開口說話，比平常輕。
      fx: {xp: 4, rel: {bai: 1}}
  thresholds:
    - id: rth_15
      n: 15
      title: 庫房開始有聲音
      text: 見過的遺物，有十五件了。晚上關店以後，庫房偶爾會有一點聲音，像很多人在不同的房間裡，同時把東西放下。
      fx: {xp: 5}
    - id: rth_30
      n: 30
      title: 有人來數
      text: 第三十件。一大早有個穿舊制服的人站在庫房門口，一件一件地數，數完在本子上打勾，什麼都沒拿就走了。你不知道他是哪一邊的人。
      fx: {xp: 8}
    - id: rth_45
      n: 45
      title: 廣播念到了那個號碼
      text: 第四十五件。那天晚上，你在收音機裡聽到末班車的廣播。廣播念了一串號碼，是空號鉛筆寫出來的那一串。念完以後，廣播說：「請持有人，回到地面。」
      fx: {xp: 10}
      alt:
        unlessSeen: qianbi
        text: 第四十五件。那天晚上，你在收音機裡聽到末班車的廣播。廣播念了一串號碼，念得很慢，像在等誰應。念完以後，廣播說：「請持有人，回到地面。」

  b_lampcharm: {name: 霜華的編繩, desc: 開張就知道盲婆婆認得三回結（謎題簿會先記下來）。, flag: lamp_hint, stones: 50}
  b_oxygen: {name: 呼吸袋, desc: 開張就有舊時代的呼吸袋（負擔上限＋2）。, gear: oxygen}
  b_harness: {name: 下降吊帶, desc: 開張就有下降吊帶。, gear: harness}
  b_rope: {name: 安全繩, desc: 開張就有安全繩。, gear: rope}
  b_headlamp: {name: 頭燈, desc: 開張就有頭燈。, gear: headlamp}
  b_bag: {name: 防水採集袋, desc: 開張就有防水採集袋。, gear: bag}
  b_sign: {name: 新招牌, desc: 開張時招牌已經重新上漆。, upg: sign}
  b_shelf: {name: 加釘的貨架, desc: 開張時貨架已經加好（多一個夥計名額）。, upg: shelf}

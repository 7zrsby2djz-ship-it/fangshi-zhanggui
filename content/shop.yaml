bonuses:
  b_stones: {name: 你爸藏的私房錢, desc: 開張時多一百靈石。, stones: 100}
  b_capital: {name: 老客人的周轉金, desc: 開張時多兩百五十靈石。, stones: 250}
  b_life: {name: 當鋪的人情, desc: 開張時壽命多兩個月。, lifespan: 2}
  b_fushi: {name: 不沉的石頭, desc: 開張就帶著一顆。水不會留你。, give: fushi}
  b_lengyu: {name: 冷羽毛, desc: 開張就帶著一根。霜會先往羽毛爬。, give: lengyu}
  b_huishi: {name: 回聲石, desc: 開張就帶著一顆。回聲會先找它講話。, give: huishi}

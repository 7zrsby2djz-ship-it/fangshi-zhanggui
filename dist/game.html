<title>坊市掌櫃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one phone column. A sticky "abacus strip" on top (day, hour track, stones, cultivation, spirit sense, stance);
   the day's work scrolls below; a fixed thumb bar at the bottom carries either the four ledgers or the deal actions.
   Paper is celadon-grey like an old account book; ink is green-black; cinnabar is reserved for seals and warnings. */
:root{
  --ground:#E4EAE4;
  --sheet:#F6F8F3;
  --ink:#1C2727;
  --ink-2:#56655F;
  --rule:#C3CEC6;
  --cinnabar:#B3362A;
  --jade:#2C6A5C;
  --gold:#8E6E22;
  --wash:rgba(44,106,92,.08);
  --shade:rgba(28,39,39,.06);
  --seal-blend:multiply;

  --serif:"Noto Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
  --talk:"LXGW WenKai TC","Kaiti TC","BiauKai","STKaiti",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;
  --barh:120px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1615; --sheet:#172120; --ink:#E0E8E3; --ink-2:#92A39D; --rule:#2B3936;
    --cinnabar:#E3624F; --jade:#74BCA7; --gold:#D3B05B; --wash:rgba(116,188,167,.10); --shade:rgba(224,232,227,.05);
    --seal-blend:normal; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0F1615; --sheet:#172120; --ink:#E0E8E3; --ink-2:#92A39D; --rule:#2B3936;
  --cinnabar:#E3624F; --jade:#74BCA7; --gold:#D3B05B; --wash:rgba(116,188,167,.10); --shade:rgba(224,232,227,.05);
  --seal-blend:normal; color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font:15px/1.65 var(--sans);-webkit-text-size-adjust:100%;text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--barh) + 24px);overflow-x:clip}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.serif{font-family:var(--serif)}
.cin{color:var(--cinnabar)}
.jade{color:var(--jade)}
.gold{color:var(--gold)}
.label{font-size:11.5px;letter-spacing:.14em;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sec-h{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.12em;color:var(--ink-2);margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.sec-h::after{content:"";flex:1;border-bottom:1px solid var(--rule);transform:translateY(-4px)}

/* ---------- buttons ---------- */
.btn{min-height:46px;border-radius:10px;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);font-weight:600;font-size:15px;padding:6px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.25;min-width:0;text-align:center}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.jade{background:var(--jade);border-color:var(--jade);color:var(--sheet)}
.btn.quiet{border-color:var(--rule);font-weight:500}
.btn.ghost{border-color:transparent;background:transparent;font-weight:500;color:var(--ink-2)}
.btn:disabled{opacity:.36;cursor:default}
.btn .sub{font-size:11.5px;font-weight:500;opacity:.8;font-variant-numeric:tabular-nums}
.btn.col{flex-direction:column;gap:0}
.btn.wide{width:100%}

/* ---------- HUD ---------- */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);margin-inline:-16px;padding:10px 16px 8px;border-bottom:1px solid var(--rule)}
#hud[hidden]{display:none}
.hud-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hud-day{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:.06em;white-space:nowrap}
.hud-day .tagline{font-size:12px;font-weight:500;color:var(--cinnabar);letter-spacing:.1em;margin-left:6px}
.track{display:flex;gap:4px}
.track span{font-family:var(--serif);font-size:12px;width:26px;height:22px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:4px;color:var(--ink-2)}
.track span.past{background:var(--shade);color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--rule)}
.track span.now{border-color:var(--jade);color:var(--jade);font-weight:700;background:var(--wash)}
.hud-stats{display:flex;align-items:center;gap:4px 10px;margin-top:6px;font-size:12.5px;flex-wrap:wrap}
.hud-stats b{font-size:16px;font-variant-numeric:tabular-nums}
.stone b{color:var(--gold)}
.xpbar{display:inline-block;width:34px;height:5px;border-radius:3px;background:var(--rule);vertical-align:middle;margin-left:4px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--jade)}
.dots{letter-spacing:0;color:var(--jade);font-size:11px}
.dots s{text-decoration:none;color:var(--rule)}
.stance{margin-left:auto;display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.stance button{border:0;background:transparent;padding:3px 8px;font-size:12px;color:var(--ink-2)}
.stance button.on{background:var(--ink);color:var(--sheet)}

/* ---------- title ---------- */
.title{padding-block:36px 20px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}
.title-v{writing-mode:vertical-rl;font-family:var(--serif);font-weight:900;font-size:clamp(54px,16vw,78px);line-height:1.05;letter-spacing:.12em;margin:0;justify-self:end}
.title-v small{display:block;font-size:.26em;font-weight:500;letter-spacing:.4em;color:var(--ink-2);margin-top:.6em}
.ticket{border:1px solid var(--rule);background:var(--sheet);padding:14px 14px 12px;border-radius:4px;position:relative;font-family:var(--serif);box-shadow:0 1px 0 var(--rule)}
.ticket .label{font-family:var(--sans)}
.ticket p.q{font-size:15px;line-height:1.9;margin-top:6px}
.ticket .left{margin-top:10px;font-size:22px;font-weight:700;color:var(--cinnabar);letter-spacing:.06em}
.ticket .seal{position:absolute;right:10px;bottom:10px;width:50px;height:50px;mix-blend-mode:var(--seal-blend);opacity:.9}
.lede{font-size:15px;line-height:1.9;margin-top:4px}
.title-actions{display:grid;gap:10px;margin-top:22px}

/* ---------- cards & lists ---------- */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px}
.newscard{padding-block:12px;border-bottom:1px dashed var(--rule);display:grid;gap:4px}
.newscard:last-child{border-bottom:0}
.newscard .src{font-size:12px;letter-spacing:.1em;color:var(--ink-2)}
.newscard .txt{font-family:var(--serif);font-size:16px;line-height:1.75}
.newscard .meta{font-size:12.5px;color:var(--ink-2)}
.event{border:1px solid var(--cinnabar);border-radius:12px;padding:12px 14px;background:var(--sheet)}
.event h3{font-family:var(--serif);font-size:15px;color:var(--cinnabar);letter-spacing:.08em;margin-bottom:4px}
.event p{font-family:var(--serif);line-height:1.8}
.event .fxline{font-size:12.5px;color:var(--ink-2);margin-top:6px}

.choice{display:grid;grid-template-columns:1fr;gap:10px}
.go{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--ink);background:var(--sheet);width:100%}
.go .gt{font-family:var(--serif);font-weight:700;font-size:17px}
.go .gd{font-size:13px;color:var(--ink-2);line-height:1.5}
.go .arrow{margin-left:auto;font-size:18px;color:var(--ink-2)}
.go:disabled{opacity:.4}
.go.quiet{border-color:var(--rule)}
.places{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.place{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:10px 12px;text-align:left;display:grid;gap:2px;min-width:0}
.place b{font-family:var(--serif);font-size:15px}
.place span{font-size:12px;color:var(--ink-2);line-height:1.45}
.place:disabled{opacity:.38}
.pill{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.pill.cin{border-color:var(--cinnabar);color:var(--cinnabar)}
.pill.jade{border-color:var(--jade);color:var(--jade)}

/* ---------- encounter ---------- */
.who{display:flex;align-items:flex-start;gap:12px;padding-top:14px}
.who .nm{font-family:var(--serif);font-weight:900;font-size:24px;line-height:1.2;letter-spacing:.04em}
.who .rl{font-size:13px;color:var(--ink-2)}
.who .lv{font-size:12.5px;margin-top:2px}
.tea{margin-left:auto;display:grid;justify-items:center;gap:0;min-width:56px}
.tea svg{width:44px;height:44px}
.tea span{font-family:var(--serif);font-size:12.5px;letter-spacing:.2em}
.goods{margin-top:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:12px 14px;position:relative;overflow:hidden}
.goods::before,.goods::after{content:"";position:absolute;left:10px;right:10px;border-top:1px solid var(--rule)}
.goods::before{top:4px}.goods::after{bottom:4px}
.goods .g-name{font-family:var(--serif);font-weight:700;font-size:19px}
.goods .g-grade{font-size:12px;color:var(--ink-2);letter-spacing:.08em}
.goods .g-price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px}
.goods .g-price b{font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums}
.goods .g-mkt{font-size:12.5px;color:var(--ink-2)}
.g-link{border:0;background:none;padding:0;color:var(--jade);font-size:13px;text-decoration:underline;text-underline-offset:3px;text-align:left;font-family:var(--serif);font-weight:600}
.goods .g-link{margin-top:8px;font-family:var(--sans);font-weight:400}
.goods.done{padding-right:104px}
.lotpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lotpick button{border:1px solid var(--rule);background:var(--ground);border-radius:8px;padding:4px 8px;font-size:12.5px}
.lotpick button.on{border-color:var(--ink);background:var(--sheet);font-weight:600}
.seal-stamp{position:absolute;right:10px;top:50%;margin-top:-44px;width:88px;height:88px;mix-blend-mode:var(--seal-blend);pointer-events:none;animation:press .32s cubic-bezier(.2,1.6,.4,1) both}
@keyframes press{from{transform:scale(1.5) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:.92}}
.tbl .g-link{font-size:14.5px;color:var(--ink);text-decoration-color:var(--rule)}
@media (prefers-reduced-motion: reduce){.seal-stamp{animation:none;transform:rotate(-8deg);opacity:.92}}

.thread{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.ln{display:grid;gap:2px;max-width:92%}
.ln .sp{font-size:11.5px;letter-spacing:.12em;color:var(--ink-2)}
.ln .tx{font-family:var(--talk);font-size:17px;line-height:1.7}
.ln.me{align-self:flex-end;text-align:right}
.ln.me .tx{font-family:var(--sans);font-size:14.5px;color:var(--ink-2)}
.ln.narr{max-width:100%}
.ln.narr .tx{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);line-height:1.8}
.ln.tell .tx{font-family:var(--serif);font-size:14.5px;color:var(--jade);line-height:1.8}
.ln.sys{max-width:100%;border:1px solid var(--rule);border-radius:10px;padding:8px 12px;background:var(--wash)}
.ln.sys .tx{font-family:var(--serif);font-size:14.5px;line-height:1.8}
.ln.res{max-width:100%;border-top:1px solid var(--rule);padding-top:10px}
.ln.res .tx{font-family:var(--serif);font-size:15.5px;line-height:1.85}

/* ---------- bottom bar ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ground);border-top:1px solid var(--rule);padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
#bar[hidden]{display:none}
.bar-in{max-width:560px;margin:0 auto;display:grid;gap:8px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.acts .btn{min-height:44px;font-size:14.5px;padding:4px 6px}
.decide{display:grid;grid-template-columns:1.4fr 1fr;gap:6px}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.nav button{border:0;background:transparent;padding:6px 0 2px;font-family:var(--serif);font-size:14px;color:var(--ink-2);border-radius:8px;min-height:40px}
.nav button.on{color:var(--ink);font-weight:700;background:var(--sheet);box-shadow:inset 0 -2px 0 var(--jade)}
.nav button em{font-style:normal;display:block;font-size:10.5px;font-family:var(--sans);letter-spacing:.1em;opacity:.8}

/* ---------- sheet ---------- */
.veil{position:fixed;inset:0;background:rgba(10,16,15,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ground);width:100%;max-width:560px;max-height:84vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule)}
.sheet h2{font-family:var(--serif);font-size:20px;margin-bottom:4px}
.opt{display:grid;gap:2px;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--ink);border-radius:12px;background:var(--sheet);margin-top:8px}
.opt b{font-family:var(--serif);font-size:16px}
.opt span{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.opt:disabled{opacity:.4}
.opt.danger{border-color:var(--cinnabar)}
.lore{font-family:var(--serif);font-size:16px;line-height:1.95}
.lore-stat{font-size:12.5px;color:var(--ink-2);letter-spacing:.04em;border-block:1px solid var(--rule);padding-block:6px;margin-block:8px 10px}
.hidden-line{margin-top:10px;padding-top:8px;border-top:1px dashed var(--rule);font-family:var(--serif);font-size:15px;line-height:1.85}
.hidden-line .label{display:block;color:var(--jade)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:500;font-size:11.5px;letter-spacing:.1em;color:var(--ink-2);text-align:left;padding:6px 4px;border-bottom:1px solid var(--rule)}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .nm{font-family:var(--serif);font-weight:600}
.up{color:var(--cinnabar)} .down{color:var(--jade)}
.tbl-wrap{overflow-x:auto}

/* ---------- people & codex ---------- */
.person{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.person .ph{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.person .ph b{font-family:var(--serif);font-size:18px}
.person ul{margin:0;padding-left:1.1em;font-size:13.5px;line-height:1.7}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags button{border:1px solid var(--rule);background:var(--ground);border-radius:999px;padding:2px 10px;font-size:12.5px}
.tags button.on{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
textarea{width:100%;min-height:52px;border:1px solid var(--rule);border-radius:8px;background:var(--ground);color:var(--ink);font:14px/1.6 var(--sans);padding:6px 8px;resize:vertical}
.codex{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.codex button{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:10px;text-align:left;display:grid;gap:2px;min-width:0}
.codex button b{font-family:var(--serif);font-size:15px}
.codex button span{font-size:11.5px;color:var(--ink-2)}
.codex button.lock{opacity:.45}

/* ---------- night & end ---------- */
.night{padding-top:18px}
.night h2{font-family:var(--serif);font-size:24px;letter-spacing:.08em}
input[type=range]{width:100%;accent-color:var(--jade)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
.check input{margin-top:4px;accent-color:var(--jade);width:18px;height:18px}
.big-num{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--serif)}
.grade{font-family:var(--serif);font-weight:900;font-size:44px;color:var(--cinnabar);letter-spacing:.1em}
.truth{display:grid;gap:4px;padding:10px 0;border-bottom:1px dashed var(--rule)}
.truth b{font-family:var(--serif);font-size:15.5px}
.truth .t3{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--barh) + 14px);z-index:35;background:var(--ink);color:var(--sheet);padding:8px 14px;border-radius:999px;font-size:13.5px;max-width:88vw;text-align:center}

/* ---------- v0.2: intel ledger, market day, notes ---------- */
.nav{grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button.new em{color:var(--cinnabar);opacity:1}
.ln.note{max-width:100%;align-self:center}
.ln.note .tx{font-family:var(--sans);font-size:12px;letter-spacing:.08em;color:var(--jade);border:1px dashed var(--jade);border-radius:999px;padding:1px 10px}
.place.hot{border:1.5px solid var(--cinnabar)}
.place.hot b em{font-style:normal;font-family:var(--sans);font-size:11px;color:var(--cinnabar);border:1px solid var(--cinnabar);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:2px}
.intels{display:grid}
.intel{padding:10px 0;border-bottom:1px dashed var(--rule);display:grid;gap:4px}
.intel:last-child{border-bottom:0}
.intel .it{font-family:var(--serif);font-size:15px;line-height:1.75}
.intel .im{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.opt .it{font-family:var(--serif);font-size:13.5px;color:var(--ink);line-height:1.6}
.evid{margin:4px 0 0;padding-left:1.2em;font-size:14px;line-height:1.8;font-family:var(--serif)}
details summary{cursor:pointer}
.tbl tr.tap{cursor:pointer}
.tbl tr.tap td:first-child{text-decoration:none}
.lesson summary{font-size:12.5px;color:var(--jade);margin-top:2px}
.lesson p{font-family:var(--serif);font-size:14px;line-height:1.85;margin-top:4px}
.t3{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- ink icons ---------- */
.ico{width:34px;height:34px;flex:none;color:var(--ink);vertical-align:middle}
.ico.sm{width:22px;height:22px;margin-right:4px}
.ico.lg{width:52px;height:52px}
.goods .g-name{display:flex;align-items:center;gap:10px}
.g-link.ilink{display:inline-flex;align-items:center;gap:2px}
.codex button{grid-template-columns:auto 1fr;column-gap:8px;align-items:center}
.codex button .ico{grid-row:span 2;width:32px;height:32px}
.codex button.lock{grid-template-columns:1fr}
.lore-h{display:flex;align-items:center;gap:10px}
.tbl .nm .ico.sm{margin-right:2px}

/* ---------- ink portraits ---------- */
.face{flex:none;color:var(--ink)}
.face.big{width:64px;height:75px;margin-right:2px;margin-top:-4px}
.face.tiny{width:20px;height:23px;vertical-align:-6px;margin-right:4px}
.ln.me .face.tiny{align-self:flex-end}
.ln.me{display:flex;align-items:flex-start;gap:4px;justify-content:flex-end}
.event.withface{position:relative;padding-right:64px}
.face.evface{position:absolute;right:8px;top:10px;width:48px;height:56px}
.hud-day small.mon{font-size:12px;font-weight:500;color:var(--ink-2);margin-right:6px;letter-spacing:.08em}

</style>
<main class="wrap">
  <header id="hud" hidden></header>
  <div id="app" aria-live="polite"></div>
</main>
<div id="bar" hidden></div>
<div id="sheet" hidden></div>
<script>
(() => {
'use strict';
/* ================= data ================= */

年還會不會來看燈。"}},"endings":{"top":"這個月，你看穿的比被騙的多。長生典的字條準時塞進門縫：「許先生，尚餘一年又五個月。」你把字條摺好，壓在那本缺頁的帳冊底下。","mid":"規費繳了，店還開著。長生典的字條準時塞進門縫：「許先生，尚餘一年又五個月。」日子還長，也不長。","low":"老錢替你墊了規費。他走的時候，在門口多站了一會兒，看了看店門口的招牌。長生典的字條準時塞進門縫：「許先生，尚餘一年又五個月。」","lowFooled":"這個月，你被騙的次數比你看穿的多。庫房裡堆著賣不出去的東西，有的金線是畫的，有的一沾水就化。長生典的字條準時塞進門縫：「許先生，尚餘一年又五個月。」","teasers":[{"need":{"flag":["gave_knife"]},"text":"余小七抱著刀走之前，回頭說了一句：「老闆，刀柄的繩尾，是被割斷的。我哥說過，割繩，就是還活著。」"},{"need":{"flag":["zhou_warned"]},"text":"周正燒掉的那頁紙，你還記得上面每一個字。他說，你爹當年，帳翻得太勤。"},{"need":{"flag":["yao_closed"]},"text":"姚四沒有再來過許衡的店。你爹的事，他知道的，比他說過的多。"},{"need":{"flag":["ahe_taken"],"not":["aheng_taken"]},"text":"阿蘅的屋子空了。住家區的人說，她去鬼市找過人，一個人去的。"},{"need":{"flag":["sold_info_pkg"]},"text":"白七娘說替你壓著的那則消息，還在她的算盤底下。她沒說要壓多久。"},{"need":{"flag":["xuechan_sold_qian"]},"text":"老錢被罰之後，逢人便說是有人害他。他沒說是誰，只是每天早上開門，第一眼看的是許衡的店。"},{"need":{"flag":["scar_grudge"]},"text":"門板上那道刀痕，你沒有刨掉。"},{"need":{"flag":["daoren_caught"]},"text":"那個道士袖子裡的三枚玉簡，周正說，是從同一個地方批來的。批貨的人，就在坊市裡。"},{"need":{"flag":["gave_tie_lingsui"]},"text":"鐵師傅的爐子，這幾天夜裡都沒熄。牆上那把二十年沒開刃的刀胚，不見了。"},{"need":{"flag":["lost_big_deal"]},"text":"阿福說的那筆大生意，錢記接了。"},{"need":{"flag":["passed_test"],"not":["lost_big_deal"]},"text":"阿福說，下個月資源組織有一筆大生意。周正記得你退回去的那四十五塊。"},{"need":{"flag":["aheng_entrust"],"not":["betrayed_aheng","aheng_leak"]},"text":"阿蘅說她信你一次。坊市裡，肯信人一次的人不多。"}],"next":"下個月：寒潭宗開始追查失物，鬼市的門對你半開，老錢的笑容沒有變。","m2":{"top":"這個月，坊市裡的人開始知道，許記的掌櫃不好騙。長生典的字條準時塞進門縫：「許公子，尚餘{left}。」你把它跟那幾頁帳紙壓在一起。","mid":"規費繳了，鋪子還開著。長生典的字條準時塞進門縫：「許公子，尚餘{left}。」十二年前的帳，還差幾筆。","low":"錢不語又在門口站了一會兒，看著許記的招牌。長生典的字條準時塞進門縫：「許公子，尚餘{left}。」","lowFooled":"這個月，你被騙的比看穿的多。長生典的字條準時塞進門縫：「許公子，尚餘{left}。」","next":"第三個月，還在寫。","teasers":[{"need":{"flag":["mang_told_mother"]},"text":"盲婆婆說，你娘走的那年，不是你們說的那樣。她說下個月，要帶你去一個地方。"},{"need":{"flag":["got_pages"],"not":["mang_told_mother"]},"text":"帳紙上寫著：「要是出事，帶衡兒去找她師姐。」你娘的師姐，在坊市裡等了你十二年——你還不知道是誰。"},{"need":{"flag":["scar_caught"]},"text":"疤臉在執事堂只說了一句話：「玉匣不是我要的。是有人出錢，要那個弟子回不了宗門。」"},{"need":{"flag":["xiaoliu_truth"],"not":["scar_caught"]},"text":"   const grid = keys.map(k => S.codex[k] ? `<button data-act="lore" data-id="${k}">${icon(k)}<b>${esc(IT[k].name)}</b><span>${esc(IT[k].grade)}${unlockedHidden(k).length ? '　·　隱藏句 ' + unlockedHidden(k).length : ''}</span></button>` : `<button class="lock" disabled><b>？？？</b><span>未見過</span></button>`).join('');
  const kz = Object.entries(D.kaozheng).filter(([, v]) => needOk(v.need)).map(([, v]) => `<div class="card" style="margin-top:8px"><b class="serif">${esc(v.title)}</b><p class="lore" style="margin-top:6px">${esc(v.text)}</p></div>`).join('');
  return `<h2 class="sec-h">圖鑑　${seen.length}／${keys.length}</h2><div class="codex">${grid}</div>${kz ? `<h2 class="sec-h">考據</h2>${kz}` : ''}`;
}
function unlockedHidden(k) { return (IT[k].hidden || []).filter(h => (h.need.realm && S.level >= h.need.realm) || (h.need.flag && S.flags[h.need.flag])); }

function renderSheet() {
  const sh = UI.sheet; if (!sh) { $sheet.hidden = true; $sheet.innerHTML = ''; return; }
  let h = '';
  if (sh.type === 'news') h = `<h2>報紙</h2>${newsHTML(sh.id)}`;
  else if (sh.type === 'oppreturn') h = `<h2>韓九的回報</h2><p>${esc(OP.report)}</p>`;
  else if (sh.type === 'legacyfiles') h = `<h2>原版存檔</h2><p>把原版匯出的JSON貼在下面。先匯出目前原檔，再匯入其他進度；匯入不會改新故事進度。</p><textarea id="legacy-json" rows="8" style="width:100%">${esc(sh.raw)}</textarea><button class="btn quiet" data-act="legacyexport">匯出目前原版JSON</button><button class="btn primary" data-act="legacyimport">匯入貼上的原版JSON</button>`;
  else if (sh.type === 'lore') {
    const it = IT[sh.id]; S.codex[sh.id] = true;
    h = `<span class="label">${esc(it.grade)}</span><h2 class="lore-h">${icon(sh.id, 'lg')}<span>${esc(it.name)}</span></h2><div class="lore-stat">${esc(it.stat)}${it.base && it.base < 100 ? `　·　今日市價 ${fmt(price(sh.id))}` : ''}</div><div class="lore">${esc(it.text)}</div>${unlockedHidden(sh.id).map(x => `<div class="hidden-line"><span class="label">${esc(x.label)}</span>${esc(x.text)}</div>`).join('')}`;
  } else if (sh.type === 'verify') {
    h = `<h2>查證</h2><p class="small muted">去找人問一問，會花掉一個時段。對方會等你，但第三方也有自己的立場。</p>` + verifyList().map(v => `<button class="opt" data-act="verifyw" data-id="${v.who}" ${v.used || (v.cost && S.stones < v.cost) ? 'disabled' : ''}><b>${esc(NP[v.who].name)}</b><span>${esc(NP[v.who].role)}${v.cost ? `　·　${v.cost} 靈石` : '　·　不收錢'}${v.used ? '　·　問過了' : ''}</span></button>`).join('');
  } else if (sh.type === 'decide') {
    h = `<h2>處置</h2>` + encOptions().map(o => `<button class="opt ${o.key === 'expose' || o.key === 'report' ? 'danger' : ''}" data-act="decide" data-k="${o.key}" ${o.disabled ? 'disabled' : ''}><b>${esc(o.label)}</b><span>${esc(o.desc || '')}</span></button>`).join('');
  } else if (sh.type === 'askbai') {
    const ps = Object.keys(S.met).filter(n => NP[n] && !NP[n].oneoff && n !== 'bai').concat(['bai']);
    h = `<h2>問白七娘</h2><p class="small muted">每問一個人 ${PL.tea.askCost} 塊靈石。</p>` + ps.map(n => `<button class="opt" data-act="baiwho" data-id="${n}"><b>${esc(NP[n].name)}</b><span>${esc(NP[n].role)}</span></button>`).join('');
  } else if (sh.type === 'turnxc') {
    const lot = S.lots.find(l => l.item === 'xuechan');
    h = `<h2>周正問：「從哪收的？」</h2>` + (lot && lot.flags.includes('entrusted') ? `<button class="opt" data-act="turnxcw" data-v="entrust"><b>「阿蘅託我交的。」</b><span>賞錢分她一半</span></button>` : `<button class="opt danger" data-act="turnxcw" data-v="aheng"><b>「採藥的阿蘅。」</b><span>說實話</span></button><button class="opt" data-act="turnxcw" data-v="other"><b>「一個路過的散修。」</b><span>他不一定信</span></button>`);
  } else if (sh.type === 'stall') {
    const ls = S.lots.filter(l => IT[l.item].base && !protectedLot(l) && (IT[l.item].sell || []).includes('walk') && !l.flags.some(f => ['sect', 'sting', 'contraband'].includes(f)));
    const pick = UI.stallPick || [];
    h = `<h2>擺攤</h2><p class="small muted">最多三批。照今日市價九五折賣出，成色差的貨，第二天可能有人回來退。</p>` + (ls.length ? ls.map(l => `<label class="check" style="margin-top:8px"><input type="checkbox" data-stall="${l.id}" ${pick.includes(l.id) ? 'checked' : ''} ${!pick.includes(l.id) && pick.length >= 3 ? 'disabled' : ''}><span>${esc(l.label)} ${quantityText(l.item, l.qty)}<br><span class="small muted">約 ${fmt(moneyFor(l.item, rp(price(l.item) * 0.95), l.qty))} 靈石</span></span></label>`).join('') + `<button class="btn primary wide" style="margin-top:12px" data-act="stallgo" ${pick.length ? '' : 'disabled'}>擺出去</button>` : '<p class="muted">沒有可以擺的貨。</p>');
  } else if (sh.type === 'sellintel') {
    const ids = Object.keys(S.intel).filter(i => IN[i]).map(i => ({ i, o: intelOffer(i) })).sort((a, b) => b.o.price - a.o.price);
    h = `<h2>賣消息給白七娘</h2><p class="small muted">今天還收 ${2 - (S.baiSold[S.day] || 0)} 則。</p>` + (ids.length ? ids.map(({ i, o }) => `<button class="opt" data-act="sellintel" data-id="${i}" ${o.price || o.refuse ? '' : 'disabled'}><b>${esc(IN[i].short)}</b><span class="it">${esc(IN[i].text)}</span><span>${o.price ? `白七娘出 <b class="gold">${o.price}</b> 靈石` : esc(o.why)}</span></button>`).join('') : '<p class="muted" style="margin-top:8px">消息簿裡還沒有能賣的東西。</p>');
  } else if (sh.type === 'accuse') {
    const a = ACC.find(x => x.id === sh.id), had = evidenceHad(a);
    h = `<h2>${esc(a.label)}</h2><p class="small muted" style="margin-top:6px">你手上的證據：</p>${had.length ? `<ul class="evid">${had.map(ev => `<li>${esc(ev.text)}</li>`).join('')}</ul>` : '<p class="small" style="margin-top:4px">什麼都沒有。</p>'}<p class="small muted" style="margin-top:8px">告了就收不回來。</p><button class="opt danger" data-act="accusego" data-id="${a.id}"><b>去告</b><span>周正會聽你說完</span></button>`;
  } else if (sh.type === 'stat') {
    const T = { saw: '看穿', fooled: '吃虧', wronged: '錯怪好人' }, TL = M.truthLabels;
    const list = (S.statLog || []).filter(x => x.kind === sh.id && (x.m || 1) === MON());
    h = `<h2>${T[sh.id]}</h2>` + (list.length ? list.map(x => { const d = DEALS[x.deal], t = d.truth; return `<div class="card" style="margin-top:10px"><b class="serif">${esc(NP[d.npc].name + '：' + d.title)}</b><div class="t3" style="margin:6px 0">${['goods', 'origin', 'intent'].map(k => `<span class="pill ${k === 'intent' && t.intent !== 'plain' ? 'cin' : ''}">${esc(TL[k][t[k]])}</span>`).join(' ')}</div><p class="small">${esc(M.dayNames[x.day - 1])}，你選了「${esc(labelOf(x.deal, x.key))}」。${S.flags['won_' + x.deal] ? '後來到派出所告成了，這筆不算吃虧。' : ''}</p>${d.lesson ? `<p class="serif" style="margin-top:6px;line-height:1.85">${esc(d.lesson)}</p>` : ''}</div>`; }).join('') : '<p class="muted">沒有紀錄。</p>');
  } else if (sh.type === 'menu') {
    h = `<h2>選單</h2>${sh.confirm ? `<p class="small">重新開始會清掉這一局。確定嗎？</p><button class="opt danger" data-act="new"><b>確定，重新開始</b><span>這一局會消失</span></button>` : `<button class="opt" data-act="home"><b>回到封面</b><span>進度會保留</span></button><button class="opt" data-act="askrestart"><b>重新開始</b><span>清掉這一局</span></button>`}`;
  }
  $sheet.hidden = false;
  $sheet.innerHTML = `<div class="veil" data-act="closesheet"><div class="sheet" role="dialog" aria-modal="true" data-stop="1">${h}<button class="btn ghost wide" style="margin-top:10px" data-act="closesheet">關上</button></div></div>`;
}

function renderBar() {
  let h = '';
  const nav = () => `<nav class="nav">${[['main', '鋪面', '今天'], ['store', '庫房', '貨與價'], ['intel', '消息', newIntel() ? '有新的' : '簿'], ['people', '人脈', '名聲'], ['codex', '圖鑑', '物品']].map(([k, a, b]) => `<button data-act="tab" data-v="${k}" class="${UI.tab === k ? 'on' : ''}${k === 'intel' && newIntel() ? ' new' : ''}">${a}<em>${b}</em></button>`).join('')}</nav>`;
  if (UI.view === 'title') { $bar.hidden = true; return; }
  if (UI.tab !== 'main') h = nav();
  else if (S.phase === 'morning') h = `<button class="btn primary wide" data-act="open">開門</button>` + nav();
  else if (S.phase === 'enc') {
    const e = S.enc;
    if (e.scene) h = monthOneBarHTML();
    else if (e.opportunity) h = opportunityBarHTML();
    else if (e.done) h = `<button class="btn primary wide" data-act="close">繼續</button>`;
    else if (e.generic) {
      const opts = encOptions();
      h = `<div class="acts"><button class="btn quiet col" data-act="chat" ${canAct('chat') ? '' : 'disabled'}>閒聊</button><button class="btn quiet col" data-act="haggle" ${canAct('haggle') ? '' : 'disabled'}>加價</button><button class="btn quiet col" data-act="decidesheet">處置…</button></div>`;
      const p = opts.find(o => o.primary);
      h += `<div class="decide">${p ? `<button class="btn jade col" data-act="decide" data-k="${p.key}">${esc(p.label)}<span class="sub">${esc(p.desc)}</span></button>` : ''}<button class="btn quiet" data-act="decide" data-k="decline" ${p ? '' : 'style="grid-column:1/-1"'}>${p ? '不賣' : '送客'}</button></div>`;
    } else {
      const d = DEALS[e.deal];
      const hag = d.side === 'buy' ? '加價' : d.side === 'task' ? '加錢' : '殺價';
      const b = (a, t, sub) => `<button class="btn quiet col" data-act="${a}" ${canAct(a) ? '' : 'disabled'}>${t}${sub ? `<span class="sub">${sub}</span>` : ''}</button>`;
      h = `<div class="acts">${b('ask', '問來歷')}${b('press', '追問', d.press ? `${d.press.length - e.press}` : '')}${b('haggle', hag)}${b('silence', '沉默')}${b('appraise', '鑑定', '靈識')}${b('verify', '查證', S.slot >= 2 ? '來不及' : '一個時段')}</div>`;
      const opts = encOptions(); const p = opts.find(o => o.primary && !o.disabled);
      h += `<div class="decide">${p ? `<button class="btn jade col" data-act="decide" data-k="${p.key}">${esc(p.label)}<span class="sub">${esc(p.desc)}</span></button>` : ''}<button class="btn primary" data-act="decidesheet" ${p ? '' : 'style="grid-column:1/-1"'}>${p ? '其他處置…' : '處置…'}</button></div>`;
    }
  } else if (S.phase === 'place' && S.place) h = `<button class="btn primary wide" data-act="leave">離開${esc(PL[S.place.id].name)}</button>` + nav();
  else if (S.phase === 'night') h = S.night ? `<button class="btn primary wide" data-act="sleep">${S.day >= M.days ? '這個月過去了' : '睡覺'}</button>` : `<button class="btn primary wide" data-act="meditate">${UI.night.invest || UI.night.pill ? '打坐' : '不打坐，睡覺'}</button>` + nav();
  else if (S.phase === 'day') h = (S.slot >= 3 ? `<button class="btn primary wide" data-act="evening">關店</button>` : '') + nav();
  else if (S.phase === 'end') h = nav();
  $bar.hidden = false;
  $bar.innerHTML = `<div class="bar-in">${h}</div>`;
  requestAnimationFrame(() => document.documentElement.style.setProperty('--barh', $bar.offsetHeight + 'px'));
}

function render() {
  if (!S) UI.view = 'title';
  renderHUD();
  let h = '';
  if (UI.view === 'title') h = renderTitle();
  else if (UI.tab === 'store') h = renderStore();
  else if (UI.tab === 'people') h = renderPeople();
  else if (UI.tab === 'intel') h = renderIntel();
  else if (UI.tab === 'codex') h = renderCodex();
  else if (S.phase === 'morning') h = renderMorning();
  else if (S.phase === 'day') h = renderHub();
  else if (S.phase === 'enc') h = renderEnc();
  else if (S.phase === 'place') { if (S.place) h = renderPlace(); else { S.phase = 'day'; h = renderHub(); } }
  else if (S.phase === 'night') h = renderNight();
  else if (S.phase === 'end') h = renderEnd();
  $app.innerHTML = h;
  renderBar(); renderSheet();
  if (UI.toast) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = UI.toast; document.body.appendChild(t); UI.toast = null; setTimeout(() => t.remove(), 1800); }
}
function toast(t) { UI.toast = t; }
function save() { if (S && !actionTransaction) { if (S.phase !== 'end') scanLearn(); strictPersist(); } }
function commit(scroll) {
  if (actionTransaction) { UI.pendingScroll = scroll; return; }
  save(); render();
  if (scroll === 'top') window.scrollTo(0, 0);
  if (scroll === 'thread') { const th = document.getElementById('thread'); if (th && th.lastElementChild) th.lastElementChild.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}

const OLD_SAVE_KEY = 'fangshi-p1-v1';
const STORY_VERSION = 'taiwan-m1m2-v1';
const LEGACY_HTML = "\u003ctitle>坊市掌櫃\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@500;700;900&display=swap\">\n\u003cstyle>\n/* Layout: one phone column. A sticky \"abacus strip\" on top (day, hour track, stones, cultivation, spirit sense, stance);\n   the day's work scrolls below; a fixed thumb bar at the bottom carries either the four ledgers or the deal actions.\n   Paper is celadon-grey like an old account book; ink is green-black; cinnabar is reserved for seals and warnings. */\n:root{\n  --ground:#E4EAE4;\n  --sheet:#F6F8F3;\n  --ink:#1C2727;\n  --ink-2:#56655F;\n  --rule:#C3CEC6;\n  --cinnabar:#B3362A;\n  --jade:#2C6A5C;\n  --gold:#8E6E22;\n  --wash:rgba(44,106,92,.08);\n  --shade:rgba(28,39,39,.06);\n  --seal-blend:multiply;\n\n  --serif:\"Noto Serif TC\",\"Songti TC\",\"PMingLiU\",\"Noto Serif CJK TC\",serif;\n  --talk:\"LXGW WenKai TC\",\"Kaiti TC\",\"BiauKai\",\"STKaiti\",serif;\n  --sans:-apple-system,BlinkMacSystemFont,\"PingFang TC\",\"Noto Sans TC\",\"Noto Sans CJK TC\",\"Microsoft JhengHei\",sans-serif;\n  --barh:120px;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --ground:#0F1615; --sheet:#172120; --ink:#E0E8E3; --ink-2:#92A39D; --rule:#2B3936;\n    --cinnabar:#E3624F; --jade:#74BCA7; --gold:#D3B05B; --wash:rgba(116,188,167,.10); --shade:rgba(224,232,227,.05);\n    --seal-blend:normal; color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --ground:#0F1615; --sheet:#172120; --ink:#E0E8E3; --ink-2:#92A39D; --rule:#2B3936;\n  --cinnabar:#E3624F; --jade:#74BCA7; --gold:#D3B05B; --wash:rgba(116,188,167,.10); --shade:rgba(224,232,227,.05);\n  --seal-blend:normal; color-scheme:dark;\n}\n\n*{box-sizing:border-box}\nhtml,body{background:var(--ground)}\nbody{margin:0;co \"nightCap\":30,\"redeemCost\":300,\"months\":{\"2\":{\"marketDay\":4,\"dues\":80,\"duesHigh\":110}},\"startLots\":[{\"item\":\"hantie\",\"qty\":10,\"cost\":8,\"label\":\"寒鐵（你爹留下的）\"},{\"item\":\"dingshen\",\"qty\":1,\"cost\":22,\"label\":\"定神香\"}],\"truthLabels\":{\"goods\":{\"genuine\":\"貨真價實\",\"inferior\":\"以次充好\",\"fake\":\"假貨\",\"flawed\":\"暗傷\",\"undervalued\":\"不識貨\"},\"origin\":{\"clean\":\"來路乾淨\",\"stolen\":\"贓物\",\"contraband\":\"禁物\",\"inheritance\":\"遺物\",\"evidence\":\"證物\"},\"intent\":{\"plain\":\"單純買賣\",\"con\":\"騙局\",\"dump\":\"拋貨局\",\"squeeze\":\"壓價局\",\"setup\":\"仙人跳\",\"sting\":\"釣魚\",\"proxy\":\"借刀\",\"test\":\"試探\",\"innocent\":\"無心之過\",\"bribe\":\"封口\"}}},\"intro\":{\"lede\":\"你叫許衡，三十一歲，煉氣四層，坊市裡的人叫你許半兩。十二年前，你爹的鋪子一夜之間背上八千靈石的債，你去長生典典了四十年壽元，保住了招牌。如今典期將至。\",\"ticket\":\"今典壽元四十年，到期不贖，人死當絕。\",\"stance\":\"右上角可以切換氣息。收斂：別人看不清你的修為，比較願意閒聊，也比較敢騙你。外放：別人規矩些，讓價也爽快，但樹大招風，月底執事堂會多收你一筆。\",\"goal\":\"這個月：月底要繳坊市規費八十。修為到煉氣五層，而且被騙、錯怪加起來不超過一次，就算上等。\",\"how\":\"每天三個時辰，每個時辰選一件事：顧店，等客人上門；或出門，去市集、丹坊、茶樓、執事堂、藥田、洞府區。客人說的話，有真有假。遊戲不會告訴你誰在說謊。問出來的、看出來的、聽來的，會記進消息簿；消息可以拿去聽雨樓換錢，也可以拿去執事堂告人。\"},\"kaozheng\":{\"canye\":{\"title\":\"缺的七頁\",\"need\":{\"has\":{\"canye\":1}},\"text\":\"「壬午年三月十七：錢兄薦寒鐵三百斤，價廉，無印。周執事言可入帳。霜華說，這批鐵不能收。」「三月十八：收了。霜華一夜沒睡。」「三月十九：霜華說，要是出事，帶衡兒去找她師姐。」那天，你爹把箱子和這幾頁交給了姚四。三月二十一，天沒亮，執事堂進了許記的倉庫。\"},\"shuanghua\":{\"title\":\"霜華\",\"need\":{\"flag\":[\"mang_told_mother\"]},\"text\":\"你娘叫霜華，玄霜門最後一代弟子。三回結是她教你爹打的；她的師姐，在青石街擺了十二年燈攤，等一個姓許的孩子。盲婆婆說，你娘走的那年，不是你們說的那樣。\"},\"twoledgers\":{\"title\":\"兩本帳\",\"need\":{\"has\":{\"zhangce\":1,\"zhangye\":1}},\"text\":\"你爹的帳上寫：「壬午年三月，收寒鐵三百斤，付靈石四十。」錢記的帳頁寫：「壬午年三月，出寒鐵三百斤予許記，收四十。另，周，二十。」同一筆生意，兩邊都記了。多出來的那一筆，只記在一邊。\"},\"xuanshuang\":{\"title\":\"三回結\",\"need\":{\"flag\":[\"mang_saw_jiansui\",\"mang_saw_yupai\"]},\"text\":\"一條燒焦的劍穗，一塊刮掉名字的玉牌，一盞照得見說謊的人的燈。盲婆婆說，打三回結的最後一個人，是她師妹。她問你，長生典那個人，今年還會不會來買燈。\"}},\"endings\":{\"top\":\"這個月，你看穿的比被騙的多。長生典的字條準時塞進門縫：「許公子，尚餘一年又五個月。」你把字條摺好，壓在那本缺頁的帳冊底下。\",\"mid\":\"規費繳了，鋪子還開著。長生典的字條準時塞進門縫：「許公子，尚餘一年又五個月。」日子還長，也不長。\",\"low\":\"錢不語替你墊了規費。他走的時候，在門口多站了一會兒，看了看許記的招牌。長生典的字條準時塞進門縫：「許公子，尚餘一年又五個月。」\",\"lowFooled\":\"這個月，你被騙的次數比你看穿的多。庫房裡堆著賣不出去的東西，有的金線是畫的，有的一沾水就化。長生典的字條準時塞進門縫：「許公子，尚餘一年又五個月。」\",\"teasers\":[{\"need\":{\"flag\":[\"gave_knife\"]},\"text\":\"余小七抱著刀走之前，回頭說了一句：「掌櫃的，刀柄的繩尾，是被割斷的。我哥說過，割繩，就是還活著。」\"},{\"need\":{\"flag\":[\"zhou_warned\"]},\"text\":\"周執事燒掉的那頁紙，你還記得上面每一個字。他說，你爹當年，帳翻得太勤。\"},{\"need\":{\"flag\":[\"yao_closed\"]},\"text\":\"姚四沒有再來過許記。你爹的事，他知道的，比他說過的多。\"},{\"need\":{\"flag\":[\"ahe_taken\"],\"not\":[\"aheng_taken\"]},\"text\":\"阿蘅的屋子空了。洞府區的人說，她去鬼市找過人，一個人去的。\"},{\"need\":{\"flag\":[\"sold_info_pkg\"]},\"text\":\"白七娘說替你壓著的那則消息，還在她的算盤底下。她沒說要壓多久。\"},{\"need\":{\"flag\":[\"xuechan_sold_qian\"]},\"text\":\"錢不語被罰之後，逢人便說是有人害他。他沒說是誰，只是每天早上開門，第一眼看的是許記。\"},{\"need\":{\"flag\":[\"scar_grudge\"]},\"text\":\"門板上那道刀痕，你沒有刨掉。\"},{\"need\":{\"flag\":[\"daoren_caught\"]},\"text\":\"那個道士袖子裡的三枚玉簡，周執事說，是從同一個地方批來的。批貨的人，就在坊市裡。\"},{\"need\":{\"flag\":[\"gave_tie_lingsui\"]},\"text\":\"鐵老蔫的爐子，這幾天夜裡都沒熄。牆上那把二十年沒開刃的刀胚，不見了。\"},{\"need\":{\"flag\":[\"lost_big_deal\"]},\"text\":\"阿福說的那筆大生意，錢記接了。\"},{\"need\":{\"flag\":[\"passed_test\"],\"not\":[\"lost_big_deal\"]},\"text\":\"阿福說，下個月執事堂有一筆大生意。周執事記得你退回去的那四十五塊。\"},{\"need\":{\"flag\":[\"aheng_entrust\"],\"not\":[\"betrayed_aheng\",\"aheng_leak\"]},\"text\":\"阿蘅說她信你一次。坊市裡，肯信人一次的人不多。\"}],\"next\":\"下個月：寒潭宗開始追查失物，鬼市的門對你半開，錢不語的笑容沒有變。\",\"m2\":{\"top\":\"這個月，坊市裡的人開始知道，許記的掌櫃不好騙。長生典的字條準時塞進門縫：「許公子，尚餘{left}。」你把它跟那幾頁帳紙壓在一起。\",\"mid\":\"規費繳了，鋪子還開著。長生典的字條準時塞進門縫：「許公子，尚餘{left}。」十二年前的帳，還差幾筆。\",\"low\":\"錢不語又在門口站了一會兒，看著許記的招牌。長生典的字條準時塞進門縫：「許公子，尚餘{left}。」\",\"lowFooled\":\"這個月，你被騙的比看穿的多。長生典的字條準時塞進門縫：「許公子，尚餘{left}。」\",\"next\":\"第三個月，還在寫。\",\"teasers\":[{\"need\":{\"flag\":[\"mang_told_mother\"]},\"text\":\"盲婆婆說，你娘走的那年，不是你們說的那樣。她說下個月，要帶你去一個地方。\"},{\"need\":{\"flag\":[\"got_pages\"],\"not\":[\"mang_told_mother\"]},\"text\":\"帳紙上寫著：「要是出事，帶衡兒去找她師姐。」你娘的師姐，在坊市裡等了你十二年——你還不知道是誰。\"},{\"need\":{\"flag\":[\"scar_caught\"]},\"text\":\"疤臉在執事堂只說了一句話：「玉匣不是我要的。是有人出錢，要那個弟子回不了宗門。」\"},{\"need\":{\"flag\":[\"xiaoliu_truth\"],\"not\":[\"scar_caught\"]},\"text\":\"余小六還躲在南嶺。疤臉也還在找他。\"},{\"need\":{\"flag\":[\"qian_confronted\"]},\"text\":\"錢不語那天在門口說的話，你想了一整夜。他沒說自己是被冤枉的，他說的是「你爹要是有你一半小心」。\"},{\"need\":{\"flag\":[\"zhang_exposed\"]},\"text\":\"張掌事交代了丹坊帳外的兩枚築基丹。買丹的人是誰，他咬死不說。\"},{\"need\":{\"flag\":[\"took_zhang_money\"]},\"text\":\"你收了張掌事的四十塊。這個人情，他記著，你也記著。\"},{\"need\":{\"flag\":[\"knows_raid\"],\"not\":[\"qian_confronted\"]},\"text\":\"白七娘說，那天清早，錢不語在對街站到天亮。他在等什麼？\"},{\"need\":{\"flag\":[\"siti_caught\"]},\"text\":\"有人說，十二年前，許記也是這樣被查的。一模一樣。\"},{\"need\":{\"flag\":[\"did_big_deal\"]},\"text\":\"阿福說，北面礦上的閘門修好了。周執事下個月還有生意，這回要的是別的東西。\"}]}},\"items\":{\"chiyan\":{\"name\":\"赤炎草\",\"cat\":\"herb\",\"unit\":\"株\",\"grade\":\"一階靈草\",\"base\":12,\"perish\":30,\"stat\":\"年份 10～80 年｜離土後靈性 30 日｜火屬丹藥主材\",\"text\":\"生於地火裂隙，根鬚扎在燙石裡，葉背有細如髮的金線。年份每長十年，金線多一道。坊間數金線定價，於是有人學會了畫。\",\"hidden\":[{\"label\":\"築基可見\",\"need\":{\"realm\":10},\"text\":\"地火一旺，此草便早熟。早熟者金線齊全，藥力只有六成。\"}],\"sell\":[\"huichun\",\"walk\"]},\"dingshen\":{\"name\":\"定神香\",\"cat\":\"incense\",\"unit\":\"束\",\"grade\":\"一階雜貨\",\"base\":25,\"perish\":null,\"stat\":\"一束十炷｜不壞｜打坐時點燃，修為轉換加四成\",\"text\":\"燃一炷可定心神一個時辰。坊市散修打坐必點，所以它從不缺貨，也從不漲價。若哪天定神香漲了，不是香少了，是很多人睡不著。\",\"sell\":[\"huichun\",\"walk\"]},\"bishui\":{\"name\":\"避水符\",\"cat\":\"talisman\",\"unit\":\"張\",\"grade\":\"一階符籙\",\"base\":8,\"perish\":null,\"stat\":\"存放不當會受潮｜渡水、探秘境必備\",\"text\":\"黃紙硃砂，一筆成形。受潮的避水符，硃砂邊緣會暈開一圈極淡的紅。所有製符師都知道這件事，所以他們賣符時從不讓你對著光看。\",\"sell\":[\"walk\"]},\"langya\":{\"name\":\"鐵背狼牙\",\"cat\":\"beast\",\"unit\":\"枚\",\"grade\":\"一階妖獸材料\",\"base\":6,\"perish\":null,\"stat\":\"不壞｜煉器、入藥兩用\",\"text\":\"牙根若帶血絲，取下時狼還沒死透。獵戶說活取的牙更利，丹師說活取的牙帶著怨，入藥發苦。兩種人都在買，所以獵戶從不先殺狼。\",\"sell\":[\"tie\",\"huichun\",\"walk\"]},\"hantie\":{\"name\":\"寒鐵\",\"cat\":\"ore\",\"unit\":\"斤\",\"grade\":\"一階礦材\",\"base\":9,\"perish\":null,\"stat\":\"不壞｜煉器主材\",\"text\":\"北面礦脈所出，色如積水，冬日握之不冷，冷是被它吸走了。礦脈歸寒潭宗，坊市流通的寒鐵，每一斤都經過執事堂的帳。帳面上。\",\"sell\":[\"tie\",\"walk\"]},\"liaoshang\":{\"name\":\"療傷丹\",\"cat\":\"pill\",\"unit\":\"枚\",\"grade\":\"一階丹藥\",\"base\":18,\"perish\":null,\"stat\":\"止血續筋，壓住內傷三日\",\"text\":\"散修出城前總會買兩枚，買了往往捨不得吃。於是療傷丹最常出現的地方，是死人的身上。\",\"sell\":[\"huichun\",\"walk\"]},\"yangqi\":{\"name\":\"養氣丹\",\"cat\":\"pill\",\"unit\":\"枚\",\"grade\":\"一階丹藥\",\"base\":22,\"perish\":null,\"stat\":\"打坐時服用，修為加十八｜連日服用，藥力減半\",\"text\":\"服之可助一夜行氣。丹坊說一夜一枚即可，散修總想一夜兩枚。於是第二枚的藥力，大多化成了丹毒。\",\"sell\":[\"huichun\",\"walk\"]},\"xuechan\":{\"name\":\"雪蟾酥\",\"cat\":\"spirit\",\"unit\":\"匣\",\"grade\":\"二階靈物\",\"base\":70,\"perish\":7,\"stat\":\"凝成後七日化為清水，玉匣只能延緩｜療傷聖藥\",\"text\":\"寒潭雪蟾耳後所凝，一隻雪蟾一生只得一錢，凝成之日便是死期。酥成七日即化為清水，寒潭宗以玉匣封存，也只能多留它幾天。宗門帳上記得清楚：每一錢都有去處。\",\"hidden\":[{\"label\":\"築基可見\",\"need\":{\"realm\":10},\"text\":\"酥面若有細紋如冰裂，是凝成不過十日。\"}],\"sell\":[]},\"lingsui\":{\"name\":\"地火靈髓\",\"cat\":\"spirit\",\"unit\":\"塊\",\"grade\":\"二階靈物\",\"base\":60,\"perish\":null,\"stat\":\"器修淬刃、丹師溫爐\",\"text\":\"地火精氣凝於石中，色如死灰，石心一線暗紅。離開地脈後，日間沉寂，入夜回溫。\",\"sell\":[\"huichun\",\"tie\"]},\"duanshui\":{\"name\":\"斷水刀（殘）\",\"cat\":\"weapon\",\"unit\":\"把\",\"grade\":\"一階法器\",\"base\":10,\"perish\":null,\"stat\":\"有修補痕\",\"text\":\"刀身有一道舊裂，被人用銅汁仔細補過，補痕打磨得幾乎看不見。補刀的人手藝很好，好到願意替一把只值十塊靈石的刀花三天工夫。除非那道裂痕本身，就是要藏起來的東西。\",\"hidden\":[{\"label\":\"築基可見\",\"need\":{\"realm\":10},\"text\":\"裂痕的走向，與一門叫「碎星指」的指法留下的勁力相符。\"}],\"sell\":[\"tie\",\"walk\"]},\"duandao\":{\"name\":\"寒鐵短刀\",\"cat\":\"weapon\",\"unit\":\"把\",\"grade\":\"一階法器\",\"base\":40,\"perish\":null,\"stat\":\"鐵老蔫打造｜不壞\",\"text\":\"鐵老蔫打的刀，不好看。刀背厚，刀刃薄，握柄纏得很緊。他說好看的刀是給人看的，他的刀是給人用的。\",\"sell\":[\"tie\",\"walk\"]},\"yujian\":{\"name\":\"無字玉簡\",\"cat\":\"tool\",\"unit\":\"枚\",\"grade\":\"品階不明\",\"base\":40,\"perish\":null,\"stat\":\"據說需以神識叩問三日方顯\",\"text\":\"玉簡內空無一字。賣家說這是某位前輩坐化前封存的傳承，需以神識叩問三日方顯。坊市裡這樣的玉簡很多，願意叩三日的人很少，所以騙子們從不缺生意。偶爾，也真有一枚會說話。\",\"sell\":[\"walk\"]},\"zhuji\":{\"name\":\"築基丹\",\"cat\":\"pill\",\"unit\":\"枚\",\"grade\":\"二階丹藥\",\"base\":600,\"perish\":null,\"stat\":\"突破築基的關鍵物｜本季已配完\",\"text\":\"一枚築基丹，是一個散修半生的積蓄，或是一個宗門弟子一年的月例。回春堂每季只出九枚，從不多一枚。據 的寒鐵。周執事把包鐵的襯紙折起來，收進袖子裡，罰了你五十：「下不為例。」對門錢記的門，今天沒開。\",\"fx\":{\"stones\":-50,\"rep\":{\"sect\":-1},\"tag\":{\"sect\":\"私藏寒鐵\"},\"rel\":{\"zhou\":-1},\"flag\":[\"pkg_caught\"]}}]},\"e_aheng_warn\":{\"title\":\"阿蘅託人帶話\",\"text\":\"「林子北邊這幾天別去，狼的腳印越來越多。」\"},\"e_xiaoman_back\":{\"title\":\"回春堂退貨\",\"cases\":[{\"if\":{\"backFlag\":\"painted\"},\"text\":\"葛小滿紅著眼睛回來了，把赤炎草放在櫃上：「師父說，金線是畫的。」張掌事要你退錢。\",\"fx\":{\"rel\":{\"zhang\":-2,\"xiaoman\":-2},\"rep\":{\"sect\":-1},\"tag\":{\"sect\":\"賣假草\"},\"flag\":[\"zhang_saw_fake\"]}},{\"if\":{},\"text\":\"葛小滿紅著眼睛回來了，把赤炎草放在櫃上：「師父說，這草不到二十年，藥性也虛。」張掌事要你退錢。\",\"fx\":{\"rel\":{\"zhang\":-1,\"xiaoman\":-1},\"rep\":{\"sect\":-1},\"tag\":{\"sect\":\"以次充好\"}}}]},\"e_tao_back\":{\"title\":\"陶老符上門\",\"cases\":[{\"if\":{\"flag\":[\"tao_reported\"],\"holdFlag\":\"damp\"},\"text\":\"陶老符來了，站在門外，沒有進門。他把一包靈石放在門檻上：「符是陶某的倉庫漏了，錢，我退你一些。可你去執事堂告我……陶某畫了四十年符，頭一回被人告。」他走了，背比上回駝。\",\"fx\":{\"buyback\":{\"flag\":\"damp\",\"ratio\":0.4},\"rel\":{\"tao\":-2},\"mem\":{\"tao\":\"你去執事堂告他。他還是來退了錢。\"}}},{\"if\":{\"holdFlag\":\"damp\"},\"text\":\"天剛亮，陶老符就站在門口，手裡攥著一個布包。「這兩天好幾個人回來找我，說符一沾水就化。」他的聲音有點啞，「是倉庫漏了，陶某不知道。你那批，我收回來，錢退你四成。剩下的……陶某實在拿不出了。」\",\"fx\":{\"buyback\":{\"flag\":\"damp\",\"ratio\":0.4},\"rel\":{\"tao\":1},\"mem\":{\"tao\":\"符受了潮，他自己上門收回去，退了四成的錢。\"}}},{\"if\":{\"flag\":[\"tao_reported\"]},\"text\":\"陶老符從許記門口走過，沒有停下來。聽說他這兩天挨家挨戶，去找買過他符的人。\",\"fx\":{\"rel\":{\"tao\":-2}}},{\"if\":{},\"text\":\"陶老符來了一趟，說他那批符受了潮，問你手上還有沒有。你說都出手了。他朝你作了個揖，嘆著氣走了：「那是陶某對不住買符的人。」\"}]},\"e_siti_raid\":{\"title\":\"執事堂查鐵\",\"cases\":[{\"if\":{\"holdFlag\":\"contraband\"},\"text\":\"周執事帶著四個人進門，直奔庫房，把那批沒有印記的寒鐵一塊一塊搬出來，擺在街上給人看：「北面礦上丟的，就是這批。」他罰了你六十，鐵全數沒收。對門錢記今天沒開門。\",\"fx\":{\"confiscate\":\"contraband\",\"stones\":-60,\"rep\":{\"sect\":-1,\"loose\":-1},\"tag\":{\"sect\":\"收私鐵\"},\"rel\":{\"zhou\":-2},\"flag\":[\"siti_caught\"]},\"face\":\"shock\"},{\"if\":{},\"text\":\"周執事帶人進門，翻遍了庫房，沒找到那批鐵。他問你賣去了哪裡，你答不上來。周執事罰了你六十：「收私鐵賺的錢，吐出來。」\",\"fx\":{\"stones\":-60,\"rep\":{\"sect\":-1},\"tag\":{\"sect\":\"收私鐵\"},\"rel\":{\"zhou\":-1},\"flag\":[\"siti_caught\"]},\"face\":\"sweat\"}]},\"e_bigdeal_dirty\":{\"title\":\"礦上點貨\",\"cases\":[{\"if\":{},\"text\":\"阿福跑回來，臉是白的：「許掌櫃，礦上點貨，你給的寒鐵裡有沒印記的！」下午周執事親自來了，把那批鐵退回你的庫房，貨款收了回去，又罰了你八十：「拿私鐵充宗門的貨，許掌櫃好大的膽子。」\",\"fx\":{\"stones\":-80,\"rel\":{\"zhou\":-3},\"rep\":{\"sect\":-2},\"tag\":{\"sect\":\"拿私鐵充數\"},\"flag\":[\"siti_caught\",\"lost_big_deal\"]},\"face\":\"shock\"}]},\"e_kuang_dirty\":{\"title\":\"礦工又來了\",\"cases\":[{\"if\":{},\"text\":\"礦工揹著簍子回來，把幾塊沒有印記的寒鐵摔在櫃上：「礦上點貨，差點把我當成賊！」他把鐵退了回來，把錢要了回去，在門口罵了半天，整條街都聽見了。\",\"fx\":{\"rep\":{\"sect\":-1,\"loose\":-1},\"tag\":{\"loose\":\"賣私鐵\"},\"flag\":[\"siti_spread\"]},\"face\":\"sweat\"}]},\"e_han_cut\":{\"title\":\"韓九回來了\",\"cases\":[{\"if\":{},\"text\":\"韓九牽著駱駝又回來了，把幾束香放在櫃上：「掌櫃的，這香一點就嗆，燒得比蠟燭還快。」他沒有吵，只是把香退了回來，把錢要了回去，臨走時說：「北邊的人，要的是能睡著的香。」\",\"fx\":{\"rel\":{\"han\":-2},\"rep\":{\"loose\":-1},\"tag\":{\"loose\":\"賣次貨\"}},\"face\":\"sweat\"}]},\"e_zhuji_audit\":{\"title\":\"陸執法來了\",\"cases\":[{\"if\":{\"has\":{\"zhuji\":1}},\"text\":\"陸執法清點回春堂這一季的築基丹，帳上九枚，庫裡七枚。他順著鬼市的線，查到了許記。他把那枚築基丹收進袖子裡：「許掌櫃，宗門的東西，不是有錢就買得到的。」罰了你五十。\",\"fx\":{\"confiscateItem\":\"zhuji\",\"stones\":-50,\"rel\":{\"lu\":-2},\"rep\":{\"sect\":-1},\"tag\":{\"sect\":\"收宗門的丹\"},\"flag\":[\"zhuji_caught\"]},\"face\":\"shock\"},{\"if\":{},\"text\":\"陸執法清點回春堂這一季的築基丹，帳上九枚，庫裡七枚。他來許記問了一句：「鬼市那枚築基丹，許掌櫃轉給誰了？」你沒答。他看了你很久，走了。\",\"fx\":{\"rel\":{\"lu\":-2},\"flag\":[\"zhuji_traced\"]},\"face\":\"sweat\"}]},\"melt\":{\"xuechan\":\"你打開玉匣。裡面只剩一汪清水，涼的。\",\"default\":\"「{name}」放壞了。\"},\"complaint\":{\"painted\":\"金線是畫的！\",\"damp\":\"符一沾水就化了！\",\"default\":\"這是什麼次貨！\"},\"monthStart\":{\"2\":[{\"need\":{\"flag\":[\"aheng_paid\"],\"not\":[\"betrayed_aheng\",\"aheng_leak\",\"ahe_taken\"]},\"title\":\"一捆赤炎草\",\"text\":\"門口放著一捆用濕布包好的赤炎草，沒有留話。布是阿蘅的。\",\"fx\":{\"give\":[{\"item\":\"chiyan\",\"qty\":2,\"cost\":0,\"q\":1.05,\"label\":\"阿蘅留下的赤炎草\"}]},\"face\":\"smile\"},{\"need\":{\"flag\":[\"aheng_taken\"],\"not\":[\"aheng_leak\"]},\"title\":\"阿蘅放出來了\",\"text\":\"聽說阿 e; });\n  if (fx.confiscate) S.lots = S.lots.filter(l => !l.flags.includes(fx.confiscate));\n  if (fx.confiscateItem) S.lots = S.lots.filter(l => l.item !== fx.confiscateItem);\n  if (fx.wind) S.wind += fx.wind;\n  if (fx.removeEvent) S.events = S.events.filter(e => e.id !== fx.removeEvent);\n  if (fx.buyback) { let got = 0; for (const l of S.lots.filter(x => x.flags.includes(fx.buyback.flag))) { got += rp(l.cost * l.qty * fx.buyback.ratio); l.qty = 0; } S.lots = S.lots.filter(l => l.qty > 0); if (got) { S.stones += got; notes.push('＋' + fmt(got) + ' 靈石'); } }\n  if (fx.refundLot) { let got = 0; for (const l of S.lots.filter(x => x.item === fx.refundLot.item)) { got += rp(l.cost * l.qty * fx.refundLot.ratio); l.qty = 0; } S.lots = S.lots.filter(l => l.qty > 0); if (got) { S.stones += got; notes.push('＋' + fmt(got) + ' 靈石'); } }\n  if (fx.unfool) { S.stats.fooled = Math.max(0, S.stats.fooled - 1); S.flags['won_' + fx.unfool] = true; }\n  if (fx.spreadText) S.extraNews.push({ day: S.day + 1, src: '坊間', text: fx.spreadText });\n  if (fx.sellHot) {\n    let got = 0;\n    for (const [item, unit] of Object.entries(fx.sellHot)) for (const l of S.lots.filter(x => x.item === item && x.flags.includes('stolen') || x.item === item && x.flags.includes('sting'))) { got += unit * l.qty; l.qty = 0; if (l.flags.includes('entrusted')) { addRel('aheng', -5); addMem('aheng', '託你交給執事堂的雪蟾酥，你賣去了鬼市。'); S.flags.betrayed_aheng = true; } }\n    S.lots = S.lots.filter(l => l.qty > 0); S.stones += got; notes.push('＋' + fmt(got) + ' 靈石');\n  }\n  return notes;\n}\n\n/* ================= day flow ================= */\nfunction beginDay() {\n  S.phase = 'morning'; S.slot = 0; S.place = null; S.enc = null; S.night = null;\n  S.spirit = M.spirit[S.level] || 2; S.dayStartStones = S.stones; S.cards = [];\n  if (S.day === 1 && MON() === 1) S.cards.push({ title: D.events.e_intro.title, text: D.events.e_intro.text });\n  if (S.day === 1 && MON() > 1) {\n    S.cards.push({ title: '長生典的字條', text: `天還沒亮，門縫裡又塞進來一張字條：「許公子，尚餘${monthsText(S.lifespan)}。」`, face: 'think' });\n    for (const c of ((D.events.monthStart || {})[MON()] || [])) if (needOk(c.need || {})) S.cards.push({ title: c.title, text: c.text, notes: applyFx(c.fx), face: c.face });\n  }\n  // perish\n  for (const l of [...S.lots]) if (l.perishDay && S.day >= l.perishDay) {\n    S.lots = S.lots.filter(x => x !== l);\n    S.cards.push({ title: '東西壞了', text: (D.events.melt[l.item] || D.events.melt.default.replace('{name}', l.label)) });\n    if (l.flags.includes('entrusted')) { addRel('aheng', -3); addMem('aheng', '託你交的雪蟾酥，在你手上化了。'); }\n  }\n  // scheduled events\n  for (const ev of S.events.filter(e => e.day === S.day)) runEvent(ev);\n  S.events = S.events.filter(e => e.day !== S.day);\n  if (MON() === 1 && S.day === 4 && S.flags.aheng_entrust && !S.flags.aheng_taken) S.cards.push({ title: D.events.e_aheng_warn.title, text: D.events.e_aheng_warn.text });\n  // complaints\n  for (const c of S.complaints.filter(c => c.day === S.day)) {\n    S.stones -= c.refund; S.rep.loose -= 1; S.repTag.loose = '賣次貨';\n    addLot({ item: c.item, qty: c.qty, cost: c.cost, q: c.q, flags: c.flags, label: c.label, known: true });\n    S.cards.push({ title: '有人回來退貨', text: `昨天在你這兒買${c.label}的人回來了，把東西摔在櫃上：「${D.events.complaint[c.reason] || D.events.complaint.default}」你退了 ${fmt(c.refund)} 塊靈石。` });\n  }\n  S.complaints = S.complaints.filter(c => c.day !== S.day);\n  // commission\n  if (S.commission && !S.commission.done && S.day >= S.commission.ready) {\n    S.commission.done = true; addLot({ item: PL.smith.commission.item, qty: 1, cost: S.commission.cost, known: true });\n    S.cards.push({ title: '刀好了', text: PL.smith.commission.done });\n  }\n  // news\n  S.todayNews = NEWS.filter(n => inMonth(n) && n.day === S.day && (!n.cond || S.flags[n.cond]) && !(n.notCond && S.flags[n.notCond])).map(n => n.id);\n  if (S.todayNews.includes('n_bounty')) S.flags.bounty_seen = true;\n}\nfunction runEvent(evo) {\n  const id = typeof evo === 'string' ? evo : evo.id;\n  if (id.startsWith('leak:')) {\n    const I = IN[id.slice(5)]; if (!I || !I.leak) return;\n    const c = I.leak.cases.find(x => needOk(x.if || {})); if (!c) return;\n    S.cards.push({ title: c.title || '風聲', text: c.text, notes: applyFx(c.fx), face: c.face || 'sweat' }); return;\n  }\n  if (id.startsWith('burn:')) {\n    const iid = id.slice(5), I = IN[iid], paid = (S.isold[iid] || {}).price || 0;\n    const back = Math.min(paid, Math.max(0, S.stones));\n    S.stones -= back; addRel('bai', -2); S.flags.bai_burned = true; S.isold[iid].burned = true;\n    addMem('bai', `你賣給她的「${I.short}」，是假的。`);\n    S.cards.push({ title: '聽雨樓來人', text: I.burn, notes: back ? ['－' + fmt(back) + ' 靈石'] : [], face: 'sweat' }); return;\n  }\n  if (id.startsWith('heat:')) { const h = D.heat[id.slice(5)]; if (!h) return; applyFx(h.fx); S.cards.push({ title: h.title, text: h.text, face: 'uneasy' }); return; }\n  const ev = D.events[id]; if (!ev) return;\n  if (evo.refund) { S.stones -= evo.refund; if (evo.back) addLot({ ...evo.back, known: true }); }\n  if (!ev.cases) { S.cards.push({ title: ev.title, text: ev.text }); return; }\n  const c = ev.cases.find(x => needOk(x.if || {}, evo));\n  if (!c) return;\n  const notes = applyFx(c.fx);\n  if (evo.refund) notes.unshift('退錢 ' + fmt(evo.refund) + ' 靈石');\n  S.cards.push({ title: ev.title, text: c.text, notes, face: c.face });\n}\nfunction openShop() { S.phase = 'day'; UI.tab = 'main'; }\nfunction advanceSlot() {\n  S.slot++; S.place = null; S.enc = null; S.phase = 'day';\n  if (S.slot >= 3) {\n    if (S.day === M.days && !S.dues) startDues();\n    else S.phase = 'night';\n  }\n}\nfunction endDay() {\n  S.stanceDays[S.stance] = (S.stanceDays[S.stance] || 0) + 1;\n  for (const d of D.deals) {\n    if (S.done[d.id] || d.extra || !inMonth(d) || d.days[1] !== S.day) continue;\n    if (d.missed && needOk(d.need)) applyFx(d.missed);\n    S.done[d.id] = needOk(d.need) ? 'missed' : 'na';\n  }\n  S.day++;\n  if (S.day > M.days) { finish(); return; }\n  beginDay();\n}\nfunction finish() {\n  S.cards = [];\n  for (const ev of S.events) if (ev.day > M.days) runEvent(ev);\n  for (const c of S.complaints) { S.stones -= c.refund; S.rep.loose -= 1; S.repTag.loose = '賣次貨'; S.cards.push({ title: '有人回來退貨', text: `在你這兒買${c.label}的人回來了：「${D.events.complaint[c.reason] || D.events.complaint.default}」你退了 ${fmt(c.refund)} 塊靈石。` }); }\n  S.complaints = [];\n  S.events = [];\n  S.phase = 'end'; S.lifespanLeft = S.lifespan - 1;\n  const sc = scoreTotal(), best = store.get(bestKey());\n  S.finalScore = sc; S.prevBest = best ? best.score : null;\n  if (!best || sc > best.score) store.set(bestKey(), { score: sc, grade: gradeOf(), at: Date.now() });\n}\nfunction goalLevel() { return (S.monthStartLevel || M.startLevel) + 1; }\nfunction nextMonth() {\n  if (MON() >= LAST_MONTH) return;\n  S.history.push({ m: MON(), grade: gradeOf(), score: S.finalScore, stats: { ...S.stats } });\n  S.month = MON() + 1; S.day = 1; S.lifespan -= 1; S.monthStartLevel = S.level;\n  const melted = S.lots.filter(l => l.perishDay); S.lots = S.lots.filter(l => !l.perishDay);\n  if (S.commission && !S.commission.done) S.commission.ready = Math.max(2, S.commission.ready - M.days);\n  Object.assign(S, { stats: { saw: 0, fooled: 0, wronged: 0 }, teaBought: {}, overheard: {}, herbBought: {}, baiSold: {}, dues: null, wind: 0, stanceDays: { 收斂: 0, 外放: 0 }, log: [], events: [], complaints: [], extraNews: [], finalScore: null, prevBest: null });\n  S.flags['month' + (S.month - 1) + '_done'] = true;\n  S.heat = Math.floor((S.heat || 0) / 2); delete S.flags.heat3; delete S.flags.heat5;\n  for (const d of D.deals) if (d.month === 'all' && S.done[d.id] && !['special', 'special2'].includes(S.done[d.id])) delete S.done[d.id];\n  S.smithBought = {};\n  beginDay();\n  for (const l of melted) S.cards.unshift({ title: '東西壞了', text: (D.events.melt[l.item] || D.events.melt.default.replace('{name}', l.label)) });\n}\nconst BEST_KEY = 'fangshi-best-v1';\nconst bestKey = () => BEST_KEY + (MON() > 1 ? '-m' + MON() : '');\nfunction gradeOf() { const m = S.stats.fooled + S.stats.wronged; return S.debt > 0 || m >= 4 ? '下' : (S.level >= goalLevel() && m \u003c= 1) ? '上' : '中'; }\nfunction scoreRows() {\n  const nw = netWorth(true);\n  return [\n    { k: 'saw', label: '看穿', n: S.stats.saw, per: 10 },\n    { k: 'fooled', label: '吃虧', n: S.stats.fooled, per: -15 },\n    { k: 'wronged', label: '錯怪好人', n: S.stats.wronged, per: -10 },\n    { label: '境界（這個月每升一層）', n: Math.max(0, S.level - (S.monthStartLevel || M.startLevel)), per: 30 },\n    { label: '身家（每十靈石）', n: Math.floor(Math.max(0, nw) / 10), per: 1 },\n    { label: '名聲（散修圈＋宗門圈）', n: (S.rep.loose || 0) + (S.rep.sect || 0), per: 5 },\n    { label: '欠錢不語', n: S.debt ? 1 : 0, per: -30 }\n  ];\n}\nconst scoreTotal = () => scoreRows().reduce((a, r) => a + r.n * r.per, 0);\n\n/* ================= encounters ================= */\nfunction dealAvail(d) { return inMonth(d) && !S.done[d.id] && S.day >= d.days[0] && S.day \u003c= d.days[1] && needOk(d.need); }\nfunction nextShopDeal() { return D.deals.filter(d => d.where === 'shop' && dealAvail(d)).sort((a, b) => (b.prio || 0) - (a.prio || 0))[0] || null; }\n\nfunction startDeal(id, from) {\n  const d = DEALS[id]; const npc = d.npc;\n  S.met[npc] = true;\n  if (S.stance === '外放') S.wind++;\n  const enc = { deal: id, npc, side: d.side, item: d.item, qty: d.qty || 1, price: d.price, tea: TEA[NP[npc].traits.patience] || 4, th: [], press: 0, haggle: 0, asked: false, silent: false, appraised: false, verified: [], cold: false, done: null, from, lot: null };\n  enc.teaMax = enc.tea;\n  if (d.side === 'buy') {\n    const lots = S.lots.filter(l => l.item === d.item);\n    lots.sort((a, b) => (b.known ? b.q : 1) - (a.known ? a.q : 1));\n    enc.lot = lots[0] ? lots[0].id : null;\n    enc.qty = Math.min(d.qty || 1, lots[0] ? lots[0].qty : 0);\n  }\n  if (IT[d.item]) S.codex[d.item] = true;\n  if (d.intro) enc.th.push({ k: 'narr', t: sub(d.intro, npc) });\n  if (id === 'd18') {\n    const high = S.wind >= M.windHigh || S.stones >= M.richHigh;\n    enc.due = high ? MD().duesHigh : MD().dues; enc.high = high;\n    enc.th.push({ k: 'npc', t: high ? d.openHigh.replace('一百', cnNum(MD().duesHigh)) : d.open.replace('八十', cnNum(MD().dues)) });\n    if (S.debt > 0) { enc.debtDue = rp(S.debt * 1.3); enc.due += enc.debtDue; enc.th.push({ k: 'narr', t: `錢不語也從對門踱了過來，手裡捏著一張借據：「許老弟，上個月墊的 ${fmt(S.debt)}，三分利，${fmt(enc.debtDue)}。一起算了吧。」` }); enc.th.push({ k: 'sys', t: `規費加還錢記，一共 ${fmt(enc.due)}。` }); }\n  } else enc.th.push({ k: 'npc', t: sub(d.open, npc) });\n  enc.face = d.openFace || baseFace(npc);\n  // realm & stance layer: adjust the opening price and say so\n  if ((d.side === 'sell' || d.side === 'buy') && !d.extra) {\n    const b = bucketOf(npc);\n    if (b === 'eq' && S.stance === '收斂') { /* nothing to say */ } else {\n    let m = d.side === 'sell' ? ({ up: .93, eq: 1, down: 1.06, far: 1.1 })[b] : ({ up: 1.06, eq: 1, down: .95, far: .92 })[b];\n    m *= d.side === 'sell' ? (S.stance === '收斂' ? 1.04 : .96) : (S.stance === '收斂' ? .97 : 1.03);\n    const np = rp(d.price * m);\n    if (np !== d.price && d.price >= 2) {\n      enc.price = np;\n      const better = d.side === 'sell' ? np \u003c d.price : np > d.price;\n      let line;\n      if (S.stance === '外放' && better) line = `你沒有收斂氣息。${NP[npc].name}頓了頓，改口：「${cnPrice(np)}。」`;\n      else if (b === 'up') line = `${NP[npc].name}看了一眼你的修為，語氣客氣了些：「給${callYou(npc)}算${cnPrice(np)}。」`;\n      else if (better) line = `${NP[npc].name}想了想，改口：「${cnPrice(np)}。」`;\n      else line = `${NP[npc].name}打量了你一下，把價錢${d.side === 'sell' ? '往上提了提' : '往下壓了壓'}：「${cnPrice(np)}。」`;\n      enc.th.push({ k: 'narr', t: line });\n    }\n    }\n  }\n  pushTells(enc, 'open');\n  S.enc = enc; S.phase = 'enc';\n  learnTrigger(id + ':open');\n  return enc;\n}\nfunction pushTells(enc, after) {\n  const d = DEALS[enc.deal]; if (!d || !d.tells) return;\n  const bonus = S.flags.lamp && enc.from === 'shop' ? 2 : 0;\n  const diff = S.level - NP[enc.npc].level + bonus;\n  for (const t of d.tells) if (t.after === after && diff >= t.need && !enc.th.some(x => x.t === t.text)) { enc.th.push({ k: 'tell', t: t.text }); if (t.f) enc.face = t.f; }\n}\nfunction spend(enc, n) {\n  enc.tea -= n;\n  if (enc.tea \u003c= 0 && !enc.cold) { enc.tea = 0; enc.cold = true; say(enc, quote(sub(NP[enc.npc].cold, enc.npc)), 'cold'); }\n}\nconst pride3 = enc => NP[enc.npc].traits.pride >= 3;\nconst baseFace = npc => ((NP[npc] || {}).look || {}).base || 'neutral';\nfunction say(e, t, f) { e.th.push({ k: 'npc', t, f }); if (f) e.face = f; }\n\nfunction canAct(act) {\n  const e = S.enc; if (!e || e.done) return false;\n  if (e.generic) {\n    if (act === 'chat') return !e.chatted && !e.cold;\n    if (act === 'haggle') return !!e.lot && !e.haggled && !e.cold;\n    return false;\n  }\n  const d = DEALS[e.deal];\n  if (e.cold && act !== 'appraise' && act !== 'verify') return false;\n  switch (act) {\n    case 'ask': return !!d.ask && !e.asked;\n    case 'press': return !!d.press && e.press \u003c d.press.length;\n    case 'silence': return !!d.silence && !e.silent;\n    case 'haggle': return !!d.haggle && e.haggle \u003c d.haggle.length && (d.side !== 'buy' || e.qty > 0);\n    case 'appraise': return !!d.appraise && !e.appraised && S.spirit > 0;\n    case 'verify': return verifyList().some(v => !v.used) && S.slot \u003c 2;\n  }\n  return false;\n}\nfunction actAsk() {\n  const e = S.enc, d = DEALS[e.deal];\n  e.asked = true; e.th.push({ k: 'me', t: d.ask.q || '這東西，怎麼來的？' }); say(e, sub(d.ask.a, e.npc), d.ask.f || baseFace(e.npc));\n  pushTells(e, 'ask'); learnTrigger(e.deal + ':ask'); spend(e, 1);\n}\nfunction actPress() {\n  const e = S.enc, d = DEALS[e.deal], p = d.press[e.press++];\n  e.th.push({ k: 'me', t: p.q }); say(e, sub(p.a, e.npc), p.f || baseFace(e.npc));\n  pushTells(e, 'press'); learnTrigger(e.deal + ':press' + (e.press - 1));\n  spend(e, 2 + (pride3(e) && ['down', 'far'].includes(bucketOf(e.npc)) ? 1 : 0));\n}\nfunction actSilence() {\n  const e = S.enc, d = DEALS[e.deal];\n  e.silent = true; e.th.push({ k: 'me', t: '（你沒有說話，只是看著對方。）', f: 'think' });\n  if (typeof d.silence === 'object') { e.th.push({ k: 'narr', t: sub(d.silence.narr, e.npc) }); if (d.silence.f) e.face = d.silence.f; } else say(e, sub(d.silence, e.npc), d.silenceFace || baseFace(e.npc));\n  if (d.silenceRaise && d.silenceRaise > e.price) e.price = d.silenceRaise;\n  if (d.silenceDrop && d.silenceDrop \u003c e.price) e.price = d.silenceDrop;\n  pushTells(e, 'silence'); learnTrigger(e.deal + ':silence');\n  spend(e, 1 + (pride3(e) ? 1 : 0));\n}\nfunction actHaggle() {\n  const e = S.enc, d = DEALS[e.deal];\n  e.th.push({ k: 'me', t: d.side === 'buy' ? '再加一點。' : d.side === 'task' ? '辛苦費，再加一點。' : '便宜點。' });\n  if (bucketOf(e.npc) === 'far' || (bucketOf(e.npc) === 'down' && pride3(e))) {\n    e.haggle = d.haggle.length; say(e, quote(sub(NP[e.npc].refuse, e.npc)), 'cold'); spend(e, 2); return;\n  }\n  let step = null;\n  while (e.haggle \u003c d.haggle.length) {\n    const s = d.haggle[e.haggle++];\n    const better = d.side === 'sell' ? s.price \u003c e.price : s.price > e.price;\n    if (better) { step = s; break; }\n  }\n  if (step) { e.price = step.price; say(e, sub(step.a, e.npc), step.f || 'think'); }\n  else say(e, quote(sub(NP[e.npc].refuse, e.npc)), 'cold');\n  pushTells(e, 'haggle'); spend(e, 2);\n}\nfunction actAppraise() {\n  const e = S.enc, d = DEALS[e.deal];\n  S.spirit--; e.appraised = true;\n  e.th.push({ k: 'me', t: `（你以靈識探向${d.itemName || (IT[d.item] && IT[d.item].name) || '那件東西'}。）` });\n  for (const a of d.appraise) if (S.level >= a.realm) e.th.push({ k: 'sys', t: a.text });\n  e.th.push({ k: 'narr', t: '以你的靈識，只看得到這麼多。' });\n  learnTrigger(e.deal + ':appraise');\n}\nfunction verifyList() {\n  const e = S.enc; if (!e || e.generic) return [];\n  const d = DEALS[e.deal]; if (!d.verify) return [];\n  return d.verify.filter(v => v.who !== e.npc && !(v.notFlag && S.flags[v.notFlag]) && (S.met[v.who] || PUBLIC_VERIFY.includes(v.who))).map(v => ({ ...v, used: e.verified.includes(v.who) }));\n}\nfunction actVerify(who) {\n  const e = S.enc, d = DEALS[e.deal], v = d.verify.find(x => x.who === who);\n  if (!v || S.slot >= 2) return;\n  if (v.cost && S.stones \u003c v.cost) { toast('靈石不夠'); return; }\n  S.stones -= v.cost || 0; S.slot++; e.verified.push(who); S.met[who] = true;\n  e.th.push({ k: 'me', t: `（「容我想想。」你出門去找${NP[who].name}${v.cost ? `，花了 ${v.cost} 塊靈石` : ''}。回來時，已經是${SLOT[S.slot]}。）` });\n  e.th.push({ k: 'npc', who, t: sub(v.a, who), f: v.f || baseFace(who) });\n  if (!learnTrigger(`${e.deal}:verify:${who}`)) noteGeneric(`${NP[who].name}談「${d.title}」：${sub(v.a, who)}`, 'verify');\n}\n\n/* ----- options ----- */\nconst OPT_ORDER = ['deal', 'special', 'special2', 'sellhot', 'mask', 'info_yao', 'info_liu', 'info_pkg', 'pay', 'poor', 'decline', 'expose', 'report', 'refer'];\nfunction encOptions() {\n  const e = S.enc; if (!e) return [];\n  if (e.generic) {\n    const out = [];\n    if (e.lot) {\n      const l = lotById(e.lot);\n      out.push({ key: 'sell', label: '賣給他', desc: `收 ${fmt(e.price * e.qty)} 靈石`, primary: true });\n      if (l && l.known && l.q \u003c 0.9) out.push({ key: 'honest', label: '照實說', desc: `說清楚成色，照成色賣：${fmt(rp(e.price * l.q) * e.qty)} 靈石` });\n    }\n    out.push({ key: 'decline', label: e.lot ? '不賣' : '送客', desc: '' });\n    return out;\n  }\n  const d = DEALS[e.deal], out = [];\n  if (d.infoBarter) for (const id of Object.keys(S.intel).filter(i => IN[i] && intelSolo(IN[i]))) { const o = intelOffer(id); if (o.price) out.push({ key: 'barter:' + id, label: `拿「${IN[id].short}」換`, desc: '不收錢。這則消息就出去了' }); }\n  if (d.infoBuyer) for (const id of Object.keys(S.intel).filter(i => IN[i])) { const o = intelOffer(id, 1.1); if (o.price) out.push({ key: 'info:' + id, label: `賣「${IN[id].short}」`, desc: `${o.price} 靈石` }); }\n  for (const key of OPT_ORDER) {\n    const o = d.opts[key]; if (!o) continue;\n    if (key === 'pay') { f (key.startsWith('barter:')) return decideBarter(key.slice(7));\n  let o = d.opts[key]; if (!o) return;\n  let ok = needOk(o.need, e);\n  const res = ok ? o : o.fail;\n  if (!res) return;\n  const unit = o.price ?? e.price;\n  const label0 = (encOptions().find(x => x.key === key) || {}).label || o.label || key;\n  let notes = [];\n  if (ok && (key === 'deal' || o.price != null)) {\n    if (d.side === 'sell') {\n      const total = unit * e.qty;\n      if (S.stones \u003c total) { toast('靈石不夠'); return; }\n      S.stones -= total;\n      if (d.item === 'box') { /* the box's contents come through fx */ }\n      else if (IT[d.item]) addLot({ item: d.item, qty: e.qty, cost: unit, q: d.lot && d.lot.q, flags: d.lot && d.lot.flags, label: d.lot && d.lot.label, perishDay: d.lot && d.lot.perishDay, from: d.id });\n      notes.push('－' + fmt(total) + ' 靈石');\n    } else if (d.side === 'buy') {\n      const l = lotById(e.lot); if (!l) return;\n      const q = Math.min(e.qty, l.qty);\n      takeQty(d.item, q, l.id); S.stones += unit * q; notes.push('＋' + fmt(unit * q) + ' 靈石');\n      if (d.dirty && l.flags.includes(d.dirty.flag)) { if (d.dirty.event) S.events.push({ id: d.dirty.event, day: S.day + 1, refund: unit * q, back: { item: l.item, qty: q, cost: l.cost, q: l.q, flags: l.flags, label: l.label } }); if (d.dirty.fx) applyFx(d.dirty.fx); }\n      if (d.honestyTest) {\n        if (l.q \u003c 0.8) S.events.push({ id: 'e_xiaoman_back', day: S.day + 1, refund: unit * q, back: { ...l, qty: q } });\n        else { addRel('zhang', 1); addRel('xiaoman', 1); }\n      }\n      if (l.q \u003c 0.7 && !d.honestyTest) scheduleComplaint(l, q, unit);\n    } else if (d.side === 'task' && key === 'deal' && d.price) { S.stones += unit; notes.push('＋' + fmt(unit) + ' 靈石'); }\n  }\n  notes = notes.concat(applyFx(res.fx, { price: unit, enc: e }));\n  let extraText = '';\n  for (const x of (res.extra || [])) if (needOk(x.if || {}, e)) { notes = notes.concat(applyFx(x.fx)); extraText += x.text |   for (const lv of Object.keys(D.heat || {}).map(Number).sort((a, b) => a - b)) if (S.heat >= lv && !S.flags['heat' + lv]) { S.flags['heat' + lv] = true; S.events.push({ id: 'heat:' + lv, day: S.day + 1 }); }\n  S.log.push({ day: S.day, t: `賣給白七娘：${I.short}（${o.price} 靈石）` });\n  return o.price;\n}\nfunction sellAtTea(id) {\n  const I = IN[id]; if (!I) return;\n  const o = intelOffer(id);\n  UI.sheet = null; S.place.sayWho = 'bai';\n  if (o.refuse) { S.place.say = o.refuse; return; }\n  if ((S.baiSold[S.day] || 0) >= 2) return;\n  const p = sellIntel(id); if (p == null) return;\n  S.baiSold[S.day] = (S.baiSold[S.day] || 0) + 1;\n  S.place.say = baiSays(I, p); toast(`＋${p} 靈石`);\n}\nfunction decideBarter(id) {\n  const e = S.enc, d = DEALS[e.deal], I = IN[id], o = d.opts.barter; if (!I || !o) return;\n  const solo = intelSolo(I);\n  S.isold[id] = { day: S.day, m: MON(), price: 0, barter: true }; S.heat += 1 + (solo ? 1 : 0);\n  if (I.sellFlag) S.flags[I.sellFlag] = true;\n  if (I.leak) S.events.push({ id: 'leak:' + id, day: S.day + 1 });\n  if (I.spread && !I.suppress) S.extraNews.push({ day: S.day + 1, src: '聽雨樓傳出', text: I.spread });\n  for (const lv of Object.keys(D.heat || {}).map(Number).sort((a, b) => a - b)) if (S.heat >= lv && !S.flags['heat' + lv]) { S.flags['heat' + lv] = true; S.events.push({ id: 'heat:' + lv, day: S.day + 1 }); }\n  e.th.push({ k: 'me', t: `（你把「${I.short}」說給她聽。）` });\n  const notes = applyFx(o.fx);\n  e.th.push({ k: 'res', t: sub(o.text, e.npc), notes });\n  e.done = { key: 'barter', label: '拿消息換', notes, seal: '換訊' }; S.done[e.deal] = 'barter';\n  S.log.push({ day: S.day, t: `拿「${I.short}」跟白七娘換了消息` });\n  scanLearn();\n}\nfunction decideInfo(id) {\n  const e = S.enc, I = IN[id]; const p = sellIntel(id, 1.1); if (p == null) return;\n  e.th.push({ k: 'me', t: `（你把「${I.short}」說給她聽。）` });\n  e.th.push({ k: 'res', t: baiSays(I, p), notes: ['＋' + fmt(p) + ' 靈石'] });\n  e.done = { key: 'info', label: '賣消息', notes: [], seal: '賣訊' }; S.done[e.deal] = 'info';\n}\n/* ----- accusations ----- */\nconst accuseList = () => ACC.filter(a => !S.accused[a.id] && needOk(a.show));\nfunction evidenceHad(a) {\n  return a.evidence.filter(ev => ev.lotKnown ? S.lots.some(l => l.item === ev.lotKnown && l.known) : ev.lotFlag ? S.lots.some(l => l.known && l.flags.includes(ev.lotFlag)) : ev.has ? held(ev.has) > 0 : ev.intel ? !!S.intel[ev.intel] : ev.flag ? !!S.flags[ev.flag] : false);\n}\nfunction accuse(id) {\n  const a = ACC.find(x => x.id === id); if (!a || S.accused[id]) return;\n  const strength = evidenceHad(a).length;\n  const c = a.cases.find(c => {\n    const f = { ...(c.if || {}) };\n    if (f.dayAfter != null && !(S.day > f.dayAfter)) return false;\n    if (f.strength != null && strength \u003c f.strength) return false;\n    delete f.dayAfter; delete f.strength; return needOk(f);\n  });\n  UI.sheet = null; if (!c) return;\n  S.accused[id] = true;\n  const notes = applyFx(c.fx);\n  S.place.say = c.text; S.place.sayWho = 'zhou';\n  if (notes.length) toast(notes.join('　'));\n  S.log.push({ day: S.day, t: '執事堂：' + a.label });\n}\n\n/* ================= night ================= */\nfunction meditate(invest, burn, pill) {\n  invest = Math.max(0, Math.min(invest, S.stones, M.nightCap));\n  let gain = invest * (burn ? 1.4 : 1);\n  let burnQ = 1;\n  if (burn) { const bl = S.lots.find(l => l.item === 'dingshen'); burnQ = bl ? bl.q : 1; takeQty('dingshen', 1, bl && bl.id); gain = invest * (1 + 0.4 * burnQ); }\n  if (pill) { takeQty('yangqi', 1); gain += S.pillYesterday ? 9 : 18; }\n  S.stones -= invest; S.xp += Math.round(gain); S.pillYesterday = !!pill;\n  const before = S.level; let need = M.xpNeed[S.level];\n  while (S.level \u003c 9 && S.xp >= need) { S.xp -= need; S.level++; need = M.xpNeed[S.level]; }\n  S.night = { invest, gain: Math.round(gain), up: S.level > before, weak: burn && burnQ \u003c 0.9 };\n}\nfunction netWorth(trueQ = true) { return S.stones + S.lots.reduce((a, l) => a + lotValue(l, Math.min(S.day, M.days),

<title>坊市掌櫃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one phone column. A sticky "abacus strip" on top (day, hour track, stones, cultivation, spirit sense, stance);
   the day's work scrolls below; a fixed thumb bar at the bottom carries either the four ledgers or the deal actions.
   Paper is celadon-grey like an old account book; ink is green-black; cinnabar is reserved for seals and warnings. */
:root{
  --ground:#E4EAE4;
  --sheet:#F6F8F3;
  --ink:#1C2727;
  --ink-2:#56655F;
  --rule:#C3CEC6;
  --cinnabar:#B3362A;
  --jade:#2C6A5C;
  --gold:#8E6E22;
  --wash:rgba(44,106,92,.08);
  --shade:rgba(28,39,39,.06);
  --seal-blend:multiply;

  --serif:"Noto Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
  --talk:"LXGW WenKai TC","Kaiti TC","BiauKai","STKaiti",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;
  --barh:120px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1615; --sheet:#172120; --ink:#E0E8E3; --ink-2:#92A39D; --rule:#2B3936;
    --cinnabar:#E3624F; --jade:#74BCA7; --gold:#D3B05B; --wash:rgba(116,188,167,.10); --shade:rgba(224,232,227,.05);
    --seal-blend:normal; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0F1615; --sheet:#172120; --ink:#E0E8E3; --ink-2:#92A39D; --rule:#2B3936;
  --cinnabar:#E3624F; --jade:#74BCA7; --gold:#D3B05B; --wash:rgba(116,188,167,.10); --shade:rgba(224,232,227,.05);
  --seal-blend:normal; color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font:15px/1.65 var(--sans);-webkit-text-size-adjust:100%;text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--barh) + 24px);overflow-x:clip}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.serif{font-family:var(--serif)}
.cin{color:var(--cinnabar)}
.jade{color:var(--jade)}
.gold{color:var(--gold)}
.label{font-size:11.5px;letter-spacing:.14em;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sec-h{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.12em;color:var(--ink-2);margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.sec-h::after{content:"";flex:1;border-bottom:1px solid var(--rule);transform:translateY(-4px)}

/* ---------- buttons ---------- */
.btn{min-height:46px;border-radius:10px;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);font-weight:600;font-size:15px;padding:6px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.25;min-width:0;text-align:center}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.jade{background:var(--jade);border-color:var(--jade);color:var(--sheet)}
.btn.quiet{border-color:var(--rule);font-weight:500}
.btn.ghost{border-color:transparent;background:transparent;font-weight:500;color:var(--ink-2)}
.btn:disabled{opacity:.36;cursor:default}
.btn .sub{font-size:11.5px;font-weight:500;opacity:.8;font-variant-numeric:tabular-nums}
.btn.col{flex-direction:column;gap:0}
.btn.wide{width:100%}

/* ---------- HUD ---------- */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);margin-inline:-16px;padding:10px 16px 8px;border-bottom:1px solid var(--rule)}
#hud[hidden]{display:none}
.hud-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hud-day{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:.06em;white-space:nowrap}
.hud-day .tagline{font-size:12px;font-weight:500;color:var(--cinnabar);letter-spacing:.1em;margin-left:6px}
.track{display:flex;gap:4px}
.track span{font-family:var(--serif);font-size:12px;width:26px;height:22px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:4px;color:var(--ink-2)}
.track span.past{background:var(--shade);color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--rule)}
.track span.now{border-color:var(--jade);color:var(--jade);font-weight:700;background:var(--wash)}
.hud-stats{display:flex;align-items:center;gap:4px 10px;margin-top:6px;font-size:12.5px;flex-wrap:wrap}
.hud-stats b{font-size:16px;font-variant-numeric:tabular-nums}
.stone b{color:var(--gold)}
.xpbar{display:inline-block;width:34px;height:5px;border-radius:3px;background:var(--rule);vertical-align:middle;margin-left:4px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--jade)}
.dots{letter-spacing:0;color:var(--jade);font-size:11px}
.dots s{text-decoration:none;color:var(--rule)}
.stance{margin-left:auto;display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.stance button{border:0;background:transparent;padding:3px 8px;font-size:12px;color:var(--ink-2)}
.stance button.on{background:var(--ink);color:var(--sheet)}

/* ---------- title ---------- */
.title{padding-block:36px 20px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}
.title-v{writing-mode:vertical-rl;font-family:var(--serif);font-weight:900;font-size:clamp(54px,16vw,78px);line-height:1.05;letter-spacing:.12em;margin:0;justify-self:end}
.title-v small{display:block;font-size:.26em;font-weight:500;letter-spacing:.4em;color:var(--ink-2);margin-top:.6em}
.ticket{border:1px solid var(--rule);background:var(--sheet);padding:14px 14px 12px;border-radius:4px;position:relative;font-family:var(--serif);box-shadow:0 1px 0 var(--rule)}
.ticket .label{font-family:var(--sans)}
.ticket p.q{font-size:15px;line-height:1.9;margin-top:6px}
.ticket .left{margin-top:10px;font-size:22px;font-weight:700;color:var(--cinnabar);letter-spacing:.06em}
.ticket .seal{position:absolute;right:10px;bottom:10px;width:50px;height:50px;mix-blend-mode:var(--seal-blend);opacity:.9}
.lede{font-size:15px;line-height:1.9;margin-top:4px}
.title-actions{display:grid;gap:10px;margin-top:22px}

/* ---------- cards & lists ---------- */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px}
.newscard{padding-block:12px;border-bottom:1px dashed var(--rule);display:grid;gap:4px}
.newscard:last-child{border-bottom:0}
.newscard .src{font-size:12px;letter-spacing:.1em;color:var(--ink-2)}
.newscard .txt{font-family:var(--serif);font-size:16px;line-height:1.75}
.newscard .meta{font-size:12.5px;color:var(--ink-2)}
.event{border:1px solid var(--cinnabar);border-radius:12px;padding:12px 14px;background:var(--sheet)}
.event h3{font-family:var(--serif);font-size:15px;color:var(--cinnabar);letter-spacing:.08em;margin-bottom:4px}
.event p{font-family:var(--serif);line-height:1.8}
.event .fxline{font-size:12.5px;color:var(--ink-2);margin-top:6px}

.choice{display:grid;grid-template-columns:1fr;gap:10px}
.go{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--ink);background:var(--sheet);width:100%}
.go .gt{font-family:var(--serif);font-weight:700;font-size:17px}
.go .gd{font-size:13px;color:var(--ink-2);line-height:1.5}
.go .arrow{margin-left:auto;font-size:18px;color:var(--ink-2)}
.go:disabled{opacity:.4}
.go.quiet{border-color:var(--rule)}
.places{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.place{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:10px 12px;text-align:left;display:grid;gap:2px;min-width:0}
.place b{font-family:var(--serif);font-size:15px}
.place span{font-size:12px;color:var(--ink-2);line-height:1.45}
.place:disabled{opacity:.38}
.pill{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.pill.cin{border-color:var(--cinnabar);color:var(--cinnabar)}
.pill.jade{border-color:var(--jade);color:var(--jade)}

/* ---------- encounter ---------- */
.who{display:flex;align-items:flex-start;gap:12px;padding-top:14px}
.who .nm{font-family:var(--serif);font-weight:900;font-size:24px;line-height:1.2;letter-spacing:.04em}
.who .rl{font-size:13px;color:var(--ink-2)}
.who .lv{font-size:12.5px;margin-top:2px}
.tea{margin-left:auto;display:grid;justify-items:center;gap:0;min-width:56px}
.tea svg{width:44px;height:44px}
.tea span{font-family:var(--serif);font-size:12.5px;letter-spacing:.2em}
.goods{margin-top:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:12px 14px;position:relative;overflow:hidden}
.goods::before,.goods::after{content:"";position:absolute;left:10px;right:10px;border-top:1px solid var(--rule)}
.goods::before{top:4px}.goods::after{bottom:4px}
.goods .g-name{font-family:var(--serif);font-weight:700;font-size:19px}
.goods .g-grade{font-size:12px;color:var(--ink-2);letter-spacing:.08em}
.goods .g-price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px}
.goods .g-price b{font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums}
.goods .g-mkt{font-size:12.5px;color:var(--ink-2)}
.g-link{border:0;background:none;padding:0;color:var(--jade);font-size:13px;text-decoration:underline;text-underline-offset:3px;text-align:left;font-family:var(--serif);font-weight:600}
.goods .g-link{margin-top:8px;font-family:var(--sans);font-weight:400}
.goods.done{padding-right:104px}
.lotpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lotpick button{border:1px solid var(--rule);background:var(--ground);border-radius:8px;padding:4px 8px;font-size:12.5px}
.lotpick button.on{border-color:var(--ink);background:var(--sheet);font-weight:600}
.seal-stamp{position:absolute;right:10px;top:50%;margin-top:-44px;width:88px;height:88px;mix-blend-mode:var(--seal-blend);pointer-events:none;animation:press .32s cubic-bezier(.2,1.6,.4,1) both}
@keyframes press{from{transform:scale(1.5) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:.92}}
.tbl .g-link{font-size:14.5px;color:var(--ink);text-decoration-color:var(--rule)}
@media (prefers-reduced-motion: reduce){.seal-stamp{animation:none;transform:rotate(-8deg);opacity:.92}}

.thread{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.ln{display:grid;gap:2px;max-width:92%}
.ln .sp{font-size:11.5px;letter-spacing:.12em;color:var(--ink-2)}
.ln .tx{font-family:var(--talk);font-size:17px;line-height:1.7}
.ln.me{align-self:flex-end;text-align:right}
.ln.me .tx{font-family:var(--sans);font-size:14.5px;color:var(--ink-2)}
.ln.narr{max-width:100%}
.ln.narr .tx{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);line-height:1.8}
.ln.tell .tx{font-family:var(--serif);font-size:14.5px;color:var(--jade);line-height:1.8}
.ln.sys{max-width:100%;border:1px solid var(--rule);border-radius:10px;padding:8px 12px;background:var(--wash)}
.ln.sys .tx{font-family:var(--serif);font-size:14.5px;line-height:1.8}
.ln.res{max-width:100%;border-top:1px solid var(--rule);padding-top:10px}
.ln.res .tx{font-family:var(--serif);font-size:15.5px;line-height:1.85}

/* ---------- bottom bar ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ground);border-top:1px solid var(--rule);padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
#bar[hidden]{display:none}
.bar-in{max-width:560px;margin:0 auto;display:grid;gap:8px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.acts .btn{min-height:44px;font-size:14.5px;padding:4px 6px}
.decide{display:grid;grid-template-columns:1.4fr 1fr;gap:6px}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.nav button{border:0;background:transparent;padding:6px 0 2px;font-family:var(--serif);font-size:14px;color:var(--ink-2);border-radius:8px;min-height:40px}
.nav button.on{color:var(--ink);font-weight:700;background:var(--sheet);box-shadow:inset 0 -2px 0 var(--jade)}
.nav button em{font-style:normal;display:block;font-size:10.5px;font-family:var(--sans);letter-spacing:.1em;opacity:.8}

/* ---------- sheet ---------- */
.veil{position:fixed;inset:0;background:rgba(10,16,15,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ground);width:100%;max-width:560px;max-height:84vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule)}
.sheet h2{font-family:var(--serif);font-size:20px;margin-bottom:4px}
.opt{display:grid;gap:2px;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--ink);border-radius:12px;background:var(--sheet);margin-top:8px}
.opt b{font-family:var(--serif);font-size:16px}
.opt span{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.opt:disabled{opacity:.4}
.opt.danger{border-color:var(--cinnabar)}
.lore{font-family:var(--serif);font-size:16px;line-height:1.95}
.lore-stat{font-size:12.5px;color:var(--ink-2);letter-spacing:.04em;border-block:1px solid var(--rule);padding-block:6px;margin-block:8px 10px}
.hidden-line{margin-top:10px;padding-top:8px;border-top:1px dashed var(--rule);font-family:var(--serif);font-size:15px;line-height:1.85}
.hidden-line .label{display:block;color:var(--jade)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:500;font-size:11.5px;letter-spacing:.1em;color:var(--ink-2);text-align:left;padding:6px 4px;border-bottom:1px solid var(--rule)}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .nm{font-family:var(--serif);font-weight:600}
.up{color:var(--cinnabar)} .down{color:var(--jade)}
.tbl-wrap{overflow-x:auto}

/* ---------- people & codex ---------- */
.person{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.person .ph{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.person .ph b{font-family:var(--serif);font-size:18px}
.person ul{margin:0;padding-left:1.1em;font-size:13.5px;line-height:1.7}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags button{border:1px solid var(--rule);background:var(--ground);border-radius:999px;padding:2px 10px;font-size:12.5px}
.tags button.on{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
textarea{width:100%;min-height:52px;border:1px solid var(--rule);border-radius:8px;background:var(--ground);color:var(--ink);font:14px/1.6 var(--sans);padding:6px 8px;resize:vertical}
.codex{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.codex button{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:10px;text-align:left;display:grid;gap:2px;min-width:0}
.codex button b{font-family:var(--serif);font-size:15px}
.codex button span{font-size:11.5px;color:var(--ink-2)}
.codex button.lock{opacity:.45}

/* ---------- night & end ---------- */
.night{padding-top:18px}
.night h2{font-family:var(--serif);font-size:24px;letter-spacing:.08em}
input[type=range]{width:100%;accent-color:var(--jade)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
.check input{margin-top:4px;accent-color:var(--jade);width:18px;height:18px}
.big-num{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--serif)}
.grade{font-family:var(--serif);font-weight:900;font-size:44px;color:var(--cinnabar);letter-spacing:.1em}
.truth{display:grid;gap:4px;padding:10px 0;border-bottom:1px dashed var(--rule)}
.truth b{font-family:var(--serif);font-size:15.5px}
.truth .t3{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--barh) + 14px);z-index:35;background:var(--ink);color:var(--sheet);padding:8px 14px;border-radius:999px;font-size:13.5px;max-width:88vw;text-align:center}

/* ---------- v0.2: intel ledger, market day, notes ---------- */
.nav{grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button.new em{color:var(--cinnabar);opacity:1}
.ln.note{max-width:100%;align-self:center}
.ln.note .tx{font-family:var(--sans);font-size:12px;letter-spacing:.08em;color:var(--jade);border:1px dashed var(--jade);border-radius:999px;padding:1px 10px}
.place.hot{border:1.5px solid var(--cinnabar)}
.place.hot b em{font-style:normal;font-family:var(--sans);font-size:11px;color:var(--cinnabar);border:1px solid var(--cinnabar);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:2px}
.intels{display:grid}
.intel{padding:10px 0;border-bottom:1px dashed var(--rule);display:grid;gap:4px}
.intel:last-child{border-bottom:0}
.intel .it{font-family:var(--serif);font-size:15px;line-height:1.75}
.intel .im{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.opt .it{font-family:var(--serif);font-size:13.5px;color:var(--ink);line-height:1.6}
.evid{margin:4px 0 0;padding-left:1.2em;font-size:14px;line-height:1.8;font-family:var(--serif)}
details summary{cursor:pointer}
.tbl tr.tap{cursor:pointer}
.tbl tr.tap td:first-child{text-decoration:none}
.lesson summary{font-size:12.5px;color:var(--jade);margin-top:2px}
.lesson p{font-family:var(--serif);font-size:14px;line-height:1.85;margin-top:4px}
.t3{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- ink icons ---------- */
.ico{width:34px;height:34px;flex:none;color:var(--ink);vertical-align:middle}
.ico.sm{width:22px;height:22px;margin-right:4px}
.ico.lg{width:52px;height:52px}
.goods .g-name{display:flex;align-items:center;gap:10px}
.g-link.ilink{display:inline-flex;align-items:center;gap:2px}
.codex button{grid-template-columns:auto 1fr;column-gap:8px;align-items:center}
.codex button .ico{grid-row:span 2;width:32px;height:32px}
.codex button.lock{grid-template-columns:1fr}
.lore-h{display:flex;align-items:center;gap:10px}
.tbl .nm .ico.sm{margin-right:2px}

/* ---------- ink portraits ---------- */
.face{flex:none;color:var(--ink)}
.face.big{width:64px;height:75px;margin-right:2px;margin-top:-4px}
.face.tiny{width:20px;height:23px;vertical-align:-6px;margin-right:4px}
.ln.me .face.tiny{align-self:flex-end}
.ln.me{display:flex;align-items:flex-start;gap:4px;justify-content:flex-end}
.event.withface{position:relative;padding-right:64px}
.face.evface{position:absolute;right:8px;top:10px;width:48px;height:56px}
.hud-day small.mon{font-size:12px;font-weight:500;color:var(--ink-2);margin-right:6px;letter-spacing:.08em}
.event.finale{position:relative;padding:14px 16px 20px;border-width:2px}
.event.finale h3{font-size:18px;margin-bottom:8px}
.event.finale p+p{margin-top:10px}
.event.finale .seal-stamp{position:static;display:block;width:64px;height:64px;margin:12px 0 0 auto;transform:rotate(-8deg)}

</style>
<main class="wrap">
  <header id="hud" hidden></header>
  <div id="app" aria-live="polite"></div>
</main>
<div id="bar" hidden></div>
<div id="sheet" hidden></div>
<script>
(() => {
'use strict';
/* ================= data ================= */

不能收。」「3/18：收了。霜華整晚沒睡。」「3/19：霜華說，要是出事，帶衡去找她以前隊上的人。」那天，你爸把箱子跟這幾頁交給姚四。3月21日天還沒亮，派出所就進了店裡的倉庫。"},"shuanghua":{"title":"霜華","need":{"flag":["mang_told_mother"]},"text":"你媽媽叫霜華，是玄霜巡守隊最後一批隊員——那是一支以前專門看守北礦舊坑道的小隊，三十年前解散了。三回結是她教你爸打的。她以前的隊友，在舊公路市場擺了十二年燈攤，等一個姓許的孩子。盲婆婆說，你媽走的那年，不是你們家說的那樣。"},"twoledgers":{"title":"兩本帳","need":{"has":{"zhangce":1,"zhangye":1}},"text":"你爸的帳上寫：「災後89年3月，收寒鐵三百公斤，付靈石四十。」錢家店的帳頁寫：「災後89年3月，出寒鐵三百公斤給許家，收四十。另，周，二十。」同一筆生意，兩邊都記了。多出來的那一筆，只記在一邊。"},"xuanshuang":{"title":"三回結","need":{"flag":["mang_saw_jiansui","mang_saw_yupai"]},"text":"一條燒焦的編繩，一塊刮掉名字的隊牌，一盞會讓人特別注意到別人小動作的燈。盲婆婆說，打三回結的最後一個人，是她隊上年紀最小的那個。她問你，長生當鋪那個人，今年還會不會來看燈。"}},"endings":{"top":"這個月，你看穿的比被騙的多。長生當鋪的字條準時塞進門縫：「許先生，尚餘一年又五個月。」你把字條摺好，壓在那本缺頁的帳冊底下。","mid":"規費繳了，店還開著。長生當鋪的字條準時塞進門縫：「許先生，尚餘一年又五個月。」日子還長，也不長。","low":"錢不語替你墊了規費。他走的時候，在門口多站了一會兒，看了看許家店的招牌。長生當鋪的字條準時塞進門縫：「許先生，尚餘一年又五個月。」","lowFooled":"這個月，你被騙的次數比你看穿的多。庫房裡堆著賣不出去的東西，有的金線是畫的，有的一沾水就化。長生當鋪的字條準時塞進門縫：「許先生，尚餘一年又五個月。」","teasers":[{"need":{"flag":["gave_knife"]},"text":"余小七抱著刀走之前，回頭說了一句：「老闆，刀柄的繩尾是被割斷的。我哥說過，割繩就是還活著。」"},{"need":{"flag":["zhou_warned"]},"text":"周警員燒掉的那頁紙，你還記得上面每一個字。他說，你爸當年，帳翻得太勤。"},{"need":{"flag":["yao_closed"]},"text":"姚四沒有再來過許家店。你爸的事，他知道的，比他說過的多。"},{"need":{"flag":["ahe_taken"],"not":["aheng_taken"]},"text":"阿蘅的屋子空了。後山住宅區的人說，她去黑市找過人，一個人去的。"},{"need":{"flag":["sold_info_pkg"]},"text":"白姐說替你壓著的那則消息，還在她的計算機底下。她沒說要壓多久。"},{"need":{"flag":["xuechan_sold_qian"]},"text":"錢不語被罰之後，逢人便說是有人害他。他沒說是誰，只是每天早上開門，第一眼看的是許家店。"},{"need":{"flag":["scar_grudge"]},"text":"門板上那道刀痕，你沒有刨掉。"},{"need":{"flag":["daoren_caught"]},"text":"那個道士包包裡的三張記憶卡，周警員說，是從同一個地方批來的。批貨的人，就在聚落裡。"},{"need":{"flag":["gave_tie_lingsui"]},"text":"鐵師傅的爐子，這幾天夜裡都沒熄。牆上那把二十年沒開刃的刀胚，不見了。"},{"need":{"flag":["lost_big_deal"]},"text":"阿福說的那筆大生意，錢家店接了。"},{"need":{"flag":["passed_test"],"not":["lost_big_deal"]},"text":"阿福說，下個月管理處有一筆大生意。周警員記得你退回去的那四十五塊。"},{"need":{"flag":["aheng_entrust"],"not":["betrayed_aheng","aheng_leak"]},"text":"阿蘅說她信你一次。聚落裡，肯信人一次的人不多。"}],"next":"寒潭會開始追查失物，黑市的門對你半開，錢不語的笑容沒有變。","m2":{"top":"這個月，聚落裡的人開始知道，許家店的老闆不好騙。長生當鋪的字條準時塞進門縫：「許先生，尚餘{left}。」你把它跟那幾頁帳紙壓在一起。","mid":"規費繳了，店還開著。長生當鋪的字條準時塞進門縫：「許先生，尚餘{left}。」十二年前的帳，還差幾筆。","low":"錢不語又在門口站了一會兒，看著許家店的招牌。長生當鋪的字條準時塞進門縫：「許先生，尚餘{left}。」","lowFooled":"這個月，你被騙的比看穿的多。長生當鋪的字條準時塞進門縫：「許先生，尚餘{left}。」","next":"北邊的霜，已經在路上了。","teasers":[{"need":{"flag":["mang_told_mother"]},"text":"盲婆婆說，你媽走的那年，不是你們說的那樣。她說下個月，要帶你去一個地方。"},{"need":{"flag":["got_pages"],"not":["mang_told_mother"]},"text":"帳紙上寫著：「要是出事，帶阿衡去找她老隊友。」你媽的老隊友，在聚落裡等了你十二年——你還不知道是誰。"},{"need":{"flag":["scar_caught"]},"text":"疤臉在管理處只說了一句話：「保冷盒不是我要的。是有人出錢，要那個年輕人回不去寒潭會。」"},{"need":{"flag":["xiaoliu_truth"],"not":["scar_caught"]},"text":"余小六還躲在南稜。疤臉也還在找他。"},{"need":{"flag":["qian_confronted"]},"text":"錢不語那天在門口說的話，你想了一整夜。他沒說自己是被冤枉的，他說的是「你爸要是有你一半小心」。"},{"need":{"flag":["zhang_exposed"]},"text":"張主任交代了藥行帳外的兩份築基藥。買藥的人是誰，他咬死不說。"},{"need":{"flag":["took_zhang_money"]},"text":"你收了張主任的四十塊。這個人情，他記著，你也記著。"},{"need":{"flag":["knows_raid"],"not":["qian_confronted"]},"text":"白姐說，那天清早，錢不語在對街站到天亮。他在等什麼？"},{"need":{"flag":["siti_caught"]},"text":"有人說，十二年前，許家店也是這樣被查的。一模一樣。"},{"need":{"flag":["did_big_deal"]},"text":"阿福說，北礦的閘門修好了。周警員下個月還有生意，這回要的是別的東西。"}]},"m3":{"top":"從四月到結霜，你看穿的比被騙的多。","mid":"四天過去了。聚落還在，許家店也還在。","low":"錢不語的借據還壓在櫃上。他這幾天沒來討，誰都沒有心思討帳。","lowFooled":"從四月到結霜，你被騙的比看穿的多。慌的時候，人最好騙。","next":"坊市掌櫃・完。北邊的霜到底是什麼，一百年前那場災變到底是什麼，沒有人能拍胸脯說清楚。你可以從頭再開一次店，走另一條路、往另一個地方走深一點。","finale":[{"id":"lamp","need":{"flag":["finale_lamp"]},"title":"終局・守燈","seal":"守燈","visit":[{"need":{"flag":["qiyu_elder"]},"text":"第一天那杯淡茶，雪衣老人記著。往北的路上，他一句一句告訴你，你媽小時候怕冷，每年冬天都偷偷在燈芯邊上烤手。"},{"need":{"flag":["mang_north"]},"text":"盲婆婆走在你身邊，手搭在你的肩上。她看不見路，可她一步都沒有踩錯。"},{"need":{"flag":["tie_xuanshuang"]},"text":"鐵師傅揹著那把刻著「玄霜」的刀，走在最後面。小石頭要跟，被他一句話趕了回去。"},{"need":{"flag":["heard_vent"]},"text":"坑道裡的敲擊聲你聽過——在柵欄外那個通風口。走進來以後，它停了一下，像是知道有人來了，然後又開始敲，比較慢。"},{"need":{"flag":["saw_frost_source"]},"text":"你認得那道地裂。上一次你只敢在柵欄外面掰一塊霜晶，這一次你提著燈，從它旁邊走了下去。"},{"need":{"anyFlag":["saw_below_lights","stair_b1"]},"text":"雪衣老人問你有沒有去過西邊斷崖下面。你說去過。他點點頭：「那你知道，往下走的時候身體會變輕。這裡也一樣。不要被騙了，回來的時候要留力氣。」"},{"need":{"flag":["answered_fog"]},"text":"坑道裡起了一點霧。霧裡有人叫了一聲「阿衡」。這一次，雪衣老人替你應了：「他在這裡。」霧就散了。"}],"text":"北礦的舊坑道，十二年沒有人進去過。越往下走，耳朵越塞，鼻子裡有鐵味。牆上長滿了霜晶，一面一面，像鏡子。燈一照，每一面鏡子裡都有一個提燈的人，走路的速度跟你差一點點。\n坑道盡頭，什麼都沒有。沒有怪物，沒有裂開的天，也沒有帳冊。只有冷，一段鏽掉的軌道，和一個空著的燈座。燈座旁邊的水泥牆上，有人用油漆寫過字，大部分剝落了，只剩「2029」跟一個箭頭，箭頭朝下。\n你把燈放上去。燈芯亮了，是很淡的藍。霜，一寸一寸往後退。\n雪衣老人說，玄霜巡守隊守了幾十年，沒有一個人知道守的是什麼。有人說是一頭睡著的東西，燈一滅它就醒；有人說是災變那年留下來、還在運轉的什麼設備；也有人說什麼都沒有，燈只是讓人敢在這裡站著。他說他年輕的時候三種都信過。\n你在燈邊坐了一夜。天快亮的時候，你看見對面那面霜晶裡，有一個人朝你點了點頭。你分不清那是你媽，還是你自己的影子。\n回到聚落，門縫裡塞著長生當鋪的字條：「許先生，尚餘——」後面的字，被霜糊住了，怎麼也看不清。\n"},{"id":"ledger","need":{"flag":["finale_ledger"]},"title":"終局・清帳","seal":"清帳","visit":[{"need":{"flag":["qian_confronted"]},"text":"錢不語在寒漪面前，把十二年前那三百公斤寒鐵的來路，一筆一筆說了。說完，他看著許家店的招牌：「你爸當年，要是有你一半小心就好了。」這一回，他沒有笑。"},{"need":{"flag":["zhang_exposed"]},"text":"張主任的口供也在卷宗裡。藥行帳外的兩份築基藥，十二年來，有一半送進了管理處。"},{"need":{"anyFlag":["scar_caught","lu_knows_scar"]},"text":"陸調查員把北林的案子並了進來。沈青的識別證放在寒漪面前，塑膠殼上還有一道刮痕。"},{"need":{"flag":["meng_fair"]},"text":"孟太太也來了。她說她先生死在北礦那天，礦上點貨，少了三百公斤寒鐵。"},{"need":{"flag":["saw_miner_names"]},"text":"你提起紀念碑上那個油漆寫的名字：孟家和。寒漪讓人把它抄進卷宗，說等北礦封好了，要請石匠補刻。"},{"need":{"flag":["played_tape"]},"text":"你把那捲錄音帶的事告訴寒漪。她聽到那句「專家表示，目前還無法確定」，笑了一下，笑得很累：「一百年了，還是這句。」"},{"need":{"flag":["saw_lab"]},"text":"你說了斷崖下面B2-17那間實驗室。葉理事沉默了很久，說寒潭會的檔案裡也有一模一樣的句子：「找不到證據，也找不到相反的證據。」他們抄了一百年。"},{"need":{"flag":["lin_theories"]},"text":"林老師託你把她那面黑板抄下來交給寒漪。寒漪看完，在最下面加了一行：「以上皆非，或以上皆是。」"}],"text":"寒漪在活動中心前面的空地上，把十二年前許家那件案子，從頭唸了一遍。周正被停職，錢家店的門貼了封條。許家店的招牌，有人重新上了漆。\n然後寒漪帶著寒潭會的三位金丹級的人，去了北礦。他們沒有讓任何人跟著。\n三天後，霜停在聚落入口那根舊電線桿前面，再也沒有往前一步。寒潭會貼了公告：北礦舊坑道坍塌，已經用水泥和鋼梁封住，聚落無虞。\n公告上沒有寫「封住」的是什麼。陸調查員私下跟你說，他們在坑道裡看到一排排生鏽的機櫃，有人說那就是災變的源頭；可葉理事說，機櫃全是空殼，真正冷的地方在更下面，下面沒有燈也沒有路。兩個人都沒說自己確定。\n夜裡關了店，你有時候會把耳朵貼在櫃上那塊寒鐵上。很遠很遠的地方，有東西在敲，一下，一下，很有耐心，像在對帳。\n長生當鋪的字條照常塞進門縫：「許先生，尚餘一年又三個月。」帳清了一半。另一半，還在北邊。\n"},{"id":"missed","need":{"flag":["missed_visit"]},"title":"終局・典當（空櫃）","seal":"典當","text":"第四天中午前，你不在店裡。回來的時候，櫃上擺著兩個喝空的茶杯，和一個紅色信封的拜訪信。杯底結著一圈薄冰。\n那天夜裡，長生當鋪的黑門開了一整夜。天亮的時候，霜退了，退得乾乾淨淨，像從來沒來過。長生當鋪的門，也不見了，那面牆上只有一片白。\n門縫裡的字條上，只有四個字：「尚餘：無期。」你不知道那是說你自由了，還是說你的帳，已經不歸你管了。\n"},{"id":"pawn","need":{"flag":["finale_pawn"]},"title":"終局・典當","seal":"典當","visit":[{"need":{"flag":["sold_lamp"]},"text":"你的狐尾燈，掛在長生當鋪的當票庫裡。燈還亮著，只是照的人，換了。"},{"need":{"flag":["pawned_sign"]},"text":"許家店的招牌，也在當票庫裡。門口上方那塊白，一直沒有補上。"},{"need":{"flag":["elder_turned_away"]},"text":"雪衣老人走的時候，沒有再看你。你想起第一天那杯沒倒的熱水。"},{"need":{"flag":["finale_refused"]},"text":"他們走後，你一個人把四個茶杯洗了。杯底的冰，到晚上才化。"},{"need":{"anyFlag":["saw_water_wall","saw_sea_fall"]},"text":"當鋪老闆從你門口經過的時候，身上有海的味道。你想起隧道盡頭那面水牆，想起斷崖外那片一直往下流的海。"},{"need":{"flag":["donated"]},"text":"林老師把你捐的那幾樣東西擺在舊物室最顯眼的一格，旁邊寫著：「它們還在等一個解釋。我們也是。」"}],"text":"兩位客人走後，長生當鋪的老闆一個人往北去了。有人說，他帶著一整箱當票。有人說，箱子是空的。\n那一夜，北邊亮了一下，不是燈的顏色。第二天，霜退了，退得乾乾淨淨。礦上的人說，舊坑道塌了，塌得連入口都找不到。\n長生當鋪的黑門不見了，那面牆上只剩一片白。聚落裡押過壽命的人，都在那天早上收到一張字條，上面只有四個字：「尚餘：無期。」\n有人說，那是長生當鋪替所有人還了帳。有人說，霜就是利息，利息收完了，本金也收走了。有人說，北邊那台一百年沒停過的機器，終於停了。也有人說，什麼都沒有發生，只是天氣轉暖了。\n你把那張字條壓在帳冊底下。每天早上開門，你都會多等一會兒，看門縫裡還會不會有東西塞進來。\n"}],"teasers":[{"need":{"flag":["qiyu_elder"]},"text":"第一天那杯熱茶，是你這輩子泡過最淡的一杯，也是最貴的一杯。"},{"need":{"flag":["stone_crystal_fair"]},"text":"小石頭用你給的三十塊，給鐵師傅買了一袋好炭。爐子又燒了一整夜。"},{"need":{"flag":["bought_fake_pass"]},"text":"你買的那塊避難名額木牌，後來拿去墊了桌腳。"},{"need":{"flag":["fake_pass_exposed"]},"text":"那天被你拆穿的假會員，在聚落入口被三家買了牌子的人堵住了。"},{"need":{"flag":["humble_baitie"]},"text":"葉理事後來跟人說，聚落裡有個才吐納幾層的店老闆，連元嬰級的人的拜訪信都敢推。他說的時候在笑。"},{"need":{"flag":["saw_from_below"]},"text":"你知道從斷崖下面往上看，聚落像一個很小的星座。你店裡那一點燈，是其中一顆。有時候關店前，你會想：下面的人，現在是不是也在看。"},{"need":{"anyFlag":["saw_sea_fall","saw_hanging_ship"]},"text":"你有時候會想起斷崖外的海。流了一百年，海面沒有低一公分。水去了哪裡，跟霜從哪裡來，也許是同一個問題，也許不是。"},{"need":{"flag":["answered_fog"]},"text":"那天霧裡叫你的聲音，你後來再也沒聽過。少掉的那一點東西，你一直沒想起來是什麼。"},{"need":{"flag":["fog_bus_wait"]},"text":"舊公路站牌下那張「末班車　已過」的紙，一直沒有人撕。"},{"need":{"flag":["saw_fog_lights"]},"text":"寒潭的霧裡，今年又多了兩盞燈。釣魚的阿伯說，他數到第四十一盞了。"},{"need":{},"text":"後來有人問你，北邊到底是什麼。你把封印、礦脈、舊時代的機器、當鋪的帳，這幾種說法都講了一遍，又說：「我只知道我那幾天看見的。」對方不太滿意。你也是。"}]}},"items":{"chiyan":{"name":"赤炎草","cat":"herb","unit":"株","grade":"異化植物","base":12,"perish":30,"stat":"年份 10～80 年｜採下後鮮度 30 天｜退燒、暖身藥的主料","text":"長在地熱裂縫邊，根扎在燙石頭裡，葉背有頭髮一樣細的金線。老人說每長十年多一道金線。大家數金線定價，所以有人學會了畫。","hidden":[{"label":"吐納六層可見","need":{"realm":6},"text":"地熱一旺，這種草就早熟。早熟的金線一樣齊，藥效只有六成。"}],"sell":["huichun","walk"]},"dingshen":{"name":"定神香","cat":"incense","unit":"束","grade":"日用品","base":25,"perish":null,"stat":"一束十支｜不壞｜靜坐時點，修行進度加四成","text":"點一支，大概能讓人靜下來兩個小時。聚落裡練吐納的人幾乎都在用，所以它從不缺貨，也很少漲價。哪天定神香漲了，通常不是香少了，是很多人睡不著。","sell":["huichun","walk"]},"bishui":{"name":"防水貼","cat":"talisman","unit":"張","grade":"手工品","base":8,"perish":null,"stat":"存放不當會受潮｜過溪、下隧道必備","text":"蠟紙一層一層壓出來，邊上用紅墨標日期。受潮的防水貼，紅墨邊緣會暈開一圈很淡的紅。做的人都知道這件事，所以賣的時候不太讓你對著光看。","sell":["walk"]},"langya":{"name":"鐵背狼牙","cat":"beast","unit":"顆","grade":"異變動物材料","base":6,"perish":null,"stat":"不壞｜打刀、入藥都用得到","text":"北林那種背上長出鐵灰色硬毛的狼。牙根如果帶血絲，表示取的時候狼還沒死透。獵人說活取的牙比較硬，藥師說活取的牙入藥會苦。兩邊都在買，所以獵人不急著先殺狼。","sell":["tie","huichun","walk"]},"hantie":{"name":"寒鐵","cat":"ore","unit":"公斤","grade":"礦石（原礦）","base":9,"perish":null,"stat":"不壞｜打刀、修工具的主料｜原礦，還沒煉","text":"北礦挖出來的鐵礦石，顏色像積水。冬天握在手裡不冰——冰是被它吸走了。礦歸寒潭會管，聚落裡流通的寒鐵，每一公斤都要經過登記。帳面上是這樣。","sell":["tie","walk"]},"liaoshang":{"name":"療傷藥","cat":"pill","unit":"瓶","grade":"藥品","base":18,"perish":null,"stat":"止血、接筋，內傷可以撐三天","text":"要出聚落的人通常會買兩瓶，買了又捨不得用。所以療傷藥最常被找到的地方，是沒回來的人身上。","sell":["huichun","walk"]},"yangqi":{"name":"養氣錠","cat":"pill","unit":"顆","grade":"藥品","base":22,"perish":null,"stat":"靜坐時吃，修行進度＋18｜連續吃，效果減半","text":"幫身體在一個晚上適應多一點。藥行說一晚一顆就好，大家總想一晚兩顆，所以第二顆的效果，大多變成了副作用。","sell":["huichun","walk"]},"xuechan":{"name":"雪蟾酥","cat":"spirit","unit":"盒","grade":"異常物","base":70,"perish":7,"stat":"七天後化成清水，保冷盒只能延緩｜療傷用的好東西","text":"寒潭水庫那種白色蟾蜍耳後分泌出來的東西，一隻蟾蜍一輩子只出一點點，出完就死。七天就化成清水，寒潭會用保冷盒封著，也只能多留幾天。會裡的帳記得很清楚：每一點都有去處。","hidden":[{"label":"吐納六層可見","need":{"realm":6},"text":"表面如果有細紋像冰裂，表示凝成不到十天。"}],"sell":[]},"lingsui":{"name":"地火靈髓","cat":"spirit","unit":"塊","grade":"異常物","base":60,"perish":null,"stat":"打刀淬火、藥行保溫","text":"地熱裂縫附近撿到的石頭，灰得像死灰，石心一線暗紅。離開裂縫以後，白天是冷的，晚上會自己回溫。沒有人知道熱是從哪裡來的。","sell":["huichun","tie"]},"duanshui":{"name":"斷水刀（殘）","cat":"weapon","unit":"把","grade":"刀具","base":10,"perish":null,"stat":"有修補痕","text":"刀身有一道舊裂，被人用銅仔細補過，補痕磨得幾乎看不見。補刀的人手藝很好，好到願意替一把只值十塊靈石的刀花三天。除非那道裂痕本身，就是要藏起來的東西。","hidden":[{"label":"吐納六層可見","need":{"realm":6},"text":"裂痕的走向，像是被一種專門撬開保冷盒鎖扣的工具硬扳出來的。"}],"sell":["tie","walk"]},"duandao":{"name":"寒鐵短刀","cat":"weapon","unit":"把","grade":"刀具","base":40,"perish":null,"stat":"鐵師傅打的｜不壞","text":"鐵師傅打的刀，不好看。刀背厚、刀刃薄，握把纏得很緊。他說好看的刀是給人看的，他的刀是給人用的。","sell":["tie","walk"]},"yujian":{"name":"空白記憶卡","cat":"tool","unit":"張","grade":"舊時代零件","base":40,"perish":null,"stat":"據說接上能用的讀卡機，三天就讀得出來","text":"指甲大小的舊時代記憶卡。賣的人說裡面存著某個老前輩留下的修行方法，只要找到還能用的讀卡機，連續讀三天就會出來。聚落裡這種卡很多，找得到讀卡機的人很少，所以騙子從來不缺生意。偶爾，也真的有一張讀得出東西。","sell":["walk"]},"zhuji":{"name":"築基藥","cat":"pill","unit":"份","grade":"管制藥品","base":600,"perish":null,"stat":"從吐納進入築基的關鍵藥｜這一季已經配完","text":"一份築基藥，是一個普通人半輩子的存款，或是一個寒潭會正式會員一年的配額。回春藥行每一季只出九份，從不多一份。據說是配方限制。據說。","hidden":[{"label":"看過藥行舊帳可見","need":{"flag":"zhang_exposed"},"text":"去年第三季那一批，出了十一份。"}],"sell":[]},"hudeng":{"name":"狐尾燈","cat":"tool","unit":"盞","grade":"獨一件","base":30,"perish":null,"stat":"只有這一盞｜擺在店裡，比較容易注意到客人的小動作","text":"燈罩內側是一圈很軟的毛，盲婆婆說是狐狸尾巴。點起來，燈影會輕輕擺，像燈後面有什麼在呼吸。在這盞燈旁邊，你比較容易注意到別人手指停了一下、眼睛多看了一眼。它不會告訴你誰在說謊——那還是你自己判斷。盲婆婆攤子上掛的都是普通燈，這一盞她從來沒掛出來過。","sell":[]},"zhangce":{"name":"缺頁帳冊","cat":"story","unit":"本","grade":"雜物","base":0,"perish":null,"stat":"不能賣｜市價幾乎是零","text":"一本店家的流水帳，字很工整，最後七頁被整齊裁掉。剩下的每一筆都對得上，只有一筆：「災後89年3月，收寒鐵三百公斤，付靈石四十。」那一年，四十塊靈石只買得到三十公斤。","hidden":[{"label":"你讀的時候","need":{"flag":"got_box"},"text":"你認得這個字。是你爸的。"}],"sell":[]},"zhangye":{"name":"一頁帳紙（抄本）","cat":"story","unit":"頁","grade":"雜物","base":0,"perish":null,"stat":"你自己抄的","text":"錢不語那個包裹裡，包寒鐵的襯紙是從一本舊帳冊撕下來的。你抄了一份：「災後89年3月，出寒鐵三百公斤給許家，收四十。另，周，二十。」字圓圓的，不是你爸的。","sell":[]},"jiansui":{"name":"半截編繩","cat":"story","unit":"條","grade":"雜物","base":0,"perish":null,"stat":"不能賣","text":"青色細繩編的，尾端燒焦。繩結是玄霜巡守隊的「三回結」，那支隊伍三十年前就解散了，現在幾乎沒人會打這種結。舊貨堆不會告訴你它從哪裡來。","hidden":[{"label":"盲婆婆摸過以後","need":{"flag":"mang_saw_jiansui"},"text":"她說，會打這種結的人，最後一個是她隊上年紀最小的那個。"}],"sell":[]},"yupai":{"name":"霜紋隊牌","cat":"story","unit":"塊","grade":"雜物","base":0,"perish":null,"stat":"不能賣","text":"一塊白色石牌，一面刻霜紋，一面刻名字。名字被人用指甲一點一點刮掉了。刮的人很有耐心，或者很恨。","hidden":[{"label":"盲婆婆摸過以後","need":{"flag":"mang_saw_yupai"},"text":"她摸了很久，說了一個名字，然後問你：「長生當鋪那個人，今年還會來看燈嗎？」"}],"sell":[]},"dangpiao":{"name":"長生當鋪當票","cat":"story","unit":"張","grade":"不能交易","base":0,"perish":null,"stat":"不能交易","text":"紙已經黃了。上面寫：「今押壽命四十年，到期不贖，人死當絕。」簽名是你的名字。是你自己寫的，手抖得很厲害。沒有人說得清楚當鋪是怎麼把壽命拿走的，也沒有人敢不信。","sell":[]},"luopan":{"name":"尋脈羅盤","cat":"tool","unit":"個","grade":"工具","base":60,"perish":null,"stat":"中間的水銀不散｜指針會找礦脈","text":"看地脈的人用的羅盤，看起來像舊時代的登山指北針改的。中間那滴水銀聚著不散，指針自己會轉，轉到礦脈的方向就停。礦上的人說，好羅盤會記得主人最後一次指的方向。","hidden":[{"label":"吐納六層可見","need":{"realm":6},"text":"指針停的地方不是礦脈，是北礦一條封了十二年的舊坑道。"}],"sell":["walk"]},"yaopai":{"name":"寒潭會識別證","cat":"story","unit":"張","grade":"會員證件","base":0,"perish":null,"stat":"寒潭會制式｜背面有名字｜不能交易","text":"塑膠殼裡夾著手寫的卡片。會員出去辦事，證件不離身。證件在，人就在；證件不在，管理處就得派人去找。"},"sidai":{"name":"舊收納袋","cat":"tool","unit":"個","grade":"異常物","base":18,"perish":null,"stat":"裡面比外面大一點｜袋口的標記被挑掉了","text":"舊時代的登山收納袋，不知道什麼時候開始，裡面裝得下比外面看起來多一點的東西——多一點點而已，大概一個便當的量。沒有人知道為什麼。袋口的標記會告訴你主人是哪裡的人，所以撿到別人收納袋的人，第一件事就是挑掉標記。","sell":["walk"]},"canye":{"name":"帳冊缺頁","cat":"story","unit":"疊","grade":"雜物","base":0,"perish":null,"stat":"七頁｜是你爸的字｜最後兩頁燒焦了","text":"幾頁從帳冊上整齊裁下來的紙。字是你爸的，墨有深有淺，像是好幾天斷斷續續寫的。","hidden":[{"label":"你讀過了","need":{"flag":"got_pages"},"text":"「災後89年3月17日：老錢介紹寒鐵三百公斤，便宜，沒有登記印。周正說可以入帳。霜華說這批不能收。」「3/18：收了。霜華整晚沒睡。」「3/19：霜華說，要是出事，帶衡去找她以前隊上的人。」後面兩頁燒焦了，只剩一個「當」字。"}]},"shuangjing":{"name":"霜晶","cat":"spirit","unit":"塊","grade":"異常物","base":45,"perish":null,"stat":"拿著不會化｜貼著鐵會起霜｜出處：北礦底下","text":"六月從北礦流下來的東西。拿在手上它不會化，是你的手掌起霜。礦工說舊坑道裡牆上長滿這個，一面一面，像鏡子。","hidden":[{"label":"吐納六層可見","need":{"realm":6},"text":"對著光看，霜晶裡封著很細的線條，像帳，又像電路板。"},{"label":"林老師研究過","need":{"flag":"studied_shuangjing"},"text":"林老師把它放在舊溫度計旁邊一整晚。溫度計沒有變，霜晶旁邊的紙卻皺了。她說她不知道這代表什麼。"} ":"異物","base":9,"perish":null,"stat":"山上撿到的海貝｜裡面還是濕的","text":"在離海很遠很高的地方撿到的貝殼，殼裡還是濕的，有鹹味。老書上說山上找得到貝殼化石，可這不是化石。它新鮮得像是今天早上才被沖上來。","sell":["walk","lin"]},"chanke":{"name":"大蟬殼","cat":"relic","unit":"個","grade":"異物","base":14,"perish":null,"stat":"兩個拳頭大｜殼裡朝外長著苔","text":"一個比你拳頭還大兩倍的蟬殼，背上裂開的地方很新，裡面卻長滿了青苔，苔是往外長的。今年夏天還沒到。脫殼出去的那隻，不知道在哪裡。","sell":["walk","lin"]},"bijiben":{"name":"數字筆記本","cat":"relic","unit":"本","grade":"舊物","base":15,"perish":null,"stat":"寫滿倒數的數字｜最後一頁沒寫完","text":"一本學生用的橫線筆記本，每一頁都寫滿數字，一行比一行小：100、99、98……寫到最後一頁，停在「1」的一半——只寫了一撇。封面寫著「不要給媽媽看」。","hidden":[{"label":"林老師研究過","need":{"flag":"studied_bijiben"},"text":"林老師說，這種倒數本子舊物室裡有三本，筆跡都不一樣，倒數的起點也不一樣。有人說那時候大家都知道什麼要來；有人說那只是考試倒數。她把三本並排放著，沒有下結論。"}],"sell":["walk","lin"]},"luyin":{"name":"錄音帶","cat":"relic","unit":"捲","grade":"舊物","base":12,"perish":null,"stat":"標籤寫著「給阿嬤 過年」","text":"一捲很舊的錄音帶，比災變還舊，標籤上用原子筆寫著「給阿嬤 過年」。帶子還沒斷。聚落裡沒有能放的機器——有人說北礦辦公室有一台，也有人說早就壞了。","sell":["walk","lin"]},"qianshi":{"name":"籤詩","cat":"relic","unit":"張","grade":"舊物","base":5,"perish":null,"stat":"「第八十九籤」","text":"一張舊廟的籤詩，紅紙已經變成粉紅色。「第八十九籤：山高水遠路難行，回頭方見舊時燈。」聚落裡的人看到這張都會笑一下，然後不笑了。","sell":["walk","lin"]},"hongzhu":{"name":"黑玻璃珠","cat":"relic","unit":"顆","grade":"異物","base":32,"perish":null,"stat":"裡面映著別的地方","text":"彈珠大小的黑玻璃。湊近看，裡面映的不是你的臉，是一片沙灘、一排椰子樹，和很亮的天空。天空的顏色會跟著時間變——跟這裡的時間，差了大概三個小時。","hidden":[{"label":"林老師研究過","need":{"flag":"studied_hongzhu"},"text":"林老師說，舊物室收過一顆一模一樣的，映的是雪地。那顆後來被寒潭會借走，沒有還。"}],"sell":["walk","lin"]},"lengyu":{"name":"冷羽毛","cat":"relic","unit":"根","grade":"異物","base":20,"perish":null,"stat":"白色的長羽毛｜一直是冰的","text":"一根比手臂還長的白羽毛，在北礦柵欄外面撿到的。它一直是冰的，冰得剛剛好，不會凍傷人。聚落裡沒有人見過這麼大的鳥。也許它不是鳥的。","sell":["walk","lin"]},"zhibei":{"name":"指南針","cat":"relic","unit":"個","grade":"異物","base":18,"perish":null,"stat":"不指北｜永遠指向西邊斷崖下的同一個點","text":"一個舊登山指南針，指針不指北，固定指著西邊斷崖底下的某個地方。走到哪裡都一樣。拿著它走到斷崖邊，指針會往下傾。","hidden":[{"label":"林老師研究過","need":{"flag":"studied_zhibei"},"text":"林老師說，二十年前有人拿著一個同樣的指南針，順著斷崖邊的舊步道往下走。他回來過一次，說下面有路燈。之後就沒有再回來了。"}],"sell":["walk","lin"]},"fushi":{"name":"不沉的石頭","cat":"relic","unit":"顆","grade":"異物","base":24,"perish":null,"stat":"會浮在水上的灰石｜摸起來溫溫的","text":"寒潭水庫邊撿到的灰色石頭，放進水裡會浮起來，而且慢慢往水庫中間漂。撈起來是溫的，像剛被人握過。","sell":["walk","lin"]},"fapiao":{"name":"統一發票","cat":"relic","unit":"張","grade":"舊物","base":4,"perish":null,"stat":"2029年11–12月｜熱感紙居然沒褪色","text":"一張超商發票，買了一瓶礦泉水和一包衛生紙。期別是2029年11–12月。熱感紙放一百年早該全白了，這一張的字黑得像昨天才印。背面有人用原子筆寫了六個數字，旁邊打了一個勾。","hidden":[{"label":"林老師研究過","need":{"flag":"studied_fapiao"},"text":"林老師說那六個數字，跟舊國小倉庫裡一份《2030年1月開獎號碼》剪報對得上——那期開獎，照理說根本沒有辦。剪報是誰剪的，沒人知道。"}],"sell":["walk","lin"]},"huangdeng":{"name":"黃燈燈罩","cat":"relic","unit":"個","grade":"異物","base":18,"perish":null,"stat":"紅綠燈的黃燈罩｜偶爾自己亮一下","text":"一個紅綠燈的黃色燈罩，背後沒有燈泡，沒有線。大概每隔一段時間，它會自己亮三秒，很平靜的黃光，像在提醒誰減速。亮的間隔不固定，可是每次亮之前，附近的狗都會先抬頭。","hidden":[{"label":"林老師研究過","need":{"flag":"studied_huangdeng"},"text":"林老師記了兩個禮拜的時間。它每次亮，都剛好是北礦那邊的風向轉南的時候。她說可能是巧合，然後在小卡上寫了「可能不是」。"}],"sell":["walk","lin"]},"jinianc":{"name":"畢業紀念冊","cat":"relic","unit":"本","grade":"舊物","base":10,"perish":null,"stat":"某國小第83屆｜團體照多一個位子","text":"一本泡過水又乾掉的畢業紀念冊。六年二班的團體照，第二排中間有一個空位，旁邊的同學都微微側身，像在讓位子給一個沒拍進去的人。名單上的名字數一數，比照片上的人多一個。","hidden":[{"label":"林老師研究過","need":{"flag":"studied_jinianc"},"text":"林老師把名單一個一個對。多出來的那個名字叫「林」——後面的字被水泡掉了。她說她不姓這個林，然後把紀念冊闔起來，很久沒說話。"}],"sell":["walk","lin"]},"fengling":{"name":"鐵管風鈴","cat":"relic","unit":"串","grade":"異物","base":16,"perish":null,"stat":"五根短鐵管｜沒有風也會響","text":"五根鏽掉的短鐵管，用釣魚線綁成一串。掛在室內、門窗全關，它還是會輕輕響，像外面有一陣你感覺不到的風。響的方向永遠是從北往南。","hidden":[{"label":"林老師研究過","need":{"flag":"studied_fengling"},"text":"林老師把它掛在教室裡，用手機錄了一晚。放慢八倍聽，鐵管撞出來的聲音裡，有一段很像有人在念數字。數到二十三就停了。"}],"sell":["walk","lin"]},"daoyu":{"name":"倒雨罐","cat":"relic","unit":"罐","grade":"異物","base":22,"perish":null,"stat":"倒過來的玻璃罐｜裡面是往上下的雨","text":"一個倒過來放的玻璃罐，罐口朝下，用保鮮膜封住。罐子裡的水珠一直從底部往上「落」，落到罐底（其實是上面）聚成一灘。你把罐子翻正，水就往另一邊落。它好像只認得一個方向，而那個方向不是地面。","hidden":[{"label":"林老師研究過","need":{"flag":"studied_daoyu"},"text":"林老師把罐子轉了一整圈，發現水永遠往同一個方向落——偏北、往上。她說那個角度，剛好對著北礦上空那道白線。"}],"sell":["walk","lin"]},"xiaozhong":{"name":"小銅鐘 "}},"fail":{"text":"你想再問，他已經把識別證收回懷裡：「不賣了。」他走得很快。"}}}},{"id":"m206","month":2,"title":"十二年前的事","npc":"bai","where":"tea","days":[2,5],"prio":7,"repeatable":true,"hook":{"t":"白姐","d":"白姐親自給你倒了茶，在你對面坐下。"},"side":"sell","item":"info","itemName":"一則十二年前的消息","price":40,"infoBarter":true,"truth":{"goods":"genuine","origin":"clean","intent":"plain"},"neutral":true,"openFace":"smile","open":"「許老闆這陣子在查你爸的事吧？我這裡有一則，十二年沒人買過。四十塊。或者——拿一則只有你知道的消息來換。」","ask":{"q":"為什麼十二年沒人買？","a":"「因為想知道的人，當年都不在聚落了。」","f":"smile"},"press":[{"q":"這則消息，是真的嗎？","a":"「聽雨茶館賣的東西，從來不保證是真的。但這一則，是我親眼看見的。」","f":"cold"}],"silence":"「……許老闆跟你爸一樣，想事情的時候，手指會敲櫃台。」","silenceFace":"smile","opts":{"deal":{"label":"付四十","text":"白姐收了靈石，聲音放得很低：「十二年前三月二十一，天沒亮，周正帶著人進了許家店的倉庫。告發的人沒有留名字。可那天清早，我看見錢老闆站在對街，一直站到天亮。那年秋天，錢家店多了一門寒鐵生意。」","fx":{"flag":["knows_raid"]}},"barter":{"text":"白姐聽完，點點頭，聲音放得很低：「十二年前三月二十一，天沒亮，周正帶著人進了許家店的倉庫。告發的人沒有留名字。可那天清早，我看見錢老闆站在對街，一直站到天亮。那年秋天，錢家店多了一門寒鐵生意。」","fx":{"flag":["knows_raid"]}},"decline":{"label":"不了","text":"白姐笑笑，替你把茶添滿：「想通了再來。這則消息，不會舊。」"}}},{"id":"m207","month":2,"title":"寒潭會派來的調查員","npc":"lu","where":"shop","days":[3,3],"prio":10,"side":"task","item":"xuechan","itemName":"上個月的雪蟾酥","truth":{"goods":"genuine","origin":"clean","intent":"test"},"lesson":"他問話的語氣不像在問，像在對帳——筆尖早就停在冊子上寫著字的那一行。聚落每一家他都問過，上個月見過那個保冷盒的人，他都問過了。說實話永遠不會錯；說謊，是賭他手上沒有別人的口供。","verdict":["deal","special"],"intro":"一個穿寒潭會深藍色制服的年輕人進了門，你看不出他的深淺。他把一本冊子放在櫃上，翻開。","openFace":"cold","open":"「寒潭會調查員，陸。上個月北林少了一盒雪蟾酥，一個年輕人沒回來。許老闆，上個月有沒有人拿雪蟾酥來過你店裡？」","ask":{"q":"陸調查員為什麼來問我？","a":"「聚落每一家，我都會問。你這間是第七家。」","f":"cold"},"press":[{"q":"那個年輕人，找到了嗎？","a":"「找到了。在北林的溪底。」他的語氣沒有變。","f":"cold"}],"silence":{"narr":"他也不說話，只是用筆尖輕輕點著冊子上的某一行，像在等你自己開口。","f":"cold"},"tells":[{"after":"open","need":-7,"text":"他問「有沒有人來過」的時候，筆尖已經停在冊子上的某一行了。那一行，寫著字。","f":"cold"}],"opts":{"deal":{"label":"照實說","text":"你把上個月看到的、聽到的，一五一十說了。陸調查員聽完，在冊子上記了一筆，合上：「許老闆是聚落裡第一個沒跟我繞彎子的。」","f":"neutral","fx":{"rel":{"lu":2},"rep":{"sect":1},"flag":["told_lu"],"mem":{"lu":"你把上個月雪蟾酥的事照實說了。"}},"extra":[{ 第四天我再來。帶著這盞燈。」","f":"shock","fx":{"flag":["qiyu_elder","elder_lamp"],"mem":{"xuelao":"狐尾燈照不出他的影子。他認得你媽的燈。"}}},"decline":{"label":"「小店不賣熱水。」","text":"老人點點頭，沒有說什麼，轉身走了。他站過的地方，柏油路面上結了一層薄霜，到中午都沒化。","fx":{"flag":["elder_turned_away"],"mem":{"xuelao":"他來要一杯熱水，你沒給。"}}}},"missed":{"flag":["elder_turned_away"]}},{"id":"m302","month":3,"title":"錢家店的避寒霜晶","npc":"qian","where":"shop","days":[1,2],"prio":9,"side":"sell","item":"shuangjing","qty":1,"price":60,"lot":{"q":0.05,"label":"錢家店的「霜晶」","flags":["fake"]},"truth":{"goods":"fake","origin":"clean","intent":"con"},"lesson":"真的霜晶放在手心不會化，貼在鐵上鐵會起霜；錢不語這一塊握一下就出水，是寒鐵屑包著冰過的玻璃。他說是「礦上的人拿出來的」，可礦上第一天就封了，誰都進不去。聚落在慌，最先賣「避難貨」的，通常是最不慌的人。","verdict":["decline","expose"],"openFace":"smile","open":"「許老弟，北邊的事聽說了吧？礦上冒出來的霜晶，戴在身上，冷氣就近不了身。我只剩這一塊，六十，算你自己人價。再過兩天，三百都買不到。」","ask":{"q":"礦上封了，霜晶怎麼出來的？","a":"「礦上的人拿出來的嘛。封之前拿的，封之前。」","f":"smile"},"press":[{"q":"封之前？哪一天封的？","a":"「前……前幾天。老弟，你管它哪天，東西是好東西。」","f":"smile"},{"q":"這麼好的東西，錢老闆自己不戴？","a":"「我？我有了，有了。」他拍拍胸口，那裡什麼都沒有。","f":"sweat"}],"silence":"「……五十。老弟，你爸要是在，早就買了。」","silenceFace":"smile","silenceDrop":50,"tells":[{"after":"press","need":-3,"text":"他說「有了」的時候，手在胸口拍了兩下。衣服底下是平的。","f":"uneasy"},{"after":"silence","need":-2,"text":"霜晶放在櫃上，底下慢慢洇出一小圈水。","f":"smile"}],"appraise":[{"realm":4,"text":"你握住它。一開始冰到手痛，握了十幾秒，指縫開始出水。外面一層寒鐵屑，底下是透明的——是玻璃。"}],"verify":[{"who":"tie","cost":0,"a":"「霜晶？真的那種，放在鐵上，鐵會起一層霜。放在手裡，它不會化，是你的手會起霜。」"},{"who":"bai","cost":5,"a":"「礦上第一天一早就封了，連陸調查員都進不去。這兩天聚落裡的霜晶，比礦上一年出的還多。」"}],"opts":{"deal":{"label":"買下","text":"錢不語把霜晶塞到你手裡，笑得很開：「老弟有眼光。」他走得很快。","fx":{"mem":{"qian":"末日當頭，賣給你一塊「霜晶」。"}}},"decline":{"text":"「好，好，那我找別家。」錢不語把霜晶塞回口袋，口袋濕了一塊。"},"expose":{"right":true,"label":"點破","text":"你把霜晶放在櫃上那塊寒鐵旁邊。鐵沒有起霜，霜晶底下倒是積了一灘水。錢不語看了一眼，笑容掛在臉上，掛了很久：「老弟，這年頭，大家都是想活命。」","f":"sweat","fx":{"rel":{"qian":-1},"rep":{"loose":1},"tag":{"loose":"眼尖"},"flag":["qian_crystal_exposed"],"mem":{"qian":"你當面點破了他的假霜晶。"}}}}},{"id":"m303","month":3,"title":"溪裡撿的冰石頭","npc":"stone","where":"market","days":[1,2],"side":"sell","item":"shuangjing","itemName":"一塊不化的冰石頭","qty":1,"price":6,"lot":{"q":1,"label":"小石頭撿的霜晶"},"truth":{"goods":"undervalued","origin":"clean","intent":"plain"},"lesson":"礦上的水流進北林溪，霜晶是順水沖下來的——不是偷的。它在太陽底下擺了一上午沒化，貼在鐵上鐵會起霜。小石頭只知道它「冰」，不知道它值多少。他說話顛三倒四，是因為怕被當成賊。","verdict":["special","expose"],"noJudge":["deal"],"openFace":"uneasy","open":"「老闆……一塊冰石頭，不會化。六塊……你要不要？我不是從礦上拿的，真的不是。」","ask":{"q":"哪裡撿的？","a":"「北林溪。溪水這幾天好冰，石頭縫裡卡著這個。我、我沒進礦，礦上有人守著。」","f":"uneasy"},"press":[{"q":"你怎麼一開口就說不是從礦上拿的？","a":"「因為……因為昨天有人說，拿礦上東西的都要抓。我怕。」他眼圈紅了。","f":"sad"}],"silence":"「……五塊也可以。鐵師傅說，冰的東西不能放在爐子旁邊，我沒地方放。」","silenceFace":"uneasy","tells":[{"after":"open","need":-2,"text":"他把冰石頭放在布上曬著。太陽已經很高了，石頭一點水都沒出。"}],"appraise":[{"realm":4,"text":"真的霜晶。你握在手裡，它不化，是你的掌心起了一層白。石面上有水流磨過的痕，是溪裡沖下來的。"}],"verify":[{"who":"tie","cost":0,"a":"「是霜晶。……那孩子沒偷。礦上的水，就是流進北林溪的。」"}],"opts":{"deal":{"label":"買下","text":"小石頭鬆了一口氣，把靈石數了兩遍：「老闆，你別告訴別人是我撿的。」","fx":{"mem":{"stone":"賣給你一塊溪裡撿的霜晶。"}}},"decline":{"text":"小石頭把冰石頭包起來，抱在懷裡，像抱著一塊燙手的東西。"},"expose":{"right":true,"label":"告訴他這是什麼","text":"你告訴他，這是霜晶，真的，值好幾十。小石頭張大了嘴，又摀住：「那我、我拿去給鐵師傅，他說要用它淬刀。」他跑了幾步，又跑回來：「老闆，溪裡還有好多，越往上游越冰。」","fx":{"rel":{"stone":2,"tie":1},"rep":{"loose":1},"tag":{"loose":"厚道"},"flag":["stone_crystal_told"],"mem":{"stone":"你告訴他那塊冰石頭的價值。"}}},"special":{"seal":"公道","label":"出公道價（三十）","price":30,"text":"「三十。」小石頭看著靈石，又看看你：「老闆，你上次也是這樣。」他把霜晶放下，跑去鐵師傅的攤子，一路都在笑。","fx":{"rel":{"stone":2,"tie":1},"rep":{"loose":1},"tag":{"loose":"厚道"},"flag":["stone_crystal_fair"],"mem":{"stone":"用三十塊買了他撿的霜晶。"}}}}},{"id":"m304","month":3,"title":"燈攤後面的門","npc":"mang","where":"market","days":[1,4],"prio":6,"need":{"anyFlag":["mang_told_mother","mang_saw_jiansui"]},"side":"task","item":"hudeng","itemName":"一盞沒點的燈","truth":{"goods":"genuine","origin":"clean","intent":"plain"},"neutral":true,"hook":{"t":"盲婆婆","d":"燈攤收了一半，盲婆婆坐在攤子後面，像是在等你。"},"openFace":"neutral","open":"「孩子，你來了。北邊的霜，你看見了吧。我說過，要帶你去一個地方。」","ask":{"q":"婆婆，北邊到底是什麼？","a":"「玄霜巡守隊守了幾十年的東西。守的是什麼，隊長沒說，隊長的隊長也沒說。我們只知道，燈不能滅。」","f":"think"},"press":[{"q":"我媽……她是怎麼走的？","a":"「十二年前，礦上也結過一次霜。你媽一個人提著燈進去，霜退了，她沒出來。聚落裡的人說她跟人跑了。我不信，也不敢說。」","f":"sad"},{"q":"那東西，是活的嗎？","a":"「我不知道。也許是一頭睡著的東西。也許是災變那年留下來、一直沒關掉的什麼。也許什麼都沒有，只有冷。」她停了一下：「長生當鋪那個人說，是一本帳。」","f":"think"}],"silence":"「……你媽那年，也是這樣不說話，想了一整夜。」","silenceFace":"sad","opts":{"decline":{"label":"再想想","text":"她點點頭，繼續纏燈罩：「第四天之前，想好。」"},"special":{"seal":"隨行","label":"跟她去","need":{"not":["lamp"]},"text":"盲婆婆收了攤，帶你穿過市場後面一條你從沒走過的小巷。巷底是一扇鐵門，門上用油漆畫著三回結。門後是一間空屋，地上一個燈座，燈座上放著一盞燈，燈罩內側是一圈軟毛——就是她攤上那盞從來不掀布的燈，原來一直擺在這裡。旁邊壓著一張紙，是你媽的字：「阿衡如果來，燈給他。」盲婆婆把燈放在你手心：「只有這一盞。孩子，第四天有人要來找你。到時候，你自己選。」","f":"cry","fx":{"flag":["mang_north","lamp"],"rel":{"mang":2},"give":[{"item":"hudeng","qty":1,"cost":0,"label":"霜華留下的狐尾燈"}],"mem":{"mang":"帶你去看了你媽留下的燈，把那盞唯一的狐尾燈給了你。"}}},"special2":{"seal":"隨行","label":"跟她去","need":{"flag":["lamp"],"not":["sold_lamp"]},"text":"盲婆婆收了攤，帶你穿過市場後面一條你從沒走過的小巷。巷底是一扇鐵門，門上用油漆畫著三回結。門後是一間空屋，地上一個空的燈座，燈座上有一圈很淺的印子，是你手上這盞燈放了很多年留下的。旁邊壓著一張紙，是你媽的字：「阿衡如果來，燈給他。」盲婆婆摸了摸你手上的燈：「它本來就是要給你的。孩子，第四天有人要來找你。到時候，你自己選。」","f":"cry","fx":{"flag":["mang_north"],"rel":{"mang":2},"mem":{"mang":"帶你去看了那盞燈原本的燈座。"}}}}},{"id":"m305","month":3,"title":"刀胚開刃","npc":"tie","where":"shop","days":[2,3],"prio":8,"need":{"anyFlag":["gave_tie_lingsui","stone_told","stone_fair","stone_apprentice","stone_crystal_told","stone_crystal_fair"]},"side":"task","item":"duandao","itemName":"一把開了刃的刀","truth":{"goods":"genuine","origin":"inheritance","intent":"plain"},"neutral":true,"intro":"鐵師傅第一次走進你的店。他手裡拿著一把刀，刀身上的煙燻擦掉了，露出兩個字。","openFace":"cold","open":"「……那把刀胚，開刃了。給你。」","ask":{"q":"刀上刻的是什麼字？","a":"「玄霜。」他停了很久：「我年輕時幫玄霜巡守隊打工具。隊上出事那年，我欠了一條命，躲到這裡，躲了二十年。」","f":"cold"},"press":[{"q":"為什麼給我？","a":"「你媽救過我。她走之前說，這把刀，等她兒子長大了再開刃。」他停了一下：「那孩子說你是好人。」","f":"sad"}],"silence":{"narr":"他也不說話，把刀放在櫃上，又把刀往你這邊推了推。","f":"cold"},"opts":{"deal":{"label":"收下","text":"你接過刀。刀不好看，刀背厚，刀刃薄，握在手裡是溫的——像是剛從爐子裡出來，又像是一直有人握著。鐵師傅點點頭，走了。","f":"smile","fx":{"flag":["tie_xuanshuang"],"give":[{"item":"duandao","qty":1,"cost":0,"label":"玄霜刀"}],"rel":{"tie":2},"mem":{"tie":"他以前幫玄霜巡守隊打工具。他把刻著「玄霜」的刀給了你。"}}},"decline":{"label":"請他留著","text":"「……也好。」鐵師傅把刀收回去：「用得著的時候，來找我。」","fx":{"flag":["tie_xuanshuang"],"rel":{"tie":1},"mem":{"tie":"他以前幫玄霜巡守隊打工具。"}}}}},{"id":"m306","month":3,"title":"一張拜訪信","npc":"ye","where":"shop","days":[2,3],"prio":10,"side":"task","item":"baitie","itemName":"寒漪的拜訪信","truth":{"goods":"genuine","origin":"clean","intent":"plain"},"neutral":true,"intro":"管理處的人在路口清出一條路。一個穿淺灰外套的中年人走進你的店，周警員跟在後面，頭低低的，一句話都沒說。","openFace":"neutral","open":"「寒潭會，葉。」他雙手遞上一個紅色信封：「寒漪老師三天前從總會出發，預定第四天中午前到，想來你店裡拜訪。我先來送信。」","ask":{"q":"元嬰級的人……為什麼要來我這間小店？","a":"「她沒說。她只說，你店裡有一樣東西，十二年前就該有人來問。」他停了一下：「她三天前就出發了。總會的人說，那時候結霜的消息還沒送到。」","f":"neutral"},"press":[{"q":"北礦到底出了什麼事？","a":"「寒潭會的公告是坍方。」他看了一眼窗外：「可是坍方不會讓六月結霜。我是金丹級的，進得去比較深的地方，我也說不出那是什麼。」","f":"think"},{"q":"周警員為什麼跟著您？","a":"「寒漪老師要看十二年前你家那件案子的卷宗。周警員是當年經手的人。」周警員的臉白了一下。","f":"cold"}],"silence":{"narr":"葉理事等你開口，等得很有耐心。周警員站在他後面，汗從髮際流下來。","f":"neutral"},"tells":[{"after":"open","need":-9,"text":"你看不出他的深淺。他後面的周警員，在他面前連大氣都不敢喘。"}],"opts":{"deal":{"label":"收下拜訪信","text":"你收下拜訪信。葉理事點頭，退了出去。周警員走在最後，到了門口，回頭看了你一眼，那一眼裡什麼都有。","fx":{"give":[{"item":"baitie","qty":1,"cost":0}],"flag":["got_baitie"],"rel":{"zhou":-1},"mem":{"zhou":"跟著寒潭會的葉理事來送拜訪信。他看你的眼神變了。"}}},"decline":{"label":"「小店不敢當。」","text":"葉理事笑了一下，把拜訪信放在櫃上：「寒漪老師說了，許老闆如果推辭，就把信放下。要不要來，是她的事。」","fx":{"give":[{"item":"baitie","qty":1,"cost":0}],"flag":["got_baitie","humble_baitie"]}}},"missed":{"flag":["got_baitie"]}},{"id":"m307","month":3,"title":"長生當鋪開了門","npc":"dianzhu","where":"shop","days":[3,3],"prio":9,"side":"task","item":"dangpiao","itemName":"你的當票","truth":{"goods":"genuine","origin":"clean","intent":"plain"},"neutral":true,"intro":"今天不是第一天。長生當鋪的黑門開了，當鋪老闆自己走進了你的店。他臉上罩著一層紗，看不到臉。","openFace":"neutral","open":"「許先生。長生當鋪開了這麼多年，第一次在第一天以外開門。北邊的霜到了，有些帳，要提前結。」","ask":{"q":"北邊的霜，跟長生當鋪有什麼關係？","a":"「長生當鋪收的，是壽命。壽命押在哪裡，許先生想過嗎？」他沒有等你回答：「也許在當票庫。也許在北邊。也許，霜就是利息。」","f":"neutral"},"press":[{"q":"我媽也押過壽命嗎？","a":"「霜華小姐沒有押壽命。她押的是別的東西。」他停了一下：「當票，長生當鋪不給人看。」","f":"neutral"},{"q":"你每年買燈，點在哪裡？","a":"「點在當票庫裡。普通的燈，照得到帳本而已。」他看著你：「有一盞不普通的，我看了十二年，沒買到。」","f":"neutral"}],"silence":{"narr":"當鋪老闆也不說話。屋裡越來越冷，你呵出的氣，是白的。","f":"neutral"},"opts":{"special":{"seal":"當燈","label":"拿狐尾燈換一年壽命","need":{"has":{"hudeng":1}},"text":"你把狐尾燈放在櫃上。當鋪老闆伸手，停了一下，才把燈收進袖子裡：「一年。」他走到門口：「許先生，燈在長生當鋪也會亮。只是看的人，換了。」","fx":{"take":[{"item":"hudeng","qty":1}],"lifespan":12,"flag":["sold_lamp"],"mem":{"dianzhu":"你把狐尾燈當給了長生當鋪，換了一年壽命。"}}},"special2":{"seal":"當匾","label":"當掉店的招牌","text":"你把店的招牌拆下來。當鋪老闆看了很久，點了點頭：「許家三代的招牌，長生當鋪收。半年壽命，加兩百靈石。」門口上方空了一塊，白白的。","fx":{"stones":200,"lifespan":6,"flag":["pawned_sign"],"rep":{"loose":-1},"tag":{"loose":"當了招牌"},"mem":{"dianzhu":"你把許家店的招牌當給了長生當鋪。"}}},"decline":{"label":"不當","text":"當鋪老闆點點頭：「許先生跟霜華小姐一樣。」他走了，門口的霜，跟著他一路退到街尾。","fx":{"flag":["refused_dianzhu"]}}}},{"id":"m308","month":3,"title":"收避難錢的「會員」","npc":"jiadizi","where":"shop","days":[3,4],"prio":8,"side":"sell","item":"info","itemName":"一塊「避難名額」木牌","price":40,"truth":{"goods":"fake","origin":"clean","intent":"con"},"lesson":"他說自己是寒潭會會員，可寒潭會的識別證是塑膠殼加手寫卡、背面有編號——如果你見過沈青那一張就知道；他腰上掛的是木頭。制服的藍色也淺了一層，是自己染的，不是寒潭會發的。他說「寒漪老師有交代」，可葉理事是親自上門送信的，寒漪要辦的事，不會叫一個會員挨家挨戶收錢。陸調查員的名冊上，也沒有這個名字。","verdict":["expose","report","decline"],"intro":"一個穿藍色制服的年輕人推門進來，手裡捧著一疊木牌，嗓門很大。","openFace":"smug","open":"「寒潭會會員，寒漪老師有交代！霜來之前，寒潭會安排聚落居民撤到南稜，每戶一個名額，四十塊靈石一塊牌子。許老闆，晚了就沒了喔。」","ask":{"q":"你叫什麼名字？哪一組的？","a":"「李三。哪一組……就、就外勤組啊，老闆不懂啦。」","f":"smug"},"press":[{"q":"你的識別證呢？","a":"他拍了拍腰上一塊木牌：「這不是嗎？寒潭會新發的，舊的都收回去了。」","f":"smug"},{"q":"寒漪老師不是明天要親自來嗎？","a":"「寒、寒漪老師那麼忙，哪會親自來。都是我們底下的人在跑。」","f":"sweat"}],"silence":"「……三十。算老闆便宜一點，不要跟別家講。」","silenceDrop":30,"tells":[{"after":"press","need":-1,"text":"你提到寒漪的時候，他的眼睛往門外瞟了一下，腳尖朝著門。","f":"uneasy"}],"appraise":[{"realm":4,"text":"他手上的木牌是新刨的，墨還沒乾。制服的藍色淺了一層，袖口的染料沾到手腕上。"}],"verify":[{"who":"lu","cost":0,"a":"「李三？名冊上沒有這個人。寒潭會的撤離通知，一塊錢都不收。」"},{"who":"bai","cost":5,"a":"「今天一早，已經有三家買了『名額』。賣牌子的人，昨天還在黑市擺攤。」"}],"opts":{"deal":{"label":"買一塊","text":"他把木牌塞給你，收了靈石，一出門就往巷子裡轉。","fx":{"flag":["bought_fake_pass"],"mem":{"jiadizi":"賣給你一塊四十靈石的「避難名額」。"}}},"decline":{"text":"「老闆不要，可別後悔！」他捧著木牌去了下一家。"},"expose":{"right":true,"label":"點破","text":"你說：「寒潭會的識別證有編號，不是木頭。撤離通知不收錢，而且寒漪老師明天就要來我這裡。」他的臉一下子白了，木牌掉了一地，推開門就跑。街上幾個剛買了牌子的人追了出去。","f":"shock","fx":{"rep":{"loose":1},"tag":{"loose":"眼尖"},"flag":["fake_pass_exposed"],"mem":{"jiadizi":"你當面拆穿了他賣假名額。"}}},"report":{"text":"你去派出所說了。陸調查員親自帶人去巷子裡把他揪了出來，木牌燒了一地。「末日還沒來，」陸調查員說，「趁火打劫的先來了。」","fx":{"rel":{"lu":1},"rep":{"sect":1},"flag":["fake_pass_reported"],"mem":{"lu":"你報了冒充寒潭會會員收避難錢的人。"}}}}},{"id":"m309","month":3,"title":"寒漪來訪","npc":"hanyi","where":"shop","days":[4,4],"prio":20,"need":{"flag":["qiyu_elder"]},"side":"task","item":"baitie","itemName":"拜訪","truth":{"goods":"genuine","origin":"clean","intent":"plain"},"neutral":true,"intro":"中午前，整條街忽然安靜下來。一個穿洗到發白外套的女人走進你的店，鞋子上全是三天山路的泥，後面跟著的，是第一天那個來要熱水的老人——今天他鬍子上沒有霜，整個人沉得像一座山。兩個元嬰級的人，在你的櫃台前坐下，像兩個普通的客人。","openFace":"neutral","open":"「寒潭會，寒漪。不好意思，突然來打擾。」她朝你點了點頭：「這位是玄霜巡守隊以前的隊長，大家叫他雪衣老師，是你媽的老師。他說第一天在你店裡喝了一杯茶，茶很淡，人很好。我們今天來，是拜訪，不是問罪——北邊的霜，需要一個許家的人，做一個選擇。」","ask":{"q":"北邊的霜，到底是什麼？","a":"寒漪沉默了很久：「我走過的地方比大部分人多，看過海往下掉，看過整座山在一夜之間升高。我說不出來。」雪衣老人接過話：「玄霜巡守隊說那是封印。寒潭會說那是礦脈。有人說是一百年前那件事留下來的機器，長生當鋪說那是一本帳。說法很多，路只有幾條。你手上有什麼，就走得了哪一條。」","f":"think"},"press":[{"q":"為什麼是我？","a":"雪衣老人看著你：「十二年前，你媽選過一次。她提燈進去，霜退了。這一次，輪到她兒子。」","f":"sad"},{"q":"我爸的案子呢？","a":"寒漪把一疊卷宗放在櫃上：「周正在外面站著。錢不語也在。許老闆如果有證據，今天就是對帳的日子。」","f":"cold"}],"silence":{"narr":"他們兩個都不說話，慢慢喝你泡的茶。窗外的霜，一點一點爬上了舊公路。","f":"neutral"},"tells":[{"after":"open","need":-20,"text":"雪衣老人朝你點了點頭，像在說：不急。"}],"opts":{"special":{"seal":"守燈","label":"把狐尾燈放在櫃上","need":{"has":{"hudeng":1},"anyFlag":["mang_told_mother","mang_north","tie_xuanshuang","elder_lamp"]},"text":"你把燈放在櫃上。雪衣老人伸手碰了碰燈罩，燈芯自己亮了，是很淡的藍。「霜華的燈。」他站起來：「走吧，孩子。玄霜巡守隊的人，從來都是提著燈進去的。」","f":"cry","fx":{"flag":["finale_lamp"],"mem":{"xuelao":"你提著你媽的燈，跟他往北去了。","hanyi":"她來店裡拜訪，你選了守燈。"}}},"special2":{"seal":"清帳","label":"把十二年前的帳攤開","need":{"anyFlag":["qian_confronted","knows_raid","zhang_exposed","scar_caught","lu_knows_scar","got_pages"]},"text":"你把你爸的帳冊、缺的那幾頁、還有這 r"],"mem":{"hanyi":"她來店裡拜訪，你把十二年前的帳攤在她面前。"}}},"deal":{"label":"「兩位說怎麼辦，就怎麼辦。」","text":"寒漪輕輕嘆了口氣：「也好。」他們走的時候，長生當鋪的黑門，在街尾開了。","fx":{"flag":["finale_pawn"],"mem":{"hanyi":"她來店裡拜訪，你把選擇交還給她。"}}},"decline":{"label":"請他們喝完茶","text":"他們喝完茶，起身告辭。雪衣老人在門口停了一下：「不選，也是一種選。」","fx":{"flag":["finale_pawn","finale_refused"],"mem":{"hanyi":"她來店裡拜訪，你只請她喝了茶。"}}}},"missed":{"flag":["finale_pawn","missed_visit"]}}],"places":{"market":{"name":"舊公路市場","hours":[0,1,2],"blurb":"舊公路剩下的那一段，柏油裂成一塊一塊，兩邊擺滿了攤子。賣什麼的都有，大多不值錢，偶爾混著一件值錢的。路邊那根舊電線桿上，還貼著一百年前的補習班廣告，字早就看不清了。","blurbMarketDay":"今天是市集日，攤子比平常多一倍，外地人也來了。","stalls":[{"npc":"mang","deals":["m304","d10","m210"],"month":"all","days":[1,6],"goods":"一排普通的小燈掛在竹竿上，玻璃罩擦得很乾淨。攤子最裡面，另外有一盞燈蓋著布，從來沒掀開過。"},{"npc":"stone","deal":"d09","days":[1,3],"goods":"一塊舊布上擺著十幾塊石頭，灰的、黑的、有紋路的。"},{"npc":"tie","special":"smith","month":"all","days":[1,6],"goods":"一張油膩的木桌，桌上幾把不好看的刀，和一堆等著修的東西：背架扣件、鍋子、一台拆開的手搖收音機。"},{"npc":"tao","deal":"d07","days":[3,3],"goods":"一疊一疊的蠟紙防水貼，用石頭壓著。"},{"npc":"scar","deal":"d08","days":[3,3],"goods":"地上一塊破布，布上只有一把刀。"},{"npc":"stone","deal":"m204","month":2,"days":[2,4],"goods":"小石頭的攤子移到了鐵師傅旁邊。布上的石頭少了，多了一塊帶紅紋的。"},{"npc":"xiangke","deal":"m211","month":2,"days":[4,4],"goods":"一台手推車，堆滿用麻繩捆好的定神香，味道衝到睜不開眼睛。"},{"npc":"scar","deal":"m212","month":2,"days":[4,4],"goods":"地上一塊破布，布上放著一個舊收納袋。"},{"npc":"stone","deal":"m303","month":3,"days":[1,2],"goods":"小石頭的布上只放了一塊石頭，太陽底下亮晶晶的，旁邊的人都離它遠遠的——說是很冰。"}]},"huichun":{"name":"回春藥行","hours":[0,1],"npc":"zhang","blurb":"寒潭會開的藥行，負責採購、驗貨。藥櫃一路頂到天花板，櫃檯後面坐著張主任，學徒在後面磨藥。牆上貼著手寫的價目表和「驗收不合格恕不退件」。","sells":[{"item":"chiyan","mult":1.15},{"item":"liaoshang","mult":1.15},{"item":"yangqi","mult":1.15},{"item":"dingshen","mult":1.15},{"item":"lingsui","mult":1.25},{"item":"bishui","mult":1.2}],"display":["zhuji"],"buyMult":0.8},"tea":{"name":"聽雨茶館","hours":[1,2],"npc":"bai","blurb":"二樓靠馬路，窗邊的位子最貴。白姐在櫃檯後面打算盤，每一桌都有人在講話。牆上掛著一張很舊的台灣地圖，海岸線被人用原子筆往內畫了好幾圈，每一圈旁邊寫著不同的年份。","askCost":3,"about":{"qian":"錢老闆啊，跟誰都稱兄道弟。他跟派出所的周警員，每個月都要喝一次酒。","yao":"姚四跟你爸是老交情。十二年前你們家出事，他幫人收過一批東西。這陣子他缺錢，缺得很急。","aheng":"採藥的阿蘅？老實的女生。她弟弟阿禾在黑市欠了一筆，利滾利，快滾不動了。","tie":"鐵師傅年輕時欠過一筆債，躲了二十年。他修過的東西，比他賣出去的多。","mang":"盲婆婆……她的事，我不賣。","stone":"那孩子想跟鐵師傅學手藝，在旁邊蹲了半年了。","ge":"老葛想讓女兒進寒潭會。他每年都往管理處送一籃好藥。","zhou":"周警員想調去總會。想調走的人，帳面都要好看。","zhang":"張主任規矩多。規矩多的人，規矩外面的事也多。","liu":"那個醫師？來不到兩個月，賣過三次好東西。三次，三家店被查。","bai":"許老闆想打聽我？這個價，你付不起。","dianzhu":"長生當鋪的事，茶館不賣。","hu":"黑市的人，我不認識。","lu":"陸調查員？寒潭會稽查組派下來的。他一下山，聚落裡就有人睡不著。","meng":"孟太太的先生是看地脈的，去年冬天死在北礦。礦上說是坍方。","lin":"林老師？舊國小那間舊物室是她顧的。你撿到什麼怪東西，拿去給她看，她不會笑你。她自己撿的比你多。"}},"office":{"name":"管理處・派出所","hours":[0,1,2],"npc":"zhou","blurb":"以前的鄉公所，一棟兩層的水泥樓。左邊是聚落管理處，收規費、貼公告；右邊是派出所，報案、懸賞都在這裡。周警員通常坐在右邊靠窗那張桌子。"},"herb":{"name":"聚落外藥田","hours":[0,1],"npc":"ge","closed":{"1":[5],"3":[3,4]},"closedText":"北林封了，藥田那條路也有人守著。守的人說，狼還在附近。","blurb":"出聚落往北走一個小時，一層一層的梯田種著藥。老葛蹲在田埂上抽菸，旁邊的舊水管還在滴水。"},"homes":{"name":"後山住宅區","hours":[0,1,2],"blurb":"聚落後山一片石頭跟鐵皮搭的房子，很多人住在這裡。你知道住址的人，才找得到門。"},"pawn":{"name":"長生當鋪","hours":[0,1,2],"days":[1],"npc":"dianzhu","blurb":"一扇黑色的門，門上沒有招牌。每段日子的第一天才開。門縫裡的空氣，比外面冷一點。"},"school":{"name":"舊國小・舊物室","type":"archive","hours":[1,2],"npc":"lin","blurb":"一百年前的國小，只剩一棟教室還有屋頂。林老師把它整理成舊物室：一排一排的架子上，放著大家從外面撿回來的東西，每一件旁邊都貼著手寫的小卡——「哪裡撿的」「誰撿的」「看到了什麼」「還不知道什麼」。","blurbM":{"3":"舊物室裡比外面暖。林老師把幾件會冷的東西搬到了窗邊，說它們這幾天「比較吵」。"},"note":"舊物、異物可以賣給她（比散客出的好一點）、請她研究（東西還你，會多知道一點），或者乾脆捐給舊物室。","spots":[{"id":"sc_shelf","title":"看架子","hint":"慢慢看那些小卡","text":"你一張一張看小卡。「隧道口撿的玻璃葉子，會響。」「水庫的霧，裝起來不會散。」「北礦柵欄外的羽毛，一直是冰的——不要放在嬰兒旁邊。」有一張卡片空著，只寫了日期，跟一句：「這件東西我不知道是什麼。」架子上那個位置是空的。","fx":{"flag":["lin_met"],"rel":{"lin":1}},"note":"舊物室的小卡寫著：隧道、水庫、西邊斷崖、北礦柵欄外，都撿得到怪東西。越遠的地方，東西越怪。"},{"id":"sc_board","title":"教室後面的黑板","hint":"一百年沒擦的黑板","after":"sc_shelf","text":"教室後面的黑板，有一塊被林老師用透明塑膠板封起來。粉筆字是小孩的：「12/31 放假！大家新年快樂！」旁邊畫了一棵聖誕樹、一個太陽，還有一座很矮很矮的山。值日生的名字被擦掉一半。林老師說，她每天早上都會看一眼這塊黑板，確定它還在。","fx":{"flag":["saw_blackboard"]}},{"id":"sc_theory","title":"林老師的筆記","hint":"她整理的「說法」","after":"sc_board","need":{"rel":{"lin":2}},"text":"林老師拿出一本很厚的筆記，裡面不是答案，是「說法」。「AI做的。」「AI想救人，救錯了。」「地底下的東西醒了。」「是人自己做的，不關機器的事。」「神明收回去了。」「什麼都不是，地球本來就會這樣。」每一條下面都有她記的證據跟反證。她說：「我不是要你選一個。我是要你知道，每一個說得很肯定的人，手上拿的都是一兩件東西而已。」","fx":{"flag":["lin_theories"],"rel":{"lin":1}},"note":"林老師整理的災變說法有六種以上，每一種都有人講得很肯定，沒有一種有足夠的證據。"},{"id":"sc_map","title":"牆上的海岸線","hint":"一張每年重畫的地圖","after":"sc_shelf","months":[2,3],"text":"牆上一張大地圖，海岸線用不同顏色的筆畫了很多次。林老師說，從斷崖回來的人會告訴她海到哪裡了，她就畫一條。可是海面從來沒有下降——水一直往西邊那道缺口流，海卻沒有變淺。「水跑去哪裡了？」她說，「我問了二十年。」","fx":{"flag":["saw_coast_map"]},"note":"林老師說，海水一直流進西邊的落差，海面卻一直沒有下降。"}]},"ruin":{"name":"舊公路崩塌段","type":"explore","depth":"第一層・聚落邊上","hours":[0,1,2],"blurb":"舊公路往南走五分鐘，路就斷了——不是塌下去，是被抬起來，整段柏油翹成一面斜牆，最上面懸在半空。風從山谷裡往上吹，帶著草跟鐵鏽的味道。小孩被大人禁止來這裡，所以小孩最愛來這裡。","blurbM":{"3":"路肩上的草結了一層白霜，霜紋全都朝著北邊。"},"spots":[{"id":"ru_edge","title":"走到路的盡頭","hint":"翹起來的柏油牆","text":"你爬上翹起來的那段柏油。最上面，路就停在空中，底下是一整片雲海。柏油的斷面一層一層，像蛋糕，最底下那層混著碎玻璃和一塊綠色的鐵片。你把鐵片撬出來，是一塊路牌。","fx":{"give":[{"item":"lupai","qty":1,"cost":0}]}},{"id":"ru_bus","title":"翻倒的公車","hint":"路邊草叢裡","after":"ru_edge","text":"一輛公車側躺在草叢裡，車身長滿了苔，像一條綠色的船。你從破窗爬進去，座椅都還在，扶手上掛著一個發白的塑膠吊環。最後一排座位底下，有一張藍色的卡。你抬頭，車窗上有一個小孩用手指在霧氣上畫的笑臉——外面沒有霧，窗上的霧卻一直沒乾。","fx":{"give":[{"item":"youyou","qty":1,"cost":0}],"flag":["saw_bus_window"]},"deep":{"level":5,"text":"你盯著那個笑臉看久了，發現它的嘴角每隔一陣子會往下掉一點點，再慢慢回去，像是在呼吸。"}},{"id":"ru_shrine","title":"土地公廟","hint":"斷路旁邊的小廟","text":"斷路旁邊有一間比人還矮的土地公廟，屋頂換過好幾次鐵皮。香爐裡有新的香腳，有人一直在拜。供桌上一個舊籤筒，你搖了一支。廟旁邊掛著一塊牌子：「平安回來的人，記得來跟土地公說一聲。」","fx":{"give":[{"item":"qianshi","qty":1,"cost":0}]}},{"id":"ru_wind","title":"往上吹的風","hint":"站在斷口聽","after":"ru_edge","months":[2,3],"text":"你站在斷口，風從底下往上吹，吹得你衣服鼓起來。風裡有鹹味——這裡離海很遠很遠。風停的那一秒，你聽到很深很深的地方，有東西在嘩嘩地響，像是很大的一條河，一直往下流。","fx":{"flag":["heard_deep_water"],"xp":4},"note":"舊公路斷口的風有海水的鹹味，風停的時候，聽得到很深的地方有大量的水往下流。"},{"id":"ru_frost","title":"路肩上的霜","hint":"霜紋都朝北","months":[3],"text":"路肩上的霜一片一片，每一片的紋路都像箭頭，全都指著北礦的方向。你蹲下來，用手指抹掉一片。過了一下子，它又長回來了，箭頭的方向沒變。","fx":{"flag":["frost_arrows"]},"note":"結霜那幾天，聚落邊上的霜紋全都指向北礦，抹掉會再長回來。"},{"id":"ru_scrap","title":"在碎石堆裡翻翻看","hint":"每天都可能翻到不一樣的","repeat":true,"loot":[{"text":"你翻了半天，翻到一頂黃色的安全帽，貼紙還在。","fx":{"give":[{"item":"anquanmao","qty":1,"cost":0}]}},{"text":"碎石底下壓著一頁泡過水的課本，你小心地把它攤平。","fx":{"give":[{"item":"keben","qty":1,"cost":0}]}},{"text":"只有一堆生鏽的螺絲、一隻斷掉的拖鞋。你把拖鞋擺正，放回原處。","fx":{}},{"text":"石縫裡長著一株赤炎草，葉背只有一道金線，是真的。","fx":{"give":[{"item":"chiyan","qty":1,"cost":0,"q":0.9,"label":"斷路邊的赤炎草"}]}},{"text":"一個生鏽的鐵盒，裡面有三塊靈石，和一張寫著「給阿弟」的紙條。你看了紙條很久。","fx":{"stones":3}},{"text":"碎石堆裡有一個貝殼，殼裡還是濕的。這裡離海很遠。","fx":{"give":[{"item":"xianbei","qty":1,"cost":0}]}},{"text":"柏油裂縫裡夾著一張超商發票，字黑得像今天早上才印的。","fx":{"give":[{"item":"fapiao","qty":1,"cost":0}]}},{"text":"一本泡過水的畢業紀念冊，攤開在草裡，翻在團體照那一頁。","fx":{"give":[{"item":"jinianc","qty":1,"cost":0}]}},{"text":"你聽到碎石底下有人在敲，一下、一下。你挖開來，底下只有一根普通的水管。敲聲停了。","fx":{}}]}]},"tunnel":{"name":"舊隧道","type":"explore","depth":"第二層・山腹","hours":[0,1],"blurb":"舊公路穿山的隧道。山抬起來的時候它被扭了一下，入口是斜的，像一張歪掉的嘴。裡面的風永遠往裡吹，從來沒有往外吹過。洞口的牆上有人用油漆寫：「回程比去程累，記得留力氣。」","blurbM":{"3":"隧道口結了一圈冰柱。往裡吹的風，今天是暖的。"},"spots":[{"id":"tu_mouth","title":"洞口的蕨","hint":"會響的葉子","text":"隧道口長了一片蕨類，風一吹，有幾株發出叮叮的聲音。你湊近看，那幾株的葉子變成了透明的玻璃，葉脈還在裡面。你小心折下一片，斷口很整齊，像本來就是可以拆下來的。","fx":{"give":[{"item":"boliye","qty":1,"cost":0}]}},{"id":"tu_lights","title":"還亮著的燈","hint":"往裡面走一段","after":"tu_mouth","text":"往裡走了大概十分鐘，牆上出現一排舊時代的緊急照明燈。大部分都壞了，但有一盞還亮著，很淡的白光。沒有電線接著它，燈罩裡也沒有電池。你在它底下站了一下，耳朵開始塞住，像坐車上山時那樣。","fx":{"flag":["tunnel_light"],"xp":5},"note":"舊隧道裡有一盞緊急照明燈沒有電源也還亮著。走到那裡，耳朵會開始塞。"},{"id":"tu_echo","title":"回聲","hint":"再往裡，會累","after":"tu_lights","strain":true,"text":"你對著隧道深處喊了一聲。回聲過了很久才回來，回來的不是你的聲音，是一個女人很輕的一句話，你沒聽清楚。地上有一顆光滑的黑石頭，回聲好像就是從它身上回來的。你把它撿起來，它是溫的。回程的路比來的時候長，你走出洞口時，鼻子流了一點血。","fx":{"give":[{"item":"huishi","qty":1,"cost":0}],"xp":10},"deep":{"level":5,"text":"你身體比以前撐得住了。回聲裡的那句話，你聽到後半段：「……記得留燈。」"}},{"id":"tu_car","title":"長進牆裡的車","hint":"隧道轉彎處","after":"tu_lights","strain":true,"text":"轉彎的地方，一台小客車一半在路上，一半埋在隧道的牆裡——不是撞進去的，牆面很平整，像是牆慢慢長過去把它包住了。後座有一本學生的筆記本，封面寫著「不要給媽媽看」。你走出隧道的時候，天色比你以為的晚。","fx":{"give":[{"item":"bijiben","qty":1,"cost":0}],"flag":["saw_wall_car"],"xp":8}},{"id":"tu_water","title":"隧道的另一頭","hint":"要吐納五層才撐得住","after":"tu_echo","need":{"level":5,"done":["tu_car"]},"strain":true,"text":"你走到隧道本來應該通到另一邊的地方。出口沒有了。眼前是一面直立的水牆，從地面一直到隧道頂，水是透明的藍綠色，幾條魚在裡面側著身體游。你伸手碰它——冰的、鹹的。手抽回來，是乾的。水牆的另一邊，好像有光。你沒有再往前。回程你走了很久很久，出洞口的時候太陽已經偏西，手錶慢了二十分鐘。","fx":{"flag":["saw_water_wall"],"xp":15,"give":[{"item":"xianbei","qty":1,"cost":0,"label":"水牆腳下的貝殼"}]},"note":"舊隧道的盡頭是一面直立的海水牆，碰了手是乾的。從那裡回來，時間好像對不上。","deep":{"level":6,"text":"你在水牆前站得比較久。水裡很遠的地方，有一排很小的燈，排成一條線往下延伸，像一條路。"}},{"id":"tu_dig","title":"在洞口附近翻翻看","hint":"每天都可能有不一樣的","repeat":true,"loot":[{"text":"落石底下有一片綠色的電路板，一角燒焦了。","fx":{"give":[{"item":"zhuban","qty":1,"cost":0}]}},{"text":"一個比拳頭還大的蟬殼掛在洞口的鐵網上。裡面長著苔，往外長。","fx":{"give":[{"item":"chanke","qty":1,"cost":0}]}},{"text":"什麼都沒有。風一直往裡吹，吹得你有點想跟著走進去。你沒有。","fx":{}},{"text":"洞口旁邊有人留下兩張還能用的防水貼，用石頭壓著，旁邊寫著「需要的人拿」。你拿了一張，留了一張。","fx":{"give":[{"item":"bishui","qty":1,"cost":0,"label":"洞口撿到的防水貼"}]}},{"text":"你在碎石裡找到一塊路牌碎片，字還很清楚。","fx":{"give":[{"item":"lupai","qty":1,"cost":0}]}},{"text":"洞口的鐵網上綁著一串鐵管風鈴，沒有風也在響。你解下來的時候，它停了一下，像在看你。","fx":{"give":[{"item":"fengling","qty":1,"cost":0}]}},{"text":"一個倒過來的紅綠燈黃燈罩，卡在落石裡。你一碰，它亮了三秒。","fx":{"give":[{"item":"huangdeng","qty":1,"cost":0}]}}]}]},"reservoir":{"name":"寒潭水庫","type":"explore","depth":"第二層・東邊","hours":[0,1,2],"blurb":"聚落東邊的舊水庫，大家叫它寒潭。水是黑綠色的，一年到頭都很冰。老人說一百年來它的水位一公分都沒變過，不管下多少雨、旱多久。水面上的霧，早上起、中午也不散。","blurbM":{"2":"五月了，寒潭的霧更厚，霧裡偶爾有一點一點的光。","3":"寒潭結了一層薄冰。冰下面，有東西在慢慢游。"},"spots":[{"id":"re_dam","title":"壩頂","hint":"跟釣魚的阿伯聊天","text":"壩頂有個阿伯在釣魚，釣了一整個早上什麼都沒釣到，看起來也不在意。他旁邊放著一排舊果醬罐，每一罐裡都裝著霧。「霧是這裡唯一抓得到的東西，」他說，「五塊一罐。不買也沒關係，霧又不會跑。」","fx":{"flag":["met_fog_man"]}},{"id":"re_fogjar","title":"跟阿伯買一罐霧","hint":"五塊","after":"re_dam","cost":5,"text":"阿伯挑了一罐給你：「這罐比較有精神。」你對著光看，霧在罐子裡慢慢轉，裡面有兩三個很小的光點，像很遠的路燈。","fx":{"give":[{"item":"wuguan","qty":1,"cost":5}]}},{"id":"re_toad","title":"白色的蟾蜍","hint":"沿著水邊走","text":"水邊的石頭上蹲著幾隻白色的蟾蜍，一動也不動，耳後鼓著一小包。寒潭會的人在不遠處巡邏，看到你，喊了一聲：「不要碰！碰了算偷！」那幾隻蟾蜍同時轉頭看你，動作一模一樣。","fx":{"flag":["saw_toads"]},"note":"寒潭水庫邊的白蟾蜍有寒潭會的人巡守，碰了就算偷。"},{"id":"re_float","title":"會漂的石頭","hint":"壩下的淺灘","after":"re_dam","text":"淺灘上，有一顆灰色石頭浮在水面上，慢慢往水庫中間漂。你把它撈回來。它是溫的，像剛被人握過。你放開手，它又開始往中間漂；你把它收進口袋。","fx":{"give":[{"item":"fushi","qty":1,"cost":0}]}},{"id":"re_village","title":"水底的村子","hint":"租竹筏，十塊，會累","after":"re_dam","cost":10,"strain":true,"text":"你跟阿伯租了竹筏划到水庫中間。霧散開一點，往下看，水很清——底下是一整個村子。屋頂、電線桿、一座國小的籃球架，籃框上還掛著網子。中午十二點，水底傳來一陣鐘聲，是學校的下課鐘。一個塑膠袋從水底浮上來，裡面是一捲錄音帶，標籤寫著「給阿嬤 過年」。划回來的時候，你的手臂抖得握不住槳。","fx":{"give":[{"item":"luyin","qty":1,"cost":0}],"flag":["saw_drowned_school"],"xp":8},"note":"寒潭水庫底下有一整個村子，中午會傳出學校的下課鐘聲。"},{"id":"re_lights","title":"霧裡的路燈","hint":"傍晚再去一次","after":"re_village","months":[2,3],"text":"傍晚，霧裡的光點變多了，一盞一盞，排成兩條線，中間是一條路的形狀。路的盡頭有一個比較亮的光，一閃一閃，像紅綠燈。阿伯說他看了三十年，每年都多一兩盞。「有人說那是水底村子的燈。可是水底沒有電啊。」","fx":{"flag":["saw_fog_lights"],"xp":5}},{"id":"re_shore","title":"沿著岸邊撿撿看","hint":"每天都可能有不一樣的","repeat":true,"loot":[{"text":"岸邊有一顆會漂的石頭卡在蘆葦裡。","fx":{"give":[{"item":"fushi","qty":1,"cost":0}]}},{"text":"一個新鮮的貝殼，殼裡還有海水。寒潭是淡水。","fx":{"give":[{"item":"xianbei","qty":1,"cost":0}]}},{"text":"你撿到一頁課本，地圖上的海岸線被人用鉛筆描過。","fx":{"give":[{"item":"keben","qty":1,"cost":0}]}},{"text":"什麼都沒有。霧裡有人在喊一個名字，喊了三次就停了。附近沒有別人。","fx":{"flag":["heard_fog_name"]}},{"text":"一隻死掉的鐵背狼泡在淺水裡，牙齒還在。你用刀撬了兩顆。","fx":{"give":[{"item":"langya","qty":2,"cost":0}]}},{"text":"蘆葦裡卡著一個小銅鐘，鐘舌上刻著「仁愛國小」。你拿起來的時候，水底某個地方回了一聲。","fx":{"give":[{"item":"xiaozhong","qty":1,"cost":0}]}}]}]},"cliff":{"name":"西側斷崖・落海口","type":"explore","depth":"第三層・聚落西緣","hours":[0,1],"blurb":"聚落西邊走兩個小時，地面忽然沒了。斷崖底下很遠的地方是海——不對，海在這裡斷掉了：海水在遠處一道看不到底的缺口邊緣，一直往下流，流成一整片白色的瀑布，聲音大到你要用喊的才聽得到自己。","blurbM":{"3":"斷崖邊很冷。缺口上方的霧結成了冰晶，太陽一照，整片天空都在閃。"},"spots":[{"id":"cl_view","title":"看海往下掉","hint":"坐在崖邊","text":"你坐在崖邊看了一個上午。海水一直往缺口流，流了一百年，海面卻沒有變低。一塊漂流木被水流帶到缺口邊，翻了一下，掉下去，沒有聲音。你數到一百，沒有聽到它落地。","fx":{"flag":["saw_sea_fall"],"xp":6},"note":"西邊斷崖外，海水一直流進一道缺口，海面卻沒有下降；掉下去的東西聽不到落地的聲音。"},{"id":"cl_camp","title":"崖邊的舊營地","hint":"帳篷跟木箱","after":"cl_view","text":"崖邊有一個沒人的營地，帳篷的布已經爛了，木箱上的字是「海況觀測　第十一次」。箱子裡有一本被雨泡爛的紀錄，最後一頁只看得清楚一行：「缺口的寬度沒有變，可是水聲的音高，每年低一點。」箱底有一個指南針，指針不指北。","fx":{"give":[{"item":"zhibei","qty":1,"cost":0}],"flag":["saw_survey_camp"]},"note":"斷崖營地的觀測紀錄寫著：缺口寬度不變，可是水聲每年低一點。"},{"id":"cl_bottle","title":"裝一瓶海水","hint":"沿著小路往下，會累","after":"cl_view","strain":true,"text":"有一條很窄的小路沿著崖壁往下，走到一半，水霧大到像下雨。你用瓶子接了一瓶。回到崖上，你發現瓶子裡的水面是斜的，斜向西邊，怎麼放都一樣。爬回崖頂花的時間是下去的兩倍，你喘到說不出話。","fx":{"give":[{"item":"xianshui","qty":1,"cost":0}],"xp":10}},{"id":"cl_ship","title":"掛在半空中的船","hint":"往北邊的崖角","after":"cl_view","months":[2,3],"text":"往北的崖角，可以看到缺口的另一段。水流裡卡著一艘船，不大，舊式的漁船，船頭朝下，停在半空中的白色水流裡，像被定住了。船身上的字只看得到「…漁…號」。有人說它已經在那裡卡了五十年。有人說它是上個月才掉下去的，只是掉得很慢。","fx":{"flag":["saw_hanging_ship"],"xp":5},"note":"落海口的水流裡卡著一艘漁船，船頭朝下，一直沒有掉下去。"},{"id":"cl_path","title":"跟著指南針往下","hint":"要吐納五層，要有那個指南針","after":"cl_camp","need":{"level":5,"has":{"zhibei":1}},"strain":true,"text":"指南針的指針往下傾。你沿著一條快要被草蓋掉的舊步道往下走，走到一個平台就停了——再下去沒有路。霧裡，很下面很下面的地方，有一排路燈，暖黃色的，亮著。燈旁邊立著一塊招牌，是倒過來的：「歡迎光臨」。你在平台的石頭縫裡撿到一顆黑色的玻璃珠。爬回崖頂的時候，你的耳朵響了一整個晚上。","fx":{"give":[{"item":"hongzhu","qty":1,"cost":0}],"flag":["saw_below_lights"],"xp":15},"note":"斷崖下的舊步道走到盡頭，看得到很深的地方有一排亮著的路燈，和一塊倒著的「歡迎光臨」招牌。","deep":{"level":6,"text":"你多待了一下。路燈底下，有一個人影在走，走得很慢，提著什麼東西。他抬頭，好像看了你一眼。"}},{"id":"cl_search","title":"在崖邊找找看","hint":"每天都可能有不一樣的","repeat":true,"loot":[{"text":"崖邊草叢裡有一個新鮮的貝殼。","fx":{"give":[{"item":"xianbei","qty":1,"cost":0}]}},{"text":"一隻比拳頭大的蟬殼，掛在崖邊的欄杆上。","fx":{"give":[{"item":"chanke","qty":1,"cost":0}]}},{"text":"一支螢幕碎掉的手機，背面刻著「小芸」。","fx":{"give":[{"item":"shouji","qty":1,"cost":0}]}},{"text":"什麼都沒找到。水聲大到你一直覺得有人在後面叫你。你回頭三次，都沒有人。","fx":{}},{"text":"一張客運票根被風吹上崖，訖站那一格是空的。","fx":{"give":[{"item":"piaogen","qty":1,"cost":0}]}}]}]},"north":{"name":"北礦柵欄外","type":"explore","depth":"第四層・北礦外圍","hours":[0,1],"minLevel":5,"levelText":"吐納五層以上才撐得住那裡的冷","blurb":"北礦被寒潭會用鐵絲網圍起來，網上掛著「禁止進入」「違者送辦」的牌子。柵欄外面是一片光禿禿的坡，風很冷，冷得不太正常。坡上有一座小小的礦工紀念碑，碑前擺著幾瓶米酒。","blurbM":{"2":"坡上的草五月還是枯的。柵欄裡面，有人在搬東西，看到你就停下來。","3":"整片坡都白了。柵欄的鐵絲上結滿了霜，霜長成一根一根的刺，全都朝外。"},"spots":[{"id":"no_fence","title":"礦工紀念碑","hint":"碑上的名字","text":"紀念碑上刻著很多名字，最早的是災後第十年，最新的一個還是用油漆寫的，很新：「孟家和，看地脈，災後100年冬。」碑腳下有一個空酒瓶，瓶裡插著一支乾掉的花。","fx":{"flag":["saw_miner_names"]},"note":"北礦紀念碑上最新的名字是孟家和，看地脈的，去年冬天。"},{"id":"no_office","title":"礦場舊辦公室","hint":"柵欄外面那間鐵皮屋","after":"no_fence","text":"柵欄外面有一間鐵皮屋，門沒鎖。裡面是一百年前的礦場辦公室：一張鐵桌、一個月曆停在2029年12月、一台舊式的錄放音機，還接著一個手搖發電機。牆上貼著一張「本季安全目標：零災害」。月曆的31號被人用紅筆圈起來，旁邊寫著「尾牙」。","fx":{"flag":["saw_mine_office"]}},{"id":"no_tape","title":"播那捲錄音帶","hint":"你身上有錄音帶","after":"no_office","need":{"has":{"luyin":1}},"text":"你把錄音帶放進去，搖了好久的發電機。沙沙聲之後，是一個小孩的聲音：「阿嬤，新年快樂！我今年考試考很好喔！爸爸說過年要帶我回去看你，你要煮那個……」後面有大人在笑。再後面，電視的聲音很小，好像在播新聞，一個男人說：「……專家表示，目前還無法確定……」然後帶子就沒了。你又聽了一次，那一句還是只有一半。","fx":{"flag":["played_tape"],"xp":4},"note":"錄音帶最後錄到一句舊新聞：「專家表示，目前還無法確定……」後面沒了。"},{"id":"no_feather","title":"白色的羽毛","hint":"坡上","after":"no_fence","months":[2,3],"text":"坡上躺著一根比你手臂還長的白羽毛，它旁邊的草全結了霜，羽毛本身卻很乾淨。你撿起來，它是冰的，冰得剛剛好。抬頭看，天上什麼都沒有。","fx":{"give":[{"item":"lengyu","qty":1,"cost":0}]}},{"id":"no_vent","title":"通風口","hint":"貼著柵欄走，會累","after":"no_fence","strain":true,"text":"柵欄邊有一個舊通風口，用鐵網封著。你站了一會兒，發現它在呼吸——每隔幾分鐘，一股冷風從裡面吐出來，再慢慢吸回去。吸氣的時候，裡面傳來敲擊聲，一下，一下，很有耐心。回程的路上你一直在發抖，手指到晚上還是麻的。","fx":{"flag":["heard_vent"],"xp":12},"note":"北礦的通風口每隔幾分鐘會吐一口冷風，吸氣的時候，裡面有規律的敲擊聲。","deep":{"level":6,"text":"你數了敲擊聲。它的節奏，跟你店裡那幾塊寒鐵半夜裡敲的，一模一樣。"}},{"id":"no_frost","title":"霜從哪裡長出來","hint":"只有結霜的時候，會很累","after":"no_fence","months":[3],"strain":true,"text":"你沿著霜最厚的地方走，走到柵欄底下一道地裂。霜是從地裂裡往上長的，不是從天上落下來的。地裂旁邊有一塊露出來的水泥，上面有很舊的油漆字，大部分剝落了，只剩「2029」，和一個往下的箭頭。地裂邊上的霜晶，你掰了一塊。回去的路上，你的影子比平常淡。","fx":{"flag":["saw_frost_source"],"xp":15,"give":[{"item":"shuangjing","qty":1,"cost":0,"label":"地裂邊的霜晶"}]},"note":"北礦的霜是從柵欄下的地裂往上長的。地裂旁的水泥上有「2029」和往下的箭頭。"}]},"stair":{"name":"斷崖下的維修梯","type":"explore","depth":"第五層・缺口邊緣往下","hours":[0],"minLevel":5,"reveal":"saw_below_lights","levelText":"吐納五層以上才下得去","blurb":"步道盡頭的平台底下，其實還有路——一道釘在崖壁上的鐵製維修梯，鏽得發紅，一層一層往下。每一層的平台都漆著編號。往下爬的時候，身體反而越來越輕鬆，呼吸越來越順；往上爬的時候，每一層都像有人在你肩膀上多放一塊石頭。梯子口有人用粉筆寫：「下去容易。」","blurbM":{"3":"維修梯上結了霜，可是越往下越暖。最底下那排路燈，今天比平常亮。"},"spots":[{"id":"st_b1","title":"B1","hint":"第一個平台","strain":true,"text":"第一個平台漆著「B1」。平台上有一張被風吹到褪色的安全須知，最後一條是：「如感到身體變輕，請立即回到地面。」你的身體的確很輕。往下看，還有很多平台，編號一直往下排，你數到B9就看不清楚了。爬回崖頂花了你一整個上午，最後幾格，手是抖的。","fx":{"flag":["stair_b1"],"xp":12},"note":"斷崖下的維修梯一層一層往下編號。下去的時候身體變輕，上來的時候特別累。"},{"id":"st_lab","title":"B2-17","hint":"一扇鐵門","after":"st_b1","strain":true,"text":"第二個平台的崖壁裡嵌著一扇鐵門，門牌「B2-17」，門上貼著一隻三隻腳的烏鴉貼紙，褪成淡藍色。你愣住了——這是那個道士說的地方。門沒鎖。裡面是一間很小的實驗室，桌上一整排讀卡機，插槽全是空的；地上散著幾十個一模一樣的記憶卡空殼。沒有骨頭。一張椅子面向東邊，椅背上掛著一件實驗袍，口袋裡有一張紙：「有緣的人拿去。」紙的背面是另一個人的字：「沒有緣的人，也可以拿。反正都是空的。」","fx":{"flag":["saw_lab"],"xp":8},"note":"斷崖下第二層真的有一間B2-17實驗室。道士的故事有一半是真的——卡是空的，從一開始就是。","deep":{"level":6,"text":"你在桌子底下找到一本值班紀錄。最後一筆是2029年12月30日：「抬升速度超出模型。不是我們的系統造成的——至少我們找不到證據。也找不到相反的證據。」字跡到後面越寫越大。"}},{"id":"st_stop","title":"公車站牌","hint":"再往下兩層","after":"st_lab","strain":true,"text":"第四個平台上，立著一根公車站牌。站牌的時刻表還在，末班車是 23:59，終點站那一格是空白的。站牌底下有一張長椅，你坐下去——椅子是溫的，像剛有人站起來。底下的路燈，從這裡看，已經近到聽得見電流的嗡嗡聲。","fx":{"flag":["saw_deep_stop"],"xp":10},"note":"斷崖下第四層有一個公車站牌，末班車23:59，沒有終點站。長椅是溫的。"},{"id":"st_flowers","title":"白花","hint":"平台縫隙裡","after":"st_b1","strain":true,"text":"平台的鐵板縫裡長滿了很小的白花，花莖細得像銀線。你一靠近，所有的花都慢慢轉過來，對著你。你摘了一朵。剩下的花，轉回去對著北邊。","fx":{"give":[{"item":"shenhua","qty":1,"cost":0}],"xp":6}},{"id":"st_lookup","title":"往上看","hint":"最低的那層，要吐納六層","after":"st_stop","need":{"level":6},"strain":true,"text":"你下到能下到的最低一層，背靠著崖壁往上看。聚落的燈在很高很高的地方，小得像星座。你認得出舊公路那一排，認得出管理處那盞大燈，也認得出你自己的店——店裡有一點很淡的光，你出門的時候明明沒有點燈。往上爬的時候，你流了鼻血，耳朵一直響，一直到第二天早上都覺得世界太亮。","fx":{"flag":["saw_from_below"],"xp":25},"note":"從斷崖下面往上看，聚落像一個很小的星座。","deep":{"level":7,"text":"你看著最底下那排路燈，忽然發現它們不是路燈——是一扇一扇窗。窗戶裡，有人在走動，在吃飯，在看你。"}},{"id":"st_gather","title":"在平台上撿撿看","hint":"每天都可能有不一樣的","repeat":true,"strain":true,"loot":[{"text":"鐵板縫裡卡著一朵白花，一直轉過來看你。","fx":{"give":[{"item":"shenhua","qty":1,"cost":0}],"xp":3}},{"text":"平台角落有一顆黑色玻璃珠，裡面映著一條你沒走過的街。","fx":{"give":[{"item":"hongzhu","qty":1,"cost":0}],"xp":3}},{"text":"一根白色的長羽毛卡在欄杆上，冰的。","fx":{"give":[{"item":"lengyu","qty":1,"cost":0}],"xp":3}},{"text":"什麼都沒找到。下面的路燈閃了一下，所有的燈同時閃，像有人眨了一次眼睛。","fx":{"
